  const mE = 52, mD = 12, mT = 16, mB = 30;
  const fmt = o.fmt || n0;
  const totais = x.map((_, i) => series.reduce((a, s) => a + (s.vals[i] || 0), 0));
  const topo = escalaTopo(Math.max.apply(null, totais.concat([0])));
  const pw = (W - mE - mD) / x.length;
  const bw = Math.max(5, Math.min(pw * 0.6, 48));
  const ph = H - mT - mB;
  const py = v => mT + ph - (v / topo) * ph;
  const passo = Math.ceil(x.length / 12);

  let s = '<svg class="viz" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  ticks(topo, 4).forEach(t => {
    s += '<line class="grade" x1="' + mE + '" x2="' + (W - mD) + '" y1="' + py(t) + '" y2="' + py(t) + '" vector-effect="non-scaling-stroke"/>';
    s += '<text class="eixo" x="' + (mE - 8) + '" y="' + (py(t) + 3.6) + '" text-anchor="end">' + (o.fmtEixo || n0)(t) + '</text>';
  });
  x.forEach((rot, i) => {
    const cx = mE + pw * i + pw / 2;
    let acc = 0;
    const tip = '<span class="d-tit">' + esc(rot) + '</span>' +
      series.map((se, si) => (se.vals[i] ? tipLinha(se.cor || corSerie(si), esc(se.nome), fmt(se.vals[i])) : '')).join('') +
      tipLinha('', 'Total', fmt(totais[i]));
    s += '<g data-tip="' + esc(tip) + '">';
    s += '<rect class="alvo" x="' + (cx - pw / 2) + '" y="' + mT + '" width="' + pw + '" height="' + ph + '"/>';
    series.forEach((se, si) => {
      const v = se.vals[i] || 0;
      if (v <= 0) return;
      const y0 = py(acc + v), alt = py(acc) - py(acc + v);
      acc += v;
      /* 2px de respiro entre fatias: encurto a fatia por baixo. */
      const respiro = Math.min(2, alt * 0.14);
      s += '<rect x="' + (cx - bw / 2) + '" y="' + y0 + '" width="' + bw + '" height="' + Math.max(1, alt - respiro) +
           '" rx="' + (si === series.length - 1 ? 4 : 0) + '" fill="' + (se.cor || corSerie(si)) + '"/>';
    });
    s += '</g>';
    if (i % passo === 0)
      s += '<text class="eixo" x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(rot) + '</text>';
  });
  return s + '</svg>';
}

/* ---------------------------------------------------------------- SPARKLINE */
function spark(vals, cor) {
  const v = (vals || []).filter(x => x != null);
  if (v.length < 2) return '';
  const max = Math.max.apply(null, v), min = Math.min.apply(null, v);
  const amp = (max - min) || 1;
  const pw = 100 / (v.length - 1);
  const pts = v.map((x, i) => (i * pw).toFixed(2) + ',' + (26 - ((x - min) / amp) * 22).toFixed(2));
  return '<svg class="viz" viewBox="0 0 100 30" preserveAspectRatio="none" style="height:30px">' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + (cor || 'var(--s1)') +
    '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="100" cy="' + (26 - ((v[v.length - 1] - min) / amp) * 22).toFixed(2) + '" r="2" fill="' + (cor || 'var(--s1)') + '"/></svg>';
}

/* ===================== LEGENDA ===================== */
function legenda(itens) {
  if (!itens || itens.length < 2) return '';
  return '<div class="legenda">' + itens.map((it, i) =>
    '<span class="legenda-item"><span class="legenda-marca" style="background:' + (it.cor || corSerie(i)) + '"></span>' +
    esc(it.nome) + (it.val != null ? ' <b style="color:var(--texto)">' + it.val + '</b>' : '') + '</span>').join('') + '</div>';
}

/* ===================== PECAS DE UI ===================== */
const ICO = {
  ok:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  alerta:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  sobe:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
  desce:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>',
  igual:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>'
};

/* Selo de status: a cor nunca vem sozinha - sempre com icone e rotulo. */
function selo(nivel, texto) {
  const ic = nivel === 'ok' ? ICO.ok : nivel === 'neutro' ? ICO.info : ICO.alerta;
  return '<span class="selo ' + nivel + '">' + ic + esc(texto) + '</span>';
}

/* Classifica atingimento contra a meta proporcional do mes. */
function nivelMeta(p) {
  if (p == null) return 'neutro';
  if (p >= 100) return 'ok';
  if (p >= 85) return 'atencao';
  if (p >= 60) return 'grave';
  return 'critico';
}

function delta(v, opc) {
  const o = opc || {};
  if (v == null || !isFinite(v)) return '<span class="delta neu">' + ICO.igual + '&mdash;</span>';
  const bom = o.inverso ? v < 0 : v > 0;
  const zero = Math.abs(v) < 0.05;
  const cls = zero ? 'neu' : (bom ? 'pos' : 'neg');
  const ic = zero ? ICO.igual : (v > 0 ? ICO.sobe : ICO.desce);
  const txt = (v > 0 ? '+' : '') + (o.fmt ? o.fmt(v) : pct(v, 1));
  return '<span class="delta ' + cls + '">' + ic + txt + (o.sufixo ? ' ' + esc(o.sufixo) : '') + '</span>';
}

function kpi(o) {
  let h = '<div class="kpi">';
  h += '<div class="kpi-rotulo">' + esc(o.rotulo) +
       (o.dica ? '<span data-tip="' + esc(o.dica) + '" style="cursor:help;opacity:.6">&#9432;</span>' : '') + '</div>';
  h += '<div class="kpi-valor' + (o.pequeno ? ' sm' : '') + '">' + (o.valor == null ? '&mdash;' : o.valor) + '</div>';
  if (o.delta) h += o.delta;
  if (o.selo) h += ' ' + o.selo;
  if (o.nota) h += '<div class="kpi-nota">' + o.nota + '</div>';
  if (o.ritmo) h += o.ritmo;
  if (o.spark) h += '<div class="kpi-spark">' + o.spark + '</div>';
  return h + '</div>';
}

/* Barra de ritmo: quanto do mes passou x quanto da meta foi entregue. */
function ritmo(o) {
  const feito = o.feito || 0, meta = o.meta || 0;
  const p = meta > 0 ? Math.min(100, (feito / meta) * 100) : 0;
  const alvo = o.alvoPct == null ? null : Math.min(100, Math.max(0, o.alvoPct));
  const atingimento = meta > 0 && alvo != null && alvo > 0 ? (p / alvo) * 100 : null;
  const nv = nivelMeta(atingimento);
  const cor = nv === 'ok' ? 'var(--ok)' : nv === 'atencao' ? 'var(--atencao)' : nv === 'grave' ? 'var(--grave)' : nv === 'critico' ? 'var(--critico)' : 'var(--s1)';
  let h = '<div class="ritmo"><div class="ritmo-trilha">';
  h += '<div class="ritmo-fill" style="width:' + p.toFixed(1) + '%;background:' + cor + '"></div>';
  if (alvo != null) h += '<div class="ritmo-alvo" style="left:' + alvo.toFixed(1) + '%" data-tip="' +
    esc('Ritmo esperado para hoje: ' + pct(alvo, 0) + ' da meta do mes') + '"></div>';
  h += '</div><div class="ritmo-legenda"><span>' + (o.fmt || n0)(feito) + ' de ' + (o.fmt || n0)(meta) +
       (o.escopo ? ' <span style="opacity:.75">&middot; ' + esc(o.escopo) + '</span>' : '') + '</span>' +
       '<span>' + pct(p, 0) + ' da meta</span></div></div>';
  return h;
}

function cartao(titulo, sub, corpo, extra) {
  return '<div class="cartao"><div class="cartao-titulo">' + esc(titulo) + (extra || '') + '</div>' +
    (sub ? '<div class="cartao-sub">' + sub + '</div>' : '<div style="height:0.6rem"></div>') + corpo + '</div>';
}

function aviso(nivel, html) {
  const ic = nivel === 'info' ? ICO.info : ICO.alerta;
  return '<div class="aviso ' + nivel + '">' + ic + '<div>' + html + '</div></div>';
}

/* ===================== TABELAS INTERATIVAS =====================
   Ordenar pelo cabecalho, buscar, limitar e exportar. O estado fica no
   registro para o redesenho nao perder a ordenacao escolhida. */
const TABELAS = {};
let TABELA_ATIVA = null;

function tabelaInterativa(id, cols, dados, opc) {
  const o = opc || {};
  TABELAS[id] = {
    cols: cols, dados: dados,
    ord: o.ord || null, dir: o.dir || -1,
    limite: o.limite || 60, passo: o.limite || 60,
    titulo: o.titulo || id, total: o.total || null
  };
  if (o.ativa !== false) TABELA_ATIVA = id;
  return '<div id="tbl-' + id + '">' + desenharTabela(id) + '</div>';
}

function valOrd(r, c) {
  const v = typeof c.v === 'function' ? c.v(r) : r[c.k];
  if (v instanceof Date) return v.getTime();
  if (v == null || v === '') return c.tipo === 'txt' ? '' : -Infinity;
  return typeof v === 'number' ? v : (c.tipo && c.tipo !== 'txt' ? num(v) : chaveBusca(v));
}

function linhasOrdenadas(id) {
  const t = TABELAS[id];
  let d = t.dados.slice();
  if (t.ord) {
    const c = t.cols.find(x => x.k === t.ord);
    if (c) d.sort((a, b) => {
      const va = valOrd(a, c), vb = valOrd(b, c);
      if (va === vb) return 0;
      return (va > vb ? 1 : -1) * t.dir;
    });
  }
  return d;
}

function celula(r, c) {
  if (c.html) return c.html(r);
  const v = typeof c.v === 'function' ? c.v(r) : r[c.k];
  if (v == null || v === '') return '&mdash;';
  switch (c.tipo) {
    case 'moeda': return brl(v);
    case 'moeda0':return brl0(v);
    case 'num':   return n0(v);
    case 'num1':  return n1(v);
    case 'pct':   return pct(v, c.casas == null ? 0 : c.casas);
    case 'data':  return fmtData(v);
    default:      return esc(v);
  }
}

function desenharTabela(id) {
  const t = TABELAS[id];
  const d = linhasOrdenadas(id);
  if (!d.length) return '<div class="vazio">Nenhum registro no recorte atual.</div>';
  const vis = d.slice(0, t.limite);

  let h = '<div class="tabela-caixa"><table class="dados"><thead><tr>';
  t.cols.forEach(c => {
    const num_ = c.tipo && c.tipo !== 'txt' && c.tipo !== 'data';
    const ordenavel = c.ord !== false;
    h += '<th class="' + (num_ ? 'num ' : '') + (ordenavel ? '' : 'nao-ord ') + (t.ord === c.k ? 'ord' : '') +
      '" ' + (ordenavel ? 'data-tabela="' + id + '" data-col="' + esc(c.k) + '"' : '') + '>' + esc(c.rot) +
      (ordenavel ? '<span class="seta">' + (t.ord === c.k ? (t.dir > 0 ? '▲' : '▼') : '⇅') + '</span>' : '') + '</th>';
  });
  h += '</tr></thead><tbody>';
  vis.forEach(r => {
    h += '<tr>';
    t.cols.forEach(c => {
      const num_ = c.tipo && c.tipo !== 'txt' && c.tipo !== 'data';
      /* data-rot alimenta o ::before do modo cartao no telefone. */
      h += '<td data-rot="' + esc(c.rot) + '" class="' + (num_ ? 'num ' : '') + (c.cls || '') + '">' + celula(r, c) + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody>';
  if (t.total) {
    h += '<tfoot><tr>';
    t.cols.forEach((c, i) => {
      const tv = t.total[c.k];
      const num_ = c.tipo && c.tipo !== 'txt' && c.tipo !== 'data';
      h += '<td class="' + (num_ ? 'num' : '') + '">' + (i === 0 ? 'Total (' + n0(d.length) + ')' : (tv ? tv(d) : '')) + '</td>';
    });
    h += '</tr></tfoot>';
  }
  h += '</table></div>';

  h += '<div class="tabela-rodape"><span>Exibindo ' + n0(vis.length) + ' de ' + n0(d.length) + ' registros</span>';
  if (d.length > t.limite)
    h += '<button class="btn-acao" data-mais="' + id + '" type="button">Mostrar mais ' + n0(Math.min(t.passo, d.length - t.limite)) + '</button>';
  h += '</div>';
  return h;
}

function repintarTabela(id) {
  const el = document.getElementById('tbl-' + id);
  if (el) el.innerHTML = desenharTabela(id);
}

/* Mini barra dentro da celula - comparacao rapida sem sair da tabela. */
function barraCelula(v, max, cor, texto) {
  const p = max > 0 ? Math.min(100, (Math.abs(v) / max) * 100) : 0;
  return '<div class="celula-barra"><div class="cb-trilha"><div class="cb-fill" style="width:' + p.toFixed(1) +
    '%;background:' + (cor || 'var(--s1)') + '"></div></div><span class="cb-num">' + (texto == null ? n0(v) : texto) + '</span></div>';
}
/* ==========================================================================
   RECORTE (filtros) - um unico estado global que todas as telas respeitam.
   ========================================================================== */
const F = {
  periodo: 'u6',
  produtos: new Set(), sdrs: new Set(), closers: new Set(), origens: new Set(),
  busca: '',
  /* Recorte de situacao, so da tabela da esteira. Comeca em "em aberto"
     porque e nela que da para agir - mas os botoes mostram todas as
     contagens, para nada ficar escondido sem o gestor ver. */
  grupo: 'aberto',
  /* Recorte de campanhas ativas, so da tela de trafego. */
  soAtivas: false,
  /* Mes inspecionado na tela de KPIs. */
  mesKpi: null
};

const MES_ATUAL = chaveMes(new Date());
function mesMais(chave, delta) {
  const a = +chave.slice(0, 4), m = +chave.slice(5, 7) - 1 + delta;
  const d = new Date(a, m, 1);
  return chaveMes(d);
}

const PERIODOS = [
  { k: 'mes',   rot: 'Mes atual' },
  { k: 'ant',   rot: 'Mes anterior' },
  { k: 'u3',    rot: 'Ultimos 3 meses' },
  { k: 'u6',    rot: 'Ultimos 6 meses' },
  { k: 'u12',   rot: 'Ultimos 12 meses' },
  { k: 'ano',   rot: 'Ano corrente' },
  { k: 'tudo',  rot: 'Todo o historico' }
];

/* Resolve o periodo em uma faixa de datas e na lista de meses do eixo X. */
function faixa() {
  const h = new Date();
  const fimMes = new Date(h.getFullYear(), h.getMonth() + 1, 0, 23, 59, 59);
  let de, ate = fimMes;
  switch (F.periodo) {
    case 'mes': de = new Date(h.getFullYear(), h.getMonth(), 1); break;
    case 'ant': de = new Date(h.getFullYear(), h.getMonth() - 1, 1);
                ate = new Date(h.getFullYear(), h.getMonth(), 0, 23, 59, 59); break;
    case 'u3':  de = new Date(h.getFullYear(), h.getMonth() - 2, 1); break;
    case 'u6':  de = new Date(h.getFullYear(), h.getMonth() - 5, 1); break;
    case 'u12': de = new Date(h.getFullYear(), h.getMonth() - 11, 1); break;
    case 'ano': de = new Date(h.getFullYear(), 0, 1); break;
    default:    de = new Date(2000, 0, 1);
  }
  return { de: de, ate: ate };
}

function mesesDoEixo(minimo) {
  const f = faixa();
  const out = [];
  let k = chaveMes(f.de);
  const fim = chaveMes(f.ate);
  let guarda = 0;
  while (k <= fim && guarda++ < 240) { out.push(k); k = mesMais(k, 1); }
  if (minimo && out.length < 2 && minimo.length) return minimo;
  return out;
}

const noPeriodo = d => { if (!d) return false; const f = faixa(); return d >= f.de && d <= f.ate; };
const passaSet = (s, v) => !s.size || s.has(v);
function passaBusca(campos) {
  if (!F.busca) return true;
  const k = chaveBusca(F.busca);
  return campos.some(c => chaveBusca(c).includes(k));
}

/* Recortes por fonte */
function selAtend() {
  const d = DADOS.atend;
  if (!d) return [];
  return d.reg.filter(r =>
    noPeriodo(r.dAtend || r.dAgenda) &&
    passaSet(F.produtos, r.produto) && passaSet(F.sdrs, r.sdr) &&
    passaSet(F.closers, r.closer) &&
    passaBusca([r.lead, r.id, r.etapa, r.closer, r.sdr, r.produto, r.telefone, r.resultado]));
}
function selClientes() {
  const d = DADOS.clientes;
  if (!d) return [];
  return d.reg.filter(r =>
    noPeriodo(r.dFecha) &&
    passaSet(F.produtos, r.produto) && passaSet(F.sdrs, r.sdr) &&
    passaSet(F.closers, r.closer) && passaSet(F.origens, r.origem) &&
    passaBusca([r.contato, r.cliente, r.produto, r.closer, r.sdr, r.origem, r.tipoPag]));
}
function selMetaDia() {
  const d = DADOS.metaDia;
  if (!d) return [];
  return d.reg.filter(r => noPeriodo(r.d) && passaBusca([r.campanha]));
}
function selMetaReun() {
  const d = DADOS.metaReun;
  if (!d) return [];
  return d.reg.filter(r => noPeriodo(r.d) && passaSet(F.produtos, r.produto) && passaSet(F.origens, r.origem));
}
function selKommo() {
  const d = DADOS.kommo;
  if (!d) return [];
  return d.reg.filter(r =>
    noPeriodo(r.d) && passaSet(F.produtos, r.produto) && passaSet(F.origens, r.origem) &&
    passaBusca([r.lead, r.id, r.etapa, r.funil, r.campanha, r.produto]));
}

/* ===================== AGREGACAO ===================== */
function agrupar(lista, chaveFn, valorFn) {
  const m = new Map();
  lista.forEach(r => {
    const k = (chaveFn(r) || '').toString().trim() || '—';
    if (!m.has(k)) m.set(k, { k: k, n: 0, v: 0, itens: [] });
    const o = m.get(k);
    o.n++; o.v += valorFn ? (valorFn(r) || 0) : 1; o.itens.push(r);
  });
  return Array.from(m.values());
}
const porVolume = a => a.sort((x, y) => y.v - x.v || y.n - x.n);
const porN      = a => a.sort((x, y) => y.n - x.n);
/* Barra de R$ 0 nao informa nada e ocupa linha: fora dos recortes de valor. */
const semZero   = a => a.filter(x => (x.v || 0) !== 0);

/* Concentra a cauda em "Outros": a 9a cor categorica nao existe. */
function topN(arr, n, rotulo) {
  if (arr.length <= n) return arr;
  const cab = arr.slice(0, n - 1);
  const resto = arr.slice(n - 1);
  cab.push({
    k: rotulo || 'Outros (' + resto.length + ')',
    n: resto.reduce((a, x) => a + x.n, 0),
    v: resto.reduce((a, x) => a + x.v, 0),
    itens: resto.reduce((a, x) => a.concat(x.itens || []), []),
    cor: 'var(--texto-muted)'
  });
  return cab;
}

function serieMensal(lista, dataFn, valorFn, meses) {
  const m = {};
  lista.forEach(r => {
    const d = dataFn(r); if (!d) return;
    const k = chaveMes(d);
    m[k] = (m[k] || 0) + (valorFn ? (valorFn(r) || 0) : 1);
  });
  return meses.map(k => m[k] || 0);
}

const soma  = (l, f) => l.reduce((a, r) => a + (f(r) || 0), 0);

/* ===== TICKET MEDIO =====
   Conta SO quem teve honorario inicial. Fechamento com honorario condicionado
   a liminar entra na planilha como R$ 0: e venda, mas nao e preco. Deixar
   esses zeros no divisor achataria o ticket (R$ 888 no lugar de R$ 2.565 em
   out/26) e esconderia por quanto o escritorio de fato negocia.
   A contagem de CLIENTES segue sendo todos - o que muda e so o ticket. */
function ticketMedio(lista) {
  const com = (lista || []).filter(r => (r.honIni || 0) > 0);
  return com.length ? soma(com, r => r.honIni) / com.length : null;
}
const semTicket = lista => (lista || []).filter(r => (r.honIni || 0) <= 0).length;
const media = (l, f) => { const v = l.map(f).filter(x => x != null && isFinite(x) && x !== 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

/* KR do mes na planilha de metas, por nome. */
function kr(nomeMes, texto) {
  const m = DADOS.metas && DADOS.metas.meses && DADOS.metas.meses[nomeMes];
  if (!m || !m.krs) return null;
  const k = chaveBusca(texto);
  return m.krs.find(x => chaveBusca(x.kr).includes(k)) || null;
}
function metasMesAtual() {
  const m = DADOS.metas && DADOS.metas.meses;
  if (!m) return null;
  const nome = MESES_ACENTO[new Date().getMonth()];
  return m[nome] && !m[nome].erro ? m[nome] : null;
}
const MESES_ACENTO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* Quanto do mes ja passou - base de toda leitura de ritmo. */
function ritmoDoMes() {
  const m = metasMesAtual();
  const h = new Date();
  const diasMes = (m && m.diasMes) || new Date(h.getFullYear(), h.getMonth() + 1, 0).getDate();
  const diasComp = (m && m.diasComp) || h.getDate();
  return { diasMes: diasMes, diasComp: diasComp, pct: diasMes ? (diasComp / diasMes) * 100 : 0 };
}

/* ==========================================================================
   TELA 1 - VISAO GERAL
   ========================================================================== */
function telaVisao() {
  const meses = mesesDoEixo();
  const at = selAtend(), cli = selClientes(), md = selMetaDia();
  const rm = ritmoDoMes();
  const mAtual = metasMesAtual();

  /* O bloco de cima e sempre o MES CORRENTE, independente do filtro de
     periodo: e a leitura de ritmo que o gestor precisa todo dia. */
  const cliMes = (DADOS.clientes ? DADOS.clientes.reg : []).filter(r => r.mes === MES_ATUAL);
  const atMes  = (DADOS.atend ? DADOS.atend.reg : []).filter(r => r.mes === MES_ATUAL);
  const mdMes  = (DADOS.metaDia ? DADOS.metaDia.reg : []).filter(r => r.mes === MES_ATUAL);
  const honMes = soma(cliMes, r => r.honIni);
  const invMes = soma(mdMes, r => r.gasto);
  const leadsMes = soma(mdMes, r => r.leadsTotal);
  const reunMes = atMes.filter(r => r.dAtend).length;

  const nomeMes = MESES_ACENTO[new Date().getMonth()];
  const krClientes = kr(nomeMes, 'clientes');
  const krHon      = kr(nomeMes, 'honorarios iniciais');
  const krReun     = kr(nomeMes, 'reunioes realizadas');

  /* Os KRs da planilha sao POR RESPONSAVEL: "Clientes" e "Honorarios
     Iniciais" estao no bloco do closer, nao no do time. O numero grande do
     cartao e do time inteiro (e isso que a gestao olha), mas o ritmo contra a
     meta recorta o realizado no mesmo escopo do KR - senao compara 26
     fechamentos do time com a meta de 32 de uma pessoa so. */
  const escopoKr = (k, lista) => {
    if (!k || !k.resp) return { itens: lista, rot: 'time' };
    const nome = chaveBusca(k.resp);
    const pc = lista.filter(r => chaveBusca(r.closer || '') === nome);
    if (pc.length) return { itens: pc, rot: k.resp };
    const ps = lista.filter(r => chaveBusca(r.sdr || '') === nome);
    if (ps.length) return { itens: ps, rot: k.resp };
    return { itens: lista, rot: 'time' };
  };
  const escCli  = escopoKr(krClientes, cliMes);
  const escHon  = escopoKr(krHon, cliMes);
  const escReun = escopoKr(krReun, atMes.filter(r => r.dAtend));
  const honEsc  = soma(escHon.itens, r => r.honIni);

  let h = '';

  /* ----- Alertas de operacao e de dado ----- */
  const alertas = [];
  const paradas = (DADOS.atend ? DADOS.atend.reg : []).filter(r => r.parado);
  const fupPend = (DADOS.atend ? DADOS.atend.reg : []).filter(r => r.emAberto && r.fupPendentes > 0);
  if (paradas.length) alertas.push(aviso('atencao', '<b>' + n0(paradas.length) + ' negociacoes em aberto sem nenhum toque ha mais de 7 dias</b> ' +
    '(valor de proposta parado: ' + brl0(soma(paradas, r => r.vInicial)) + '). Veja em <a href="#" data-ir="esteira">Negociacao</a>.'));
  if (fupPend.length) alertas.push(aviso('atencao', '<b>' + n0(fupPend.length) + ' negociacoes com follow up marcado como Pendente</b> na esteira de FUP.'));
  if (ERROS.kommo) alertas.push(aviso('critico', '<b>Leads Kommo nao entrou:</b> ' + esc(ERROS.kommo) +
    ' A pre-qualificacao lead a lead fica indisponivel; os totais de funil seguem vindo da planilha de Metas.'));
  Object.keys(ERROS).filter(k => k !== 'kommo').forEach(k => {
    const f = FONTES.find(x => x.k === k);
    alertas.push(aviso(f && f.critica ? 'critico' : 'atencao', '<b>' + esc(f ? f.nome : k) + ' nao entrou:</b> ' + esc(ERROS[k])));
  });
  if (alertas.length) h += alertas.join('');

  /* ----- KPIs do mes corrente ----- */
  h += '<div class="secao-titulo primeiro">Mes corrente &middot; ' + rotuloMes(MES_ATUAL) +
       ' <span style="text-transform:none;letter-spacing:0;font-weight:500">(' + rm.diasComp + ' de ' + rm.diasMes +
       ' dias &mdash; ' + pct(rm.pct, 0) + ' do mes)</span></div>';
  if (escCli.rot !== 'time' || escHon.rot !== 'time') {
    h += aviso('info', 'Os numeros grandes sao do <b>time inteiro</b>, somados das planilhas de atendimento e de clientes. ' +
      'As metas da planilha de Metas estao lancadas <b>por responsavel</b> &mdash; por isso a barra de ritmo diz de quem e a meta ' +
      'que ela esta medindo. E tambem por isso o painel pode mostrar mais clientes no mes do que o KR de um closer sozinho.');
  }
  h += '<div class="grid g-kpi">';
  h += kpi({
    rotulo: 'Clientes fechados', valor: n0(cliMes.length),
    dica: 'O numero grande e do time. A barra de ritmo compara com a meta do responsavel pelo KR na planilha.',
    ritmo: krClientes ? ritmo({ feito: escCli.itens.length, meta: krClientes.metaMes, alvoPct: rm.pct, escopo: escCli.rot }) : null,
    selo: krClientes ? selo(nivelMeta(taxa(escCli.itens.length, krClientes.metaProp)), 'ritmo ' + pctOuTraco(taxa(escCli.itens.length, krClientes.metaProp))) : null
  });
  h += kpi({
    rotulo: 'Honorarios iniciais', valor: brl0(honMes), pequeno: true,
    ritmo: krHon ? ritmo({ feito: honEsc, meta: krHon.metaMes, alvoPct: rm.pct, fmt: brl0, escopo: escHon.rot }) : null,
    selo: krHon ? selo(nivelMeta(taxa(honEsc, krHon.metaProp)), 'ritmo ' + pctOuTraco(taxa(honEsc, krHon.metaProp))) : null
  });
  h += kpi({
    rotulo: 'Ticket medio', valor: ticketMedio(cliMes) == null ? '&mdash;' : brl0(ticketMedio(cliMes)), pequeno: true,
    dica: 'Media dos honorarios iniciais entre os clientes que tiveram honorario inicial. Fechamento condicionado a liminar (R$ 0) nao entra no calculo: e venda, mas nao e preco.',
    nota: semTicket(cliMes) ? 'Entre os ' + n0(cliMes.length - semTicket(cliMes)) + ' com honorario inicial &mdash; ' +
      n0(semTicket(cliMes)) + ' condicionado(s) a liminar ficam fora' : 'Sobre os ' + n0(cliMes.length) + ' clientes do mes'
  });
  h += kpi({
    rotulo: 'Reunioes realizadas', valor: n0(reunMes),
    ritmo: krReun ? ritmo({ feito: escReun.itens.length, meta: krReun.metaMes, alvoPct: rm.pct, escopo: escReun.rot }) : null,
    selo: krReun ? selo(nivelMeta(taxa(escReun.itens.length, krReun.metaProp)), 'ritmo ' + pctOuTraco(taxa(escReun.itens.length, krReun.metaProp))) : null
  });
  h += kpi({
    rotulo: 'Conversao reuniao → cliente', valor: pctOuTraco(taxa(cliMes.length, reunMes), 1),
    dica: 'Clientes fechados no mes dividido por reunioes realizadas no mes. Nao e a mesma coorte: um cliente de outubro pode ter vindo de reuniao de setembro.',
    nota: n0(cliMes.length) + ' clientes / ' + n0(reunMes) + ' reunioes' +
      (escCli.rot !== 'time' && escReun.itens.length
        ? ' &middot; ' + esc(escCli.rot) + ': ' + pctOuTraco(taxa(escCli.itens.length, escReun.itens.length), 1) : '')
  });
  h += kpi({
    rotulo: 'Investimento Meta Ads', valor: brl0(invMes), pequeno: true,
    nota: mdMes.length ? 'Media diaria ' + brl0(invMes / Math.max(1, rm.diasComp)) : 'Sem leitura de insights'
  });
  h += kpi({
    rotulo: 'CPL', valor: leadsMes ? brl(invMes / leadsMes) : '&mdash;', pequeno: true,
    nota: n0(leadsMes) + ' leads no Meta no mes'
  });
  h += kpi({
    rotulo: 'CAC', valor: cliMes.length ? brl0(invMes / cliMes.length) : '&mdash;', pequeno: true,
    dica: 'Investimento em midia do mes dividido pelos clientes do mes. Nao inclui custo de equipe.'
  });
  h += kpi({
    rotulo: 'ROI sobre midia', valor: invMes ? n1(honMes / invMes) + 'x' : '&mdash;', pequeno: true,
    selo: invMes ? selo(honMes / invMes >= 3 ? 'ok' : honMes / invMes >= 1.5 ? 'atencao' : 'critico',
      honMes / invMes >= 3 ? 'saudavel' : honMes / invMes >= 1.5 ? 'apertado' : 'no vermelho') : null,
    nota: 'Honorarios iniciais / investimento'
  });
  h += '</div>';

  /* ----- Series do periodo filtrado ----- */
  h += '<div class="secao-titulo">Evolucao &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += '<div class="grid g-2">';

  const sClientes = serieMensal(cli, r => r.dFecha, null, meses);
  const sHon      = serieMensal(cli, r => r.dFecha, r => r.honIni, meses);
  const sReun     = serieMensal(at.filter(r => r.dAtend), r => r.dAtend, null, meses);
  const sInv      = serieMensal(md, r => r.d, r => r.gasto, meses);
  const sLeads    = serieMensal(md, r => r.d, r => r.leadsTotal, meses);
  const eixo      = meses.map(rotuloMesCurto);

  h += cartao('Clientes por mes de fechamento', 'Fonte: FLUXO DE CLIENTES [2026], aba DADOS.',
    vizColunas({ dados: meses.map((k, i) => ({ k: rotuloMesCurto(k), rot: rotuloMes(k), v: sClientes[i] })), cor: 'var(--s3)', nome: 'Clientes' }));

  h += cartao('Honorarios iniciais por mes', 'Soma da coluna HONORARIOS INICIAIS, por data de fechamento.',
    vizColunas({ dados: meses.map((k, i) => ({ k: rotuloMesCurto(k), rot: rotuloMes(k), v: sHon[i] })), cor: 'var(--s1)', nome: 'Honorarios', fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', rotulos: false }));

  /* Duas medidas de escalas diferentes = dois graficos. Nunca dois eixos Y. */
  h += cartao('Reunioes realizadas x clientes fechados', 'Mesma escala (contagem), por isso dividem o grafico.',
    vizLinhas({ x: eixo, fmt: n0, series: [
      { nome: 'Reunioes', vals: sReun, cor: 'var(--s1)' },
      { nome: 'Clientes', vals: sClientes, cor: 'var(--s3)' }
    ] }) + legenda([{ nome: 'Reunioes', cor: 'var(--s1)' }, { nome: 'Clientes', cor: 'var(--s3)' }]));

  h += cartao('Investimento em midia por mes', 'Gasto no Meta Ads. O retorno aparece no grafico ao lado, em escala propria.',
    vizColunas({ dados: meses.map((k, i) => ({ k: rotuloMesCurto(k), rot: rotuloMes(k), v: sInv[i] })), cor: 'var(--s2)', nome: 'Investimento', fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', rotulos: false }));
  h += '</div>';

  /* ----- Quebras ----- */
  h += '<div class="secao-titulo">Onde o resultado se forma</div>';
  h += '<div class="grid g-3">';
  const porCloser = semZero(porVolume(agrupar(cli, r => r.closer, r => r.honIni)));
  h += cartao('Honorarios por closer', 'Clientes fechados no recorte.',
    vizBarras({ dados: porCloser.map((g, i) => ({ k: g.k, v: g.v, cor: corSerie(i), extra: [{ rot: 'Clientes', val: n0(g.n) }, { rot: 'Ticket medio', val: ticketMedio(g.itens) == null ? '—' : brl0(ticketMedio(g.itens)) }] })), fmt: brl0, nome: 'Honorarios' }));

  const porProduto = semZero(porVolume(topN(agrupar(cli, r => r.produto, r => r.honIni), 6)));
  h += cartao('Honorarios por produto juridico', 'Concentracao da receita por tese.',
    vizBarras({ dados: porProduto.map((g, i) => ({ k: g.k, v: g.v, cor: g.cor || corSerie(i), extra: [{ rot: 'Clientes', val: n0(g.n) }] })), fmt: brl0, nome: 'Honorarios' }));

  const porOrigem = porN(topN(agrupar(cli, r => r.origem), 6));
  h += cartao('Clientes por origem', 'De onde vem quem assina.',
    vizBarras({ dados: porOrigem.map((g, i) => ({ k: g.k, v: g.n, cor: g.cor || corSerie(i), extra: [{ rot: 'Honorarios', val: brl0(soma(g.itens, r => r.honIni)) }] })), nome: 'Clientes' }));
  h += '</div>';

  return h;
}

/* ==========================================================================
   TELA 2 - FUNIL E PRE-QUALIFICACAO
   ========================================================================== */
function telaFunil() {
  let h = '';
  const p = DADOS.metas && DADOS.metas.produtos;
  const atual = p && p.atual;

  if (atual && atual.real) {
    const ordem = ['leads (organico)', 'leads (kommo)', 'leads (meta ads)', 'responderam a triagem', 'elegiveis',
      'responderam a qualificacao', 'qualificados (aguardando documentacao)', 'diagnosticos', 'viaveis',
      'atendimentos realizados', 'clientes'];
    /* As linhas de ORIGEM de lead (Organico, Kommo, Meta Ads) sao paralelas
       entre si, nao etapas em sequencia: encadear uma na outra produziria
       "conversao de 1.981%". Elas entram somadas como topo do funil, e a
       cadeia de conversao comeca na triagem. */
    const FONTES_LEAD = ['leads (organico)', 'leads (kommo)', 'leads (meta ads)',
                         'leads abordados ou que falaram no whatsapp'];
    const valorDe = k => (atual.real && atual.real[k] != null && atual.real[k] !== '') ? num(atual.real[k]) : null;

    const origens = FONTES_LEAD.map(k => {
      const v = valorDe(k);
      if (!v) return null;
      const e = atual.etapas.find(x => x.k === k);
      return { k: (e && e.rot) || k, v: v };
    }).filter(Boolean);
    const totalLeads = origens.reduce((a, o) => a + o.v, 0);

    const etapas = totalLeads ? [{ k: 'Leads (todas as origens)', v: totalLeads }] : [];
    ordem.filter(k => FONTES_LEAD.indexOf(k) < 0).forEach(k => {
      const v = valorDe(k);
      if (!v) return;
      const e = atual.etapas.find(x => x.k === k);
      etapas.push({ k: (e && e.rot) || k, v: v });
    });

    h += '<div class="secao-titulo primeiro">Funil do produto &middot; ' +
      (atual.medicao ? 'medicao de ' + esc(atual.medicao) : rotuloMes(MES_ATUAL)) + '</div>';
    h += aviso('info', 'Este funil vem da aba <b>Produtos Juridicos</b> da planilha de Metas &mdash; ' +
      'e a contagem que o time mantem a mao. A percentagem ao lado de cada etapa e a conversao sobre a etapa anterior. ' +
      'As origens de lead entram somadas no topo (elas sao paralelas, nao etapas em sequencia).');
    h += '<div class="grid g-2">';
    h += cartao('Funil realizado no mes', 'Volume por etapa e conversao etapa a etapa.', vizFunil(etapas));

    if (origens.length > 1) {
      h += cartao('De onde vieram os leads do mes', 'Origens somadas no topo do funil.',
        /* Barra horizontal ja carrega o proprio rotulo: legenda aqui seria
           repetir a mesma lista duas vezes. */
        vizBarras({ dados: origens.map((o, i) => ({ k: o.k, v: o.v, cor: corSerie(i),
          extra: [{ rot: 'Participacao', val: pct(taxa(o.v, totalLeads), 1) }] })), nome: 'Leads' }));
    }

    /* Real x projetado: a planilha ja traz as duas projecoes. Mostro o texto
       original da celula (R$, %, decimal) em vez de reformatar - assim a
       linha de ROI nao vira "2" no lugar de "2,02". */
    const cel = (o, k) => (o && o[k] != null && o[k] !== '') ? String(o[k]).trim() : '';
    const linhas = atual.etapas.map(e => ({
      etapa: e.rot,
      real: num(cel(atual.real, e.k)),        realTxt: cel(atual.real, e.k),
      projProp: num(cel(atual.projProp, e.k)), projPropTxt: cel(atual.projProp, e.k),
      projMes: num(cel(atual.projMes, e.k)),   projMesTxt: cel(atual.projMes, e.k)
    })).filter(l => l.realTxt || l.projMesTxt);
    const txtOuNum = (txt, n) => txt ? esc(txt) : (n ? n0(n) : '&mdash;');

    h += cartao('Realizado x projetado', 'Comparacao com a projecao proporcional (ritmo esperado para hoje) e com a meta cheia do mes.',
      tabelaInterativa('funil-proj', [
        { k: 'etapa', rot: 'Etapa', tipo: 'txt', cls: 'forte' },
        { k: 'real', rot: 'Real', tipo: 'num',
          html: r => '<b style="color:var(--texto)">' + txtOuNum(r.realTxt, r.real) + '</b>' },
        { k: 'projProp', rot: 'Proj. proporcional', tipo: 'num', html: r => txtOuNum(r.projPropTxt, r.projProp) },
        { k: 'atingProp', rot: 'vs proporcional', tipo: 'num', ord: false,
          html: r => { const t = taxa(r.real, r.projProp); return t == null ? '&mdash;' : selo(nivelMeta(t), pct(t, 0)); } },
        { k: 'projMes', rot: 'Meta do mes', tipo: 'num', html: r => txtOuNum(r.projMesTxt, r.projMes) },
        { k: 'atingMes', rot: 'vs meta', tipo: 'num', ord: false,
          html: r => { const t = taxa(r.real, r.projMes); return t == null ? '&mdash;' : pct(t, 0); } }
      ], linhas, { titulo: 'Funil realizado x projetado', limite: 25, ativa: false }));
    h += '</div>';

    /* ----- Avanco etapa a etapa, em numero e em percentual -----
       Duas taxas diferentes, e confundi-las e o erro classico de leitura de
       funil: o AVANCO e sobre a etapa imediatamente anterior (mede aquela
       passagem) e o ACUMULADO e sobre o topo (mede o funil inteiro ate ali).
       A coluna de perda mostra quantos ficaram pelo caminho naquele degrau. */
    if (etapas.length > 1) {
      const passos = etapas.map((e, i) => {
        const ant = i > 0 ? etapas[i - 1].v : null;
        return {
          etapa: e.k, ordem: i + 1, volume: e.v,
          avanco: ant ? taxa(e.v, ant) : null,
          perda: ant ? ant - e.v : null,
          perdaPct: ant ? taxa(ant - e.v, ant) : null,
          acumulado: taxa(e.v, etapas[0].v)
        };
      });
      /* O degrau que mais sangra, para o olho ir direto nele. */
      const pior = passos.filter(p => p.perda != null)
        .sort((a, b) => b.perda - a.perda)[0];

      h += '<div class="secao-titulo">Avanco etapa a etapa</div>';
      if (pior && pior.perda > 0) {
        h += aviso('atencao', 'O degrau que mais perde gente e <b>' + esc(pior.etapa) + '</b>: ' +
          'entram ' + n0(pior.volume + pior.perda) + ', seguem ' + n0(pior.volume) + ' &mdash; ' +
          '<b>' + n0(pior.perda) + ' ficam pelo caminho</b> (' + pct(pior.perdaPct, 0) + ' daquela etapa).');
      }
      h += tabelaInterativa('funil-passos', [
        { k: 'ordem', rot: '#', tipo: 'num' },
        { k: 'etapa', rot: 'Etapa', tipo: 'txt', cls: 'forte' },
        { k: 'volume', rot: 'Volume', tipo: 'num',
          html: r => barraCelula(r.volume, etapas[0].v, corRampa(r.ordem - 1, etapas.length), n0(r.volume)) },
        { k: 'avanco', rot: 'Avanco da etapa anterior', tipo: 'num', ord: false,
          html: r => r.avanco == null ? '<span style="color:var(--texto-muted)">topo do funil</span>'
            : selo(r.avanco >= 80 ? 'ok' : r.avanco >= 50 ? 'atencao' : 'critico', pct(r.avanco, 1)) },
        { k: 'perda', rot: 'Perda no degrau', tipo: 'num',
          html: r => r.perda == null ? '&mdash;' : (r.perda > 0
            ? '<span style="color:#e98a8a">-' + n0(r.perda) + '</span> <span style="color:var(--texto-muted)">(' + pct(r.perdaPct, 0) + ')</span>'
            : n0(0)) },
        { k: 'acumulado', rot: 'Do topo do funil', tipo: 'num', ord: false,
          html: r => pct(r.acumulado, r.acumulado < 10 ? 2 : 1) }
      ], passos, { titulo: 'Avanco do funil', limite: 20, ativa: false });
    }

    /* ----- Origem dos leads: campanha a campanha ----- */
    /* Escopo do MES, nao do filtro de periodo: o organico e o total do CRM
       vem da aba de Produtos Juridicos, que e mensal. Somar 6 meses de
       campanha contra 1 mes de organico daria uma participacao mentirosa. */
    h += '<div class="secao-titulo">Origem dos leads &middot; ' + rotuloMes(atual.medicao ? MES_ATUAL : MES_ATUAL) + '</div>';
    const midiaMes = (DADOS.metaDia ? DADOS.metaDia.reg : []).filter(r => r.mes === MES_ATUAL);
    const porCampanha = porN(agrupar(midiaMes.filter(r => r.leadsTotal > 0),
      r => r.campanha, r => r.leadsTotal)).map(g => ({ k: g.k, v: g.v, tipo: 'Campanha paga' }));
    const leadsPagos = soma(porCampanha, g => g.v);
    const organico = valorDe('leads (organico)') || 0;
    const totalCrm = valorDe('leads (kommo)') || 0;
    /* O que o CRM registrou e a midia nao explica: parceria, indicacao,
       recompra, direct. So entra se for positivo - numero negativo aqui
       significaria atribuicao furada, e inventar uma fatia esconderia isso. */
    const outras = Math.max(0, totalCrm - leadsPagos - organico);
    const fatias = porCampanha.slice();
    if (organico) fatias.push({ k: 'Organico', v: organico, tipo: 'Organico' });
    if (outras)   fatias.push({ k: 'Outras origens (nao atribuido)', v: outras, tipo: 'Outras' });
    const totalFatias = soma(fatias, f => f.v);

    if (!fatias.length) {
      h += '<div class="cartao"><div class="vazio">Sem leads com origem identificada no recorte.</div></div>';
    } else {
      const corTipo = t => t === 'Organico' ? 'var(--s3)' : t === 'Outras' ? 'var(--texto-muted)' : 'var(--s1)';
      h += '<div class="grid g-2">';
      h += cartao('De onde vieram os leads', 'Campanha paga pelos insights do Meta, organico pela planilha de Metas.',
        vizBarras({ rotuloW: 230, nome: 'Leads', dados: topN(fatias.map(f =>
          ({ k: f.k, v: f.v, n: 1, cor: corTipo(f.tipo),
             extra: [{ rot: 'Participacao', val: pct(taxa(f.v, totalFatias), 1) }] })), 9) }) +
        legenda([{ nome: 'Campanha paga', cor: 'var(--s1)', val: n0(leadsPagos) },
                 { nome: 'Organico', cor: 'var(--s3)', val: n0(organico) },
                 { nome: 'Outras origens', cor: 'var(--texto-muted)', val: n0(outras) }]));

      h += cartao('Pago, organico e outras', 'Participacao de cada natureza de origem no total de leads.',
        vizDonut({ centro: n0(totalFatias), centroRot: 'leads', dados: [
          { k: 'Campanha paga', v: leadsPagos, cor: 'var(--s1)' },
          { k: 'Organico', v: organico, cor: 'var(--s3)' },
          { k: 'Outras origens', v: outras, cor: 'var(--texto-muted)' }
        ] }));
      h += '</div>';

      /* Tabela com custo e CPL por campanha - a leitura que decide verba. */
      const invPorCamp = {};
      midiaMes.forEach(r => { invPorCamp[r.campanha] = (invPorCamp[r.campanha] || 0) + r.gasto; });
      const tabOrigem = fatias.map(f => ({
        origem: f.k, tipo: f.tipo, leads: f.v,
        share: taxa(f.v, totalFatias),
        gasto: f.tipo === 'Campanha paga' ? (invPorCamp[f.k] || 0) : null,
        cpl: f.tipo === 'Campanha paga' && f.v ? (invPorCamp[f.k] || 0) / f.v : null
      }));
      h += tabelaInterativa('funil-origem', [
        { k: 'origem', rot: 'Origem', tipo: 'txt', cls: 'forte wrap' },
        { k: 'tipo', rot: 'Natureza', tipo: 'txt', ord: false,
          html: r => '<span style="color:' + corTipo(r.tipo) + '">&#9679;</span> ' + esc(r.tipo) },
        { k: 'leads', rot: 'Leads', tipo: 'num' },
        { k: 'share', rot: '% do total', tipo: 'pct', casas: 1 },
        { k: 'gasto', rot: 'Investimento', tipo: 'moeda0' },
        { k: 'cpl', rot: 'CPL', tipo: 'moeda',
          html: r => r.cpl == null ? '<span style="color:var(--texto-muted)">sem custo de midia</span>' : brl(r.cpl) }
      ], tabOrigem, { ord: 'leads', dir: -1, titulo: 'Origem dos leads', limite: 40,
        total: { leads: d => n0(soma(d, r => r.leads)), gasto: d => brl0(soma(d, r => r.gasto)),
                 cpl: d => { const l = soma(d.filter(r => r.cpl != null), r => r.leads);
                             return l ? brl(soma(d, r => r.gasto) / l) : ''; } } });

      if (totalCrm && leadsPagos + organico > totalCrm) {
        h += aviso('atencao', 'A soma de campanha paga (' + n0(leadsPagos) + ') com organico (' + n0(organico) +
          ') passa o total de leads que o CRM registrou no mes (' + n0(totalCrm) + '). ' +
          'Os insights do Meta contam lead por plataforma e o CRM conta lead criado &mdash; a diferenca costuma ser ' +
          'lead duplicado ou que nao chegou a virar registro.');
      }
    }

    /* Taxas de conversao projetadas x reais, quando a planilha informa. */
    if (atual.taxasReal && atual.taxasProj) {
      const tx = atual.etapas.map(e => {
        const r = atual.taxasReal[e.k], pj = atual.taxasProj[e.k];
        if (!r || !pj || !/%/.test(String(r)) && !/%/.test(String(pj))) return null;
        return { etapa: e.rot, real: numPct(r), proj: numPct(pj) };
      }).filter(Boolean);
      if (tx.length) {
        h += '<div class="secao-titulo">Taxas de conversao &middot; real x projetada</div>';
        h += cartao('Conversao por etapa', 'Onde a operacao esta acima e abaixo do que o modelo assume.',
          vizLinhas({ x: tx.map(t => t.etapa.length > 14 ? t.etapa.slice(0, 13) + '…' : t.etapa), fmt: v => pct(v, 0),
            series: [{ nome: 'Projetada', vals: tx.map(t => t.proj), cor: 'var(--s4)' },
                     { nome: 'Real', vals: tx.map(t => t.real), cor: 'var(--s1)' }] }) +
          legenda([{ nome: 'Projetada', cor: 'var(--s4)' }, { nome: 'Real', cor: 'var(--s1)' }]));
      }
    }
  } else if (p && p.atualErro) {
    h += aviso('atencao', 'Nao consegui ler a aba de funil da planilha de Metas: ' + esc(p.atualErro));
  }

  /* ----- Pre-qualificacao lead a lead (Kommo) ----- */
  h += '<div class="secao-titulo">Pre-qualificacao lead a lead &middot; Kommo</div>';
  if (ERROS.kommo) {
    h += aviso('critico', '<b>A planilha Leads Kommo [DASHBOARDS] nao pode ser lida pelo navegador.</b><br>' +
      esc(ERROS.kommo) + '<br><br>Das seis planilhas do painel, ela e a unica sem leitura por link. ' +
      'Para liberar: abra a planilha &rarr; <b>Compartilhar</b> &rarr; <i>Acesso geral</i> &rarr; ' +
      '<b>Qualquer pessoa com o link</b>, no papel <b>Leitor</b>. ' +
      'Enquanto isso, o funil acima continua vindo da planilha de Metas.');
  } else if (DADOS.kommo) {
    const kk = selKommo();
    const d = DADOS.kommo;
    if (d.legadas) {
      h += aviso('atencao', '<b>A aba Leads esta no meio de uma reescrita.</b> ' +
        'O cabecalho ja esta no formato novo (57 colunas), mas ' + n0(d.legadas) +
        ' linhas ainda estao no formato antigo (17 colunas) &mdash; o coletor falhou antes de terminar. ' +
        'O painel le os dois formatos, mas os campos novos (valor, motivo de perda, UTM) so existem nas linhas ja migradas.');
    }
    const preq = kk.filter(r => r.preQual);
    h += '<div class="grid g-kpi">';
    h += kpi({ rotulo: 'Leads no recorte', valor: n0(kk.length), nota: 'Funil Processual fora: nao e lead comercial' });
    h += kpi({ rotulo: 'Responderam a triagem', valor: n0(preq.length),
      nota: pctOuTraco(taxa(preq.length, kk.length), 1) + ' dos leads',
      dica: 'Conta quem respondeu ao menos um campo do formulario (plano, tipo, mensalidade ou tempo de plano).' });
    h += kpi({ rotulo: 'Marcados como perdidos', valor: n0(kk.filter(r => r.perdido).length),
      nota: pctOuTraco(taxa(kk.filter(r => r.perdido).length, kk.length), 1) + ' dos leads' });
    h += kpi({ rotulo: 'Com reuniao agendada', valor: n0(kk.filter(r => r.reuniao).length) });
    h += '</div>';

    const meses = mesesDoEixo();
    h += '<div class="grid g-2" style="margin-top:0.85rem">';
    h += cartao('Leads por mes de entrada', 'Total e quantos responderam a triagem.',
      vizLinhas({ x: meses.map(rotuloMesCurto), fmt: n0, series: [
        { nome: 'Leads', vals: serieMensal(kk, r => r.d, null, meses), cor: 'var(--s1)' },
        { nome: 'Responderam a triagem', vals: serieMensal(preq, r => r.d, null, meses), cor: 'var(--s3)' }
      ] }) + legenda([{ nome: 'Leads', cor: 'var(--s1)' }, { nome: 'Responderam a triagem', cor: 'var(--s3)' }]));

    h += cartao('Etapas do CRM', 'Onde os leads do recorte estao parados.',
      vizBarras({ dados: porN(topN(agrupar(kk, r => r.etapa), 10)).map((g, i) => ({ k: g.k, v: g.n, cor: g.cor || corRampa(i, 10) })), nome: 'Leads' }));

    h += cartao('Campanhas que trouxeram lead', 'Pelo campo Campanha do CRM.',
      vizBarras({ dados: porN(topN(agrupar(kk.filter(r => r.campanha), r => r.campanha), 8)).map((g, i) => ({ k: g.k, v: g.n, cor: g.cor || corSerie(i) })), nome: 'Leads' }));

    h += cartao('Perfil de quem responde', 'Tipo de plano declarado na triagem.',
      vizBarras({ dados: porN(topN(agrupar(preq.filter(r => r.tipoPlano), r => r.tipoPlano), 7)).map((g, i) => ({ k: g.k, v: g.n, cor: g.cor || corSerie(i) })), nome: 'Leads' }));
    h += '</div>';

    h += '<div class="secao-titulo">Leads do recorte</div>';
    h += tabelaInterativa('kommo-leads', [
      { k: 'd', rot: 'Entrada', tipo: 'data' },
      { k: 'lead', rot: 'Lead', tipo: 'txt', cls: 'forte' },
      { k: 'funil', rot: 'Funil', tipo: 'txt' },
      { k: 'etapa', rot: 'Etapa', tipo: 'txt' },
      { k: 'situacao', rot: 'Situacao', tipo: 'txt' },
      { k: 'produto', rot: 'Produto', tipo: 'txt' },
      { k: 'campanha', rot: 'Campanha', tipo: 'txt' },
      { k: 'tipoPlano', rot: 'Tipo de plano', tipo: 'txt' },
      { k: 'mensalidade', rot: 'Mensalidade', tipo: 'txt' },
      { k: 'preQual', rot: 'Triagem', tipo: 'txt', ord: false,
        html: r => r.preQual ? selo('ok', 'respondeu') : selo('neutro', 'sem resposta') },
      { k: 'responsavel', rot: 'Responsavel', tipo: 'txt' }
    ], kk, { ord: 'd', dir: -1, titulo: 'Leads Kommo', limite: 50 });
  }
  return h;
}

/* ==========================================================================
   TELA 3 - NEGOCIACAO (ESTEIRA)
   ========================================================================== */
function telaEsteira() {
  if (ERROS.atend) return aviso('critico', '<b>Fluxo de Atendimentos nao entrou:</b> ' + esc(ERROS.atend));
  const at = selAtend();
  const todos = DADOS.atend ? DADOS.atend.reg : [];
  const abertos = at.filter(r => r.emAberto);
  const ganhos = at.filter(r => r.grupo === 'ganho');
  const perdidos = at.filter(r => r.grupo === 'perdido');
  const semResp = at.filter(r => r.grupo === 'semresposta');
  const decididos = ganhos.length + perdidos.length;

  let h = '';
  h += '<div class="secao-titulo primeiro">Esteira de negociacao &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Em aberto', valor: n0(abertos.length),
    nota: 'Negociacoes vivas (fora ganho, perda e sem resposta)' });
  h += kpi({ rotulo: 'Proposta em aberto', valor: brl0(soma(abertos, r => r.vInicial)), pequeno: true,
    nota: 'Soma dos honorarios iniciais propostos nas negociacoes vivas',
    dica: 'So conta quem tem valor de proposta preenchido na planilha.' });
  h += kpi({ rotulo: 'Ganhos no recorte', valor: n0(ganhos.length),
    nota: 'Etapa "Enviado a Triagem e Distribuicao"' });
  h += kpi({ rotulo: 'Taxa de ganho', valor: pctOuTraco(taxa(ganhos.length, decididos), 1),
    dica: 'Ganhos dividido por ganhos + perdidos. Quem esta sem resposta nao entra: ainda nao decidiu.',
    nota: n0(ganhos.length) + ' de ' + n0(decididos) + ' decididos' });
  h += kpi({ rotulo: 'Sem resposta', valor: n0(semResp.length),
    nota: pctOuTraco(taxa(semResp.length, at.length), 0) + ' dos atendimentos do recorte',
    selo: taxa(semResp.length, at.length) > 40 ? selo('critico', 'maior gargalo') : null });
  h += kpi({ rotulo: 'Tempo medio em negociacao', valor: (() => { const m = media(abertos, r => r.diasNeg); return m == null ? '&mdash;' : n0(m) + ' dias'; })(), pequeno: true });
  h += kpi({ rotulo: 'Paradas ha mais de 7 dias', valor: n0(abertos.filter(r => r.parado).length),
    selo: abertos.filter(r => r.parado).length ? selo('atencao', 'retomar contato') : selo('ok', 'em dia'),
    dica: 'Dias desde o ultimo follow up registrado ou, na falta dele, desde o atendimento.' });
  h += kpi({ rotulo: 'FUP pendentes', valor: n0(soma(abertos, r => r.fupPendentes)),
    nota: n0(abertos.filter(r => r.fupPendentes > 0).length) + ' negociacoes com pendencia' });
  h += '</div>';

  /* ----- Distribuicao pela esteira ----- */
  h += '<div class="secao-titulo">Como a esteira esta distribuida</div>';
  h += '<div class="grid g-2">';
  const etapas = agrupar(at, r => r.etapa).sort((a, b) => posEtapa(a.k) - posEtapa(b.k));
  h += cartao('Etapas do funil de negociacao', 'Na ordem da esteira, do primeiro contato ao fechamento.',
    vizBarras({ dados: etapas.map((g, i) => ({
      k: g.k, v: g.n, cor: COR_GRUPO[grupoEtapa(g.k)],
      extra: [{ rot: 'Proposta somada', val: brl0(soma(g.itens, r => r.vInicial)) }]
    })), nome: 'Negociacoes' }) +
    legenda(['ganho', 'aberto', 'semresposta', 'perdido'].map(g => ({ nome: ROTULO_GRUPO[g], cor: COR_GRUPO[g] }))));

  const sit = ['ganho', 'aberto', 'semresposta', 'perdido'].map(g => ({
    k: ROTULO_GRUPO[g], v: at.filter(r => r.grupo === g).length, cor: COR_GRUPO[g]
  }));
  h += cartao('Desfecho dos atendimentos', 'Participacao de cada situacao no recorte.',
    vizDonut({ dados: sit, centro: n0(at.length), centroRot: 'atendimentos' }) + legenda(sit.map(s => ({ nome: s.k, cor: s.cor, val: n0(s.v) }))));

  /* Esteira de FUP: onde cada negociacao viva parou. */
  const fupDef = DADOS.atend.fups || [];
  if (fupDef.length) {
    const passos = fupDef.map(f => ({
      k: f.rotulo,
      v: at.filter(r => r.fups.some(x => x.n === f.n && /feito/i.test(x.status))).length,
      pend: at.filter(r => r.fups.some(x => x.n === f.n && /pendente/i.test(x.status))).length
    }));
    h += cartao('Esteira de follow up', 'Quantos atendimentos do recorte tiveram cada follow up marcado como Feito. O degrau onde a barra cai e onde a esteira perde gente.',
      vizBarras({ dados: passos.map((p, i) => ({
        k: p.k, v: p.v, cor: corRampa(i, passos.length),
        extra: p.pend ? [{ rot: 'Pendentes', val: n0(p.pend), cor: 'var(--atencao)' }] : []
      })), nome: 'Feitos' }));
  }

  const perdaMotivo = porN(agrupar(perdidos.filter(r => r.motivoPerda), r => r.motivoPerda));
  h += cartao('Motivos de perda', perdidos.length ? 'Entre as ' + n0(perdidos.length) + ' perdas do recorte, ' +
      n0(perdidos.filter(r => r.motivoPerda).length) + ' tem motivo registrado.' : 'Sem perdas no recorte.',
    perdaMotivo.length ? vizBarras({ dados: perdaMotivo.map((g, i) => ({ k: g.k, v: g.n, cor: corSerie(i) })), nome: 'Perdas' })
      : '<div class="vazio">Nenhuma perda com motivo preenchido no recorte.</div>');
  h += '</div>';

  /* ----- Oferta e temperatura ----- */
  const comHon = at.filter(r => r.tipoHon);
  if (comHon.length) {
    h += '<div class="secao-titulo">Formato de honorario oferecido</div>';
    h += '<div class="grid g-3">';
    h += cartao('Tipo de contrato de honorarios', 'Reflete a esteira de oferta: inicial, liminar (D28) e exito.',
      vizBarras({ dados: porN(agrupar(comHon, r => r.tipoHon)).map((g, i) => ({
        k: g.k, v: g.n, cor: corSerie(i),
        extra: [{ rot: 'Proposta somada', val: brl0(soma(g.itens, r => r.vInicial)) }] })), nome: 'Negociacoes' }));
    const temp = at.filter(r => r.temperatura);
    h += cartao('Temperatura da negociacao', temp.length ? 'Preenchida em ' + n0(temp.length) + ' de ' + n0(at.length) + ' atendimentos.' : 'Campo pouco preenchido na planilha.',
      temp.length ? vizBarras({ dados: porN(agrupar(temp, r => r.temperatura)).map(g => ({
        k: g.k, v: g.n, cor: /quente/i.test(g.k) ? 'var(--s2)' : /fria/i.test(g.k) ? 'var(--s1)' : 'var(--s4)' })), nome: 'Negociacoes' })
        : '<div class="vazio">Sem temperatura registrada no recorte.</div>');
    h += cartao('Proposta por faixa de valor', 'Honorarios iniciais propostos.',
      (() => {
        const faixas = [{ k: 'Ate R$ 1.000', t: v => v > 0 && v <= 1000 }, { k: 'R$ 1.000 a 2.000', t: v => v > 1000 && v <= 2000 },
          { k: 'R$ 2.000 a 3.000', t: v => v > 2000 && v <= 3000 }, { k: 'R$ 3.000 a 5.000', t: v => v > 3000 && v <= 5000 },
          { k: 'Acima de R$ 5.000', t: v => v > 5000 }];
        const d = faixas.map((f, i) => ({ k: f.k, v: at.filter(r => f.t(r.vInicial)).length, cor: corRampa(i, faixas.length) }));
        return d.some(x => x.v) ? vizBarras({ dados: d, nome: 'Propostas' }) : '<div class="vazio">Sem valor de proposta preenchido no recorte.</div>';
      })());
    h += '</div>';
  }

  /* ----- Tabela operacional ----- */
  h += '<div class="secao-titulo">Negociacoes &middot; ordene por dias sem toque para achar o que esfriou</div>';
  const TOG = [{ k: '', rot: 'Todas' }, { k: 'aberto', rot: 'Em aberto' }, { k: 'ganho', rot: 'Ganhos' },
               { k: 'semresposta', rot: 'Sem resposta' }, { k: 'perdido', rot: 'Perdidos' }];
  h += '<div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.75rem">' + TOG.map(g => {
    const qt = g.k ? at.filter(r => r.grupo === g.k).length : at.length;
    return '<button class="btn-acao' + (F.grupo === g.k ? ' primario' : '') + '" type="button" data-grupo="' + g.k + '">' +
      esc(g.rot) + ' <b style="font-variant-numeric:tabular-nums">' + n0(qt) + '</b></button>';
  }).join('') + '</div>';
  const linhasTab = F.grupo ? at.filter(r => r.grupo === F.grupo) : at;
  h += tabelaInterativa('esteira-tab', [
    { k: 'dAtend', rot: 'Atendimento', tipo: 'data' },
    { k: 'lead', rot: 'Lead', tipo: 'txt', cls: 'forte' },
    { k: 'etapa', rot: 'Etapa', tipo: 'txt',
      html: r => '<span style="color:' + COR_GRUPO[r.grupo] + ';font-weight:600">&#9679;</span> ' + esc(r.etapa) },
    { k: 'closer', rot: 'Closer', tipo: 'txt' },
    { k: 'sdr', rot: 'SDR', tipo: 'txt' },
    { k: 'produto', rot: 'Produto', tipo: 'txt' },
    { k: 'vInicial', rot: 'Proposta inicial', tipo: 'moeda0' },
    { k: 'tipoHon', rot: 'Honorarios', tipo: 'txt' },
    { k: 'diasNeg', rot: 'Dias em neg.', tipo: 'num' },
    { k: 'diasSemToque', rot: 'Dias sem toque', tipo: 'num',
      html: r => r.diasSemToque == null ? '&mdash;' :
        (r.parado ? '<span style="color:#f3c45a;font-weight:700">' + n0(r.diasSemToque) + '</span>' : n0(r.diasSemToque)) },
    { k: 'etapaFup', rot: 'FUP feitos', tipo: 'num',
      html: r => barraCelula(r.fupFeitos, (DADOS.atend.fups || []).length || 9, 'var(--s1)', n0(r.fupFeitos) + '/' + ((DADOS.atend.fups || []).length || 9)) },
    { k: 'proximoFup', rot: 'Proximo FUP', tipo: 'data' },
    { k: 'temperatura', rot: 'Temp.', tipo: 'txt' },
    { k: 'motivoPerda', rot: 'Motivo da perda', tipo: 'txt' },
    { k: 'telefone', rot: 'Telefone', tipo: 'txt' }
  ], linhasTab, { ord: 'diasSemToque', dir: -1, titulo: 'Esteira de negociacao', limite: 60 });

  return h;
}

/* ==========================================================================
   TELA 4 - VENDAS E RECEITA
   ========================================================================== */
function telaVendas() {
  if (ERROS.clientes) return aviso('critico', '<b>FLUXO DE CLIENTES nao entrou:</b> ' + esc(ERROS.clientes));
  const cli = selClientes();
  const meses = mesesDoEixo();
  const hon = soma(cli, r => r.honIni);
  const entrada = soma(cli, r => r.entrada);
  const cond = cli.filter(r => r.condicionado);
  const comValor = cli.filter(r => r.honIni > 0);

  let h = '';
  h += '<div class="secao-titulo primeiro">Vendas &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Clientes fechados', valor: n0(cli.length) });
  h += kpi({ rotulo: 'Honorarios iniciais', valor: brl0(hon), pequeno: true });
  h += kpi({ rotulo: 'Ticket medio', valor: ticketMedio(cli) == null ? '&mdash;' : brl0(ticketMedio(cli)), pequeno: true,
    dica: 'Media dos honorarios iniciais entre os clientes que tiveram honorario inicial.',
    nota: semTicket(cli) ? 'Entre os ' + n0(comValor.length) + ' com honorario inicial &mdash; ' +
      n0(semTicket(cli)) + ' condicionado(s) a liminar ficam fora' : 'Sobre os ' + n0(cli.length) + ' clientes do recorte' });
  h += kpi({ rotulo: 'Fechados com honorario inicial', valor: n0(comValor.length), pequeno: true,
    nota: pctOuTraco(taxa(comValor.length, cli.length), 0) + ' dos clientes do recorte',
    dica: 'Os demais fecharam com honorario condicionado a liminar: contam como cliente, mas nao entram no ticket medio.' });
  h += kpi({ rotulo: 'Entrada recebida', valor: brl0(entrada), pequeno: true,
    nota: pctOuTraco(taxa(entrada, hon), 0) + ' dos honorarios iniciais' });
  h += kpi({ rotulo: 'Pagamento confirmado', valor: pctOuTraco(taxa(cli.filter(r => r.pagoOk).length, cli.length), 0),
    nota: n0(cli.filter(r => r.pagoOk).length) + ' de ' + n0(cli.length) + ' clientes' });
  h += kpi({ rotulo: 'Dias para fechar (medio)', valor: (() => { const m = media(cli, r => r.diasFechar); return m == null ? '&mdash;' : n0(m) + ' dias'; })(), pequeno: true,
    dica: 'Da reuniao ao fechamento, pela coluna DIAS PARA FECHAR.' });
  h += kpi({ rotulo: 'Jornada completa (media)', valor: (() => { const m = media(cli, r => r.jornada); return m == null ? '&mdash;' : n0(m) + ' dias'; })(), pequeno: true,
    dica: 'Do primeiro contato ao fechamento.' });
  h += '</div>';

  if (cond.length) h += aviso('info', '<b>' + n0(cond.length) + ' fechamento(s) do recorte tem honorario inicial R$ 0 com pagamento em Liminar.</b> ' +
    'Sao vendas com honorario condicionado (politica D28), nao vendas sem valor. Elas contam como cliente, ' +
    'mas <b>ficam fora do ticket medio</b>: e venda, nao e preco. O ticket mede por quanto o escritorio negocia.');

  h += '<div class="secao-titulo">Evolucao</div>';
  h += '<div class="grid g-2">';
  h += cartao('Honorarios iniciais por mes', 'Por data de fechamento.',
    vizColunas({ dados: meses.map(k => ({ k: rotuloMesCurto(k), rot: rotuloMes(k), v: soma(cli.filter(r => r.mes === k), x => x.honIni) })),
      cor: 'var(--s1)', fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', nome: 'Honorarios', rotulos: false }));
  h += cartao('Clientes e ticket medio', 'Duas escalas diferentes, dois graficos: aqui o volume.',
    vizColunas({ dados: meses.map(k => ({ k: rotuloMesCurto(k), rot: rotuloMes(k), v: cli.filter(r => r.mes === k).length })), cor: 'var(--s3)', nome: 'Clientes' }));
  h += cartao('Ticket medio por mes', 'Honorarios iniciais divididos pelos clientes do mes.',
    vizLinhas({ x: meses.map(rotuloMesCurto), fmt: brl0, area: true, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k',
      series: [{ nome: 'Ticket medio', vals: meses.map(k => ticketMedio(cli.filter(r => r.mes === k))), cor: 'var(--s4)' }] }));
  h += cartao('Tempo para fechar', 'Media de dias da reuniao ao fechamento, por mes.',
    vizLinhas({ x: meses.map(rotuloMesCurto), fmt: v => n0(v) + ' d', area: true,
      series: [{ nome: 'Dias para fechar', vals: meses.map(k => media(cli.filter(r => r.mes === k), r => r.diasFechar)), cor: 'var(--s7)' }] }));
  h += '</div>';

  h += '<div class="secao-titulo">Quebras da receita</div>';
  h += '<div class="grid g-3">';
  [['closer', 'Closer'], ['sdr', 'SDR'], ['produto', 'Produto juridico'], ['origem', 'Origem'], ['tipoPag', 'Tipo de pagamento']].forEach(([campo, rot]) => {
    const g = semZero(porVolume(topN(agrupar(cli, r => r[campo], r => r.honIni), 7)));
    h += cartao(rot, 'Honorarios iniciais no recorte.',
      vizBarras({ dados: g.map((x, i) => ({ k: x.k, v: x.v, cor: x.cor || corSerie(i),
        extra: [{ rot: 'Clientes', val: n0(x.n) }, { rot: 'Ticket medio', val: ticketMedio(x.itens) == null ? '—' : brl0(ticketMedio(x.itens)) }] })), fmt: brl0, nome: 'Honorarios' }));
  });
  h += '</div>';

  h += '<div class="secao-titulo">Clientes fechados no recorte</div>';
  h += tabelaInterativa('vendas-tab', [
    { k: 'dFecha', rot: 'Fechamento', tipo: 'data' },
    { k: 'contato', rot: 'Contato', tipo: 'txt', cls: 'forte' },
    { k: 'produto', rot: 'Produto', tipo: 'txt' },
    { k: 'origem', rot: 'Origem', tipo: 'txt' },
    { k: 'sdr', rot: 'SDR', tipo: 'txt' },
    { k: 'closer', rot: 'Closer', tipo: 'txt' },
    { k: 'honIni', rot: 'Hon. iniciais', tipo: 'moeda' },
    { k: 'entrada', rot: 'Entrada', tipo: 'moeda' },
    { k: 'honFim', rot: 'Hon. exito', tipo: 'pct' },
    { k: 'tipoPag', rot: 'Pagamento', tipo: 'txt' },
    { k: 'pagoOk', rot: 'Confirmado', tipo: 'txt', ord: false,
      html: r => r.pagoOk ? selo('ok', 'sim') : selo('atencao', 'nao') },
    { k: 'diasFechar', rot: 'Dias p/ fechar', tipo: 'num' },
    { k: 'jornada', rot: 'Jornada', tipo: 'num' }
  ], cli, { ord: 'dFecha', dir: -1, titulo: 'Clientes fechados', limite: 60,
    total: { honIni: d => brl0(soma(d, r => r.honIni)), entrada: d => brl0(soma(d, r => r.entrada)),
             diasFechar: d => { const m = media(d, r => r.diasFechar); return m == null ? '' : n0(m) + ' d'; } } });
  return h;
}

/* ==========================================================================
   TELA 5 - TRAFEGO (META ADS)
   ========================================================================== */
function telaTrafego() {
  if (ERROS.metaDia) return aviso('critico', '<b>Insights do Meta Ads nao entraram:</b> ' + esc(ERROS.metaDia));
  const md = selMetaDia();
  const cli = selClientes();
  const meses = mesesDoEixo();
  const gasto = soma(md, r => r.gasto);
  const leads = soma(md, r => r.leadsTotal);
  const impr = soma(md, r => r.impressoes);
  const cliques = soma(md, r => r.cliques);
  const hon = soma(cli, r => r.honIni);
  const reun = selMetaReun();

  let h = '';
  h += '<div class="secao-titulo primeiro">Trafego pago &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Investimento', valor: brl0(gasto), pequeno: true });
  h += kpi({ rotulo: 'Leads', valor: n0(leads), nota: 'Formulario + conversas + pixel' });
  h += kpi({ rotulo: 'CPL', valor: leads ? brl(gasto / leads) : '&mdash;', pequeno: true });
  h += kpi({ rotulo: 'Impressoes', valor: n0(impr), pequeno: true });
  h += kpi({ rotulo: 'CTR', valor: pctOuTraco(taxa(cliques, impr), 2),
    nota: n0(cliques) + ' cliques' });
  h += kpi({ rotulo: 'Reunioes do CRM', valor: n0(reun.length),
    nota: ERROS.metaReun ? 'aba Reunioes indisponivel' : 'aba Reunioes da planilha do Meta' });
  h += kpi({ rotulo: 'Custo por reuniao', valor: reun.length ? brl0(gasto / reun.length) : '&mdash;', pequeno: true });
  h += kpi({ rotulo: 'CAC', valor: cli.length ? brl0(gasto / cli.length) : '&mdash;', pequeno: true,
    dica: 'Investimento em midia do recorte dividido pelos clientes fechados no mesmo recorte. Nao e coorte: o cliente pode ter entrado antes.' });
  h += kpi({ rotulo: 'ROI sobre midia', valor: gasto ? n1(hon / gasto) + 'x' : '&mdash;', pequeno: true,
    selo: gasto ? selo(hon / gasto >= 3 ? 'ok' : hon / gasto >= 1.5 ? 'atencao' : 'critico',
      hon / gasto >= 3 ? 'saudavel' : hon / gasto >= 1.5 ? 'apertado' : 'no vermelho') : null });
  h += '</div>';

  h += '<div class="secao-titulo">Evolucao</div>';
  h += '<div class="grid g-2">';
  h += cartao('Investimento por mes', 'Gasto no Meta Ads.',
    vizColunas({ dados: meses.map(k => ({ k: rotuloMesCurto(k), rot: rotuloMes(k), v: soma(md.filter(r => r.mes === k), x => x.gasto) })),
      cor: 'var(--s2)', fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', nome: 'Investimento', rotulos: false }));
  h += cartao('Leads por mes', 'Soma dos leads atribuidos as campanhas.',
    vizColunas({ dados: meses.map(k => ({ k: rotuloMesCurto(k), rot: rotuloMes(k), v: soma(md.filter(r => r.mes === k), x => x.leadsTotal) })),
      cor: 'var(--s1)', nome: 'Leads' }));
  h += cartao('CPL por mes', 'Investimento dividido pelos leads do mes. Linha subindo = lead encarecendo.',
    vizLinhas({ x: meses.map(rotuloMesCurto), fmt: brl, area: true, fmtEixo: v => 'R$' + n0(v),
      series: [{ nome: 'CPL', vals: meses.map(k => { const g = md.filter(r => r.mes === k); const l = soma(g, x => x.leadsTotal); return l ? soma(g, x => x.gasto) / l : null; }), cor: 'var(--s4)' }] }));
  h += cartao('Retorno sobre a midia', 'Honorarios iniciais por real investido, mes a mes.',
    vizLinhas({ x: meses.map(rotuloMesCurto), fmt: v => n1(v) + 'x', area: true, fmtEixo: v => n1(v) + 'x',
      series: [{ nome: 'ROI', vals: meses.map(k => { const g = soma(md.filter(r => r.mes === k), x => x.gasto); return g ? soma(cli.filter(r => r.mes === k), x => x.honIni) / g : null; }), cor: 'var(--s3)' }] }));
  h += '</div>';

  /* ===== FUNIL POR CAMPANHA =====
     A cadeia inteira: investimento -> lead -> reuniao -> cliente -> honorario,
     campanha a campanha. E possivel porque tres fontes falam o mesmo nome de
     campanha: os insights do Meta, a coluna Campanha da aba Reunioes e a
     coluna ORIGEM da planilha de clientes.

     E a leitura que decide verba: CPL baixo com conversao em reuniao baixa e
     lead barato que nao vira nada - gastar mais ali so compra volume ruim. */
  const porCamp = porVolume(agrupar(md, r => r.campanha, r => r.gasto));
  const cadastro = {};
  (DADOS.metaCamp ? DADOS.metaCamp.reg : []).forEach(c => { cadastro[chaveBusca(c.campanha)] = c; });

  /* Reunioes e clientes indexados pelo nome da campanha / origem. */
  const reunPorCamp = {}, cliPorCamp = {}, honPorCamp = {};
  reun.forEach(r => { const k = chaveBusca(r.campanha); if (k) reunPorCamp[k] = (reunPorCamp[k] || 0) + 1; });
  cli.forEach(r => {
    const k = chaveBusca(r.origem);
    if (!k) return;
    cliPorCamp[k] = (cliPorCamp[k] || 0) + 1;
    honPorCamp[k] = (honPorCamp[k] || 0) + r.honIni;
  });

  const campanhas = porCamp.map(g => {
    const c = cadastro[chaveBusca(g.k)] || {};
    const k = chaveBusca(g.k);
    const l = soma(g.itens, r => r.leadsTotal);
    const rn = reunPorCamp[k] || 0;
    const cl = cliPorCamp[k] || 0;
    const hon = honPorCamp[k] || 0;
    return {
      campanha: g.k, gasto: g.v, leads: l, cpl: l ? g.v / l : null,
      impressoes: soma(g.itens, r => r.impressoes), cliques: soma(g.itens, r => r.cliques),
      ctr: taxa(soma(g.itens, r => r.cliques), soma(g.itens, r => r.impressoes)),
      reunioes: rn, convReuniao: taxa(rn, l),
      clientes: cl, convCliente: taxa(cl, l), convReunCli: taxa(cl, rn),
      honorarios: hon, cac: cl ? g.v / cl : null, roi: g.v ? hon / g.v : null,
      custoReuniao: rn ? g.v / rn : null,
      status: c.status || '', ativa: /^active$/i.test(c.status || ''),
      orcDia: c.orcDia || 0, dias: new Set(g.itens.map(r => chaveMes(r.d) + r.d.getDate())).size
    };
  });
  const campVis = F.soAtivas ? campanhas.filter(c => c.ativa) : campanhas;

  /* ===== COBERTURA DA ATRIBUICAO =====
     Antes de comparar campanhas, e preciso saber se da para comparar. Se a
     coluna Campanha vem vazia na maioria das reunioes, "0 reuniao" nao
     significa que a campanha nao converteu - significa que ninguem anotou.
     Acusar a campanha por isso seria inventar um diagnostico. */
  const reunComCamp = reun.filter(r => r.campanha).length;
  const cobReun = taxa(reunComCamp, reun.length);
  const cliComOrigem = cli.filter(r => r.origem && r.origem !== 'Sem origem').length;
  const cobCli = taxa(cliComOrigem, cli.length);
  const atribuicaoFraca = cobReun != null && cobReun < 60;

  h += '<div class="secao-titulo">Campanhas &middot; do investimento ao honorario</div>';
  if (atribuicaoFraca) {
    h += aviso('critico', '<b>A atribuicao de reuniao por campanha esta incompleta.</b> ' +
      'So <b>' + pctOuTraco(cobReun, 0) + '</b> das ' + n0(reun.length) + ' reunioes do recorte tem a coluna ' +
      '<i>Campanha</i> preenchida na aba Reunioes. Entao a conversao em reuniao abaixo esta ' +
      '<b>subestimada</b>, e campanha com zero reuniao pode so nao ter sido anotada. ' +
      'Enquanto estiver assim, o painel nao acusa campanha por falta de reuniao &mdash; seria diagnostico inventado. ' +
      'Para destravar esta leitura, o preenchimento da campanha na reuniao precisa virar regra.' +
      (cobCli != null ? '<br>Na planilha de clientes a atribuicao esta melhor: ' + pct(cobCli, 0) +
        ' dos fechamentos tem origem preenchida.' : ''));
  } else {
    h += aviso('info', 'A ligacao entre campanha, reuniao e cliente e feita pelo <b>nome da campanha</b>: ' +
      'os insights do Meta, a aba Reunioes e a coluna ORIGEM da planilha de clientes usam o mesmo rotulo. ' +
      'Cobertura hoje: ' + pctOuTraco(cobReun, 0) + ' das reunioes e ' + pctOuTraco(cobCli, 0) +
      ' dos clientes com origem preenchida.');
  }

  /* Filtro de campanhas ativas, no padrao dos botoes da esteira. */
  h += '<div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.75rem">' +
    [{ k: false, rot: 'Todas' }, { k: true, rot: 'So campanhas ativas' }].map(o =>
      '<button class="btn-acao' + (!!F.soAtivas === o.k ? ' primario' : '') + '" type="button" data-ativas="' + o.k + '">' +
      esc(o.rot) + ' <b style="font-variant-numeric:tabular-nums">' +
      n0(o.k ? campanhas.filter(c => c.ativa).length : campanhas.length) + '</b></button>').join('') + '</div>';

  h += '<div class="grid g-2">';
  h += cartao('Conversao em reuniao por campanha', 'Reunioes marcadas dividido pelos leads da campanha. So campanhas com 10 leads ou mais &mdash; abaixo disso a taxa e ruido.',
    (() => {
      const d = campVis.filter(c => c.leads >= 10 && c.convReuniao != null)
        .sort((a, b) => b.convReuniao - a.convReuniao).slice(0, 10);
      return d.length ? vizBarras({ rotuloW: 230, fmt: v => pct(v, 2), nome: 'Conversao em reuniao',
        dados: d.map(c => ({ k: c.campanha, v: c.convReuniao,
          cor: c.convReuniao >= 2 ? 'var(--s3)' : c.convReuniao >= 1 ? 'var(--s4)' : 'var(--s2)',
          extra: [{ rot: 'Leads', val: n0(c.leads) }, { rot: 'Reunioes', val: n0(c.reunioes) },
                  { rot: 'CPL', val: c.cpl == null ? '—' : brl(c.cpl) }] })) })
        : '<div class="vazio">Nenhuma campanha com 10 ou mais leads no recorte.</div>';
    })());

  h += cartao('Custo por reuniao marcada', 'Investimento da campanha dividido pelas reunioes que ela gerou. Mais direto que o CPL para decidir verba.',
    (() => {
      const d = campVis.filter(c => c.custoReuniao != null && c.reunioes >= 2)
        .sort((a, b) => a.custoReuniao - b.custoReuniao).slice(0, 10);
      return d.length ? vizBarras({ rotuloW: 230, fmt: brl0, nome: 'Custo por reuniao',
        dados: d.map(c => ({ k: c.campanha, v: c.custoReuniao,
          cor: c.custoReuniao <= 300 ? 'var(--s3)' : c.custoReuniao <= 600 ? 'var(--s4)' : 'var(--s2)',
          extra: [{ rot: 'Reunioes', val: n0(c.reunioes) }, { rot: 'Investimento', val: brl0(c.gasto) }] })) })
        : '<div class="vazio">Nenhuma campanha com 2 ou mais reunioes no recorte.</div>';
    })());

  h += cartao('Investimento por campanha', 'Onde o dinheiro foi.',
    vizBarras({ rotuloW: 230, fmt: brl0, nome: 'Investimento',
      dados: topN(campVis.slice(0, 9).map(c => ({ k: c.campanha, v: c.gasto, n: 1 })), 8)
        .map((x, i) => ({ k: x.k, v: x.v, cor: x.cor || corSerie(i) })) }));

  h += cartao('CPL por campanha', 'So campanhas com 3 leads ou mais.',
    (() => {
      const d = campVis.filter(c => c.cpl != null && c.leads >= 3).sort((a, b) => a.cpl - b.cpl).slice(0, 10);
      return d.length ? vizBarras({ rotuloW: 230, fmt: brl, nome: 'CPL',
        dados: d.map(c => ({ k: c.campanha, v: c.cpl,
          cor: c.cpl <= 15 ? 'var(--s3)' : c.cpl <= 30 ? 'var(--s4)' : 'var(--s2)',
          extra: [{ rot: 'Leads', val: n0(c.leads) }, { rot: 'Gasto', val: brl0(c.gasto) }] })) })
        : '<div class="vazio">Nenhuma campanha com 3 ou mais leads no recorte.</div>';
    })());
  h += '</div>';

  h += tabelaInterativa('trafego-tab', [
    { k: 'campanha', rot: 'Campanha', tipo: 'txt', cls: 'forte wrap' },
    { k: 'status', rot: 'Status', tipo: 'txt', ord: false, html: r => !r.status ? '&mdash;' :
      (r.ativa ? selo('ok', 'ativa') : selo('neutro', r.status.toLowerCase())) },
    { k: 'gasto', rot: 'Investimento', tipo: 'moeda0' },
    { k: 'leads', rot: 'Leads', tipo: 'num' },
    { k: 'cpl', rot: 'CPL', tipo: 'moeda' },
    { k: 'reunioes', rot: 'Reunioes', tipo: 'num' },
    { k: 'convReuniao', rot: 'Conv. reuniao', tipo: 'pct', casas: 2,
      html: r => r.convReuniao == null ? '&mdash;' : barraCelula(r.convReuniao, 5,
        r.convReuniao >= 2 ? 'var(--s3)' : r.convReuniao >= 1 ? 'var(--s4)' : 'var(--s2)', pct(r.convReuniao, 2)) },
    { k: 'custoReuniao', rot: 'Custo / reuniao', tipo: 'moeda0' },
    { k: 'clientes', rot: 'Clientes', tipo: 'num' },
    { k: 'convReunCli', rot: 'Reuniao &rarr; cliente', tipo: 'pct', casas: 1 },
    { k: 'honorarios', rot: 'Honorarios', tipo: 'moeda0' },
    { k: 'cac', rot: 'CAC', tipo: 'moeda0' },
    { k: 'roi', rot: 'ROI', tipo: 'num1', ord: true,
      html: r => r.roi == null ? '&mdash;' : (r.roi >= 3 ? selo('ok', n1(r.roi) + 'x')
        : r.roi >= 1 ? selo('atencao', n1(r.roi) + 'x') : selo('critico', n1(r.roi) + 'x')) },
    { k: 'ctr', rot: 'CTR', tipo: 'pct', casas: 2 },
    { k: 'orcDia', rot: 'Orc. diario', tipo: 'moeda0' },
    { k: 'dias', rot: 'Dias com gasto', tipo: 'num' }
  ], campVis, { ord: 'gasto', dir: -1, titulo: 'Campanhas Meta Ads', limite: 50,
    total: { gasto: d => brl0(soma(d, r => r.gasto)), leads: d => n0(soma(d, r => r.leads)),
             reunioes: d => n0(soma(d, r => r.reunioes)), clientes: d => n0(soma(d, r => r.clientes)),
             honorarios: d => brl0(soma(d, r => r.honorarios)),
             cpl: d => { const l = soma(d, r => r.leads); return l ? brl(soma(d, r => r.gasto) / l) : ''; } } });

  /* ===== CRIATIVO ===== */
  if (DADOS.metaAnuncios && DADOS.metaAnuncios.reg.length) {
    const jan = DADOS.metaAnuncios.janelas[0] || '';
    const ads = DADOS.metaAnuncios.reg.filter(r => !jan || r.janela === jan)
      .filter(r => !F.soAtivas || campanhas.some(c => c.ativa && chaveBusca(c.campanha) === chaveBusca(r.campanha)));
    h += '<div class="secao-titulo">Anuncios &middot; qual criativo esta ganhando' +
      (jan ? ' <span style="text-transform:none;letter-spacing:0;font-weight:500">(janela de ' + esc(jan) + ')</span>' : '') + '</div>';
    h += aviso('info', 'A campanha pode ir bem na media e carregar um criativo que so queima verba. ' +
      'Esta aba mede por peca, na janela recente &mdash; nao no historico inteiro.');
    h += tabelaInterativa('trafego-ads', [
      { k: 'anuncio', rot: 'Anuncio', tipo: 'txt', cls: 'forte' },
      { k: 'campanha', rot: 'Campanha', tipo: 'txt', cls: 'wrap' },
      { k: 'gasto', rot: 'Investimento', tipo: 'moeda0' },
      { k: 'leads', rot: 'Leads', tipo: 'num' },
      { k: 'cpl', rot: 'CPL', tipo: 'moeda',
        html: r => !r.leads ? '<span style="color:var(--texto-muted)">sem lead</span>' : brl(r.gasto / r.leads) },
      { k: 'impressoes', rot: 'Impressoes', tipo: 'num' },
      { k: 'ctrLink', rot: 'CTR do link', tipo: 'pct', casas: 2 },
      { k: 'cpc', rot: 'CPC', tipo: 'moeda' },
      { k: 'cpm', rot: 'CPM', tipo: 'moeda' },
      { k: 'frequencia', rot: 'Frequencia', tipo: 'num1',
        html: r => !r.frequencia ? '&mdash;' : (r.frequencia >= 3
          ? '<span style="color:#f3c45a" title="publico saturando">' + n1(r.frequencia) + '</span>' : n1(r.frequencia)) }
    ], ads, { ord: 'gasto', dir: -1, titulo: 'Anuncios Meta Ads', limite: 40, ativa: false });
  }

  /* ===== PONTOS DE ATENCAO ===== */
  const alertas = [];
  campVis.filter(c => c.gasto >= 500 && !c.leads).forEach(c =>
    alertas.push({ nivel: 'critico', txt: '<b>' + esc(c.campanha) + '</b> gastou ' + brl0(c.gasto) + ' e nao registrou nenhum lead.' }));
  /* Com a atribuicao furada, "nenhuma reuniao" e "retorno baixo" podem ser
     falta de anotacao em vez de falta de resultado. Nesses casos o alerta
     vira um so, sobre a atribuicao - nao uma lista acusando campanhas. */
  if (!atribuicaoFraca) {
    campVis.filter(c => c.leads >= 20 && c.reunioes === 0).forEach(c =>
      alertas.push({ nivel: 'atencao', txt: '<b>' + esc(c.campanha) + '</b> trouxe ' + n0(c.leads) +
        ' leads e nenhuma reuniao marcada &mdash; lead barato que nao avanca.' }));
    campVis.filter(c => c.roi != null && c.roi < 1 && c.gasto >= 1000).forEach(c =>
      alertas.push({ nivel: 'atencao', txt: '<b>' + esc(c.campanha) + '</b> tem retorno de ' + n1(c.roi) +
        'x: ' + brl0(c.gasto) + ' investidos para ' + brl0(c.honorarios) + ' em honorarios atribuidos.' }));
  } else {
    alertas.push({ nivel: 'atencao', txt: 'Alertas de conversao por campanha estao <b>suspensos</b>: com ' +
      pctOuTraco(cobReun, 0) + ' das reunioes sem campanha anotada, nao da para separar campanha ruim de ' +
      'campanha mal atribuida. O investimento sem nenhum lead, esse sim, segue sendo acusado.' });
  }
  if (DADOS.metaAnuncios) {
    const jan = DADOS.metaAnuncios.janelas[0] || '';
    DADOS.metaAnuncios.reg.filter(r => (!jan || r.janela === jan) && r.frequencia >= 3.5 && r.gasto >= 200).forEach(a =>
      alertas.push({ nivel: 'atencao', txt: 'O criativo <b>' + esc(a.anuncio) + '</b> (' + esc(a.campanha) +
        ') esta com frequencia ' + n1(a.frequencia) + ': o mesmo publico ja viu a peca vezes demais.' }));
  }
  if (alertas.length) {
    h += '<div class="secao-titulo">Pontos de atencao</div>';
    h += alertas.slice(0, 12).map(a => aviso(a.nivel, a.txt)).join('');
  }
  return h;
}

/* ==========================================================================
   TELA - FINANCEIRO E EFICIENCIA (CAC real)
   --------------------------------------------------------------------------
   O CAC de midia responde "quanto custou o anuncio por cliente". O CAC real
   responde "quanto custou a MAQUINA comercial por cliente": SDR e closer
   (fixo + variavel), lider, estagiarios, CRM, automacoes e midia. E a
   diferenca entre os dois que diz se o gargalo e de trafego ou de operacao.
   ========================================================================== */
function telaFinanceiro() {
  if (ERROS.fin) return aviso('critico', '<b>DRE COMERCIAL nao entrou:</b> ' + esc(ERROS.fin));
  const f = DADOS.fin;
  if (!f || !f.comercial) return aviso('atencao', 'A aba DRE COMERCIAL foi lida, mas nao achei a linha "(-) SETOR COMERCIAL".');

  const cli = DADOS.clientes ? DADOS.clientes.reg : [];
  const at  = DADOS.atend ? DADOS.atend.reg : [];
  const md  = DADOS.metaDia ? DADOS.metaDia.reg : [];

  /* So os meses que a DRE ja fechou E que estao no recorte de periodo. */
