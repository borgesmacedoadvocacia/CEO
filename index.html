        dados: d.map(c => ({ k: c.campanha, v: c.custoReuniao,
          cor: c.custoReuniao <= 300 ? 'var(--s3)' : c.custoReuniao <= 600 ? 'var(--s4)' : 'var(--s2)',
          extra: [{ rot: 'Reunioes', val: n0(c.reunioes) }, { rot: 'Investimento', val: brl0(c.gasto) }] })) })
        : '<div class="vazio">Nenhuma campanha com 2 ou mais reunioes no recorte.</div>';
    })());

  h += cartao('Investimento por campanha', 'Onde o dinheiro foi.',
    vizBarras({ rotuloW: 230, fmt: brl0, nome: 'Investimento',
      dados: topN(campVis.slice(0, 9).map(c => ({ k: c.campanha, v: c.gasto, n: 1 })), 8)
        .map((x, i) => ({ k: x.k, v: x.v, cor: x.cor || corSerie(i) })) }));

  h += cartao('CPL por campanha', 'So campanhas com 3 leads ou mais.',
    (() => {
      const d = campVis.filter(c => c.cpl != null && c.leads >= 3).sort((a, b) => a.cpl - b.cpl).slice(0, 10);
      return d.length ? vizBarras({ rotuloW: 230, fmt: brl, nome: 'CPL',
        dados: d.map(c => ({ k: c.campanha, v: c.cpl,
          cor: c.cpl <= 15 ? 'var(--s3)' : c.cpl <= 30 ? 'var(--s4)' : 'var(--s2)',
          extra: [{ rot: 'Leads', val: n0(c.leads) }, { rot: 'Gasto', val: brl0(c.gasto) }] })) })
        : '<div class="vazio">Nenhuma campanha com 3 ou mais leads no recorte.</div>';
    })());
  h += '</div>';

  h += tabelaInterativa('trafego-tab', [
    { k: 'campanha', rot: 'Campanha', tipo: 'txt', cls: 'forte wrap' },
    { k: 'status', rot: 'Status', tipo: 'txt', ord: false, html: r => !r.status ? '&mdash;' :
      (r.ativa ? selo('ok', 'ativa') : selo('neutro', r.status.toLowerCase())) },
    { k: 'gasto', rot: 'Investimento', tipo: 'moeda0' },
    { k: 'leads', rot: 'Leads', tipo: 'num' },
    { k: 'cpl', rot: 'CPL', tipo: 'moeda' },
    { k: 'reunioes', rot: 'Reunioes', tipo: 'num' },
    { k: 'convReuniao', rot: 'Conv. reuniao', tipo: 'pct', casas: 2,
      html: r => r.convReuniao == null ? '&mdash;' : barraCelula(r.convReuniao, 5,
        r.convReuniao >= 2 ? 'var(--s3)' : r.convReuniao >= 1 ? 'var(--s4)' : 'var(--s2)', pct(r.convReuniao, 2)) },
    { k: 'custoReuniao', rot: 'Custo / reuniao', tipo: 'moeda0' },
    { k: 'clientes', rot: 'Clientes', tipo: 'num' },
    { k: 'convReunCli', rot: 'Reuniao &rarr; cliente', tipo: 'pct', casas: 1 },
    { k: 'honorarios', rot: 'Honorarios', tipo: 'moeda0' },
    { k: 'cac', rot: 'CAC', tipo: 'moeda0' },
    { k: 'roi', rot: 'ROI', tipo: 'num1', ord: true,
      html: r => r.roi == null ? '&mdash;' : (r.roi >= 3 ? selo('ok', n1(r.roi) + 'x')
        : r.roi >= 1 ? selo('atencao', n1(r.roi) + 'x') : selo('critico', n1(r.roi) + 'x')) },
    { k: 'ctr', rot: 'CTR', tipo: 'pct', casas: 2 },
    { k: 'orcDia', rot: 'Orc. diario', tipo: 'moeda0' },
    { k: 'dias', rot: 'Dias com gasto', tipo: 'num' }
  ], campVis, { ord: 'gasto', dir: -1, titulo: 'Campanhas Meta Ads', limite: 50,
    total: { gasto: d => brl0(soma(d, r => r.gasto)), leads: d => n0(soma(d, r => r.leads)),
             reunioes: d => n0(soma(d, r => r.reunioes)), clientes: d => n0(soma(d, r => r.clientes)),
             honorarios: d => brl0(soma(d, r => r.honorarios)),
             cpl: d => { const l = soma(d, r => r.leads); return l ? brl(soma(d, r => r.gasto) / l) : ''; } } });

  /* ===== CRIATIVO ===== */
  if (DADOS.metaAnuncios && DADOS.metaAnuncios.reg.length) {
    const jan = DADOS.metaAnuncios.janelas[0] || '';
    const ads = DADOS.metaAnuncios.reg.filter(r => !jan || r.janela === jan)
      .filter(r => !F.soAtivas || campanhas.some(c => c.ativa && chaveBusca(c.campanha) === chaveBusca(r.campanha)));
    h += '<div class="secao-titulo">Anuncios &middot; qual criativo esta ganhando' +
      (jan ? ' <span style="text-transform:none;letter-spacing:0;font-weight:500">(janela de ' + esc(jan) + ')</span>' : '') + '</div>';
    h += aviso('info', 'A campanha pode ir bem na media e carregar um criativo que so queima verba. ' +
      'Esta aba mede por peca, na janela recente &mdash; nao no historico inteiro.');
    h += tabelaInterativa('trafego-ads', [
      { k: 'anuncio', rot: 'Anuncio', tipo: 'txt', cls: 'forte' },
      { k: 'campanha', rot: 'Campanha', tipo: 'txt', cls: 'wrap' },
      { k: 'gasto', rot: 'Investimento', tipo: 'moeda0' },
      { k: 'leads', rot: 'Leads', tipo: 'num' },
      { k: 'cpl', rot: 'CPL', tipo: 'moeda',
        html: r => !r.leads ? '<span style="color:var(--texto-muted)">sem lead</span>' : brl(r.gasto / r.leads) },
      { k: 'impressoes', rot: 'Impressoes', tipo: 'num' },
      { k: 'ctrLink', rot: 'CTR do link', tipo: 'pct', casas: 2 },
      { k: 'cpc', rot: 'CPC', tipo: 'moeda' },
      { k: 'cpm', rot: 'CPM', tipo: 'moeda' },
      { k: 'frequencia', rot: 'Frequencia', tipo: 'num1',
        html: r => !r.frequencia ? '&mdash;' : (r.frequencia >= 3
          ? '<span style="color:#f3c45a" title="publico saturando">' + n1(r.frequencia) + '</span>' : n1(r.frequencia)) }
    ], ads, { ord: 'gasto', dir: -1, titulo: 'Anuncios Meta Ads', limite: 40, ativa: false });
  }

  /* ===== PONTOS DE ATENCAO ===== */
  const alertas = [];
  campVis.filter(c => c.gasto >= 500 && !c.leads).forEach(c =>
    alertas.push({ nivel: 'critico', txt: '<b>' + esc(c.campanha) + '</b> gastou ' + brl0(c.gasto) + ' e nao registrou nenhum lead.' }));
  /* Com a atribuicao furada, "nenhuma reuniao" e "retorno baixo" podem ser
     falta de anotacao em vez de falta de resultado. Nesses casos o alerta
     vira um so, sobre a atribuicao - nao uma lista acusando campanhas. */
  if (!atribuicaoFraca) {
    campVis.filter(c => c.leads >= 20 && c.reunioes === 0).forEach(c =>
      alertas.push({ nivel: 'atencao', txt: '<b>' + esc(c.campanha) + '</b> trouxe ' + n0(c.leads) +
        ' leads e nenhuma reuniao marcada &mdash; lead barato que nao avanca.' }));
    campVis.filter(c => c.roi != null && c.roi < 1 && c.gasto >= 1000).forEach(c =>
      alertas.push({ nivel: 'atencao', txt: '<b>' + esc(c.campanha) + '</b> tem retorno de ' + n1(c.roi) +
        'x: ' + brl0(c.gasto) + ' investidos para ' + brl0(c.honorarios) + ' em honorarios atribuidos.' }));
  } else {
    alertas.push({ nivel: 'atencao', txt: 'Alertas de conversao por campanha estao <b>suspensos</b>: com ' +
      pctOuTraco(cobReun, 0) + ' das reunioes sem campanha anotada, nao da para separar campanha ruim de ' +
      'campanha mal atribuida. O investimento sem nenhum lead, esse sim, segue sendo acusado.' });
  }
  if (DADOS.metaAnuncios) {
    const jan = DADOS.metaAnuncios.janelas[0] || '';
    DADOS.metaAnuncios.reg.filter(r => (!jan || r.janela === jan) && r.frequencia >= 3.5 && r.gasto >= 200).forEach(a =>
      alertas.push({ nivel: 'atencao', txt: 'O criativo <b>' + esc(a.anuncio) + '</b> (' + esc(a.campanha) +
        ') esta com frequencia ' + n1(a.frequencia) + ': o mesmo publico ja viu a peca vezes demais.' }));
  }
  if (alertas.length) {
    h += '<div class="secao-titulo">Pontos de atencao</div>';
    h += alertas.slice(0, 12).map(a => aviso(a.nivel, a.txt)).join('');
  }
  return h;
}

/* ==========================================================================
   TELA - FLUXO DE CLIENTES (porte do painel da central)
   --------------------------------------------------------------------------
   Mesmo recorte do painel "Dashboard CRM - Fluxo de Clientes", com a fonte
   trocada: perfil de quem assina, por canal, meio de pagamento, produto,
   natureza juridica e por quem atendeu.

   A tela de Vendas responde "quanto entrou e como evoluiu". Esta responde
   "QUEM assina, por onde chega e quem fecha" - por isso cada quebra traz
   ticket, jornada, dias para fechar e pagamento confirmado juntos: e a
   combinacao deles que separa canal bom de canal volumoso.
   ========================================================================== */

/* Bloco de metricas por dimensao, reusado em origem, produto, pagamento... */
function quebraClientes(lista, chaveFn) {
  return agrupar(lista, chaveFn).map(g => ({
    chave: g.k,
    clientes: g.n,
    total: soma(g.itens, r => r.honIni),
    ticket: ticketMedio(g.itens),
    jornada: media(g.itens, r => r.jornada),
    diasFechar: media(g.itens, r => r.diasFechar),
    confirmado: taxa(g.itens.filter(r => r.pagoOk).length, g.n),
    itens: g.itens
  })).sort((a, b) => b.total - a.total);
}

function telaClientesFluxo() {
  if (ERROS.clientes) return aviso('critico', '<b>FLUXO DE CLIENTES nao entrou:</b> ' + esc(ERROS.clientes));
  const cli = selClientes();
  if (!cli.length) return aviso('info', 'Nenhum cliente no recorte atual. Amplie o periodo ou limpe os filtros.');

  const total = soma(cli, r => r.honIni);
  const tk = ticketMedio(cli);
  let h = '';

  /* ----- VISAO GERAL ----- */
  h += '<div class="secao-titulo primeiro">Visao geral &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Clientes', valor: n0(cli.length) });
  h += kpi({ rotulo: 'Total de honorarios', valor: brl0(total), pequeno: true });
  h += kpi({ rotulo: 'Ticket medio', valor: tk == null ? '&mdash;' : brl0(tk), pequeno: true,
    nota: 'So quem teve honorario inicial' });
  h += kpi({ rotulo: 'Jornada media', valor: (() => { const m = media(cli, r => r.jornada); return m == null ? '&mdash;' : n0(m) + ' dias'; })(), pequeno: true,
    dica: 'Do primeiro contato ao fechamento.' });
  h += kpi({ rotulo: 'Dias para fechar', valor: (() => { const m = media(cli, r => r.diasFechar); return m == null ? '&mdash;' : n0(m) + ' dias'; })(), pequeno: true,
    dica: 'Da reuniao ao fechamento.' });
  h += kpi({ rotulo: 'Pagamento confirmado', valor: pctOuTraco(taxa(cli.filter(r => r.pagoOk).length, cli.length), 0),
    nota: n0(cli.filter(r => r.pagoOk).length) + ' de ' + n0(cli.length) });
  h += kpi({ rotulo: 'Entrada recebida', valor: brl0(soma(cli, r => r.entrada)), pequeno: true,
    nota: pctOuTraco(taxa(soma(cli, r => r.entrada), total), 0) + ' dos honorarios' });
  h += kpi({ rotulo: 'Canais ativos', valor: n0(new Set(cli.map(r => r.origem)).size),
    nota: 'Origens distintas no recorte' });
  h += '</div>';

  /* Colunas comuns das tabelas de quebra. */
  const colsQuebra = rotulo => [
    { k: 'chave', rot: rotulo, tipo: 'txt', cls: 'forte wrap' },
    { k: 'clientes', rot: 'Clientes', tipo: 'num' },
    { k: 'total', rot: 'Total honorarios', tipo: 'moeda0' },
    { k: 'share', rot: '% do total', tipo: 'pct', casas: 1,
      html: r => pct(taxa(r.total, total), 1) },
    { k: 'ticket', rot: 'Ticket medio', tipo: 'moeda0' },
    { k: 'jornada', rot: 'Jornada media', tipo: 'num1',
      html: r => r.jornada == null ? '&mdash;' : n0(r.jornada) + ' d' },
    { k: 'diasFechar', rot: 'Dias p/ fechar', tipo: 'num1',
      html: r => r.diasFechar == null ? '&mdash;' : n0(r.diasFechar) + ' d' },
    { k: 'confirmado', rot: '% confirm.', tipo: 'pct', casas: 0,
      html: r => r.confirmado == null ? '&mdash;' : barraCelula(r.confirmado, 100,
        r.confirmado >= 80 ? 'var(--s3)' : r.confirmado >= 50 ? 'var(--s4)' : 'var(--s2)', pct(r.confirmado, 0)) }
  ];
  const totQuebra = { clientes: d => n0(soma(d, r => r.clientes)), total: d => brl0(soma(d, r => r.total)) };

  /* ----- POR ORIGEM ----- */
  const porOrigem = quebraClientes(cli, r => r.origem);
  h += '<div class="secao-titulo">KPIs por origem</div>';
  h += '<div class="grid g-2">';
  h += cartao('Honorarios por canal', 'De onde vem a receita.',
    vizBarras({ rotuloW: 230, fmt: brl0, nome: 'Honorarios',
      dados: topN(porOrigem.map(g => ({ k: g.chave, v: g.total, n: g.clientes })), 9)
        .map((g, i) => ({ k: g.k, v: g.v, cor: g.cor || corSerie(i),
          extra: [{ rot: 'Clientes', val: n0(g.n) }] })) }));
  h += cartao('Clientes por canal', 'Volume, que nem sempre anda junto com a receita.',
    vizBarras({ rotuloW: 230, nome: 'Clientes',
      dados: topN(porOrigem.slice().sort((a, b) => b.clientes - a.clientes)
        .map(g => ({ k: g.chave, v: g.clientes, n: g.clientes })), 9)
        .map((g, i) => ({ k: g.k, v: g.v, cor: g.cor || corSerie(i) })) }));
  h += '</div>';
  h += tabelaInterativa('cli-origem', colsQuebra('Canal / origem'), porOrigem,
    { ord: 'total', dir: -1, titulo: 'Clientes por origem', limite: 30, total: totQuebra });

  /* ----- MEIOS DE PAGAMENTO ----- */
  const porPag = quebraClientes(cli, r => r.tipoPag);
  h += '<div class="secao-titulo">Meios de pagamento</div>';
  h += '<div class="grid g-2">';
  h += cartao('Distribuicao por tipo de pagamento', 'Participacao de cada meio no numero de clientes.',
    vizDonut({ centro: n0(cli.length), centroRot: 'clientes',
      dados: topN(porPag.slice().sort((a, b) => b.clientes - a.clientes)
        .map(g => ({ k: g.chave, v: g.clientes })), 6) }) +
    legenda(topN(porPag.slice().sort((a, b) => b.clientes - a.clientes)
      .map(g => ({ k: g.chave, v: g.clientes })), 6)
      .map((g, i) => ({ nome: g.k, cor: g.cor || corSerie(i), val: n0(g.v) }))));
  const porParc = quebraClientes(cli, r => r.rotParcelas);
  h += cartao('Distribuicao por numero de parcelas', 'Lido da coluna OBSERVACOES, onde a planilha guarda "12x", "6x" ou "a vista".',
    vizBarras({ rotuloW: 150, nome: 'Clientes',
      dados: porParc.slice().sort((a, b) => (a.chave === 'A vista' ? -1 : b.chave === 'A vista' ? 1 : num(a.chave) - num(b.chave)))
        .map((g, i) => ({ k: g.chave, v: g.clientes, cor: corRampa(i, porParc.length),
          extra: [{ rot: 'Ticket medio', val: g.ticket == null ? '—' : brl0(g.ticket) }] })) }));
  h += '</div>';
  h += tabelaInterativa('cli-pag', [
    { k: 'chave', rot: 'Tipo', tipo: 'txt', cls: 'forte' },
    { k: 'clientes', rot: 'Qtd', tipo: 'num' },
    { k: 'pctCli', rot: '% clientes', tipo: 'pct', casas: 1, html: r => pct(taxa(r.clientes, cli.length), 1) },
    { k: 'total', rot: 'Total', tipo: 'moeda0' },
    { k: 'ticket', rot: 'Ticket medio', tipo: 'moeda0' },
    { k: 'confirmado', rot: '% confirm.', tipo: 'pct', casas: 0 }
  ], porPag, { ord: 'total', dir: -1, titulo: 'Meios de pagamento', limite: 20, ativa: false, total: totQuebra });

  /* ----- PRODUTOS ----- */
  const porProduto = quebraClientes(cli, r => r.produto);
  h += '<div class="secao-titulo">Produtos juridicos</div>';
  h += cartao('Honorarios por produto', 'Concentracao da receita por tese.',
    vizBarras({ rotuloW: 230, fmt: brl0, nome: 'Honorarios',
      dados: semZero(topN(porProduto.map(g => ({ k: g.chave, v: g.total, n: g.clientes })), 8))
        .map((g, i) => ({ k: g.k, v: g.v, cor: g.cor || corSerie(i),
          extra: [{ rot: 'Clientes', val: n0(g.n) }] })) }));
  h += tabelaInterativa('cli-produto', colsQuebra('Produto'), porProduto,
    { ord: 'total', dir: -1, titulo: 'Clientes por produto', limite: 25, ativa: false, total: totQuebra });

  /* ----- PJ x PF ----- */
  h += '<div class="secao-titulo">Perfil de clientes &middot; PJ x PF</div>';
  const temTipo = cli.some(r => r.tipoPessoa);
  if (!temTipo) {
    h += aviso('info', 'A natureza juridica e deduzida do CPF/CNPJ, que <b>nao trafega para o painel</b>. ' +
      'Com o proxy Apps Script publicado, o servidor conta os digitos e devolve so <b>PJ</b> ou <b>PF</b> &mdash; ' +
      'a classificacao chega, o identificador nao. Enquanto a leitura for direta do navegador, esta secao fica vazia.');
  } else {
    const porTipo = quebraClientes(cli.filter(r => r.tipoPessoa), r => r.tipoPessoa);
    h += '<div class="grid g-2">';
    h += cartao('PJ x PF', 'Participacao no numero de clientes.',
      vizDonut({ centro: n0(soma(porTipo, g => g.clientes)), centroRot: 'clientes',
        dados: porTipo.map((g, i) => ({ k: g.chave, v: g.clientes, cor: corSerie(i) })) }) +
      legenda(porTipo.map((g, i) => ({ nome: g.chave, cor: corSerie(i), val: n0(g.clientes) }))));
    h += cartao('Ticket medio por natureza', 'Onde o contrato vale mais.',
      vizBarras({ rotuloW: 120, fmt: brl0, nome: 'Ticket medio',
        dados: porTipo.filter(g => g.ticket != null).map((g, i) => ({ k: g.chave, v: g.ticket, cor: corSerie(i),
          extra: [{ rot: 'Clientes', val: n0(g.clientes) }, { rot: 'Total', val: brl0(g.total) }] })) }));
    h += '</div>';
    h += tabelaInterativa('cli-tipo', [
      { k: 'chave', rot: 'Tipo', tipo: 'txt', cls: 'forte' },
      { k: 'clientes', rot: 'Qtd', tipo: 'num' },
      { k: 'pct', rot: '%', tipo: 'pct', casas: 1, html: r => pct(taxa(r.clientes, soma(porTipo, g => g.clientes)), 1) },
      { k: 'total', rot: 'Total honorarios', tipo: 'moeda0' },
      { k: 'ticket', rot: 'Ticket medio', tipo: 'moeda0' },
      { k: 'jornada', rot: 'Jornada media', tipo: 'num1', html: r => r.jornada == null ? '&mdash;' : n0(r.jornada) + ' d' }
    ], porTipo, { ord: 'total', dir: -1, titulo: 'PJ x PF', limite: 10, ativa: false });
  }

  /* ----- CLOSERS ----- */
  const porCloser = quebraClientes(cli, r => r.closer);
  h += '<div class="secao-titulo">Performance por closer</div>';
  h += '<div class="grid g-2">';
  h += cartao('Honorarios por closer', 'Receita fechada no recorte.',
    vizBarras({ rotuloW: 150, fmt: brl0, nome: 'Honorarios',
      dados: semZero(porCloser.map(g => ({ k: g.chave, v: g.total })))
        .map((g, i) => ({ k: g.k, v: g.v, cor: corSerie(i) })) }));
  h += cartao('Radar de performance', 'Cada eixo normalizado pelo melhor do recorte. Em jornada e dias para fechar, menos e melhor &mdash; o eixo ja considera isso.',
    vizRadar({
      eixos: [
        { rot: 'Clientes', fmt: n0 },
        { rot: 'Honorarios', fmt: brl0 },
        { rot: 'Ticket', fmt: brl0 },
        { rot: 'Rapidez', fmt: v => n0(v) + ' d', inverso: true },
        { rot: '% pago', fmt: v => pct(v, 0) }
      ],
      series: porCloser.slice(0, 3).map((g, i) => ({
        nome: g.chave, cor: corSerie(i),
        vals: [g.clientes, g.total, g.ticket, g.diasFechar, g.confirmado]
      }))
    }) + legenda(porCloser.slice(0, 3).map((g, i) => ({ nome: g.chave, cor: corSerie(i) }))));
  h += '</div>';
  h += tabelaInterativa('cli-closer', [
    { k: 'pos', rot: '#', tipo: 'num', ord: false, html: r => n0(porCloser.indexOf(r) + 1) }
  ].concat(colsQuebra('Closer').slice(1)), porCloser,
    { ord: 'total', dir: -1, titulo: 'Ranking de closers', limite: 20, ativa: false, total: totQuebra });

  /* ----- SDRs ----- */
  const porSdr = quebraClientes(cli, r => r.sdr);
  h += '<div class="secao-titulo">Performance por SDR</div>';
  h += cartao('Clientes gerados por SDR', 'Fechamentos atribuidos a quem originou.',
    vizBarras({ rotuloW: 150, nome: 'Clientes',
      dados: porSdr.slice().sort((a, b) => b.clientes - a.clientes).map((g, i) => ({
        k: g.chave, v: g.clientes, cor: corSerie(i),
        extra: [{ rot: 'Honorarios', val: brl0(g.total) }, { rot: 'Ticket medio', val: g.ticket == null ? '—' : brl0(g.ticket) }] })) }));
  h += tabelaInterativa('cli-sdr', [
    { k: 'pos', rot: '#', tipo: 'num', ord: false, html: r => n0(porSdr.indexOf(r) + 1) }
  ].concat(colsQuebra('SDR').slice(1)), porSdr,
    { ord: 'total', dir: -1, titulo: 'Ranking de SDRs', limite: 20, ativa: false, total: totQuebra });

  /* ----- ANALISES ADICIONAIS ----- */
  const meses = mesesDoEixo();
  h += '<div class="secao-titulo">Analises adicionais</div>';
  h += '<div class="grid g-2">';
  h += cartao('Evolucao mensal &mdash; honorarios e clientes', 'Duas escalas, dois graficos. Aqui a receita.',
    vizColunas({ dados: meses.map(k => ({ k: rotuloMesCurto(k), rot: rotuloMes(k), v: soma(cli.filter(r => r.mes === k), x => x.honIni) })),
      cor: 'var(--s1)', fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', nome: 'Honorarios', rotulos: false }));
  h += cartao('Clientes por mes', 'E aqui o volume.',
    vizColunas({ dados: meses.map(k => ({ k: rotuloMesCurto(k), rot: rotuloMes(k), v: cli.filter(r => r.mes === k).length })),
      cor: 'var(--s3)', nome: 'Clientes' }));

  const faixas = [
    { k: 'Ate R$ 1.000', t: v => v > 0 && v <= 1000 },
    { k: 'R$ 1.000 a 2.000', t: v => v > 1000 && v <= 2000 },
    { k: 'R$ 2.000 a 3.000', t: v => v > 2000 && v <= 3000 },
    { k: 'R$ 3.000 a 5.000', t: v => v > 3000 && v <= 5000 },
    { k: 'Acima de R$ 5.000', t: v => v > 5000 },
    { k: 'Condicionado (R$ 0)', t: v => !v }
  ];
  h += cartao('Distribuicao por faixa de honorario', 'Onde o ticket se concentra.',
    vizBarras({ rotuloW: 170, nome: 'Clientes',
      dados: faixas.map((f, i) => ({ k: f.k, v: cli.filter(r => f.t(r.honIni)).length,
        cor: f.k.indexOf('Condicionado') === 0 ? 'var(--texto-muted)' : corRampa(i, faixas.length) })) }));

  h += cartao('Ticket medio por canal', 'Canal que traz volume nem sempre traz valor.',
    vizBarras({ rotuloW: 230, fmt: brl0, nome: 'Ticket medio',
      dados: porOrigem.filter(g => g.ticket != null && g.clientes >= 3)
        .sort((a, b) => b.ticket - a.ticket).slice(0, 9)
        .map((g, i) => ({ k: g.chave, v: g.ticket, cor: corSerie(i),
          extra: [{ rot: 'Clientes', val: n0(g.clientes) }] })) }));
  h += '</div>';
  return h;
}

/* ==========================================================================
   TELA - FINANCEIRO E EFICIENCIA (CAC real)
   --------------------------------------------------------------------------
   O CAC de midia responde "quanto custou o anuncio por cliente". O CAC real
   responde "quanto custou a MAQUINA comercial por cliente": SDR e closer
   (fixo + variavel), lider, estagiarios, CRM, automacoes e midia. E a
   diferenca entre os dois que diz se o gargalo e de trafego ou de operacao.
   ========================================================================== */
function telaFinanceiro() {
  if (ERROS.fin) return aviso('critico', '<b>DRE COMERCIAL nao entrou:</b> ' + esc(ERROS.fin));
  const f = DADOS.fin;
  if (!f || !f.comercial) return aviso('atencao', 'A aba DRE COMERCIAL foi lida, mas nao achei a linha "(-) SETOR COMERCIAL".');

  const cli = DADOS.clientes ? DADOS.clientes.reg : [];
  const at  = DADOS.atend ? DADOS.atend.reg : [];
  const md  = DADOS.metaDia ? DADOS.metaDia.reg : [];

  /* So os meses que a DRE ja fechou E que estao no recorte de periodo. */
  const noRec = k => { const fx = faixa(); const d = new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, 15); return d >= fx.de && d <= fx.ate; };
  const meses = f.meses.filter(noRec);
  if (!meses.length) return aviso('info', 'Nenhum mes da DRE COMERCIAL cai no periodo selecionado. Amplie o periodo no filtro acima.');

  const somaMes = (linha, ks) => (ks || meses).reduce((a, k) => a + ((linha && linha.meses[k]) || 0), 0);
  const nClientes = ks => cli.filter(r => (ks || meses).indexOf(r.mes) >= 0).length;
  const honComp   = ks => soma(cli.filter(r => (ks || meses).indexOf(r.mes) >= 0), r => r.honIni);
  const nReunioes = ks => at.filter(r => r.dAtend && (ks || meses).indexOf(r.mes) >= 0).length;
  const nLeads    = ks => soma(md.filter(r => (ks || meses).indexOf(r.mes) >= 0), r => r.leadsTotal);

  const custoCom = somaMes(f.comercial);
  const custoMidia = soma(f.itens.filter(i => i.bucket === 'midia'), i => somaMes(i));
  const custoPessoas = soma(f.itens.filter(i => i.bucket === 'pessoas'), i => somaMes(i));
  const custoFerr = soma(f.itens.filter(i => i.bucket === 'ferramentas'), i => somaMes(i));
  const receita = somaMes(f.receita);
  const lucro = somaMes(f.lucro);
  const rateio = somaMes(f.rateio);
  const impostos = somaMes(f.impostos);
  const bancarias = somaMes(f.bancarias);
  const clientes = nClientes();
  const cacReal = clientes ? custoCom / clientes : null;
  const cacMidia = clientes ? custoMidia / clientes : null;
  const tk = ticketMedio(cli.filter(r => meses.indexOf(r.mes) >= 0));

  let h = '';
  h += '<div class="secao-titulo primeiro">Financeiro do comercial &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += aviso('info', 'Fonte: aba <b>DRE COMERCIAL</b> do FLUXO FINANCEIRO ' + f.ano + '. ' +
    'A DRE e por <b>regime de caixa</b> (o que entrou e saiu no mes) e a planilha de clientes e por ' +
    '<b>competencia</b> (contrato assinado no mes) &mdash; os dois numeros de receita nao batem de proposito. ' +
    'O painel mostra os dois e a diferenca, em vez de escolher um.');

  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Receita (caixa)', valor: brl0(receita), pequeno: true,
    nota: 'Honorarios iniciais recebidos na DRE' });
  h += kpi({ rotulo: 'Custo do setor comercial', valor: brl0(custoCom), pequeno: true,
    nota: 'Pessoas + midia + ferramentas' });
  h += kpi({ rotulo: 'Lucro liquido do comercial', valor: brl0(lucro), pequeno: true,
    selo: selo(lucro > 0 ? 'ok' : lucro === 0 ? 'neutro' : 'critico', lucro > 0 ? 'positivo' : 'no vermelho'),
    nota: 'Ja descontados rateio, impostos e taxas' });
  h += kpi({ rotulo: 'Margem liquida', valor: pctOuTraco(taxa(lucro, receita), 1),
    dica: 'Lucro liquido do setor sobre a receita de caixa do setor.' });
  h += kpi({ rotulo: 'CAC real', valor: cacReal == null ? '&mdash;' : brl0(cacReal), pequeno: true,
    dica: 'Custo do setor comercial inteiro dividido pelos clientes fechados no mesmo periodo. Inclui SDR, closer, lider, estagiarios, CRM, automacoes e midia.',
    nota: n0(clientes) + ' clientes no periodo' });
  h += kpi({ rotulo: 'CAC de midia', valor: cacMidia == null ? '&mdash;' : brl0(cacMidia), pequeno: true,
    nota: cacReal && cacMidia ? 'Midia e ' + pct(taxa(custoMidia, custoCom), 0) + ' do custo comercial' : '' });
  h += kpi({ rotulo: 'Ticket medio', valor: tk == null ? '&mdash;' : brl0(tk), pequeno: true,
    nota: 'So quem teve honorario inicial' });
  h += kpi({ rotulo: 'Margem por cliente', valor: (tk != null && cacReal != null) ? brl0(tk - cacReal) : '&mdash;', pequeno: true,
    selo: (tk != null && cacReal != null) ? selo(tk - cacReal > 0 ? 'ok' : 'critico',
      tk - cacReal > 0 ? 'ticket cobre o CAC' : 'CAC acima do ticket') : null,
    dica: 'Ticket medio menos CAC real. Nao inclui honorario de exito, que entra depois e muda esta conta.' });
  h += kpi({ rotulo: 'Retorno sobre o custo', valor: custoCom ? n1(receita / custoCom) + 'x' : '&mdash;', pequeno: true,
    selo: custoCom ? selo(receita / custoCom >= 2 ? 'ok' : receita / custoCom >= 1 ? 'atencao' : 'critico',
      receita / custoCom >= 2 ? 'saudavel' : receita / custoCom >= 1 ? 'no limite' : 'queima caixa') : null,
    dica: 'Receita de caixa dividida pelo custo do setor comercial. Diferente do ROI de midia, que olha so o anuncio.' });
  h += '</div>';

  /* ----- Evolucao ----- */
  h += '<div class="secao-titulo">Evolucao mes a mes</div>';
  h += '<div class="grid g-2">';
  const eixo = meses.map(rotuloMesCurto);

  h += cartao('Receita e custo do comercial', 'Mesma unidade (R$), por isso dividem o grafico. A distancia entre as linhas e o lucro.',
    vizLinhas({ x: eixo, fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', series: [
      { nome: 'Receita (caixa)', vals: meses.map(k => somaMes(f.receita, [k])), cor: 'var(--s1)' },
      { nome: 'Custo do comercial', vals: meses.map(k => somaMes(f.comercial, [k])), cor: 'var(--s2)' }
    ] }) + legenda([{ nome: 'Receita (caixa)', cor: 'var(--s1)' }, { nome: 'Custo do comercial', cor: 'var(--s2)' }]));

  /* Lucro: positivo x negativo pede par divergente, nao rampa. */
  h += cartao('Lucro liquido do comercial', 'Barra abaixo de zero e mes em que o setor consumiu caixa.',
    vizColunas({ dados: meses.map(k => {
      const v = somaMes(f.lucro, [k]);
      return { k: rotuloMesCurto(k), rot: rotuloMes(k), v: Math.abs(v),
               cor: v >= 0 ? 'var(--s1)' : 'var(--s8)',
               extra: [{ rot: v >= 0 ? 'Lucro' : 'Prejuizo', val: brl0(v), cor: v >= 0 ? 'var(--s1)' : 'var(--s8)' },
                       { rot: 'Receita', val: brl0(somaMes(f.receita, [k])) },
                       { rot: 'Custo comercial', val: brl0(somaMes(f.comercial, [k])) }] };
    }), fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', nome: 'Resultado', rotulos: false }) +
    legenda([{ nome: 'Mes com lucro', cor: 'var(--s1)' }, { nome: 'Mes com prejuizo', cor: 'var(--s8)' }]));

  h += cartao('CAC real x ticket medio', 'As duas em R$ por cliente: quando o CAC encosta no ticket, cada venda nova para de pagar a operacao.',
    vizLinhas({ x: eixo, fmt: brl0, fmtEixo: v => 'R$' + n0(v), series: [
      { nome: 'CAC real', vals: meses.map(k => { const n = nClientes([k]); return n ? somaMes(f.comercial, [k]) / n : null; }), cor: 'var(--s2)' },
      { nome: 'CAC de midia', vals: meses.map(k => { const n = nClientes([k]); return n ? soma(f.itens.filter(i => i.bucket === 'midia'), i => somaMes(i, [k])) / n : null; }), cor: 'var(--s4)' },
      { nome: 'Ticket medio', vals: meses.map(k => ticketMedio(cli.filter(r => r.mes === k))), cor: 'var(--s3)' }
    ] }) + legenda([{ nome: 'CAC real', cor: 'var(--s2)' }, { nome: 'CAC de midia', cor: 'var(--s4)' }, { nome: 'Ticket medio', cor: 'var(--s3)' }]));

  h += cartao('Estrutura do custo comercial', 'Quanto do custo e gente, quanto e midia e quanto e ferramenta.',
    vizEmpilhado({ x: eixo, fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', series: [
      { nome: 'Pessoas', vals: meses.map(k => soma(f.itens.filter(i => i.bucket === 'pessoas'), i => somaMes(i, [k]))), cor: 'var(--s1)' },
      { nome: 'Midia', vals: meses.map(k => soma(f.itens.filter(i => i.bucket === 'midia'), i => somaMes(i, [k]))), cor: 'var(--s2)' },
      { nome: 'Ferramentas', vals: meses.map(k => soma(f.itens.filter(i => i.bucket === 'ferramentas'), i => somaMes(i, [k]))), cor: 'var(--s3)' }
    ] }) + legenda([
      { nome: 'Pessoas', cor: 'var(--s1)', val: brl0(custoPessoas) },
      { nome: 'Midia', cor: 'var(--s2)', val: brl0(custoMidia) },
      { nome: 'Ferramentas', cor: 'var(--s3)', val: brl0(custoFerr) }]));
  h += '</div>';

  /* ----- Eficiencia por etapa ----- */
  h += '<div class="secao-titulo">Custo por etapa do funil</div>';
  const leads = nLeads(), reun = nReunioes();
  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Custo por lead', valor: leads ? brl(custoCom / leads) : '&mdash;', pequeno: true,
    nota: n0(leads) + ' leads de midia no periodo', dica: 'Custo comercial inteiro por lead, nao so o anuncio. O CPL da tela de trafego usa so a midia.' });
  h += kpi({ rotulo: 'Custo por reuniao', valor: reun ? brl0(custoCom / reun) : '&mdash;', pequeno: true,
    nota: n0(reun) + ' reunioes realizadas' });
  h += kpi({ rotulo: 'Custo por cliente', valor: cacReal == null ? '&mdash;' : brl0(cacReal), pequeno: true,
    nota: n0(clientes) + ' clientes fechados' });
  h += kpi({ rotulo: 'Rateio do processual', valor: brl0(rateio), pequeno: true,
    dica: 'Parte do custo do setor processual, liderancas e despesas extraordinarias atribuida ao comercial na DRE. Nao entra no CAC: e custo de entrega, nao de aquisicao.' });
  h += kpi({ rotulo: 'Impostos', valor: brl0(impostos), pequeno: true });
  h += kpi({ rotulo: 'Taxas bancarias', valor: brl0(bancarias), pequeno: true,
    nota: pctOuTraco(taxa(bancarias, receita), 1) + ' da receita',
    dica: 'Custo de maquininha, link e parcelamento. Sobe junto com a fatia de venda parcelada.' });
  h += '</div>';

  /* ----- Reconciliacao caixa x competencia ----- */
  h += '<div class="secao-titulo">Caixa x competencia &middot; onde os dois numeros divergem</div>';
  const recon = meses.map(k => {
    const caixa = somaMes(f.receita, [k]);
    const comp = honComp([k]);
    return { mes: rotuloMes(k), caixa: caixa, comp: comp, dif: caixa - comp,
             difPct: comp ? ((caixa - comp) / comp) * 100 : null, clientes: nClientes([k]) };
  });
  h += cartao('Receita na DRE x honorarios assinados', 'Diferenca grande e sinal de contrato assinado que ainda nao virou caixa &mdash; ou de lancamento faltando em uma das duas planilhas.',
    tabelaInterativa('fin-recon', [
      { k: 'mes', rot: 'Mes', tipo: 'txt', cls: 'forte' },
      { k: 'clientes', rot: 'Clientes', tipo: 'num' },
      { k: 'comp', rot: 'Assinado (competencia)', tipo: 'moeda0' },
      { k: 'caixa', rot: 'Recebido (caixa)', tipo: 'moeda0' },
      { k: 'dif', rot: 'Diferenca', tipo: 'moeda0',
        html: r => '<span style="color:' + (Math.abs(r.difPct || 0) > 15 ? '#f3c45a' : 'var(--texto-2)') + '">' + brl0(r.dif) + '</span>' },
      { k: 'difPct', rot: '%', tipo: 'num', ord: false,
        html: r => r.difPct == null ? '&mdash;' : delta(r.difPct, { fmt: v => pct(v, 0) }) }
    ], recon, { titulo: 'Caixa x competencia', limite: 24, ativa: false }));

  /* ----- Linhas de custo ----- */
  h += '<div class="secao-titulo">Linhas de custo do setor comercial</div>';
  const itens = f.itens.map(i => {
    const v = somaMes(i);
    return { rotulo: i.rotulo, bucket: i.bucket, valor: v,
             share: taxa(v, custoCom), porCliente: clientes ? v / clientes : null,
             projecao: i.projecao, media: meses.length ? v / meses.length : 0 };
  }).filter(i => i.valor !== 0).sort((a, b) => b.valor - a.valor);
  const maxItem = itens.length ? itens[0].valor : 0;
  const ROT_BUCKET = { pessoas: 'Pessoas', midia: 'Midia', ferramentas: 'Ferramentas', outros: 'Outros' };
  const COR_BUCKET = { pessoas: 'var(--s1)', midia: 'var(--s2)', ferramentas: 'var(--s3)', outros: 'var(--texto-muted)' };
  h += tabelaInterativa('fin-itens', [
    { k: 'rotulo', rot: 'Linha de custo', tipo: 'txt', cls: 'forte wrap' },
    { k: 'bucket', rot: 'Grupo', tipo: 'txt', ord: false,
      html: r => '<span style="color:' + COR_BUCKET[r.bucket] + '">&#9679;</span> ' + esc(ROT_BUCKET[r.bucket] || r.bucket) },
    { k: 'valor', rot: 'Total no periodo', tipo: 'moeda0',
      html: r => barraCelula(r.valor, maxItem, COR_BUCKET[r.bucket], brl0(r.valor)) },
    { k: 'share', rot: '% do custo', tipo: 'pct', casas: 1 },
    { k: 'media', rot: 'Media mensal', tipo: 'moeda0' },
    { k: 'porCliente', rot: 'Por cliente', tipo: 'moeda0' }
  ], itens, { ord: 'valor', dir: -1, titulo: 'Linhas de custo do comercial', limite: 30,
    total: { valor: d => brl0(soma(d, r => r.valor)), porCliente: d => clientes ? brl0(soma(d, r => r.valor) / clientes) : '' } });
  return h;
}

/* ==========================================================================
   TELA - KPIs DO COMERCIAL (ritmo e projecao)
   --------------------------------------------------------------------------
   Porte do painel "KPIs Comercial" da central: mesmo layout, fonte trocada.
   Em vez de ler a planilha antiga, cada realizado vem das fontes vivas.

   A leitura central e de RITMO, com tres numeros que respondem coisas
   diferentes e vivem sendo confundidos:
     . Realizado (MTD)      - o que ja entrou no mes ate hoje
     . Meta proporcional    - o que DEVERIA ter entrado ate hoje
     . Projecao do mes      - onde o mes termina se o ritmo de hoje continuar
   Comparar realizado com meta MENSAL no dia 10 so produz panico; comparar com
   a proporcional e o que diz se esta atrasado de verdade.
   ========================================================================== */
const METAS_PADRAO = {
  leadsAds:    { rot: 'Leads (Meta Ads)',       meta: 1500,  tipo: 'num',   acumula: true },
  leadsAbord:  { rot: 'Leads Abordados',        meta: 900,   tipo: 'num',   acumula: true },
  leadsQual:   { rot: 'Leads Qualificados',     meta: 300,   tipo: 'num',   acumula: true },
  reunioes:    { rot: 'Reunioes Realizadas',    meta: 100,   tipo: 'num',   acumula: true },
  clientes:    { rot: 'Clientes Fechados',      meta: 32,    tipo: 'num',   acumula: true },
  faturamento: { rot: 'Faturamento',            meta: 80000, tipo: 'moeda', acumula: true },
  ticket:      { rot: 'Ticket Medio',           meta: 2500,  tipo: 'moeda', acumula: false },
  investimento:{ rot: 'Investimento (Ads)',     meta: 16000, tipo: 'moeda', acumula: true },
  cac:         { rot: 'CAC',                    meta: 500,   tipo: 'moeda', acumula: false, inverso: true },
  convReunCli: { rot: 'Conv. Reuniao → Cliente', meta: 20, tipo: 'pct', acumula: false },
  convLeadReun:{ rot: 'Conv. Lead → Reuniao',    meta: 12, tipo: 'pct', acumula: false },
  convLeadCli: { rot: 'Conv. Lead → Cliente',    meta: 2.5, tipo: 'pct', acumula: false },
  roi:         { rot: 'ROI',                    meta: 5,     tipo: 'mult',  acumula: false }
};
const K_METAS = 'bm_ceo_metas';

function metasAtivas() {
  const m = {};
  Object.keys(METAS_PADRAO).forEach(k => { m[k] = METAS_PADRAO[k].meta; });
  try {
    const salvo = JSON.parse(localStorage.getItem(K_METAS) || 'null');
    if (salvo) Object.keys(salvo).forEach(k => { if (m[k] != null && isFinite(salvo[k])) m[k] = Number(salvo[k]); });
  } catch (e) {}
  return m;
}

const fmtPorTipo = t => t === 'moeda' ? brl0 : t === 'pct' ? (v => pct(v, v < 10 ? 2 : 1))
  : t === 'mult' ? (v => n1(v) + 'x') : n0;

/* Um bloco de KPI: valor grande + as linhas de ritmo. */
function blocoKpi(c) {
  const f = fmtPorTipo(c.tipo);
  const emCurso = c.emCurso;
  const projecao = c.acumula && c.fracao > 0 ? c.valor / c.fracao : null;
  const metaProp = c.acumula ? c.meta * c.fracao : c.meta;
  const base = c.acumula ? (emCurso ? projecao : c.valor) : c.valor;
  const vsProp = c.inverso
    ? (c.valor > 0 ? taxa(metaProp, c.valor) : null)
    : taxa(c.valor, metaProp);
  const vsMeta = c.inverso
    ? (base > 0 ? taxa(c.meta, base) : null)
    : taxa(base, c.meta);

  let h = '<div class="cartao">';
  h += '<div class="cartao-titulo">' + esc(c.rot) +
    (emCurso ? ' <span class="selo neutro" style="font-weight:600">em curso</span>' : '') + '</div>';
  h += '<div class="kpi-valor" style="margin:0.35rem 0 0.7rem">' + (c.valor == null ? '&mdash;' : f(c.valor)) + '</div>';
  h += '<div style="display:flex;flex-direction:column;gap:0.3rem;font-size:0.73rem">';
  const linha = (rot, val, forte) =>
    '<div style="display:flex;justify-content:space-between;gap:0.8rem;align-items:baseline">' +
    '<span style="color:var(--texto-muted)">' + rot + '</span>' +
    '<span style="font-variant-numeric:tabular-nums;' + (forte ? 'font-weight:700;color:var(--texto)' : 'color:var(--texto-2)') + '">' +
    val + '</span></div>';
  h += linha('Realizado' + (emCurso ? ' (MTD)' : ''), f(c.valor));
  if (projecao != null && emCurso) h += linha('Projecao (mes)', f(projecao));
  if (c.acumula) h += linha('Meta proporcional' + (emCurso ? ' (' + c.dias + 'd)' : ''), f(metaProp));
  h += linha('Meta mensal', f(c.meta));
  h += '</div><div class="ritmo"><div class="ritmo-trilha">';
  const pTrilha = c.inverso
    ? (c.valor > 0 ? Math.min(100, (c.meta / c.valor) * 100) : 0)
    : Math.min(100, taxa(c.valor, c.meta) || 0);
  const nv = nivelMeta(c.acumula ? vsProp : vsMeta);
  const cor = nv === 'ok' ? 'var(--ok)' : nv === 'atencao' ? 'var(--atencao)' : nv === 'grave' ? 'var(--grave)' : 'var(--critico)';
  h += '<div class="ritmo-fill" style="width:' + pTrilha.toFixed(1) + '%;background:' + cor + '"></div>';
  if (c.acumula && emCurso) h += '<div class="ritmo-alvo" style="left:' + (c.fracao * 100).toFixed(1) + '%"></div>';
  h += '</div><div class="ritmo-legenda">';
  h += '<span>' + (c.acumula ? 'vs proporcional ' : 'vs meta ') + pctOuTraco(c.acumula ? vsProp : vsMeta, 1) + '</span>';
  /* O painel original mostrava aqui "projecao vs meta", mas esse numero e
     algebricamente IGUAL ao "vs proporcional" (valor/(meta*f) dos dois lados):
     repetir o mesmo numero sob dois rotulos faz duvidar do resto da tela. No
     lugar entra o que de fato falta e em que ritmo diario, que da para agir. */
  if (c.acumula && emCurso && c.meta > c.valor) {
    const faltam = c.meta - c.valor;
    const diasRest = Math.max(1, c.diasMes - c.dias);
    h += '<span>faltam ' + f(faltam) + ' &middot; ' + f(faltam / diasRest) + '/dia</span>';
  } else if (c.acumula && emCurso) {
    h += '<span style="color:#5fd35f">meta do mes ja batida</span>';
  }
  h += '</div></div></div>';
  return { html: h, noVerde: (c.acumula ? vsProp : vsMeta) >= 100 };
}

function telaKpis() {
  const mes = F.mesKpi || MES_ATUAL;
  const emCurso = mes === MES_ATUAL;
  const metas = metasAtivas();
  const hoje_ = new Date();
  const diasMes = new Date(+mes.slice(0, 4), +mes.slice(5, 7), 0).getDate();
  const dias = emCurso ? hoje_.getDate() : diasMes;
  const fracao = dias / diasMes;

  const cli = (DADOS.clientes ? DADOS.clientes.reg : []).filter(r => r.mes === mes);
  const at  = (DADOS.atend ? DADOS.atend.reg : []).filter(r => r.mes === mes && r.dAtend);
  const md  = (DADOS.metaDia ? DADOS.metaDia.reg : []).filter(r => r.mes === mes);
  const nomeMes = MESES_ACENTO[+mes.slice(5, 7) - 1];
  const kpisMes = DADOS.metas && DADOS.metas.meses && DADOS.metas.meses[nomeMes];
  const krDe = txt => {
    if (!kpisMes || !kpisMes.krs) return null;
    const k = chaveBusca(txt);
    const x = kpisMes.krs.find(y => chaveBusca(y.kr).includes(k));
    return x ? x.resultado : null;
  };

  const leadsAds = soma(md, r => r.leadsTotal);
  const invest = soma(md, r => r.gasto);
  const reunioes = at.length;
  const clientes = cli.length;
  const faturamento = soma(cli, r => r.honIni);
  const tk = ticketMedio(cli);
  const leadsAbord = krDe('novos leads');
  const leadsQual = krDe('leads qualificados');

  let h = '';
  h += '<div class="secao-titulo primeiro">KPIs do comercial &middot; ' + rotuloMes(mes) + '</div>';

  /* Seletor de mes e botao de metas, no lugar do original. */
  const meses12 = [];
  for (let i = 0; i < 12; i++) meses12.push(mesMais(MES_ATUAL, -i));
  h += '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:0.9rem">' +
    '<div class="filtro"><label class="filtro-rotulo">Mes</label><select data-selmes>' +
    meses12.filter(k => k >= '2026-01').map(k =>
      '<option value="' + k + '"' + (k === mes ? ' selected' : '') + '>' + rotuloMes(k) + '</option>').join('') +
    '</select></div>' +
    '<button class="btn-acao" data-metas type="button">&#9881; Configurar metas</button></div>';

  if (emCurso) {
    h += aviso('info', '<b>Mes em andamento</b> &mdash; dados parciais ate ' + hoje_.toLocaleDateString('pt-BR') +
      ' (' + dias + ' de ' + diasMes + ' dias). A <b>projecao</b> assume que o ritmo de hoje continua ate o fim do mes; ' +
      'a <b>meta proporcional</b> e o quanto deveria estar entregue a esta altura.');
  }

  /* Blocos, na mesma ordem e agrupamento do painel original. */
  const def = (chave, valor) => Object.assign({}, METAS_PADRAO[chave], {
    valor: valor, meta: metas[chave], emCurso: emCurso, dias: dias, diasMes: diasMes, fracao: fracao
  });
  const blocos = {
    'Volume de leads': [
      blocoKpi(def('leadsAds', leadsAds)),
      blocoKpi(def('leadsAbord', leadsAbord)),
      blocoKpi(def('leadsQual', leadsQual))
    ],
    'Resultados comerciais': [
      blocoKpi(def('reunioes', reunioes)),
      blocoKpi(def('clientes', clientes))
    ],
    'Financeiro': [
      blocoKpi(def('faturamento', faturamento)),
      blocoKpi(def('ticket', tk)),
      blocoKpi(def('investimento', invest)),
      blocoKpi(def('cac', clientes ? invest / clientes : null))
    ],
    'Taxas de conversao': [
      blocoKpi(def('convReunCli', taxa(clientes, reunioes))),
      blocoKpi(def('convLeadReun', taxa(reunioes, leadsAds))),
      blocoKpi(def('convLeadCli', taxa(clientes, leadsAds))),
      blocoKpi(def('roi', invest ? faturamento / invest : null))
    ]
  };
  const todos = Object.keys(blocos).reduce((a, k) => a.concat(blocos[k]), []);
  const verdes = todos.filter(b => b.noVerde).length;

  /* Linha de destaque, igual ao original. */
  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Faturamento', valor: brl0(faturamento), pequeno: true,
    nota: 'Meta: ' + brl0(metas.faturamento), selo: selo(nivelMeta(taxa(faturamento, metas.faturamento * fracao)),
      pctOuTraco(taxa(faturamento, metas.faturamento), 1) + ' da meta') });
  h += kpi({ rotulo: 'Clientes', valor: n0(clientes),
    nota: 'Meta: ' + n0(metas.clientes), selo: selo(nivelMeta(taxa(clientes, metas.clientes * fracao)),
      pctOuTraco(taxa(clientes, metas.clientes), 1) + ' da meta') });
  h += kpi({ rotulo: 'ROI', valor: invest ? n1(faturamento / invest) + 'x' : '&mdash;', pequeno: true,
    nota: 'Meta: ' + n1(metas.roi) + 'x',
    selo: invest ? selo(nivelMeta(taxa(faturamento / invest, metas.roi)), pctOuTraco(taxa(faturamento / invest, metas.roi), 1)) : null });
  h += kpi({ rotulo: 'Investimento', valor: brl0(invest), pequeno: true,
    nota: 'Orcamento: ' + brl0(metas.investimento),
    selo: selo(taxa(invest, metas.investimento) > 100 ? 'critico' : 'neutro',
      pctOuTraco(taxa(invest, metas.investimento), 1) + ' do orcamento') });
  h += kpi({ rotulo: 'KPIs no verde', valor: n0(verdes) + '/' + n0(todos.length),
    nota: emCurso ? 'atingindo a meta proporcional' : 'atingindo a meta do mes',
    selo: selo(nivelMeta(taxa(verdes, todos.length)), pctOuTraco(taxa(verdes, todos.length), 0)) });
  h += '</div>';

  Object.keys(blocos).forEach(secao => {
    h += '<div class="secao-titulo">' + esc(secao) + '</div>';
    h += '<div class="grid g-3">' + blocos[secao].map(b => b.html).join('') + '</div>';
  });

  if (!kpisMes || kpisMes.erro) {
    h += aviso('atencao', 'Leads abordados e qualificados vem da aba <code>KPIS ' + esc(nomeMes) +
      '</code> da planilha de Metas, que nao foi lida neste recorte &mdash; esses dois blocos ficam sem numero.');
  }
  return h;
}

/* ==========================================================================
   TELA 6 - EQUIPE
   ========================================================================== */
function telaEquipe() {
  const at = selAtend(), cli = selClientes();
  let h = '';
  h += '<div class="secao-titulo primeiro">Equipe comercial &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += aviso('info', 'Closers aparecem pela coluna <b>Closer</b> e SDRs pela coluna <b>SDR</b> das planilhas de atendimento e de clientes. ' +
    'A conversao e do recorte, nao de coorte: um cliente pode ter vindo de reuniao de mes anterior.');

  /* --- Closers --- */
  const closers = Array.from(new Set(at.map(r => r.closer).concat(cli.map(r => r.closer)))).filter(x => x && x !== 'Sem closer');
  const linhasCloser = closers.map(nome => {
    const a = at.filter(r => r.closer === nome);
    const c = cli.filter(r => r.closer === nome);
    const reun = a.filter(r => r.dAtend).length;
    const ganhos = a.filter(r => r.grupo === 'ganho').length;
    const perdidos = a.filter(r => r.grupo === 'perdido').length;
    const hon = soma(c, r => r.honIni);
    return {
      nome: nome, reun: reun, abertos: a.filter(r => r.emAberto).length,
      ganhos: ganhos, perdidos: perdidos,
      taxaGanho: taxa(ganhos, ganhos + perdidos),
      clientes: c.length, hon: hon, ticket: ticketMedio(c),
      conv: taxa(c.length, reun), dias: media(c, r => r.diasFechar),
      propAberta: soma(a.filter(r => r.emAberto), r => r.vInicial),
      parados: a.filter(r => r.parado).length
    };
  }).sort((a, b) => b.hon - a.hon);

  h += '<div class="secao-titulo">Closers</div>';
  h += '<div class="grid g-3">';
  h += cartao('Honorarios por closer', 'Receita inicial fechada no recorte.',
    vizBarras({ dados: linhasCloser.filter(c => c.hon > 0).map((c, i) => ({ k: c.nome, v: c.hon, cor: corSerie(i),
      extra: [{ rot: 'Clientes', val: n0(c.clientes) }, { rot: 'Ticket medio', val: c.ticket == null ? '—' : brl0(c.ticket) }] })), fmt: brl0, nome: 'Honorarios' }));
  h += cartao('Conversao reuniao → cliente', 'Clientes sobre reunioes realizadas.',
    vizBarras({ dados: linhasCloser.filter(c => c.conv != null).map((c, i) => ({ k: c.nome, v: c.conv, cor: corSerie(i),
      extra: [{ rot: 'Reunioes', val: n0(c.reun) }, { rot: 'Clientes', val: n0(c.clientes) }] })), fmt: v => pct(v, 1), nome: 'Conversao' }));
  h += cartao('Taxa de ganho na negociacao', 'Ganhos sobre ganhos + perdidos. Sem resposta nao entra.',
    vizBarras({ dados: linhasCloser.filter(c => c.taxaGanho != null).map((c, i) => ({ k: c.nome, v: c.taxaGanho, cor: corSerie(i),
      extra: [{ rot: 'Ganhos', val: n0(c.ganhos) }, { rot: 'Perdidos', val: n0(c.perdidos) }] })), fmt: v => pct(v, 1), nome: 'Taxa de ganho' }));
  h += '</div>';

  h += tabelaInterativa('closer-tab', [
    { k: 'nome', rot: 'Closer', tipo: 'txt', cls: 'forte' },
    { k: 'reun', rot: 'Reunioes', tipo: 'num' },
    { k: 'clientes', rot: 'Clientes', tipo: 'num' },
    { k: 'conv', rot: 'Conversao', tipo: 'pct', casas: 1 },
    { k: 'ganhos', rot: 'Ganhos', tipo: 'num' },
    { k: 'perdidos', rot: 'Perdidos', tipo: 'num' },
    { k: 'taxaGanho', rot: 'Taxa de ganho', tipo: 'pct', casas: 1 },
    { k: 'hon', rot: 'Honorarios', tipo: 'moeda0' },
    { k: 'ticket', rot: 'Ticket medio', tipo: 'moeda0' },
    { k: 'dias', rot: 'Dias p/ fechar', tipo: 'num1' },
    { k: 'abertos', rot: 'Em aberto', tipo: 'num' },
    { k: 'propAberta', rot: 'Proposta em aberto', tipo: 'moeda0' },
    { k: 'parados', rot: 'Parados > 7d', tipo: 'num',
      html: r => r.parados ? '<span style="color:#f3c45a;font-weight:700">' + n0(r.parados) + '</span>' : '0' }
  ], linhasCloser, { ord: 'hon', dir: -1, titulo: 'Desempenho por closer', limite: 30 });

  /* --- SDRs --- */
  const sdrs = Array.from(new Set(at.map(r => r.sdr).concat(cli.map(r => r.sdr)))).filter(x => x && x !== 'Sem SDR');
  const linhasSdr = sdrs.map(nome => {
    const a = at.filter(r => r.sdr === nome);
    const c = cli.filter(r => r.sdr === nome);
    const agendadas = a.filter(r => r.dAgenda).length;
    const realizadas = a.filter(r => r.dAtend).length;
    return {
      nome: nome, agendadas: agendadas, realizadas: realizadas,
      noShow: Math.max(0, agendadas - realizadas),
      presenca: taxa(realizadas, agendadas),
      clientes: c.length, hon: soma(c, r => r.honIni),
      conv: taxa(c.length, realizadas),
      semResposta: a.filter(r => r.grupo === 'semresposta').length
    };
  }).sort((a, b) => b.realizadas - a.realizadas);

  h += '<div class="secao-titulo">SDR &middot; agendamento e comparecimento</div>';
  h += '<div class="grid g-2">';
  h += cartao('Reunioes agendadas x realizadas', 'A diferenca e o no-show da agenda.',
    vizEmpilhado({ x: linhasSdr.map(s => s.nome), fmt: n0, series: [
      { nome: 'Realizadas', vals: linhasSdr.map(s => s.realizadas), cor: 'var(--s3)' },
      { nome: 'Nao realizadas', vals: linhasSdr.map(s => s.noShow), cor: 'var(--s4)' }
    ] }) + legenda([{ nome: 'Realizadas', cor: 'var(--s3)' }, { nome: 'Nao realizadas', cor: 'var(--s4)' }]));
  h += cartao('Clientes gerados por SDR', 'Fechamentos atribuidos ao SDR que originou.',
    vizBarras({ dados: linhasSdr.map((s, i) => ({ k: s.nome, v: s.clientes, cor: corSerie(i),
      extra: [{ rot: 'Honorarios', val: brl0(s.hon) }] })), nome: 'Clientes' }));
  h += '</div>';

  h += tabelaInterativa('sdr-tab', [
    { k: 'nome', rot: 'SDR', tipo: 'txt', cls: 'forte' },
    { k: 'agendadas', rot: 'Agendadas', tipo: 'num' },
    { k: 'realizadas', rot: 'Realizadas', tipo: 'num' },
    { k: 'noShow', rot: 'Nao realizadas', tipo: 'num' },
    { k: 'presenca', rot: 'Comparecimento', tipo: 'pct', casas: 1 },
    { k: 'semResposta', rot: 'Sem resposta', tipo: 'num' },
    { k: 'clientes', rot: 'Clientes', tipo: 'num' },
    { k: 'conv', rot: 'Conversao', tipo: 'pct', casas: 1 },
    { k: 'hon', rot: 'Honorarios', tipo: 'moeda0' }
  ], linhasSdr, { ord: 'realizadas', dir: -1, titulo: 'Desempenho por SDR', limite: 30, ativa: false });
  return h;
}

/* ==========================================================================
   TELA 7 - METAS E OKRS
   ========================================================================== */
function telaMetas() {
  let h = '';
  if (ERROS.metas) return aviso('critico', '<b>Planilha de Metas nao entrou:</b> ' + esc(ERROS.metas));
  const m = DADOS.metas || {};
  const nomeAtual = MESES_ACENTO[new Date().getMonth()];
  const nomeAnt = MESES_ACENTO[(new Date().getMonth() + 11) % 12];
  const rm = ritmoDoMes();

  const atual = m.meses && m.meses[nomeAtual] && !m.meses[nomeAtual].erro ? m.meses[nomeAtual] : null;
  const ant = m.meses && m.meses[nomeAnt] && !m.meses[nomeAnt].erro ? m.meses[nomeAnt] : null;

  h += '<div class="secao-titulo primeiro">Metas do mes &middot; ' + esc(nomeAtual) + '</div>';
  if (!atual) {
    h += aviso('atencao', 'Nao encontrei a aba <code>KPIS ' + esc(nomeAtual) + '</code> na planilha de Metas. ' +
      'Quando o time criar a aba do mes, ela aparece aqui sozinha.');
  } else {
    h += aviso('info', 'Medicao de <b>' + esc(atual.atualizado || 'data nao informada na planilha') + '</b> &middot; ' +
      rm.diasComp + ' de ' + rm.diasMes + ' dias do mes (' + pct(rm.pct, 0) + '). ' +
      'A <b>meta proporcional</b> e o quanto deveria estar entregue hoje; e contra ela que o ritmo e lido.');

    const fmtKr = k => k.tipo === 'moeda' ? brl0 : (k.tipo === 'pct' ? (v => pct(v, 0)) : n0);
    h += tabelaInterativa('metas-tab', [
      { k: 'resp', rot: 'Responsavel', tipo: 'txt', cls: 'forte' },
      { k: 'kr', rot: 'Resultado chave', tipo: 'txt', cls: 'wrap' },
      { k: 'metaMes', rot: 'Meta do mes', tipo: 'num', html: r => fmtKr(r)(r.metaMes) },
      { k: 'metaProp', rot: 'Meta proporcional', tipo: 'num', html: r => fmtKr(r)(r.metaProp) },
      { k: 'resultado', rot: 'Resultado', tipo: 'num', html: r => '<b style="color:var(--texto)">' + fmtKr(r)(r.resultado) + '</b>' },
      { k: 'vsProp', rot: 'vs proporcional', tipo: 'num', ord: false,
        html: r => selo(nivelMeta(r.inverso ? (r.vsProp ? 200 - r.vsProp : null) : r.vsProp), pct(r.vsProp, 0)) },
      { k: 'vsMes', rot: 'vs meta do mes', tipo: 'num', ord: false,
        html: r => barraCelula(r.vsMes, 120, r.vsMes >= 100 ? 'var(--ok)' : r.vsMes >= 60 ? 'var(--atencao)' : 'var(--critico)', pct(r.vsMes, 0)) },
      { k: 'ritmo', rot: 'Ritmo', tipo: 'txt', ord: false,
        html: r => ritmo({ feito: r.resultado, meta: r.metaMes, alvoPct: rm.pct, fmt: fmtKr(r) }) }
    ], atual.krs, { titulo: 'Metas do mes', limite: 40 });

    /* Comparacao com o mes anterior pelos KRs de mesmo nome. */
    if (ant) {
      const comp = atual.krs.map(k => {
        const a = ant.krs.find(x => chaveBusca(x.kr) === chaveBusca(k.kr));
        if (!a) return null;
        return { kr: k.kr, resp: k.resp, atual: k.resultado, ant: a.resultado,
                 var: a.resultado ? ((k.resultado - a.resultado) / Math.abs(a.resultado)) * 100 : null, inverso: k.inverso, tipo: k.tipo };
      }).filter(Boolean);
      if (comp.length) {
        h += '<div class="secao-titulo">' + esc(nomeAtual) + ' x ' + esc(nomeAnt) +
          ' <span style="text-transform:none;letter-spacing:0;font-weight:500">(' + esc(nomeAtual) + ' ainda em curso &mdash; compare com o ritmo, nao com o total)</span></div>';
        h += tabelaInterativa('metas-comp', [
          { k: 'kr', rot: 'Resultado chave', tipo: 'txt', cls: 'forte wrap' },
          { k: 'resp', rot: 'Responsavel', tipo: 'txt' },
          { k: 'ant', rot: esc(nomeAnt), tipo: 'num', html: r => (r.tipo === 'moeda' ? brl0 : r.tipo === 'pct' ? (v => pct(v, 0)) : n0)(r.ant) },
          { k: 'atual', rot: esc(nomeAtual) + ' (parcial)', tipo: 'num', html: r => (r.tipo === 'moeda' ? brl0 : r.tipo === 'pct' ? (v => pct(v, 0)) : n0)(r.atual) },
          { k: 'var', rot: 'Variacao', tipo: 'num', ord: false, html: r => delta(r.var, { inverso: r.inverso }) }
        ], comp, { titulo: 'Comparativo de metas', limite: 40, ativa: false });
      }
    }
  }

  /* --- Plano de acao --- */
  h += '<div class="secao-titulo">Plano de acao</div>';
  if (m.okrs && m.okrs.length) {
    h += tabelaInterativa('okr-tab', [
      { k: 'acao', rot: 'Acao', tipo: 'txt', cls: 'forte wrap' },
      { k: 'resp', rot: 'Responsavel', tipo: 'txt' },
      { k: 'prazo', rot: 'Conclusao prevista', tipo: 'data' },
      { k: 'status', rot: 'Status', tipo: 'txt', ord: false,
        html: r => !r.status ? '&mdash;' : selo(/conclu|feito|pronto/i.test(r.status) ? 'ok' :
          /execu|andamento/i.test(r.status) ? 'neutro' : 'atencao', r.status) },
      { k: 'atraso', rot: 'Prazo', tipo: 'num', ord: false,
        html: r => { if (!r.prazo) return '&mdash;';
          const d = diasEntre(r.prazo, hoje());
          if (/conclu|feito/i.test(r.status || '')) return selo('ok', 'concluida');
          return d > 0 ? selo('atencao', d + ' dia(s) em atraso') : d === 0 ? selo('atencao', 'vence hoje') : selo('neutro', 'em ' + (-d) + ' dia(s)'); } },
      { k: 'obs', rot: 'Observacao', tipo: 'txt', cls: 'wrap' }
    ], m.okrs, { titulo: 'Plano de acao', limite: 40, ativa: false });
  } else {
    h += '<div class="cartao"><div class="vazio">' +
      (m.okrsErro ? 'Nao consegui ler a aba OKRS: ' + esc(m.okrsErro) : 'Nenhuma acao cadastrada na aba OKRS.') + '</div></div>';
  }

  /* --- Acumulado do ano (planilha antiga) --- */
  h += '<div class="secao-titulo">Acumulado do ano <span style="text-transform:none;letter-spacing:0;font-weight:500">(planilha antiga &mdash; base historica)</span></div>';
  if (DADOS.hist && DADOS.hist.acumulado && DADOS.hist.acumulado.real) {
    const ac = DADOS.hist.acumulado;
    const linhas = ac.etapas.map(e => ({
      etapa: e.rot, real: num(ac.real[e.k]),
      proj: ac.projMes ? num(ac.projMes[e.k]) : null, bruto: ac.real[e.k]
    })).filter(l => l.real || l.proj);
    h += cartao('Funil acumulado do ano', 'Vem da aba <b>Produtos Juridicos [Acumulado ' + new Date().getFullYear() +
      ']</b> da planilha antiga. Use como referencia de ano, nao como numero do mes.',
      tabelaInterativa('hist-tab', [
        { k: 'etapa', rot: 'Etapa', tipo: 'txt', cls: 'forte' },
        { k: 'proj', rot: 'Projetado no ano', tipo: 'num' },
        { k: 'real', rot: 'Real no ano', tipo: 'num', html: r => '<b style="color:var(--texto)">' + (/R\$|%/.test(String(r.bruto)) ? esc(r.bruto) : n0(r.real)) + '</b>' },
        { k: 'ating', rot: 'Atingimento', tipo: 'num', ord: false,
          html: r => { const t = taxa(r.real, r.proj); return t == null ? '&mdash;' : barraCelula(t, 200, t >= 100 ? 'var(--ok)' : 'var(--atencao)', pct(t, 0)); } }
      ], linhas, { titulo: 'Acumulado 2026', limite: 30, ativa: false }));
  } else {
    h += '<div class="cartao"><div class="vazio">' +
      (ERROS.hist ? 'Planilha antiga nao entrou: ' + esc(ERROS.hist) : 'Sem acumulado disponivel.') + '</div></div>';
  }
  return h;
}

/* ==========================================================================
   TELA 8 - FONTES E SAUDE DO DADO
   ========================================================================== */
function telaFontes() {
  let h = '';

  /* ----- Transporte: e aqui que se confere se a barreira esta de pe ----- */
  h += '<div class="secao-titulo primeiro">Como o painel le os dados</div>';
  if (TRANSPORTE === 'proxy') {
    h += aviso('info', '<b>Leitura pelo proxy Apps Script.</b> A senha e conferida no servidor, ' +
      'as planilhas podem ficar privadas e CPF/CNPJ nem sai do Google. ' +
      'E este o modo em que o login protege o dado, e nao so a descoberta dele.');
  } else if (PROXY_FALHA) {

    '</div>' +
    (TOKEN ? '' : '<div class="kpi-nota" style="margin-top:0.6rem;color:#f3c45a">Esta sessao foi restaurada sem a credencial do proxy. ' +

  h += '<div class="secao-titulo">Saude das fontes</div>';

  const contar = d => {
    if (!d) return null;
    if (d.reg) return d.reg.length;
    if (d.meses) {
      const n = Object.keys(d.meses).reduce((a, k) => a + ((d.meses[k] && d.meses[k].krs) ? d.meses[k].krs.length : 0), 0);
      return n || null;
    }
    if (d.acumulado && d.acumulado.etapas) return d.acumulado.etapas.length;

  };
  const linhas = FONTES.map(f => {
    const d = DADOS[f.k];

  h += tabelaInterativa('fontes-tab', [

  h += '<div class="secao-titulo">Nota de seguranca</div>';
  if (TRANSPORTE === 'proxy') {
    h += aviso('info', '<b>A senha e conferida no servidor.</b> O navegador deriva ' +
      'PBKDF2-SHA256 (310 mil iteracoes) do login e da senha e envia so o resultado &mdash; a senha nunca trafega ' +
      'e nunca e guardada. O proxy compara com um hash que nao volta a ser senha, conta tentativa errada e ' +
      'bloqueia por janela de tempo. As planilhas podem ficar <b>privadas</b>: quem nao tem a senha nao tem o dado. ' +
      'CPF/CNPJ e recortado no servidor e nem sai do Google.' +

  } else {
    h += aviso('atencao', '<b>Neste modo o painel protege a descoberta, nao os dados.</b> ' +
      'O login cifra os IDs das planilhas (AES-256-GCM, PBKDF2-SHA256 com 310 mil iteracoes): sem a senha, a pagina nao sabe o que ler. ' +
      'Mas as planilhas estao compartilhadas como <i>qualquer pessoa com o link</i> e os IDs de algumas ja aparecem ' +
      'em texto puro nos outros paineis publicos &mdash; quem os tiver le os dados direto no Google, sem senha. ' +
      'CPF/CNPJ dos clientes nao e lido por este painel. ' +
      '<b>Publique o proxy para fechar isso.</b>');

  return h;
}

/* Rotulo do periodo em uso, para os titulos das telas. */
function rotuloPeriodo() {
  const p = PERIODOS.find(x => x.k === F.periodo);
  const f = faixa();
  if (F.periodo === 'tudo') return 'todo o historico';
  if (F.periodo === 'mes' || F.periodo === 'ant') return rotuloMes(chaveMes(f.de)).replace('&mdash;', '');
  return (p ? p.rot.toLowerCase() : '') + ' (' + rotuloMesCurto(chaveMes(f.de)) + ' a ' + rotuloMesCurto(chaveMes(f.ate)) + ')';
}
/* ==========================================================================
   INDICADORES POR AREA  -  trafego, marketing e comercial
   --------------------------------------------------------------------------
   Duas densidades em cada area, e a hierarquia e o ponto:

     PRINCIPAIS   - o que decide a semana. Cartao inteiro, numero grande,
                    meta, comparacao com o mes anterior e historico de 6 meses.
     ESPECIALISTA - o diagnostico. Ficha compacta, agrupada por assunto,
                    consultada quando um principal acende.

   Tres regras valem em todas as telas daqui:

   1. Indicador sem fonte NAO e zero. Ele aparece com borda tracejada,
      travessao no lugar do numero e, no pe, exatamente o que falta para ele
      existir. Inventar um numero seria pior que a lacuna: o gestor decidiria
      sobre ele sem saber.
   2. Toda conta carrega o escopo escrito. "Custo por lead elegivel" divide o
      investimento do Meta por um total do CRM que tambem conta organico -
      isso subestima o custo, e o pe do cartao diz isso.
   3. Comparar realizado com meta CHEIA no dia 10 do mes so produz panico. Em
      indicador que acumula, a referencia e a meta PROPORCIONAL ao dia.
   ========================================================================== */

/* ===== NATUREZA DA ORIGEM =====
   O time nomeia campanha do Meta entre colchetes ("[ENG] [FORM] Rev. Plano
   de Saude"), e e esse rotulo que chega na coluna ORIGEM da planilha de
   clientes. O resto e nominal: Organico, Indicacao, Recompra, Site. Daqui sai
   o unico recorte pago x nao pago que existe em nivel de REGISTRO - e por
   isso que clientes e faturamento tem o corte por origem e os leads nao. */
function naturezaOrigem(o) {
  const t = String(o == null ? '' : o).trim();
  const k = chaveBusca(t);
  if (!k) return 'indefinido';
  if (t.charAt(0) === '[' || /remarketing/.test(k)) return 'ads';
  if (/indicacao/.test(k)) return 'indicacao';
  if (/recompra|cliente bm/.test(k)) return 'base';
  if (/organico|site|calculadora|reuniao fechada/.test(k)) return 'organico';
  return 'outras';
}
const ROT_NAT = { ads: 'Meta Ads', organico: 'Orgânico', indicacao: 'Indicação',
                  base: 'Base / recompra', outras: 'Outras origens', indefinido: 'Sem origem' };
const COR_NAT = { ads: 'var(--s1)', organico: 'var(--s3)', indicacao: 'var(--s7)',
                  base: 'var(--s4)', outras: 'var(--texto-muted)', indefinido: 'var(--texto-muted)' };
const NATS = ['ads', 'organico', 'indicacao', 'base', 'outras'];

/* ===== DEGRAU DA ESTEIRA EM QUE O FECHAMENTO ACONTECEU =====
   A esteira tem 9 follow ups com significado proprio: 1 = oferta de 24h,
   7 = D21 Buckner, 8 = D28 honorarios em liminar, 9 = D45 apenas exito. O FUP
   mais alto marcado "Feito" e, literalmente, o degrau alcancado.
   Quando "Tipo de Contrato (Honorarios)" esta preenchido ele manda: diz a
   OFERTA que fechou, nao so quando o toque aconteceu. */
const ETAPA_FECHA = [
  { k: '24h',     rot: 'Oferta de 24h',               cor: 'var(--s3)' },
  { k: 'normal',  rot: 'Negociação normal (D3–D14)',  cor: 'var(--s1)' },
  { k: 'buckner', rot: 'D21 · Buckner',               cor: 'var(--s4)' },
  { k: 'liminar', rot: 'D28 · honorários em liminar', cor: 'var(--s7)' },
  { k: 'exito',   rot: 'D45 · apenas êxito',          cor: 'var(--s5)' }
];
function etapaFechamento(r) {
  const th = chaveBusca(r.tipoHon);
  if (/liminar/.test(th)) return 'liminar';
  if (/exito/.test(th) && !/inicial/.test(th)) return 'exito';
  const n = r.etapaFup || 0;
  if (n >= 9) return 'exito';
  if (n === 8) return 'liminar';
  if (n === 7) return 'buckner';
  if (n <= 1) return '24h';
  return 'normal';
}

/* ===================== RENDERIZACAO DE INDICADOR ===================== */
const FMT_K = {
  num:    n0,
  moeda:  brl0,
  moeda2: brl,
  pct:    v => pct(v, v != null && Math.abs(v) < 10 ? 2 : 1),
  mult:   v => n1(v) + 'x',
  dias:   v => n1(v) + ' d'
};
const fmtK = k => FMT_K[k.tipo] || n0;
const CORNV = { ok: 'var(--ok)', atencao: 'var(--atencao)', grave: 'var(--grave)',
                critico: 'var(--critico)', neutro: 'transparent' };
/* Sobre fundo escuro o token puro de status nao tem contraste para texto.
   Estes sao os mesmos tons que o selo usa. */
const CORTX = { ok: '#5fd35f', atencao: '#f3c45a', grave: '#f0a681',
                critico: '#e98a8a', neutro: 'var(--texto-2)' };

/* Meta de referencia do indicador. metaProp vem da propria planilha quando
   ela ja calcula; senao, rateia pela fracao do mes ja corrida. */
function metaRefK(k) {
  /* Meta zero nao e meta: e celula em branco que o num() converteu. Tratar
     como alvo faria todo indicador nascer em 0% da meta. */
  if (k.meta == null || !isFinite(k.meta) || k.meta === 0) return null;
  if (k.metaProp != null && isFinite(k.metaProp) && k.emCurso) return k.metaProp;
  return k.acumula && k.emCurso ? k.meta * (k.fracao == null ? 1 : k.fracao) : k.meta;
}
/* Atingimento. Em indicador INVERSO (custo, CAC, no-show) menos e melhor,
   entao a fracao vira meta/realizado. */
function atingK(k) {
  const m = metaRefK(k);
  if (k.valor == null || !isFinite(k.valor) || m == null || m === 0) return null;
  return k.inverso ? (k.valor > 0 ? taxa(m, k.valor) : null) : taxa(k.valor, m);
}
function nivelK(k) { const a = atingK(k); return a == null ? 'neutro' : nivelMeta(a); }
/* Variacao contra o mes anterior, em percentual do valor anterior. */
function varK(k) {
  if (k.valor == null || k.ant == null || !isFinite(k.ant) || k.ant === 0) return null;
  return ((k.valor - k.ant) / Math.abs(k.ant)) * 100;
}
const alertaK = k => ['grave', 'critico'].indexOf(nivelK(k)) >= 0;

function rotuloK(k, cls) {
  return '<div class="' + cls + '">' + esc(k.rot) +
    (k.dica ? '<span data-tip="' + esc(k.dica) + '" style="cursor:help;opacity:.55;margin-left:auto">&#9432;</span>' : '') +
    '</div>';
}

/* Projecao do mes a partir do resultado parcial.
   Em indicador que ACUMULA (leads, clientes, faturamento), projetar e dividir
   o realizado pela fracao do mes ja corrida. Em TAXA, ticket ou custo nao se
   projeta assim: numerador e denominador crescem juntos, e a razao de hoje ja
   e a melhor estimativa do mes - entao a projecao e o proprio valor. */
function projecaoK(k) {
  if (k.valor == null || !isFinite(k.valor)) return null;
  if (!k.emCurso) return k.valor;
  return (k.acumula && k.fracao) ? k.valor / k.fracao : k.valor;
}

/* Uma linha do quadro comparativo. */
function qLinha(rot, val, cls, dica) {
  return '<div class="q-linha' + (cls ? ' ' + cls : '') + '">' +
    '<span class="q-rot">' + rot +
    (dica ? '<span data-tip="' + esc(dica) + '" style="cursor:help;opacity:.55">&#9432;</span>' : '') +
    '</span><span class="q-val">' + val + '</span></div>';
}
const qInd = (nv, txt) => '<span class="q-ind" style="color:' + CORTX[nv] + '">' +
  (nv === 'ok' ? ICO.ok : nv === 'neutro' ? '' : ICO.alerta) + txt + '</span>';

/* O quadro das quatro leituras. Sem meta nao existe quadro: sobraria uma
   tabela de uma linha repetindo o numero grande logo acima. */
function quadroK(k) {
  if (k.meta == null || !isFinite(k.meta) || k.meta === 0) return '';
  const f = fmtK(k);
  const mProp = metaRefK(k);
  const a = atingK(k);
  const nv = nivelK(k);
  const proj = projecaoK(k);
  const prop = k.emCurso && k.acumula;
  /* Projecao contra a meta CHEIA do mes - e a pergunta "o mes fecha na meta?". */
  const aProj = (proj == null || !k.meta) ? null
    : (k.inverso ? (proj > 0 ? taxa(k.meta, proj) : null) : taxa(proj, k.meta));

  let h = '<div class="quadro">';
  h += qLinha('Realizado × ' + (prop ? 'meta proporcional' : 'meta mensal'),
    a == null ? '&mdash;' : qInd(nv, pct(a, 0)), 'forte',
    k.inverso ? 'Indicador invertido: a meta é um teto. Acima de 100% significa que o realizado está DENTRO do limite.'
              : null);
  if (prop) h += qLinha('Meta proporcional (' + n0(k.dias) + 'd)', f(mProp), null,
    'O quanto deveria estar entregue a esta altura do mês: ' + n0(k.dias) + ' de ' + n0(k.diasMes) + ' dias do mês.');
  h += qLinha((k.inverso ? 'Limite' : 'Meta') + ' mensal', f(k.meta));
  if (k.emCurso) {
    h += qLinha('Projeção (mês)',
      (proj == null ? '&mdash;' : f(proj)) +
      (aProj == null ? '' : ' <span class="q-sec">(' + pct(aProj, 0) + ')</span>'), null,
      k.acumula ? 'Onde o mês termina se o ritmo de hoje continuar. O percentual é contra a meta cheia.'
                : 'Taxa e custo não acumulam: numerador e denominador crescem juntos, então a razão de hoje já é a estimativa do mês.');
  }
  h += '</div>';

  /* Barra de ritmo: a mesma leitura da primeira linha, em forma. O risco
     marca onde o ritmo esperado esta hoje. */
  if (prop && k.valor != null) {
    const pFill = Math.min(100, Math.max(0, k.inverso
      ? (k.valor > 0 ? (k.meta / k.valor) * 100 : 0)
      : (taxa(k.valor, k.meta) || 0)));
    h += '<div class="ritmo"><div class="ritmo-trilha">' +
      '<div class="ritmo-fill" style="width:' + pFill.toFixed(1) + '%;background:' +
      (CORNV[nv] === 'transparent' ? 'var(--s1)' : CORNV[nv]) + '"></div>' +
      '<div class="ritmo-alvo" style="left:' + (k.fracao * 100).toFixed(1) + '%" data-tip="' +
      esc('Ritmo esperado para hoje: ' + pct(k.fracao * 100, 0) + ' da meta do mês') + '"></div>' +
      '</div></div>';
  }
  return h;
}

/* Cartao do indicador principal: numero grande, comparacao e o quadro. */
function destaque(k) {
  if (k.falta) {
    return '<div class="destaque sem">' + rotuloK(k, 'destaque-rot') +
      '<div class="destaque-val sm">&mdash;</div>' +
      '<div class="destaque-linha"><span class="marca-sem">sem fonte</span></div>' +
      '<div class="destaque-pe">' + k.falta + '</div></div>';
  }
  const f = fmtK(k), nv = nivelK(k), a = atingK(k), v = varK(k);
  let h = '<div class="destaque" style="--fio:' + CORNV[nv] + '">' + rotuloK(k, 'destaque-rot');
  h += '<div class="destaque-val' + (k.largo === false ? ' sm' : '') + '">' +
       (k.valor == null ? '&mdash;' : f(k.valor)) + '</div>';
  const linha = [];
  /* Sem meta nao ha quadro, e entao o selo e o unico lugar onde o status
     cabe. Com meta, o quadro logo abaixo ja diz realizado x meta com cor e
     percentual - repetir aqui seria o mesmo numero sob dois rotulos. */
  if (a != null && k.meta == null) linha.push(selo(nv, pct(a, 0) + ' da meta'));
  if (v != null) linha.push(delta(v, { inverso: !!k.inverso, sufixo: 'vs ' + k.rotAnt }));
  if (linha.length) h += '<div class="destaque-linha">' + linha.join('') + '</div>';
  h += quadroK(k);
  if (k.nota) h += '<div class="destaque-pe">' + k.nota + '</div>';
  if (k.serie && k.serie.filter(x => x != null && x !== 0).length > 2)
    h += '<div class="kpi-spark">' + spark(k.serie, 'var(--s1)') + '</div>';
  return h + '</div>';
}

/* Ficha compacta do indicador de especialista. */
function ficha(k) {
  if (k.falta) {
    return '<div class="ficha sem">' + rotuloK(k, 'ficha-rot') +
      '<div class="ficha-val">&mdash;</div>' +
      '<div class="ficha-pe"><span class="marca-sem">sem fonte</span> ' + k.falta + '</div></div>';
  }
  const f = fmtK(k), nv = nivelK(k), a = atingK(k), v = varK(k);
  let h = '<div class="ficha">' + rotuloK(k, 'ficha-rot');
  h += '<div class="ficha-val">' + (k.valor == null ? '&mdash;' : f(k.valor)) + '</div>';
  if (a != null) h += '<div style="margin-top:.25rem">' +
    selo(nv, k.inverso ? 'limite ' + f(metaRefK(k)) : pct(a, 0) + ' da meta') + '</div>';
  else if (v != null) h += delta(v, { inverso: !!k.inverso });
  if (k.nota) h += '<div class="ficha-pe">' + k.nota + '</div>';
  return h + '</div>';
}

const gradeDestaque = lista => '<div class="grid g-destaque">' + lista.map(destaque).join('') + '</div>';
const gradeFicha    = lista => '<div class="grid g-ficha">' + lista.map(ficha).join('') + '</div>';

/* Bloco de especialista: titulo, uma linha de contexto e a grade de fichas. */
function blocoEsp(titulo, sub, lista) {
  if (!lista || !lista.length) return '';
  const sem = lista.filter(k => k.falta).length;
  let h = '<div class="secao-titulo">' + esc(titulo) +
    (sem ? '<span class="marca-sem">' + sem + ' sem fonte</span>' : '') + '</div>';
  if (sub) h += '<div style="font-size:0.73rem;color:var(--texto-muted);line-height:1.5;margin:-0.35rem 0 0.7rem;max-width:74ch">' + sub + '</div>';
  return h + gradeFicha(lista);
}

/* Faixa de resumo da area - a leitura de uma linha so. */
function resumoArea(lista) {
  const com = lista.filter(k => !k.falta && k.valor != null);
  const comMeta = com.filter(k => atingK(k) != null);
  const verdes = comMeta.filter(k => nivelK(k) === 'ok').length;
  const vermelhos = comMeta.filter(k => alertaK(k)).length;
  const sem = lista.filter(k => k.falta).length;
  return '<div class="resumo-area">' +
    '<div class="resumo-item"><b>' + n0(com.length) + '</b> indicadores medidos</div>' +
    '<div class="resumo-item"><b>' + n0(verdes) + '/' + n0(comMeta.length) + '</b> no verde</div>' +
    '<div class="resumo-item"><b style="color:' + (vermelhos ? '#e98a8a' : 'var(--texto)') + '">' + n0(vermelhos) +
      '</b> pedindo diagnóstico</div>' +
    (sem ? '<div class="resumo-item"><b>' + n0(sem) + '</b> sem fonte</div>' : '') +
    '</div>';
}

/* Comparativo entre indicadores: a unica escala em que KPIs de unidades
   diferentes podem dividir o mesmo grafico e o ATINGIMENTO em percentual.
   A linha tracejada marca 100%. */
function vizAtingimento(lista, opc) {
  const o = opc || {};
  const d = lista.filter(k => !k.falta && atingK(k) != null)
    .map(k => ({ k: k.rot, v: atingK(k), nivel: nivelK(k), kk: k }))
    .sort((a, b) => a.v - b.v);
  if (!d.length) return '<div class="vazio">Nenhum indicador com meta definida neste recorte.</div>';
  return vizBarras({
    rotuloW: o.rotuloW || 230, fmt: v => pct(v, 0), nome: 'Atingimento', ref: 100,
    dados: d.map(x => ({
      k: x.k, v: x.v, cor: CORNV[x.nivel] === 'transparent' ? 'var(--s1)' : CORNV[x.nivel],
      extra: [{ rot: 'Realizado', val: fmtK(x.kk)(x.kk.valor) },
              { rot: 'Meta de referência', val: fmtK(x.kk)(metaRefK(x.kk)) }]
    }))
  });
}

/* Tabela de diagnostico: todos os indicadores da area, com fonte declarada. */
function tabelaKpi(id, lista, titulo) {
  const linhas = lista.map(k => ({
    rot: k.rot, grupo: k.grupo || '', kk: k,
    valorTxt: k.falta ? null : (k.valor == null ? null : fmtK(k)(k.valor)),
    valorOrd: k.valor == null ? null : k.valor,
    metaTxt: k.meta == null ? null : fmtK(k)(k.meta),
    ating: k.falta ? null : atingK(k),
    fonte: k.falta ? 'sem fonte' : (k.fonte || '')
  }));
  return tabelaInterativa(id, [
    { k: 'rot', rot: 'Indicador', tipo: 'txt', cls: 'forte wrap' },
    { k: 'grupo', rot: 'Bloco', tipo: 'txt' },
    { k: 'valorOrd', rot: 'Realizado', tipo: 'num',
      html: r => r.valorTxt == null ? '<span class="marca-sem">sem fonte</span>' : '<b style="color:var(--texto)">' + r.valorTxt + '</b>' },
    { k: 'metaTxt', rot: 'Meta', tipo: 'txt', ord: false,
      html: r => r.metaTxt == null ? '<span style="color:var(--texto-muted)">sem meta</span>'
        : r.metaTxt + (r.kk.inverso ? ' <span style="color:var(--texto-muted)">(teto)</span>' : '') },
    { k: 'ating', rot: 'Atingimento', tipo: 'num',
      html: r => r.ating == null ? '&mdash;' : selo(nivelMeta(r.ating), pct(r.ating, 0)) },
    { k: 'fonte', rot: 'De onde vem', tipo: 'txt', cls: 'wrap' }
  ], linhas, { titulo: titulo, limite: 80, ativa: false });
}

/* Seletor do mes do painel - o mesmo estado de F.mesKpi em todas as telas
   de indicador, para nao existirem dois "mes atual" diferentes na cabeca. */
function seletorMes(comMetas) {
  const atual = F.mesKpi || MES_ATUAL;
  const ms = [];
  for (let i = 0; i < 12; i++) ms.push(mesMais(MES_ATUAL, -i));
  return '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:0.9rem">' +
    '<div class="filtro"><label class="filtro-rotulo">Mês do painel</label><select data-selmes>' +
    ms.filter(k => k >= '2026-01').map(k => '<option value="' + k + '"' + (k === atual ? ' selected' : '') +
      '>' + rotuloMes(k) + '</option>').join('') + '</select></div>' +
    (comMetas ? '<button class="btn-acao" data-metas type="button">&#9881; Configurar metas</button>' : '') +
    '</div>';
}

/* ==========================================================================
   CONTEXTO MENSAL  -  um unico recorte, montado uma vez por desenho de tela
   ========================================================================== */
function ctxArea() {
  const mes = F.mesKpi || MES_ATUAL;
  const ant = mesMais(mes, -1);
  const emCurso = mes === MES_ATUAL;
  const diasMes = new Date(+mes.slice(0, 4), +mes.slice(5, 7), 0).getDate();
  const dias = emCurso ? Math.min(new Date().getDate(), diasMes) : diasMes;
  const fracao = diasMes ? dias / diasMes : 1;

  const serie = [];
  for (let i = 5; i >= 0; i--) serie.push(mesMais(mes, -i));

  const reg = f => (f && f.reg) || [];
  const noMes = (lista, k) => lista.filter(r => r.mes === k);
  /* Reuniao REALIZADA e a que tem data de atendimento; a agendada conta pela
     data do agendamento. Sao coisas diferentes e o no-show vive na diferenca. */
  const realizadas = (lista, k) => lista.filter(r => r.dAtend && chaveMes(r.dAtend) === k);
  const agendadas  = (lista, k) => lista.filter(r => r.dAgenda && chaveMes(r.dAgenda) === k);

  const todosCli = reg(DADOS.clientes), todosAt = reg(DADOS.atend), todosMd = reg(DADOS.metaDia);

  const c = {
    mes: mes, ant: ant, emCurso: emCurso, dias: dias, diasMes: diasMes, fracao: fracao,
    rotMes: rotuloMes(mes), rotAnt: rotuloMesCurto(ant), serie: serie,
    nomeMes: MESES_ACENTO[+mes.slice(5, 7) - 1],
    cli: noMes(todosCli, mes), cliAnt: noMes(todosCli, ant),
    at: noMes(todosAt, mes),
    reun: realizadas(todosAt, mes), reunAnt: realizadas(todosAt, ant),
    marc: agendadas(todosAt, mes), marcAnt: agendadas(todosAt, ant),
    md: noMes(todosMd, mes), mdAnt: noMes(todosMd, ant),
    todosCli: todosCli, todosAt: todosAt, todosMd: todosMd,
    serieCli: k => noMes(todosCli, k),
    serieMd:  k => noMes(todosMd, k),
    serieReun: k => realizadas(todosAt, k)
  };

  /* KR da planilha de metas: traz meta mensal, meta proporcional e o
     resultado que o time anotou a mao.
     A pontuacao do rotulo varia ("No-Show", "No Show", "Conversao em Reuniao
     [Automatico]"), entao a comparacao ignora pontuacao - senao um hifen na
     planilha faz o indicador aparecer como "sem fonte". */
  const chaveKr = t => chaveBusca(t).replace(/[^a-z0-9]+/g, ' ').trim();
  const achaKr = (m, texto) => {
    if (!m || m.erro || !m.krs) return null;
    const kk = chaveKr(texto);
    return m.krs.find(x => chaveKr(x.kr).indexOf(kk) >= 0) || null;
  };
  c.kr = texto => achaKr(DADOS.metas && DADOS.metas.meses && DADOS.metas.meses[c.nomeMes], texto);
  c.krAnt = texto => {
