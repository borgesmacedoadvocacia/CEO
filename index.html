          if (/conclu|feito/i.test(r.status || '')) return selo('ok', 'concluida');
          return d > 0 ? selo('atencao', d + ' dia(s) em atraso') : d === 0 ? selo('atencao', 'vence hoje') : selo('neutro', 'em ' + (-d) + ' dia(s)'); } },
      { k: 'obs', rot: 'Observação', tipo: 'txt', cls: 'wrap' }
    ], m.okrs, { titulo: 'Plano de ação', limite: 40, ativa: false });
  } else {
    h += '<div class="cartao"><div class="vazio">' +
      (m.okrsErro ? 'Nao consegui ler a aba OKRS: ' + esc(m.okrsErro) : 'Nenhuma acao cadastrada na aba OKRS.') + '</div></div>';
  }

  /* --- Acumulado do ano (planilha antiga) --- */
  h += '<div class="secao-titulo">Acumulado do ano <span style="text-transform:none;letter-spacing:0;font-weight:500">(planilha antiga &mdash; base historica)</span></div>';
  if (DADOS.hist && DADOS.hist.acumulado && DADOS.hist.acumulado.real) {
    const ac = DADOS.hist.acumulado;
    const linhas = ac.etapas.map(e => ({
      etapa: e.rot, real: num(ac.real[e.k]),
      proj: ac.projMes ? num(ac.projMes[e.k]) : null, bruto: ac.real[e.k]
    })).filter(l => l.real || l.proj);
    h += cartao('Funil acumulado do ano', 'Vem da aba <b>Produtos Jurídicos [Acumulado ' + new Date().getFullYear() +
      ']</b> da planilha antiga. Use como referencia de ano, nao como numero do mes.',
      tabelaInterativa('hist-tab', [
        { k: 'etapa', rot: 'Etapa', tipo: 'txt', cls: 'forte' },
        { k: 'proj', rot: 'Projetado no ano', tipo: 'num' },
        { k: 'real', rot: 'Real no ano', tipo: 'num', html: r => '<b style="color:var(--texto)">' + (/R\$|%/.test(String(r.bruto)) ? esc(r.bruto) : n0(r.real)) + '</b>' },
        { k: 'ating', rot: 'Atingimento', tipo: 'num', ord: false,
          html: r => { const t = taxa(r.real, r.proj); return t == null ? '&mdash;' : barraCelula(t, 200, t >= 100 ? 'var(--ok)' : 'var(--atencao)', pct(t, 0)); } }
      ], linhas, { titulo: 'Acumulado 2026', limite: 30, ativa: false }));
  } else {
    h += '<div class="cartao"><div class="vazio">' +
      (ERROS.hist ? 'Planilha antiga nao entrou: ' + esc(ERROS.hist) : 'Sem acumulado disponivel.') + '</div></div>';
  }
  return h;
}

/* ==========================================================================
   TELA 8 - FONTES E SAUDE DO DADO
   ========================================================================== */
function telaFontes() {
  let h = '';

  /* ----- Transporte: e aqui que se confere se a barreira esta de pe ----- */
  h += '<div class="secao-titulo primeiro">Como o painel le os dados</div>';
  if (TRANSPORTE === 'proxy') {
    h += aviso('info', '<b>Leitura pelo proxy Apps Script.</b> A senha e conferida no servidor, ' +
      'as planilhas podem ficar privadas e CPF/CNPJ nem sai do Google. ' +
      'E este o modo em que o login protege o dado, e nao so a descoberta dele.');
  } else if (PROXY_FALHA) {
    h += aviso('critico', '<b>O proxy esta configurado mas nao respondeu:</b> ' + esc(PROXY_FALHA) +
      '<br>O painel voltou a ler as planilhas direto, o que so funciona nas que ainda estao ' +
      'compartilhadas por link. Confira se o endereco termina em <code>/exec</code> e se a ' +
      'implantacao esta como <i>Executar como: Eu</i> e <i>Acesso: Qualquer pessoa</i>.');
  } else {
    h += aviso('atencao', '<b>Leitura direta do navegador (sem proxy).</b> ' +
      'Funciona so com planilha compartilhada como <i>qualquer pessoa com o link</i> &mdash; ' +
      'ou seja, quem tiver o ID de uma delas le os dados <b>sem passar por esta senha</b>. ' +
      'Para fechar as planilhas, publique o proxy (<code>apps-script/LEIA-ME.md</code> no repositorio) ' +
      'e cole o endereco abaixo.');
  }

  h += '<div class="cartao"><div class="cartao-titulo">Endereco do proxy</div>' +
    '<div class="cartao-sub">URL do app da Web do Apps Script, terminando em <code>/exec</code>. ' +
    'Fica guardado neste navegador &mdash; nao e segredo: sem a senha ele nao devolve nada.</div>' +
    '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center">' +
    '<input type="url" id="campoProxy" class="campo-texto" style="flex:1;min-width:260px;max-width:620px" ' +
      'placeholder="https://script.google.com/macros/s/.../exec" value="' + esc(CONFIG.PROXY || '') + '" />' +
    '<button class="btn-acao primario" id="btnUsarProxy" type="button">Usar o proxy</button>' +
    (CONFIG.PROXY ? '<button class="btn-acao" id="btnTirarProxy" type="button">Remover</button>' : '') +
    '</div>' +
    (TOKEN ? '' : '<div class="kpi-nota" style="margin-top:0.6rem;color:#f3c45a">Esta sessao foi restaurada sem a credencial do proxy. ' +
      'Saia e entre de novo para que ela seja derivada.</div>') +
    '</div>';

  h += '<div class="secao-titulo">Saúde das fontes</div>';
  h += aviso('info', 'Nao ha banco de dados: o painel le as planilhas e calcula tudo na hora. ' +
    'Cada fonte cai de pe sozinha &mdash; se uma falha, as outras telas seguem funcionando e a falha aparece aqui.');

  const contar = d => {
    if (!d) return null;
    if (d.reg) return d.reg.length;
    if (d.meses) {
      const n = Object.keys(d.meses).reduce((a, k) => a + ((d.meses[k] && d.meses[k].krs) ? d.meses[k].krs.length : 0), 0);
      return n || null;
    }
    if (d.acumulado && d.acumulado.etapas) return d.acumulado.etapas.length;
    return null;
  };
  const linhas = FONTES.map(f => {
    const d = DADOS[f.k];
    return { nome: f.nome, papel: f.papel, erro: ERROS[f.k] || '', reg: contar(d),
             critica: f.critica, sheet: CONFIG.SHEETS ? CONFIG.SHEETS[f.sheet] : null };
  });
  h += tabelaInterativa('fontes-tab', [
    { k: 'nome', rot: 'Planilha / aba', tipo: 'txt', cls: 'forte wrap' },
    { k: 'papel', rot: 'O que alimenta', tipo: 'txt', cls: 'wrap' },
    { k: 'status', rot: 'Status', tipo: 'txt', ord: false,
      html: r => r.erro ? selo(r.critica ? 'critico' : 'atencao', 'nao entrou') : selo('ok', 'lida') },
    { k: 'reg', rot: 'Registros', tipo: 'num', html: r => r.reg == null ? '&mdash;' : n0(r.reg) },
    { k: 'via', rot: 'Lido via', tipo: 'txt', ord: false,
      html: r => r.erro ? '&mdash;' : (TRANSPORTE === 'proxy' ? selo('ok', 'proxy') : selo('atencao', 'link direto')) },
    { k: 'erro', rot: 'Detalhe', tipo: 'txt', cls: 'wrap' },
    { k: 'abrir', rot: 'Planilha', tipo: 'txt', ord: false,
      html: r => r.sheet ? '<a href="https://docs.google.com/spreadsheets/d/' + esc(r.sheet) +
        '/edit" target="_blank" rel="noopener" style="color:var(--azul-claro)">abrir</a>' : '&mdash;' }
  ], linhas, { titulo: 'Fontes', limite: 20, ativa: false });

  if (AVISOS.length) {
    h += '<div class="secao-titulo">Colunas que o painel não achou</div>';
    AVISOS.forEach(a => { h += aviso(a.nivel, '<b>' + esc(a.fonte) + ':</b> ' + esc(a.txt)); });
  }

  /* Diagnostico do coletor do Kommo, quando a planilha e legivel. */
  if (DADOS.kommo) {
    h += '<div class="secao-titulo">Coletor do Kommo</div>';
    const d = DADOS.kommo;
    h += '<div class="grid g-kpi">';
    h += kpi({ rotulo: 'Linhas na aba', valor: n0(d.linhas) });
    h += kpi({ rotulo: 'Leads com data valida', valor: n0(d.todos.length) });
    h += kpi({ rotulo: 'Formato do cabecalho', valor: d.formato === 'largo' ? '57 colunas' : '17 colunas', pequeno: true });
    h += kpi({ rotulo: 'Linhas no formato antigo', valor: n0(d.legadas), pequeno: true,
      selo: d.legadas ? selo('atencao', 'reescrita incompleta') : selo('ok', 'consistente') });
    h += '</div>';
  }

  h += '<div class="secao-titulo">Nota de seguranca</div>';
  if (TRANSPORTE === 'proxy') {
    h += aviso('info', '<b>A senha e conferida no servidor.</b> O navegador deriva ' +
      'PBKDF2-SHA256 (310 mil iteracoes) do login e da senha e envia so o resultado &mdash; a senha nunca trafega ' +
      'e nunca e guardada. O proxy compara com um hash que nao volta a ser senha, conta tentativa errada e ' +
      'bloqueia por janela de tempo. As planilhas podem ficar <b>privadas</b>: quem nao tem a senha nao tem o dado. ' +
      'CPF/CNPJ e recortado no servidor e nem sai do Google.' +
      '<br><br>Confira na tabela acima se <b>todas</b> as fontes estao lidas via <i>proxy</i>. ' +
      'Se alguma ainda aparece como <i>link direto</i>, aquela planilha continua legivel por quem tiver o ID.');
  } else {
    h += aviso('atencao', '<b>Neste modo o painel protege a descoberta, nao os dados.</b> ' +
      'O login cifra os IDs das planilhas (AES-256-GCM, PBKDF2-SHA256 com 310 mil iteracoes): sem a senha, a pagina nao sabe o que ler. ' +
      'Mas as planilhas estao compartilhadas como <i>qualquer pessoa com o link</i> e os IDs de algumas ja aparecem ' +
      'em texto puro nos outros paineis publicos &mdash; quem os tiver le os dados direto no Google, sem senha. ' +
      'CPF/CNPJ dos clientes nao e lido por este painel. ' +
      '<b>Publique o proxy para fechar isso.</b>');
  }
  return h;
}

/* Rotulo do periodo em uso, para os titulos das telas. */
function rotuloPeriodo() {
  const p = PERIODOS.find(x => x.k === F.periodo);
  const f = faixa();
  if (F.periodo === 'tudo') return 'todo o historico';
  if (F.periodo === 'mes' || F.periodo === 'ant') return rotuloMes(chaveMes(f.de)).replace('&mdash;', '');
  return (p ? p.rot.toLowerCase() : '') + ' (' + rotuloMesCurto(chaveMes(f.de)) + ' a ' + rotuloMesCurto(chaveMes(f.ate)) + ')';
}
/* ==========================================================================
   INDICADORES POR AREA  -  trafego, marketing e comercial
   --------------------------------------------------------------------------
   Duas densidades em cada area, e a hierarquia e o ponto:

     PRINCIPAIS   - o que decide a semana. Cartao inteiro, numero grande,
                    meta, comparacao com o mes anterior e historico de 6 meses.
     ESPECIALISTA - o diagnostico. Ficha compacta, agrupada por assunto,
                    consultada quando um principal acende.

   Tres regras valem em todas as telas daqui:

   1. Indicador sem fonte NAO e zero. Ele aparece com borda tracejada,
      travessao no lugar do numero e, no pe, exatamente o que falta para ele
      existir. Inventar um numero seria pior que a lacuna: o gestor decidiria
      sobre ele sem saber.
   2. Toda conta carrega o escopo escrito. "Custo por lead elegivel" divide o
      investimento do Meta por um total do CRM que tambem conta organico -
      isso subestima o custo, e o pe do cartao diz isso.
   3. Comparar realizado com meta CHEIA no dia 10 do mes so produz panico. Em
      indicador que acumula, a referencia e a meta PROPORCIONAL ao dia.
   ========================================================================== */

/* ===== NATUREZA DA ORIGEM =====
   O time nomeia campanha do Meta entre colchetes ("[ENG] [FORM] Rev. Plano
   de Saude"), e e esse rotulo que chega na coluna ORIGEM da planilha de
   clientes. O resto e nominal: Organico, Indicacao, Recompra, Site. Daqui sai
   o unico recorte pago x nao pago que existe em nivel de REGISTRO - e por
   isso que clientes e faturamento tem o corte por origem e os leads nao. */
function naturezaOrigem(o) {
  const t = String(o == null ? '' : o).trim();
  const k = chaveBusca(t);
  if (!k) return 'indefinido';
  if (t.charAt(0) === '[' || /remarketing/.test(k)) return 'ads';
  if (/indicacao/.test(k)) return 'indicacao';
  if (/recompra|cliente bm/.test(k)) return 'base';
  if (/organico|site|calculadora|reuniao fechada/.test(k)) return 'organico';
  return 'outras';
}
const ROT_NAT = { ads: 'Meta Ads', organico: 'Orgânico', indicacao: 'Indicação',
                  base: 'Base / recompra', outras: 'Outras origens', indefinido: 'Sem origem' };
const COR_NAT = { ads: 'var(--s1)', organico: 'var(--s3)', indicacao: 'var(--s7)',
                  base: 'var(--s4)', outras: 'var(--texto-muted)', indefinido: 'var(--texto-muted)' };
const NATS = ['ads', 'organico', 'indicacao', 'base', 'outras'];

/* ===== O QUE O KOMMO SABE SOBRE O LEAD DE CAMPANHA =====
   No modulo do Meta Ads, TODO denominador tem de ser de lead atribuido a
   campanha. O total de elegiveis da planilha de Metas e atribuicao do
   COMERCIAL - conta organico, indicacao e recompra junto - e nao responde
   nada sobre o anuncio.

   O Kommo guarda a etapa ATUAL do lead, nao a data em que ele entrou em
   cada uma. Entao "passou da elegibilidade" se le pela etapa de hoje, e o
   lead se situa no tempo pela data de criacao. As duas regras ficam aqui, e
   nao dentro da tela, para a tabela de campanhas e os indicadores da area
   nunca discordarem sobre o mesmo lead. */
const ETAPA_ELEGIVEL    = /qualificac|documenta|agendar reuniao|advbox|inviavel|pesquisa de satisfacao|diagnostic/;
const ETAPA_QUALIFICADO = /documenta|agendar reuniao|advbox|inviavel|pesquisa de satisfacao|diagnostic/;
/* Conversa iniciada, na definicao da casa: o lead avancou para elegivel OU
   para inelegivel. Quem travou na primeira mensagem nao chega a ser avaliado
   e fica de fora. Nao da para usar o campo de triagem do Kommo: o coletor o
   preenche em 673 de 674 leads, entao ele nao separa ninguem. */
const ETAPA_CONVERSA = /qualificac|documenta|agendar reuniao|advbox|inviavel|pesquisa de satisfacao|diagnostic|inelegivel/;
const houveConversa = r => ETAPA_CONVERSA.test(chaveBusca(r.etapa));
/* "-" aparece como campanha em centenas de leads: e ausencia de atribuicao,
   nao uma campanha chamada traco. */
const temCampanha   = r => !!r.campanha && r.campanha.trim() !== '' && r.campanha.trim() !== '-';
/* ===== DOIS MUNDOS DENTRO DO MESMO CRM =====
   O Kommo tem tres funis no mes: "[API] CRM Comercial" e "[API] Follow Up",
   que sao a esteira comercial, e "Instagram", que e interacao social -
   direct, comentario, pedido de telefone. O funil do Instagram NAO tem
   campanha por natureza, e nem deveria ter: ninguem comenta um post por
   causa de um anuncio pago.

   Misturar os dois fazia a cobertura de atribuicao dizer 45% quando a
   atribuicao comercial de fato esta em 86%. E, do outro lado, escondia que
   o painel ja tem a materia-prima do social seller que a tela de Marketing
   declarava como sem fonte. */
const ehFunilSocial = r => /instagram/i.test(r.funil || '');
/* Etapas do funil social, na ordem em que a conversa avanca. */
const IG_PEDIU_CONTATO = /telefone solicitado|ja esta no wpp/;
const IG_FOI_PARA_WPP  = /ja esta no wpp/;
const ehElegivel    = r => ETAPA_ELEGIVEL.test(chaveBusca(r.etapa));
const ehQualificado = r => ETAPA_QUALIFICADO.test(chaveBusca(r.etapa));

/* ===== DEGRAU DA ESTEIRA EM QUE O FECHAMENTO ACONTECEU =====
   A esteira tem 9 follow ups com significado proprio: 1 = oferta de 24h,
   7 = D21 Buckner, 8 = D28 honorarios em liminar, 9 = D45 apenas exito. O FUP
   mais alto marcado "Feito" e, literalmente, o degrau alcancado.
   Quando "Tipo de Contrato (Honorarios)" esta preenchido ele manda: diz a
   OFERTA que fechou, nao so quando o toque aconteceu. */
const ETAPA_FECHA = [
  { k: '24h',     rot: 'Oferta de 24h',               cor: 'var(--s3)' },
  { k: 'normal',  rot: 'Negociação normal (D3–D14)',  cor: 'var(--s1)' },
  { k: 'buckner', rot: 'D21 · Buckner',               cor: 'var(--s4)' },
  { k: 'liminar', rot: 'D28 · honorários em liminar', cor: 'var(--s7)' },
  { k: 'exito',   rot: 'D45 · apenas êxito',          cor: 'var(--s5)' }
];
function etapaFechamento(r) {
  const th = chaveBusca(r.tipoHon);
  if (/liminar/.test(th)) return 'liminar';
  if (/exito/.test(th) && !/inicial/.test(th)) return 'exito';
  const n = r.etapaFup || 0;
  if (n >= 9) return 'exito';
  if (n === 8) return 'liminar';
  if (n === 7) return 'buckner';
  if (n <= 1) return '24h';
  return 'normal';
}

/* ===================== RENDERIZACAO DE INDICADOR ===================== */
const FMT_K = {
  num:    n0,
  moeda:  brl0,
  moeda2: brl,
  pct:    v => pct(v, v != null && Math.abs(v) < 10 ? 2 : 1),
  mult:   v => n1(v) + 'x',
  dias:   v => n1(v) + ' d'
};
const fmtK = k => FMT_K[k.tipo] || n0;
const CORNV = { ok: 'var(--ok)', atencao: 'var(--atencao)', grave: 'var(--grave)',
                critico: 'var(--critico)', neutro: 'transparent' };
/* Sobre fundo escuro o token puro de status nao tem contraste para texto.
   Estes sao os mesmos tons que o selo usa. */
const CORTX = { ok: '#5fd35f', atencao: '#f3c45a', grave: '#f0a681',
                critico: '#e98a8a', neutro: 'var(--texto-2)' };

/* Meta de referencia do indicador. metaProp vem da propria planilha quando
   ela ja calcula; senao, rateia pela fracao do mes ja corrida. */
function metaRefK(k) {
  /* Meta zero nao e meta: e celula em branco que o num() converteu. Tratar
     como alvo faria todo indicador nascer em 0% da meta. */
  if (k.meta == null || !isFinite(k.meta) || k.meta === 0) return null;
  if (k.metaProp != null && isFinite(k.metaProp) && k.emCurso) return k.metaProp;
  return k.acumula && k.emCurso ? k.meta * (k.fracao == null ? 1 : k.fracao) : k.meta;
}
/* Atingimento. Em indicador INVERSO (custo, CAC, no-show) menos e melhor,
   entao a fracao vira meta/realizado. */
function atingK(k) {
  const m = metaRefK(k);
  if (k.valor == null || !isFinite(k.valor) || m == null || m === 0) return null;
  return k.inverso ? (k.valor > 0 ? taxa(m, k.valor) : null) : taxa(k.valor, m);
}
function nivelK(k) { const a = atingK(k); return a == null ? 'neutro' : nivelMeta(a); }
/* Variacao contra o mes anterior, em percentual do valor anterior. */
function varK(k) {
  if (k.valor == null || k.ant == null || !isFinite(k.ant) || k.ant === 0) return null;
  return ((k.valor - k.ant) / Math.abs(k.ant)) * 100;
}
const alertaK = k => ['grave', 'critico'].indexOf(nivelK(k)) >= 0;

function rotuloK(k, cls) {
  return '<div class="' + cls + '">' + esc(k.rot) +
    (k.dica ? '<span data-tip="' + esc(k.dica) + '" style="cursor:help;opacity:.55;margin-left:auto">&#9432;</span>' : '') +
    '</div>';
}

/* Projecao do mes a partir do resultado parcial.
   Em indicador que ACUMULA (leads, clientes, faturamento), projetar e dividir
   o realizado pela fracao do mes ja corrida. Em TAXA, ticket ou custo nao se
   projeta assim: numerador e denominador crescem juntos, e a razao de hoje ja
   e a melhor estimativa do mes - entao a projecao e o proprio valor. */
function projecaoK(k) {
  if (k.valor == null || !isFinite(k.valor)) return null;
  if (!k.emCurso) return k.valor;
  return (k.acumula && k.fracao) ? k.valor / k.fracao : k.valor;
}

/* Uma linha do quadro comparativo. */
function qLinha(rot, val, cls, dica) {
  return '<div class="q-linha' + (cls ? ' ' + cls : '') + '">' +
    '<span class="q-rot">' + rot +
    (dica ? '<span data-tip="' + esc(dica) + '" style="cursor:help;opacity:.55">&#9432;</span>' : '') +
    '</span><span class="q-val">' + val + '</span></div>';
}
const qInd = (nv, txt) => '<span class="q-ind" style="color:' + CORTX[nv] + '">' +
  (nv === 'ok' ? ICO.ok : nv === 'neutro' ? '' : ICO.alerta) + txt + '</span>';

/* O quadro das quatro leituras. Sem meta nao existe quadro: sobraria uma
   tabela de uma linha repetindo o numero grande logo acima. */
function quadroK(k) {
  if (k.meta == null || !isFinite(k.meta) || k.meta === 0) return '';
  const f = fmtK(k);
  const mProp = metaRefK(k);
  const a = atingK(k);
  const nv = nivelK(k);
  const proj = projecaoK(k);
  const prop = k.emCurso && k.acumula;
  /* Projecao contra a meta CHEIA do mes - e a pergunta "o mes fecha na meta?". */
  const aProj = (proj == null || !k.meta) ? null
    : (k.inverso ? (proj > 0 ? taxa(k.meta, proj) : null) : taxa(proj, k.meta));

  let h = '<div class="quadro">';
  h += qLinha('Realizado × ' + (prop ? 'meta proporcional' : 'meta mensal'),
    a == null ? '&mdash;' : qInd(nv, pct(a, 0)), 'forte',
    k.inverso ? 'Indicador invertido: a meta é um teto. Acima de 100% significa que o realizado está DENTRO do limite.'
              : null);
  if (prop) h += qLinha('Meta proporcional (' + n0(k.dias) + 'd)', f(mProp), null,
    'O quanto deveria estar entregue a esta altura do mês: ' + n0(k.dias) + ' de ' + n0(k.diasMes) + ' dias do mês.');
  h += qLinha((k.inverso ? 'Limite' : 'Meta') + ' mensal', f(k.meta));
  /* Quanto falta e em que ritmo diario. "vs meta" diz se esta atrasado;
     isto diz o que fazer amanha. Vinha do painel de KPIs do comercial e nao
     tem equivalente em nenhuma outra linha do quadro. */
  if (prop && k.valor != null && !k.inverso) {
    if (k.meta > k.valor) {
      const faltam = k.meta - k.valor;
      const diasRest = Math.max(1, k.diasMes - k.dias);
      h += qLinha('Falta', f(faltam) + ' <span class="q-sec">(' + f(faltam / diasRest) + '/dia)</span>', null,
        'Quanto falta para a meta cheia e quanto por dia nos ' + n0(diasRest) + ' dias que restam.');
    } else {
      h += qLinha('Falta', '<span class="q-ind" style="color:' + CORTX.ok + '">meta do mês batida</span>');
    }
  }
  if (k.emCurso) {
    h += qLinha('Projeção (mês)',
      (proj == null ? '&mdash;' : f(proj)) +
      (aProj == null ? '' : ' <span class="q-sec">(' + pct(aProj, 0) + ')</span>'), null,
      k.acumula ? 'Onde o mês termina se o ritmo de hoje continuar. O percentual é contra a meta cheia.'
                : 'Taxa e custo não acumulam: numerador e denominador crescem juntos, então a razão de hoje já é a estimativa do mês.');
  }
  h += '</div>';

  /* Barra de ritmo: a mesma leitura da primeira linha, em forma. O risco
     marca onde o ritmo esperado esta hoje. */
  if (prop && k.valor != null) {
    const pFill = Math.min(100, Math.max(0, k.inverso
      ? (k.valor > 0 ? (k.meta / k.valor) * 100 : 0)
      : (taxa(k.valor, k.meta) || 0)));
    h += '<div class="ritmo"><div class="ritmo-trilha">' +
      '<div class="ritmo-fill" style="width:' + pFill.toFixed(1) + '%;background:' +
      (CORNV[nv] === 'transparent' ? 'var(--s1)' : CORNV[nv]) + '"></div>' +
      '<div class="ritmo-alvo" style="left:' + (k.fracao * 100).toFixed(1) + '%" data-tip="' +
      esc('Ritmo esperado para hoje: ' + pct(k.fracao * 100, 0) + ' da meta do mês') + '"></div>' +
      '</div></div>';
  }
  return h;
}

/* Cartao do indicador principal: numero grande, comparacao e o quadro. */
function destaque(k) {
  if (k.falta) {
    return '<div class="destaque sem">' + rotuloK(k, 'destaque-rot') +
      '<div class="destaque-val sm">&mdash;</div>' +
      '<div class="destaque-linha"><span class="marca-sem">sem fonte</span></div>' +
      '<div class="destaque-pe">' + k.falta + '</div></div>';
  }
  const f = fmtK(k), nv = nivelK(k), a = atingK(k), v = varK(k);
  let h = '<div class="destaque" style="--fio:' + CORNV[nv] + '">' + rotuloK(k, 'destaque-rot');
  h += '<div class="destaque-val' + (k.largo === false ? ' sm' : '') + '">' +
       (k.valor == null ? '&mdash;' : f(k.valor)) + '</div>';
  const linha = [];
  /* Sem meta nao ha quadro, e entao o selo e o unico lugar onde o status
     cabe. Com meta, o quadro logo abaixo ja diz realizado x meta com cor e
     percentual - repetir aqui seria o mesmo numero sob dois rotulos. */
  if (a != null && k.meta == null) linha.push(selo(nv, pct(a, 0) + ' da meta'));
  if (v != null) linha.push(delta(v, { inverso: !!k.inverso, sufixo: 'vs ' + k.rotAnt }));
  if (linha.length) h += '<div class="destaque-linha">' + linha.join('') + '</div>';
  h += quadroK(k);
  if (k.nota) h += '<div class="destaque-pe">' + k.nota + '</div>';
  if (k.serie && k.serie.filter(x => x != null && x !== 0).length > 2)
    h += '<div class="kpi-spark">' + spark(k.serie, 'var(--s1)') + '</div>';
  return h + '</div>';
}

/* Ficha compacta do indicador de especialista. */
function ficha(k) {
  if (k.falta) {
    return '<div class="ficha sem">' + rotuloK(k, 'ficha-rot') +
      '<div class="ficha-val">&mdash;</div>' +
      '<div class="ficha-pe"><span class="marca-sem">sem fonte</span> ' + k.falta + '</div></div>';
  }
  const f = fmtK(k), nv = nivelK(k), a = atingK(k), v = varK(k);
  let h = '<div class="ficha">' + rotuloK(k, 'ficha-rot');
  h += '<div class="ficha-val">' + (k.valor == null ? '&mdash;' : f(k.valor)) + '</div>';
  if (a != null) h += '<div style="margin-top:.25rem">' +
    selo(nv, k.inverso ? 'limite ' + f(metaRefK(k)) : pct(a, 0) + ' da meta') + '</div>';
  else if (v != null) h += delta(v, { inverso: !!k.inverso });
  if (k.nota) h += '<div class="ficha-pe">' + k.nota + '</div>';
  return h + '</div>';
}

const gradeDestaque = lista => '<div class="grid g-destaque">' + lista.map(destaque).join('') + '</div>';

/* Linha densa com os mesmos dados do cartao: realizado, meta, atingimento e
   variação. E a forma de mostrar dez indicadores sem transformar a tela
   numa parede de cartoes iguais. */
function metLinha(k) {
  const f = fmtK(k);
  if (k.falta) {
    return '<div class="met-linha"><div class="met-rot"><b>' + esc(k.rot) + '</b>' +
      '<i>' + k.falta.replace(/<[^>]+>/g, '') + '</i></div>' +
      '<div class="met-val" style="color:var(--texto-muted)">&mdash;</div>' +
      '<div class="met-barra"><span class="marca-sem">sem fonte</span></div><div class="met-fim"></div></div>';
  }
  const nv = nivelK(k), a = atingK(k), v = varK(k);
  const cor = CORNV[nv] === 'transparent' ? 'var(--s1)' : CORNV[nv];
  let h = '<div class="met-linha">';
  h += '<div class="met-rot"><b>' + esc(k.rot) + '</b>' +
       (k.nota ? '<i>' + k.nota + '</i>' : (k.inverso ? '<i>menos \u00e9 melhor</i>' : '')) + '</div>';
  h += '<div class="met-val">' + (k.valor == null ? '&mdash;' : f(k.valor)) + '</div>';
  h += '<div class="met-barra">';
  if (a != null) {
    h += '<div class="met-trilha"><div class="met-fill" style="width:' +
      Math.min(100, Math.max(2, a)).toFixed(0) + '%;background:' + cor + '"></div></div>' +
      '<span class="met-pct" style="color:' + CORTX[nv] + '">' + pct(a, 0) + '</span>';
  }
  h += '</div>';
  h += '<div class="met-fim">' +
    (k.meta != null && k.meta !== 0 ? (k.inverso ? 'limite ' : 'meta ') + f(metaRefK(k)) + '<br>' : '') +
    (v != null ? delta(v, { inverso: !!k.inverso, sufixo: 'vs ' + k.rotAnt }) : '') + '</div>';
  return h + '</div>';
}
const listaMetricas = lista => !lista.length ? '' :
  '<div class="lista-met">' + lista.map(metLinha).join('') + '</div>';

/* Os que decidem a semana vao em cartao; o resto, na lista. A divisao e por
   marca no proprio indicador, para a tela nao precisar saber a regra. */
const heroi = l => l.filter(k => k.hero);
const resto = l => l.filter(k => !k.hero);
function blocoPrincipais(lista) {
  const hs = heroi(lista);
  if (!hs.length) return gradeDestaque(lista);
  return gradeDestaque(hs) + (resto(lista).length
    ? '<div style="height:0.85rem"></div>' + listaMetricas(resto(lista)) : '');
}
const gradeFicha    = lista => '<div class="grid g-ficha">' + lista.map(ficha).join('') + '</div>';

/* Bloco de especialista: titulo, uma linha de contexto e a grade de fichas. */
function blocoEsp(titulo, sub, lista) {
  if (!lista || !lista.length) return '';
  const sem = lista.filter(k => k.falta).length;
  let h = '<div class="secao-titulo">' + esc(titulo) +
    (sem ? '<span class="marca-sem">' + sem + ' sem fonte</span>' : '') + '</div>';
  if (sub) h += '<div style="font-size:0.73rem;color:var(--texto-muted);line-height:1.5;margin:-0.35rem 0 0.7rem;max-width:74ch">' + sub + '</div>';
  return h + gradeFicha(lista);
}

/* Faixa de resumo da area - a leitura de uma linha so. */
function resumoArea(lista) {
  const com = lista.filter(k => !k.falta && k.valor != null);
  const comMeta = com.filter(k => atingK(k) != null);
  const verdes = comMeta.filter(k => nivelK(k) === 'ok').length;
  const vermelhos = comMeta.filter(k => alertaK(k)).length;
  const sem = lista.filter(k => k.falta).length;
  return '<div class="resumo-area">' +
    '<div class="resumo-item"><b>' + n0(com.length) + '</b> indicadores medidos</div>' +
    '<div class="resumo-item"><b>' + n0(verdes) + '/' + n0(comMeta.length) + '</b> no verde</div>' +
    '<div class="resumo-item"><b style="color:' + (vermelhos ? '#e98a8a' : 'var(--texto)') + '">' + n0(vermelhos) +
      '</b> pedindo diagnóstico</div>' +
    (sem ? '<div class="resumo-item"><b>' + n0(sem) + '</b> sem fonte</div>' : '') +
    '</div>';
}

/* Comparativo entre indicadores: a unica escala em que KPIs de unidades
   diferentes podem dividir o mesmo grafico e o ATINGIMENTO em percentual.
   A linha tracejada marca 100%. */
function vizAtingimento(lista, opc) {
  const o = opc || {};
  const d = lista.filter(k => !k.falta && atingK(k) != null)
    .map(k => ({ k: k.rot, v: atingK(k), nivel: nivelK(k), kk: k }))
    .sort((a, b) => a.v - b.v);
  if (!d.length) return '<div class="vazio">Nenhum indicador com meta definida neste recorte.</div>';
  return vizBarras({
    rotuloW: o.rotuloW || 230, fmt: v => pct(v, 0), nome: 'Atingimento', ref: 100,
    dados: d.map(x => ({
      k: x.k, v: x.v, cor: CORNV[x.nivel] === 'transparent' ? 'var(--s1)' : CORNV[x.nivel],
      extra: [{ rot: 'Realizado', val: fmtK(x.kk)(x.kk.valor) },
              { rot: 'Meta de referência', val: fmtK(x.kk)(metaRefK(x.kk)) }]
    }))
  });
}

/* Tabela de indicadores, no mesmo padrao da tabela de campanhas: glossario
   antes, colunas que dizem a conta, ordenacao por qualquer uma. E a mesma
   leitura do cartao - realizado, meta ate hoje, meta cheia, projecao -, so
   que com a area inteira de uma vez, para comparar e ordenar. */
function tabelaKpi(id, lista, titulo, area) {
  const linhas = lista.map(k => ({
    rot: k.rot, grupo: k.grupo || '', kk: k,
    valorTxt: k.falta ? null : (k.valor == null ? null : fmtK(k)(k.valor)),
    valorOrd: k.falta || k.valor == null ? null : k.valor,
    propOrd: k.falta ? null : metaRefK(k),
    metaOrd: k.meta == null || k.meta === 0 ? null : k.meta,
    projOrd: k.falta ? null : projecaoK(k),
    ating: k.falta ? null : atingK(k),
    fonte: k.falta ? 'sem fonte' : (k.fonte || '')
  }));
  const emCurso = lista.length && lista[0].emCurso;
  const cel = (r, v) => v == null ? '&mdash;' : fmtK(r.kk)(v);

  let h = tabelaExplicada(titulo,
    '<b>Realizado</b> = o que j\u00e1 entrou no m\u00eas &middot; ' +
    '<b>Meta at\u00e9 hoje</b> = a meta mensal rateada pelos dias j\u00e1 corridos, nos indicadores que acumulam ' +
    '(em taxa, ticket e custo nada se rateia: a meta cheia vale o m\u00eas todo) &middot; ' +
    '<b>Meta mensal</b> = a meta cheia; em indicador invertido (CAC, custo, no-show) ela \u00e9 um <b>teto</b> &middot; ' +
    '<b>Proje\u00e7\u00e3o</b> = onde o m\u00eas termina se o ritmo de hoje continuar &middot; ' +
    '<b>Atingimento</b> = realizado \u00f7 meta at\u00e9 hoje; no indicador invertido a conta se inverte, ' +
    'e acima de 100% quer dizer <b>dentro do limite</b> &middot; ' +
    '<b>De onde vem</b> = a planilha, a coluna ou a conta que produz o n\u00famero.',
    DICA_ORDENAR + '<br>Linha com <b>sem fonte</b> n\u00e3o \u00e9 zero: \u00e9 indicador que nenhuma planilha ' +
    'alimenta hoje. O cart\u00e3o dele, acima, diz o que falta para ele existir.');

  h += tabelaInterativa(id, [
    { k: 'rot', rot: 'Indicador', tipo: 'txt', cls: 'forte wrap',
      html: r => esc(r.rot) + (r.kk.inverso ? '<span class="cel-sub">menos \u00e9 melhor</span>' : '') },
    { k: 'grupo', rot: 'Bloco', tipo: 'txt' },
    { k: 'valorOrd', rot: 'Realizado', tipo: 'num', cls: 'forte',
      html: r => r.valorTxt == null
        ? '<span class="marca-sem">sem fonte</span>'
        : '<b style="color:var(--texto)">' + r.valorTxt + '</b>' },
    { k: 'propOrd', rot: emCurso ? 'Meta at\u00e9 hoje' : 'Meta do m\u00eas', tipo: 'num',
      html: r => r.propOrd == null ? '<span style="color:var(--texto-muted)">sem meta</span>' : cel(r, r.propOrd) },
    { k: 'metaOrd', rot: 'Meta mensal', tipo: 'num',
      html: r => r.metaOrd == null ? '&mdash;'
        : cel(r, r.metaOrd) + (r.kk.inverso ? ' <span style="color:var(--texto-muted)">(teto)</span>' : '') },
    { k: 'projOrd', rot: 'Proje\u00e7\u00e3o', tipo: 'num', html: r => cel(r, r.projOrd) },
    { k: 'ating', rot: 'Atingimento', tipo: 'num',
      html: r => r.ating == null ? '&mdash;' : selo(nivelMeta(r.ating), pct(r.ating, 0)) },
    { k: 'fonte', rot: 'De onde vem', tipo: 'txt', cls: 'wrap' }
  ], linhas, { titulo: titulo, limite: 80, ativa: false });
  return h;
}

/* Quando ha filtro de dimensao ligado, a tela diz o que responde e o que
   nao responde - senao o numero da planilha parece teimoso. */
function avisoFiltro(c) {
  if (!c.filtrando) return '';
  const partes = [];
  if (F.produtos.size) partes.push('produto');
  if (F.closers.size) partes.push('closer');
  if (F.sdrs.size) partes.push('SDR');
  if (F.origens.size) partes.push('origem');
  if (F.busca) partes.push('busca "' + esc(F.busca) + '"');
  return aviso('info', '<b>Filtro ativo:</b> ' + partes.join(', ') + '. ' +
    'Clientes, faturamento, reuni\u00f5es e tudo que sai de registro j\u00e1 est\u00e3o recortados. ' +
    'Os indicadores que vêm dos <b>KRs da planilha de Metas</b> (leads, eleg\u00edveis, qualificados, ' +
    'diagn\u00f3sticos, liga\u00e7\u00f5es, no-show) s\u00e3o totais do m\u00eas e n\u00e3o sabem filtrar por pessoa ou produto &mdash; ' +
    'eles seguem cheios.');
}

/* Barra da tela: o mes do recorte e os controles dele, numa linha so.
   O estado do mes e um unico (F.mesKpi) em todas as telas de indicador -
   dois "mes atual" diferentes na mesma cabeca nao dao certo. */
function barraTela(c, comMetas) {
  const atual = F.mesKpi || MES_ATUAL;
  const ms = [];
  for (let i = 0; i < 12; i++) ms.push(mesMais(MES_ATUAL, -i));
  return '<div class="barra-tela">' +
    '<span class="rot"><b>' + esc(c.rotMes) + '</b>' +
      (c.emCurso ? ' &middot; mês em andamento &middot; dia ' + n0(c.dias) + ' de ' + n0(c.diasMes)
                 : ' &middot; mês fechado') + '</span>' +
    '<span class="dir">' +
      '<select data-selmes aria-label="Mês do painel">' +
      ms.filter(k => k >= '2026-01').map(k => '<option value="' + k + '"' + (k === atual ? ' selected' : '') +
        '>' + rotuloMes(k) + '</option>').join('') + '</select>' +
      (comMetas ? '<button class="btn-acao" data-metas type="button">&#9881; Configurar metas</button>' : '') +
    '</span></div>';
}

/* ==========================================================================
   CONTEXTO MENSAL  -  um unico recorte, montado uma vez por mes
   --------------------------------------------------------------------------
   O Painel semanal monta as tres areas de uma vez e a tela de Trafego monta
   a dela de novo: sem memoria, o painel varreria 11 mil leads e 300 mil
   linhas de insight varias vezes por clique. O recorte so depende do MES e
   da leitura das planilhas - nao dos filtros da barra -, entao a chave e
   essa. GERACAO sobe quando as planilhas sao relidas ou as metas mudam.
   ========================================================================== */
let GERACAO = 0;
const MEMO = { chave: '', dados: {} };
function memoAreas() {
  /* O filtro entra na chave: sem isso, trocar de closer nao recalcularia
     nada - a memoria devolveria o recorte anterior. */
  const chave = (F.mesKpi || MES_ATUAL) + '|' + GERACAO + '|' + F.busca + '|' +
    [F.produtos, F.closers, F.sdrs, F.origens].map(x => [...x].sort().join(',')).join(';');
  if (MEMO.chave !== chave) { MEMO.chave = chave; MEMO.dados = {}; }
  return MEMO.dados;
}
function ctxAreaMemo() {
  const m = memoAreas();
  if (!m.ctx) m.ctx = ctxArea();
  return m.ctx;
}
/* Indicadores de uma area, calculados no maximo uma vez por mes. */
function kpisArea(nome) {
  const m = memoAreas();
  if (!m[nome]) {
    const c = ctxAreaMemo();
    m[nome] = nome === 'trafego' ? kpisTrafego(c)
            : nome === 'marketing' ? kpisMarketing(c) : kpisComercial(c);
  }
  return m[nome];
}

function ctxArea() {
  const mes = F.mesKpi || MES_ATUAL;
  const ant = mesMais(mes, -1);
  const emCurso = mes === MES_ATUAL;
  const diasMes = new Date(+mes.slice(0, 4), +mes.slice(5, 7), 0).getDate();
  const dias = emCurso ? Math.min(new Date().getDate(), diasMes) : diasMes;
  const fracao = diasMes ? dias / diasMes : 1;

  const serie = [];
  for (let i = 5; i >= 0; i--) serie.push(mesMais(mes, -i));

  const reg = f => (f && f.reg) || [];

  /* ===== OS FILTROS DA BARRA VALEM AQUI TAMBEM =====
     Antes nao valiam: escolher um closer nao mexia nada na tela de
     indicadores, e o filtro parecia quebrado. Cada fonte recebe so os
     filtros que fazem sentido nela - um insight do Meta nao tem closer nem
     SDR, entao filtrar por pessoa nao pode zerar o investimento. */
  const passaCli = r => passaSet(F.produtos, r.produto) && passaSet(F.sdrs, r.sdr) &&
    passaSet(F.closers, r.closer) && passaSet(F.origens, r.origem) &&
    passaBusca([r.contato, r.cliente, r.produto, r.closer, r.sdr, r.origem, r.tipoPag]);
  const passaAt = r => passaSet(F.produtos, r.produto) && passaSet(F.sdrs, r.sdr) &&
    passaSet(F.closers, r.closer) &&
    passaBusca([r.lead, r.id, r.etapa, r.closer, r.sdr, r.produto, r.telefone, r.resultado]);
  const passaMd = r => passaBusca([r.campanha]);

  const noMes = (lista, k) => lista.filter(r => r.mes === k && passaCli(r));
  const mdMes = (lista, k) => lista.filter(r => r.mes === k && passaMd(r));
  /* Reuniao REALIZADA e a que tem data de atendimento; a agendada conta pela
     data do agendamento. Sao coisas diferentes e o no-show vive na diferenca. */
  const realizadas = (lista, k) => lista.filter(r => r.dAtend && chaveMes(r.dAtend) === k && passaAt(r));
  const agendadas  = (lista, k) => lista.filter(r => r.dAgenda && chaveMes(r.dAgenda) === k && passaAt(r));

  const todosCli = reg(DADOS.clientes), todosAt = reg(DADOS.atend), todosMd = reg(DADOS.metaDia);
  const todosKo = reg(DADOS.kommo);
  const passaKo = r => passaSet(F.produtos, r.produto) && passaSet(F.origens, r.origem) &&
    passaBusca([r.lead, r.id, r.etapa, r.funil, r.campanha, r.produto]);
  /* Leads do CRM vindos de campanha, no mes: a base de tudo que o modulo do
     Meta Ads mede depois do clique. */
  const koAds = k => todosKo.filter(r => r.mes === k && temCampanha(r) && passaKo(r));
  const koCom = k => todosKo.filter(r => r.mes === k && !ehFunilSocial(r) && passaKo(r));
  const koSoc = k => todosKo.filter(r => r.mes === k && ehFunilSocial(r) && passaKo(r));
  const koComAnt_ = k => koCom(k);

  const c = {
    mes: mes, ant: ant, emCurso: emCurso, dias: dias, diasMes: diasMes, fracao: fracao,
    rotMes: rotuloMes(mes), rotAnt: rotuloMesCurto(ant), serie: serie,
    nomeMes: MESES_ACENTO[+mes.slice(5, 7) - 1],
    cli: noMes(todosCli, mes), cliAnt: noMes(todosCli, ant),
    at: todosAt.filter(r => r.mes === mes && passaAt(r)),
    reun: realizadas(todosAt, mes), reunAnt: realizadas(todosAt, ant),
    marc: agendadas(todosAt, mes), marcAnt: agendadas(todosAt, ant),
    md: mdMes(todosMd, mes), mdAnt: mdMes(todosMd, ant),
    koAds: koAds(mes), koAdsAnt: koAds(ant),
    koCom: koCom(mes), koComAnt: koComAnt_(ant),
    koSoc: koSoc(mes), koSocAnt: koSoc(ant),
    koMes: todosKo.filter(r => r.mes === mes && passaKo(r)),
    temKommo: !ERROS.kommo && todosKo.length > 0,
    todosCli: todosCli, todosAt: todosAt, todosMd: todosMd,
    serieCli: k => noMes(todosCli, k),
    serieMd:  k => mdMes(todosMd, k),
    serieReun: k => realizadas(todosAt, k),
    /* Alguma dimensao escolhida na barra? Os indicadores que vem dos KRs da
       planilha sao totais do mes e nao sabem filtrar - a tela avisa. */
    filtrando: !!(F.produtos.size || F.closers.size || F.sdrs.size || F.origens.size || F.busca)
  };

  /* KR da planilha de metas: traz meta mensal, meta proporcional e o
     resultado que o time anotou a mao.
     A pontuacao do rotulo varia ("No-Show", "No Show", "Conversao em Reuniao
     [Automatico]"), entao a comparacao ignora pontuacao - senao um hifen na
     planilha faz o indicador aparecer como "sem fonte". */
  const chaveKr = t => chaveBusca(t).replace(/[^a-z0-9]+/g, ' ').trim();
  const achaKr = (m, texto) => {
    if (!m || m.erro || !m.krs) return null;
    const kk = chaveKr(texto);
    return m.krs.find(x => chaveKr(x.kr).indexOf(kk) >= 0) || null;
  };
  c.kr = texto => achaKr(DADOS.metas && DADOS.metas.meses && DADOS.metas.meses[c.nomeMes], texto);
  c.krAnt = texto => {
    const nome = MESES_ACENTO[+ant.slice(5, 7) - 1];
    const x = achaKr(DADOS.metas && DADOS.metas.meses && DADOS.metas.meses[nome], texto);
    return x ? x.resultado : null;
  };
  /* A aba KPIS Marketing e opcional: so existe se o time criar. */
  c.krMkt = texto => achaKr(DADOS.metas && DADOS.metas.marketing, texto);
  c.temMkt = !!(DADOS.metas && DADOS.metas.marketing && !DADOS.metas.marketing.erro &&
                DADOS.metas.marketing.krs && DADOS.metas.marketing.krs.length);

  /* A aba Produtos Juridicos existe para o mes corrente e o anterior. */
  const p = DADOS.metas && DADOS.metas.produtos;
  c.prod = p ? (emCurso ? p.atual : (mes === mesMais(MES_ATUAL, -1) ? p.anterior : null)) : null;
  c.prodAnt = p ? (emCurso ? p.anterior : null) : null;
  c.vProd = (o, kk) => (o && o.real && o.real[kk] != null && o.real[kk] !== '') ? num(o.real[kk]) : null;

  /* Base do indicador: fracao do mes e rotulo do mes anterior entram em todos. */
  c.base = o => Object.assign({ emCurso: emCurso, fracao: fracao, dias: dias, diasMes: diasMes,
    rotAnt: c.rotAnt, tipo: 'num' }, o);
  return c;
}

/* Soma de uma lista de clientes por natureza de origem. */
const porNat = (lista, nat) => (lista || []).filter(r => naturezaOrigem(r.origem) === nat);

/* ==========================================================================
   AREA 1 - TRAFEGO PAGO (META ADS)
   ========================================================================== */
function kpisTrafego(c) {
  const B = c.base;
  const gasto = soma(c.md, r => r.gasto), gastoAnt = soma(c.mdAnt, r => r.gasto);
  const leads = soma(c.md, r => r.leadsTotal), leadsAnt = soma(c.mdAnt, r => r.leadsTotal);
  const leadsForm = soma(c.md, r => r.leadsForm);
  const conversasMeta = soma(c.md, r => r.conversas);
  const impr = soma(c.md, r => r.impressoes);
  const cliques = soma(c.md, r => r.cliques);
  const cliqLink = soma(c.md, r => r.cliquesLink);

  /* TUDO AQUI E SO DO META ADS: o lead do CRM entra na conta apenas se tiver
     campanha anotada.

     "Conversa iniciada", na definicao da casa, e o lead que avancou para
     elegivel ou inelegivel - quem travou na primeira mensagem nao conta. No
     Kommo isso e ter respondido a triagem. A metrica homonima do Meta conta
     outra coisa e vive separada, no bloco de especialista. */
  const semKommo = !c.temKommo
    ? 'Depende da planilha <b>Leads Kommo</b>, que não entrou nesta leitura. É ela que diz em que etapa cada lead de campanha parou.'
    : null;
  const triagem       = c.temKommo ? c.koAds.filter(houveConversa).length : null;
  const triagemAnt    = c.temKommo ? c.koAdsAnt.filter(houveConversa).length : null;
  const elegiveis     = c.temKommo ? c.koAds.filter(ehElegivel).length : null;
  const elegiveisAnt  = c.temKommo ? c.koAdsAnt.filter(ehElegivel).length : null;
  const qualificados  = c.temKommo ? c.koAds.filter(ehQualificado).length : null;
  const leadsCrmAds   = c.temKommo ? c.koAds.length : null;

  const cliAds = porNat(c.cli, 'ads'), cliAdsAnt = porNat(c.cliAnt, 'ads');
  const honAds = soma(cliAds, r => r.honIni);
  const honAdsAnt = soma(cliAdsAnt, r => r.honIni);

  /* Orcamento diario: so das campanhas que estao de fato no ar. */
  const camps = (DADOS.metaCamp && DADOS.metaCamp.reg) || [];
  const ativas = camps.filter(x => /^active$/i.test(x.status || ''));
  const orcDia = soma(ativas, r => r.orcDia);

  /* Criativos novos no ar. A planilha nao guarda data de criacao do anuncio,
     mas guarda a MESMA peca medida em duas janelas fechadas (7d e 30d). Se o
     gasto dos ultimos 7 dias e praticamente todo o gasto dos ultimos 30, a
     peca comecou a rodar dentro da janela - ou seja, e nova no ar. */
  const ads = (DADOS.metaAnuncios && DADOS.metaAnuncios.reg) || [];
  const a7 = ads.filter(r => r.janela === '7d' && r.impressoes > 0);
  const a30 = {};
  ads.filter(r => r.janela === '30d').forEach(r => { a30[chaveBusca(r.anuncio) + '|' + chaveBusca(r.campanha)] = r; });
  /* Comparo por IMPRESSAO, nao por gasto, e com piso de entrega: uma peca que
     gastou R$ 0,11 em 7 dias e R$ 0,11 em 30 passaria no teste de razao sem
     dizer nada - a razao de dois numeros minusculos e ruido, nao criativo novo. */
  const PISO_IMPR = 300;
  const novos = a7.filter(r => {
    if (r.impressoes < PISO_IMPR) return false;
    const v = a30[chaveBusca(r.anuncio) + '|' + chaveBusca(r.campanha)];
    return !v || !v.impressoes || r.impressoes / v.impressoes >= 0.85;
  });
  const entregando = a7.filter(r => r.impressoes >= PISO_IMPR);
  const temJanelas = a7.length && Object.keys(a30).length;
  const janelaAds = temJanelas
    ? 'Peças cuja entrega de 7 dias é praticamente toda a entrega de 30 — começaram a rodar dentro da janela. ' +
      'Só as que passaram de ' + n0(PISO_IMPR) + ' impressões: ' + n0(entregando.length) + ' de ' + n0(a7.length) + ' peças no ar.'
    : null;

  /* Metas: as que a planilha de metas define por KR entram de lá; as de
     midia vem do painel de metas configuravel. */
  const metas = metasAtivas();
  const krReun = c.kr('reunioes realizadas');
  const metaReun = krReun ? krReun.metaMes : metas.reunioes;

  const fonteIns = 'Insights diários do Meta Ads';
  const fonteCli = 'ORIGEM da planilha de clientes';
  const fonteKr = 'KR da aba KPIS ' + c.nomeMes;

  const principais = [
    B({ k: 'criativos', rot: 'Criativos novos no ar', valor: temJanelas ? novos.length : null,
        falta: temJanelas ? null : 'A aba <b>Anúncios</b> precisa das duas janelas (7d e 30d) para o painel distinguir peça nova de peça antiga.',
        nota: janelaAds, fonte: 'Aba Anúncios (janelas 7d e 30d)',
        dica: 'Sem coluna de data de criação, o painel deduz pela comparação das janelas: impressões de 7d ≈ impressões de 30d significa que a peça começou a rodar agora.' }),
    B({ hero: true, k: 'invest', rot: 'Investimento em tráfego', tipo: 'moeda', valor: gasto, ant: gastoAnt,
        meta: metas.investimento, acumula: true, serie: c.serie.map(k => soma(c.serieMd(k), r => r.gasto)),
        fonte: fonteIns, nota: c.emCurso ? n0(c.dias) + ' de ' + n0(c.diasMes) + ' dias do mês' : null }),
    B({ k: 'orcDia', rot: 'Orçamento diário no ar', tipo: 'moeda', valor: orcDia,
        fonte: 'Aba Campanhas (status ACTIVE)', largo: false,
        nota: n0(ativas.length) + ' de ' + n0(camps.length) + ' campanhas ativas · ritmo de ' + brl0(orcDia * c.diasMes) + '/mês' }),
    B({ hero: true, k: 'leads', rot: 'Leads (total)', valor: leads, ant: leadsAnt, meta: metas.leadsAds, acumula: true,
        serie: c.serie.map(k => soma(c.serieMd(k), r => r.leadsTotal)), fonte: fonteIns,
        nota: 'Formulário ' + n0(leadsForm) + ' · conversas ' + n0(conversasMeta) + ' · pixel ' + n0(soma(c.md, r => r.leadsPixel)) }),
    B({ k: 'eleg', rot: 'Leads elegíveis', valor: elegiveis, ant: elegiveisAnt, acumula: true,
        falta: semKommo,
        fonte: 'Kommo: leads com campanha anotada que passaram da elegibilidade',
        nota: leadsCrmAds ? n0(elegiveis) + ' de ' + n0(leadsCrmAds) + ' leads de campanha no CRM (' +
          pctOuTraco(taxa(elegiveis, leadsCrmAds), 0) + ')' : null,
        dica: 'Só lead com campanha anotada no Kommo. O total de elegíveis da planilha de Metas conta orgânico, indicação e recompra junto — é atribuição do comercial e vive no módulo Comercial, não aqui. Como o Kommo guarda só a etapa atual, a contagem é pela etapa de hoje. Este número é maior que a soma da aba Campanhas porque lá só entram campanhas que gastaram no período: lead que carrega o nome de uma campanha já parada conta aqui e não tem linha lá.' }),
    B({ k: 'custoConversa', rot: 'Custo por conversa iniciada', tipo: 'moeda2', inverso: true,
        valor: triagem ? gasto / triagem : null,
        ant: (triagemAnt && gastoAnt) ? gastoAnt / triagemAnt : null,
        falta: semKommo,
        fonte: 'Investimento ÷ leads de campanha avaliados (elegíveis + inelegíveis)',
        nota: (triagem && leadsCrmAds) ? n0(triagem) + ' de ' + n0(leadsCrmAds) + ' leads de campanha foram avaliados (' +
          pctOuTraco(taxa(triagem, leadsCrmAds), 0) + ')' : null,
        dica: 'Conversa iniciada = o lead avançou para elegível OU para inelegível. Quem travou na primeira mensagem não chega a ser avaliado e fica fora do divisor. A leitura vem da etapa do Kommo, não do campo de triagem: o coletor preenche esse campo para quase todo lead e ele não separa ninguém.' }),
    B({ hero: true, k: 'cpl', rot: 'Custo por lead (total)', tipo: 'moeda2', inverso: true,
        valor: leads ? gasto / leads : null, ant: leadsAnt ? gastoAnt / leadsAnt : null,
        serie: c.serie.map(k => { const g = c.serieMd(k); const l = soma(g, r => r.leadsTotal); return l ? soma(g, r => r.gasto) / l : null; }),
        fonte: fonteIns }),
    B({ k: 'cplEleg', rot: 'Custo por lead elegível', tipo: 'moeda2', inverso: true,
        valor: elegiveis ? gasto / elegiveis : null,
        ant: elegiveisAnt ? gastoAnt / elegiveisAnt : null,
        falta: semKommo,
        fonte: 'Investimento ÷ elegíveis de campanha (Kommo)',
        dica: 'Numerador e denominador do mesmo lado: só verba de anúncio, só lead de anúncio.' }),
    B({ k: 'custoReuniao', rot: 'Custo por reunião', tipo: 'moeda', inverso: true,
        valor: c.reun.length ? gasto / c.reun.length : null,
        ant: c.reunAnt.length ? gastoAnt / c.reunAnt.length : null,
        fonte: 'Investimento ÷ reuniões realizadas (Fluxo de Atendimentos)',
        nota: n0(c.reun.length) + ' reuniões realizadas no mês' }),
    B({ k: 'convReuniao', rot: 'Conversão de lead em reunião', tipo: 'pct',
        valor: taxa(c.reun.length, leads), ant: taxa(c.reunAnt.length, leadsAnt),
        meta: metaReun && metas.leadsAds ? taxa(metaReun, metas.leadsAds) : null,
        fonte: 'Reuniões realizadas ÷ leads do Meta',
        dica: 'Lead é o do Meta Ads; reunião é a realizada no CRM. A conversão real por campanha depende da atribuição — ver Mensuração.' }),
    B({ k: 'clientesAds', rot: 'Clientes', valor: cliAds.length, ant: cliAdsAnt.length,
        meta: metas.clientes, acumula: true, serie: c.serie.map(k => porNat(c.serieCli(k), 'ads').length),
        fonte: fonteCli, nota: n0(cliAds.length) + ' de ' + n0(c.cli.length) + ' fechamentos vieram de campanha' }),
    B({ hero: true, k: 'cacMidia', rot: 'Custo por cliente (CAC de mídia)', tipo: 'moeda', inverso: true,
        valor: cliAds.length ? gasto / cliAds.length : null,
        ant: cliAdsAnt.length ? gastoAnt / cliAdsAnt.length : null,
        meta: metas.cac,
        serie: c.serie.map(k => { const n = porNat(c.serieCli(k), 'ads').length; return n ? soma(c.serieMd(k), r => r.gasto) / n : null; }),
        fonte: 'Investimento ÷ clientes de origem campanha',
        dica: 'Só os clientes cuja ORIGEM é uma campanha entram no divisor — é o CAC de mídia pedido, não o CAC do escritório inteiro.' }),
    B({ k: 'retorno', rot: 'Retorno financeiro', tipo: 'moeda', valor: honAds, ant: honAdsAnt,
        serie: c.serie.map(k => soma(porNat(c.serieCli(k), 'ads'), r => r.honIni)),
        fonte: fonteCli, nota: 'Honorários iniciais dos clientes de campanha' }),
    B({ hero: true, k: 'roi', rot: 'ROI de mídia', tipo: 'mult', valor: gasto ? honAds / gasto : null,
        ant: gastoAnt ? honAdsAnt / gastoAnt : null, meta: metas.roi,
        serie: c.serie.map(k => { const g = soma(c.serieMd(k), r => r.gasto); return g ? soma(porNat(c.serieCli(k), 'ads'), r => r.honIni) / g : null; }),
        fonte: 'Retorno atribuído ÷ investimento' })
  ];

  /* ----- ESPECIALISTA: investimento e entrega -----
     Alcance e frequencia vem das JANELAS fechadas, nao da soma dos dias: o
     alcance diario conta pessoas unicas POR DIA, e somar 30 dias contaria a
     mesma pessoa 30 vezes. */
  const jan = (DADOS.metaJanelas && DADOS.metaJanelas.reg) || [];
  const j7 = jan.filter(r => r.janela === '7d');
  const alc7 = soma(j7, r => r.alcance), impr7 = soma(j7, r => r.impressoes);
  /* Frequencia correta e a que a Meta calcula por campanha. A razao entre as
     SOMAS daria um numero menor que o real, porque a soma dos alcances conta
     a mesma pessoa uma vez por campanha em que ela aparece. */
  const freq7 = impr7 ? soma(j7, r => r.frequencia * r.impressoes) / impr7 : null;
  const metaInv = metas.investimento;

  const entrega = [
    B({ k: 'ritmoVerba', rot: 'Ritmo de verba', tipo: 'pct',
        valor: metaInv && c.fracao ? taxa(gasto, metaInv * c.fracao) : null,
        fonte: 'Gasto acumulado ÷ orçamento proporcional ao dia',
        dica: 'Sem selo de meta de propósito: aqui passar de 100% é tão informativo quanto ficar abaixo, e um sinal verde para gasto acima do previsto enganaria.',
        nota: brl0(gasto) + ' de ' + brl0(metaInv * c.fracao) + ' previstos até hoje' }),
    B({ k: 'impressoes', rot: 'Impressões', valor: impr, fonte: fonteIns }),
    B({ k: 'alcance7', rot: 'Alcance (7 dias)', valor: alc7 || null,
        falta: alc7 ? null : 'A aba <b>Janelas</b> não trouxe a janela de 7 dias.',
        fonte: 'Soma do alcance por campanha na janela de 7d',
        dica: 'E um teto, não pessoas unicas: quem foi alcancado por duas campanhas conta duas vezes. A Meta só da o alcance único por campanha, não o da conta.' }),
    B({ k: 'freq7', rot: 'Frequência (7 dias)', tipo: 'mult', valor: freq7,
        falta: freq7 ? null : 'Depende da janela de 7 dias na aba Janelas.',
        fonte: 'Média das frequências por campanha, ponderada por impressão',
        nota: freq7 && freq7 >= 3 ? 'Acima de 3: o mesmo público já viu demais' : null,
        dica: 'Ponderada de propósito: a razao entre as somas daria menos que o real, porque a soma dos alcances conta a mesma pessoa mais de uma vez.' }),
    B({ k: 'cpm', rot: 'CPM', tipo: 'moeda2', inverso: true, valor: impr ? (gasto / impr) * 1000 : null,
        fonte: 'Investimento ÷ impressões × 1.000' }),
    B({ k: 'conjAtivos', rot: 'Conjuntos ativos', valor: soma(ativas, r => r.conjAtivos) || null,
        fonte: 'Aba Campanhas' }),
    B({ k: 'aprendizado', rot: 'Fora da fase de aprendizado', falta:
        'A aba Campanhas traz conjuntos ativos, mas não o <b>status de aprendizado</b> de cada conjunto. Precisa do campo <code>learning_stage_info</code> no coletor.' }),
    B({ k: 'reprovados', rot: 'Anúncios reprovados ou restritos', falta:
        'A aba Anúncios não tem coluna de <b>status de revisão</b>. Precisa de <code>effective_status</code> no nível do anúncio.' })
  ];

  /* ----- ESPECIALISTA: criativo ----- */
  const totGasto7 = soma(a7, r => r.gasto);
  const fadiga = entregando.filter(r => {
    const v = a30[chaveBusca(r.anuncio) + '|' + chaveBusca(r.campanha)];
    return r.frequencia >= 2.5 && v && v.ctrLink > 0 && r.ctrLink < v.ctrLink * 0.85;
  });
  const criativo = [
    B({ k: 'ctrLink', rot: 'CTR do link', tipo: 'pct', valor: taxa(cliqLink, impr), fonte: fonteIns }),
    B({ k: 'cpcLink', rot: 'CPC do link', tipo: 'moeda2', inverso: true, valor: cliqLink ? gasto / cliqLink : null,
        fonte: 'Investimento ÷ cliques no link' }),
    B({ k: 'criativosAtivos', rot: 'Peças entregando (7d)', valor: entregando.length || null,
        falta: a7.length ? null : 'A aba Anúncios não trouxe a janela de 7 dias.',
        fonte: 'Aba Anúncios (7d)', nota: a7.length ? brl0(totGasto7) + ' na janela' : null }),
    B({ k: 'fadiga', rot: 'Peças em fadiga', valor: temJanelas ? fadiga.length : null,
        falta: temJanelas ? null : 'Precisa das janelas 7d e 30d na aba Anúncios.',
        fonte: 'Frequência ≥ 2,5 com CTR de 7d abaixo do CTR de 30d',
        dica: 'Fadiga é frequência subindo junto com CTR caindo. Com as duas janelas o painel compara a entrega recente com a do mês.',
        nota: temJanelas && fadiga.length ? fadiga.slice(0, 2).map(x => esc(x.anuncio)).join(' · ') : null }),
    B({ k: 'hook', rot: 'Hook rate (3s ÷ impressões)', falta:
        'O coletor não traz <code>video_3_sec_watched_actions</code>. A coluna Ações (JSON) tem só <code>video_view</code>, que não separa 3 segundos.' }),
    B({ k: 'hold', rot: 'Hold rate (ThruPlay ÷ 3s)', falta:
        'Precisa de <code>video_thruplay_watched_actions</code> no coletor da aba Insights.' }),
    B({ k: 'retencao', rot: 'Retenção 25/50/75/95%', falta:
        'Precisa de <code>video_p25…p95_watched_actions</code> no coletor.' }),
    B({ k: 'relevancia', rot: 'Classificações de relevância', falta:
        'Precisa de <code>quality_ranking</code>, <code>engagement_rate_ranking</code> e <code>conversion_rate_ranking</code> no nível do anúncio.' }),
    B({ k: 'cplQualAd', rot: 'Custo por lead qualificado por anúncio', falta:
        'A qualificação é anotada no CRM sem o anúncio de origem. Precisa do <code>ad_id</code> (ou UTM de conteúdo) chegando no lead.' })
  ];

  /* ----- ESPECIALISTA: conversao no destino ----- */
  const campsForm = c.md.filter(r => /\[form\]/i.test(r.campanha));
  const gastoForm = soma(campsForm, r => r.gasto), leadsFormCamp = soma(campsForm, r => r.leadsForm);
  const destino = [
    B({ k: 'cliqueConversa', rot: 'Clique → conversa', tipo: 'pct', valor: taxa(conversasMeta, cliqLink),
        fonte: 'Conversas iniciadas (Meta) ÷ cliques no link',
        dica: 'Aqui a conversa é a métrica do Meta, não a definição da casa — é ela que fala a mesma língua do clique.' }),
    B({ k: 'custoConversaMeta', rot: 'Custo por conversa (métrica do Meta)', tipo: 'moeda2', inverso: true,
        valor: conversasMeta ? gasto / conversasMeta : null,
        fonte: 'Investimento ÷ conversas iniciadas (Meta)',
        nota: n0(conversasMeta) + ' conversas · a maior parte da verba está em campanha de formulário' }),
    B({ k: 'cplForm', rot: 'Custo por lead de formulário', tipo: 'moeda2', inverso: true,
        valor: leadsFormCamp ? gastoForm / leadsFormCamp : null,
        falta: leadsFormCamp ? null : 'Nenhuma campanha com <code>[FORM]</code> no nome teve lead de formulário no mês.',
        fonte: 'Campanhas [FORM]: investimento ÷ leads de formulário' }),
    B({ k: 'conexoes', rot: 'Novas conexões ÷ conversas', falta:
        'Precisa de <code>messaging_first_reply</code> e <code>messaging_conversation_started</code> separados no coletor.' }),
    B({ k: 'convLp', rot: 'Conversão da landing page', falta:
        'Não há fonte de site no painel. Precisa de uma aba com sessões e conversões (GA4 ou similar).' }),
    B({ k: 'velocidadeLp', rot: 'Velocidade da landing page', falta: 'Mesma lacuna: nenhuma fonte de site conectada.' })
  ];

  /* ----- ESPECIALISTA: qualidade e fundo de funil ----- */
  const fin = DADOS.fin;
  const custoComercial = fin && fin.comercial ? (fin.comercial.meses[c.mes] || 0) : null;
  const cacTotal = custoComercial && c.cli.length ? custoComercial / c.cli.length : null;
  /* ROAS de caixa: receita que ENTROU nos ultimos tres meses fechados contra
     o investimento dos mesmos meses. A DRE e de caixa, a planilha de clientes
     e de competencia - aqui o numero de caixa e o certo. */
  const tri = [mesMais(c.mes, -2), mesMais(c.mes, -1), c.mes];
  const recTri = fin && fin.receita ? soma(tri, k => fin.receita.meses[k] || 0) : null;
  const invTri = soma(tri, k => soma(c.serieMd(k), r => r.gasto));
  const fundo = [
    B({ k: 'txQual', rot: 'Taxa de qualificação', tipo: 'pct',
        valor: taxa(qualificados, leadsCrmAds), falta: semKommo,
        fonte: 'Qualificados ÷ leads de campanha, ambos do Kommo',
        nota: leadsCrmAds ? n0(qualificados) + ' de ' + n0(leadsCrmAds) + ' leads de campanha' : null,
        dica: 'Qualificado = lead de campanha cuja etapa já passou da documentação. Só anúncio dos dois lados da conta.' }),
    B({ k: 'cplQual', rot: 'Custo por lead qualificado', tipo: 'moeda', inverso: true,
        valor: qualificados ? gasto / qualificados : null, falta: semKommo,
        fonte: 'Investimento ÷ qualificados de campanha (Kommo)' }),
    B({ k: 'cacTotal', rot: 'CAC total (mídia + comercial)', tipo: 'moeda', inverso: true, valor: cacTotal,
        falta: cacTotal ? null : 'Depende da linha <b>(-) SETOR COMERCIAL</b> da DRE para ' + esc(c.rotMes) + '.',
        fonte: 'DRE COMERCIAL ÷ clientes do mês',
        nota: custoComercial ? brl0(custoComercial) + ' de custo comercial · ' + n0(c.cli.length) + ' clientes' : null,
        dica: 'Inclui SDR, closer, liderança, CRM, automações e mídia. É o CAC do escritório, não o de mídia.' }),
    B({ k: 'roasCaixa', rot: 'ROAS de caixa (3 meses)', tipo: 'mult',
        valor: (recTri && invTri) ? recTri / invTri : null,
        falta: recTri ? null : 'Depende da linha de receitas da DRE.',
        fonte: 'Receita de caixa ÷ investimento, nos 3 meses até ' + esc(c.rotMes),
        dica: 'A DRE é de caixa: mede o que entrou, não o que foi contratado. Meses de calendário, não 90 dias corridos.' }),
    B({ k: 'conversaContrato', rot: 'Conversa → contrato', tipo: 'pct',
        valor: triagem ? taxa(cliAds.length, triagem) : null, falta: semKommo,
        fonte: 'Clientes de campanha ÷ conversas iniciadas de campanha' }),
    B({ k: 'convLeadCliente', rot: 'Lead → cliente', tipo: 'pct', valor: taxa(cliAds.length, leads),
        ant: taxa(cliAdsAnt.length, leadsAnt), fonte: 'Clientes de campanha ÷ leads do Meta' })
  ];

  /* ----- ESPECIALISTA: mensuracao -----
     Antes de comparar campanha, medir se da para comparar. */
  const reunMes = (DADOS.metaReun && DADOS.metaReun.reg || []).filter(r => r.mes === c.mes);
  const cobReun = taxa(reunMes.filter(r => r.campanha).length, reunMes.length);
  const cobCli = taxa(c.cli.filter(r => r.origem && r.origem !== 'Sem origem').length, c.cli.length);
  const mensuracao = [
    B({ k: 'cobReun', rot: 'Cobertura: reunião com campanha', tipo: 'pct', valor: cobReun, meta: 95,
        fonte: 'Aba Reuniões: coluna Campanha preenchida',
        nota: n0(reunMes.filter(r => r.campanha).length) + ' de ' + n0(reunMes.length) + ' reuniões do mês',
        dica: 'Com cobertura baixa, campanha sem reunião pode ser só falta de anotação. O painel suspende os alertas por campanha nesse caso.' }),
    B({ k: 'cobCli', rot: 'Cobertura: cliente com origem', tipo: 'pct', valor: cobCli, meta: 95,
        fonte: 'Planilha de clientes: coluna ORIGEM preenchida' }),
    B({ k: 'cobKommo', rot: 'Cobertura: campanha anotada no lead', tipo: 'pct',
        valor: c.temKommo ? taxa(c.koAds.length, c.koCom.length) : null,
        falta: semKommo, meta: 90,
        nota: c.temKommo ? n0(c.koAds.length) + ' de ' + n0(c.koCom.length) + ' leads do funil comercial' : null,
        fonte: 'Leads do funil comercial com o campo Campanha preenchido',
        dica: 'O divisor exclui o funil Instagram: direct e comentário não vêm de campanha por natureza, e contá-los aqui derrubava a cobertura de 86% para 45% sem que nada estivesse errado. Todo indicador deste módulo sai do lead com campanha anotada — o que chega sem ela some da conta, e o custo por elegível sobe sem motivo real.' }),
    B({ k: 'pixel', rot: 'Qualidade do pixel e da API', falta:
        'Precisa da nota de correspondência de eventos do Gerenciador de Eventos — nenhuma aba traz isso hoje.' }),
    B({ k: 'eventosCrm', rot: 'Eventos de CRM devolvidos à Meta', falta:
        'Não existe envio de qualificado/reunião/contrato de volta para a Meta. É o que faria a otimização aprender com venda, não com lead.' })
  ];

  [['Investimento e entrega', entrega], ['Criativo', criativo], ['Conversão no destino', destino],
   ['Qualidade e fundo de funil', fundo], ['Mensuração', mensuracao]]
    .forEach(([g, l]) => l.forEach(k => { k.grupo = g; k.tela = 'trafego'; }));
  principais.forEach(k => { k.grupo = 'Principais'; k.tela = 'trafego'; });

  return { principais: principais, grupos: [
    { t: 'Investimento e entrega', s: 'Quanto saiu, para quanta gente e com que repetição.', l: entrega },
    { t: 'Criativo', s: 'Qual peça está ganhando dentro da campanha — e qual já cansou o público.', l: criativo },
    { t: 'Conversão no destino', s: 'Do clique até a conversa: onde o lead se perde antes de existir.', l: destino },
    { t: 'Qualidade e fundo de funil', s: 'Cruzando mídia com CRM: o que a verba virou em cliente.', l: fundo },
    { t: 'Mensuração', s: 'Antes de acusar uma campanha, medir se dá para acusar.', l: mensuracao }
  ], ctx: { gasto: gasto, leads: leads, triagem: triagem, cliAds: cliAds, cobReun: cobReun } };
}

/* ==========================================================================
   AREA 2 - MARKETING
   ========================================================================== */
function kpisMarketing(c) {
  const B = c.base;
  /* O que da para medir hoje vem da ORIGEM do cliente e da linha de organico
     da planilha de metas. Audiencia, conteudo e social seller nao tem fonte
     nenhuma no painel - e a lacuna maior desta tela. */
  const organicoLeads = c.vProd(c.prod, 'leads (organico)');
  const organicoAnt = c.vProd(c.prodAnt, 'leads (organico)');
  const cliOrg = porNat(c.cli, 'organico'), cliOrgAnt = porNat(c.cliAnt, 'organico');
  const cliInd = porNat(c.cli, 'indicacao'), cliIndAnt = porNat(c.cliAnt, 'indicacao');
  const cliAds = porNat(c.cli, 'ads');
  const cliBase = porNat(c.cli, 'base');
  const honOrg = soma(cliOrg, r => r.honIni);

  /* Custo de marketing que NAO e plataforma de anuncio: social media e as
     outras despesas de marketing da DRE. E o que divide o lead organico. */
  const fin = DADOS.fin;
  const custoMkt = fin ? soma((fin.itens || []).filter(x =>
    /social media|outras despesas de marketing/.test(normCab(x.rotulo))), x => x.meses[c.mes] || 0) : null;

  /* Tres estados, nao dois: a aba pode nao existir, existir com a linha em
     branco, ou estar preenchida. O painel diz qual deles e - "0" no lugar de
     "ainda nao preenchido" seria um numero inventado. */
  /* ===== O SOCIAL SELLER JA ESTAVA NO CRM =====
     O funil "Instagram" do Kommo guarda a interacao recebida: direct,
     comentario, pedido de telefone e a passagem para o WhatsApp. Isso e
     exatamente o que esta tela declarava como sem fonte. Nao e audiencia -
     seguidor e visita de perfil continuam so dentro do Instagram -, mas e a
     conversa, que e a parte que vira lead. */
  const soc = c.koSoc || [];
  const socAnt = c.koSocAnt || [];
  const pediuContato = soc.filter(r => IG_PEDIU_CONTATO.test(chaveBusca(r.etapa))).length;
  const pediuContatoAnt = socAnt.filter(r => IG_PEDIU_CONTATO.test(chaveBusca(r.etapa))).length;
  const foiParaWpp = soc.filter(r => IG_FOI_PARA_WPP.test(chaveBusca(r.etapa))).length;
  const porEtapaSoc = cha => soc.filter(r => chaveBusca(r.etapa) === cha).length;
  const semSocial = !c.temKommo
    ? 'Depende da planilha <b>Leads Kommo</b>, que não entrou nesta leitura.'
    : (!soc.length ? 'Nenhuma intera\u00e7\u00e3o no funil <b>Instagram</b> do Kommo neste m\u00eas.' : null);

  const cheio = v => v != null && String(v).trim() !== '';
  const SEM_MKT = 'Nenhuma fonte de Instagram no painel. Crie a aba <code>KPIS Marketing</code> na planilha de Metas, no mesmo formato das abas KPIS, com este indicador como Resultado Chave — o painel passa a lê-lo sozinho. O script <code>apps-script/CriarAbaMarketing.gs</code> monta a aba pronta.';
  const kMkt = (k, rot, nome, o) => {
    const linha = c.krMkt(nome);
    const temValor = linha && cheio(linha.brutoRes);
    const temMeta = linha && cheio(linha.brutoMeta) && num(linha.brutoMeta) !== 0;
    return B(Object.assign({
      k: k, rot: rot,
      valor: temValor ? linha.resultado : null,
      meta: temMeta ? linha.metaMes : null,
      metaProp: temMeta ? linha.metaProp : null,
      acumula: true,
      falta: temValor ? null : (linha
        ? 'A aba <code>KPIS Marketing</code> já tem esta linha, mas o <b>Resultado do Mês</b> ainda não foi preenchido.'
        : SEM_MKT),
      fonte: 'KR “' + (linha ? linha.kr : rot) + '” da aba KPIS Marketing'
    }, o || {}));
