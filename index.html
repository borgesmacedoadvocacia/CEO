<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel do Gestor Comercial | Borges Macedo</title>
<link rel="icon" type="image/png" href="favicon.png" />
<meta name="referrer" content="no-referrer" />
<!-- A pagina so fala com o endpoint das planilhas. Sem CDN, sem rastreador,
     sem endereco para onde dado possa escapar. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://docs.google.com; base-uri 'none'; form-action 'none'" />
<script>
/* Este painel nunca roda dentro de outra pagina: embutido num iframe de
   terceiro, ele se recusa a renderizar (anti-clickjacking). */
if (window.self !== window.top) {
  try { window.top.location.replace(window.location.href); }
  catch (e) { document.documentElement.innerHTML = '<p style="font:16px sans-serif;padding:2rem;color:#fff;background:#0f1117">Este painel nao pode ser exibido dentro de outra pagina.</p>'; }
}
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  * { -webkit-tap-highlight-color: transparent; }

  :root {
    /* ===== Chrome da Central de Dashboards ===== */
    --bg: #0f1117;
    --bg2: #161b26;
    --bg3: #1e2536;
    --bg4: #232c42;
    --azul: #2563eb;
    --azul-claro: #3b82f6;
    --texto: #e2e8f0;
    --texto-2: #b6c2d6;
    --texto-muted: #64748b;
    --borda: #1e2d4a;
    --radius: 12px;
    --sidebar-w: 268px;

    /* ===== Paleta de DADOS (validada para a superfície #161b26, modo escuro) =====
       Ordem categorica fixa - nunca ciclar, nunca reordenar por ranking.
       Validada no validate_palette.js: banda de luminosidade, piso de croma,
       separacao para daltonismo (pior par adjacente dE 8,4) e contraste >= 3:1. */
    --s1: #3987e5;  /* azul     */
    --s2: #d95926;  /* laranja  */
    --s3: #199e70;  /* agua     */
    --s4: #c98500;  /* amarelo  */
    --s5: #d55181;  /* magenta  */
    --s6: #008300;  /* verde    */
    --s7: #9085e9;  /* violeta  */
    --s8: #e66767;  /* vermelho */

    /* Rampa ordinal de um so tom (etapas de funil, magnitude) */
    --r1: #cde2fb; --r2: #9ec5f4; --r3: #6da7ec;
    --r4: #3987e5; --r5: #256abf; --r6: #184f95;

    /* Status - reservados. Nunca viram "serie 9". Sempre com icone + rotulo. */
    --ok: #0ca30c;
    --atencao: #fab219;
    --grave: #ec835a;
    --critico: #d03b3b;

    --grade: rgba(148,163,184,0.13);
  }

  html { font-size: 15px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--texto);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  .oculto { display: none !important; }
  ::selection { background: rgba(59,130,246,0.35); }

  /* ===================== LOGIN ===================== */
  .login-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: radial-gradient(circle at 50% 0%, #1a2338 0%, var(--bg) 62%);
    display: flex; align-items: center; justify-content: center; padding: 1.25rem;
    overflow-y: auto;
  }
  .login-caixa {
    width: 100%; max-width: 372px; background: var(--bg2);
    border: 1px solid var(--borda); border-radius: 16px; padding: 2rem 1.75rem;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
  }
  .login-logo { display: block; height: 46px; margin: 0 auto 1.15rem; object-fit: contain; }
  .login-titulo { text-align: center; font-size: 1.02rem; font-weight: 700; letter-spacing: 0.02em; }
  .login-sub {
    text-align: center; font-size: 0.72rem; color: var(--texto-muted);
    text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.25rem; margin-bottom: 1.6rem;
  }
  .campo-grupo { margin-bottom: 0.9rem; }
  .campo-rotulo {
    display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--texto-muted); font-weight: 700; margin-bottom: 0.35rem;
  }
  .campo-texto {
    width: 100%; background: var(--bg3); border: 1px solid var(--borda);
    color: var(--texto); border-radius: 9px; padding: 0.68rem 0.85rem;
    font-size: 0.92rem; font-family: inherit; outline: none; transition: border-color .15s;
  }
  .campo-texto:focus { border-color: var(--azul-claro); }
  .campo-texto::placeholder { color: #47536b; }
  .btn-entrar {
    width: 100%; margin-top: 0.5rem; padding: 0.72rem;
    background: var(--azul); border: none; border-radius: 9px;
    color: #fff; font-size: 0.92rem; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: background .15s;
  }
  .btn-entrar:hover:not(:disabled) { background: var(--azul-claro); }
  .btn-entrar:disabled { opacity: 0.6; cursor: default; }
  .login-erro {
    margin-top: 0.9rem; padding: 0.6rem 0.75rem; border-radius: 8px;
    background: rgba(208,59,59,0.12); border: 1px solid rgba(208,59,59,0.45);
    color: #f1a3a3; font-size: 0.79rem; line-height: 1.45; text-align: center;
  }
  .login-rodape {
    margin-top: 1.35rem; padding-top: 1rem; border-top: 1px solid var(--borda);
    font-size: 0.7rem; color: var(--texto-muted); text-align: center; line-height: 1.55;
  }

  /* ===================== APP ===================== */
  .app { display: flex; height: 100%; }

  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0; height: 100%;
    background: var(--bg2); border-right: 1px solid var(--borda);
    display: flex; flex-direction: column; transition: transform .22s ease; z-index: 90;
  }
  .sidebar-topo {
    display: flex; align-items: center; justify-content: center;
    padding: 1.05rem 1.15rem; border-bottom: 1px solid var(--borda);
  }
  .sidebar-logo { height: 42px; max-width: 100%; width: auto; object-fit: contain; }
  .nav { flex: 1; overflow-y: auto; padding: 0.9rem 0.7rem 1rem; }
  .nav::-webkit-scrollbar { width: 8px; }
  .nav::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
  .nav-grupo-titulo {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--texto-muted); font-weight: 700; padding: 0 0.55rem; margin: 0.9rem 0 0.4rem;
  }
  .nav-grupo-titulo.primeiro { margin-top: 0; }
  .nav-item {
    display: flex; align-items: center; gap: 0.6rem; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 9px;
    color: var(--texto-2); font-size: 0.85rem; font-weight: 500; font-family: inherit;
    padding: 0.56rem 0.7rem; margin-bottom: 2px; cursor: pointer; line-height: 1.3;
    transition: background .13s, color .13s, border-color .13s;
  }
  .nav-item:hover { background: var(--bg3); color: var(--texto); }
  .nav-item.ativo { background: var(--bg4); color: #fff; border-color: var(--borda); font-weight: 600; }
  .nav-item .ico { flex-shrink: 0; width: 17px; height: 17px; opacity: .85; }
  .nav-item.ativo .ico { opacity: 1; }
  .sidebar-rodape {
    padding: 0.85rem 1rem; border-top: 1px solid var(--borda);
    font-size: 0.68rem; color: var(--texto-muted); line-height: 1.5;
  }
  .btn-sair {
    width: 100%; margin-top: 0.55rem; padding: 0.45rem; background: var(--bg3);
    border: 1px solid var(--borda); border-radius: 7px; color: var(--texto-2);
    font-size: 0.74rem; font-family: inherit; font-weight: 600; cursor: pointer;
  }
  .btn-sair:hover { background: var(--bg4); color: var(--texto); }

  .conteudo { flex: 1; min-width: 0; height: 100%; overflow-y: auto; }
  .conteudo::-webkit-scrollbar { width: 10px; }
  .conteudo::-webkit-scrollbar-track { background: var(--bg); }
  .conteudo::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 5px; }

  .topo {
    position: sticky; top: 0; z-index: 50; background: rgba(15,17,23,0.93);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--borda);
    padding: 0.85rem 1.4rem 0;
  }
  .topo-linha { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .btn-menu {
    display: none; background: var(--bg3); border: 1px solid var(--borda); border-radius: 8px;
    color: var(--texto); padding: 0.4rem 0.6rem; cursor: pointer; font-size: 1rem; line-height: 1;
  }
  .topo-titulo { font-size: 1.12rem; font-weight: 700; letter-spacing: -0.01em; }
  .topo-sub { font-size: 0.74rem; color: var(--texto-muted); margin-top: 0.12rem; }
  .topo-acoes { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .btn-acao {
    background: var(--bg3); border: 1px solid var(--borda); border-radius: 8px;
    color: var(--texto-2); font-size: 0.76rem; font-family: inherit; font-weight: 600;
    padding: 0.44rem 0.72rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem;
  }
  .btn-acao:hover { background: var(--bg4); color: var(--texto); }
  .btn-acao.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
  .btn-acao.primario:hover { background: var(--azul-claro); }
  .btn-acao svg { width: 13px; height: 13px; }

  /* ===================== FILTROS ===================== */
  .filtros {
    display: flex; align-items: flex-end; gap: 0.7rem; flex-wrap: wrap;
    padding: 0.8rem 0 0.85rem;
  }
  .filtro { display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; }
  .filtro-rotulo {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--texto-muted); font-weight: 700;
  }
  .filtro select, .filtro input {
    background: var(--bg3); border: 1px solid var(--borda); color: var(--texto);
    border-radius: 8px; padding: 0.42rem 0.6rem; font-size: 0.8rem;
    font-family: inherit; outline: none; min-width: 152px; max-width: 230px;
  }
  .filtro select:focus, .filtro input:focus { border-color: var(--azul-claro); }
  .filtro input[type="search"] { min-width: 215px; }
  .chip-multi { position: relative; }
  .chip-botao {
    background: var(--bg3); border: 1px solid var(--borda); color: var(--texto);
    border-radius: 8px; padding: 0.42rem 0.6rem; font-size: 0.8rem; font-family: inherit;
    cursor: pointer; min-width: 152px; text-align: left; display: flex;
    align-items: center; justify-content: space-between; gap: 0.4rem;
  }
  .chip-botao:hover { border-color: var(--azul-claro); }
  .chip-botao .cnt {
    background: var(--azul); color: #fff; border-radius: 99px; font-size: 0.64rem;
    font-weight: 700; padding: 0.05rem 0.35rem; min-width: 1.2em; text-align: center;
  }
  .chip-lista {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 70; min-width: 236px;
    max-height: 330px; overflow-y: auto; background: var(--bg2);
    border: 1px solid var(--borda); border-radius: 10px; padding: 0.4rem;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
  }
  .chip-lista label {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.34rem 0.45rem;
    border-radius: 6px; font-size: 0.8rem; cursor: pointer; color: var(--texto-2);
  }
  .chip-lista label:hover { background: var(--bg3); color: var(--texto); }
  .chip-lista input { accent-color: var(--azul); min-width: auto; }
  .chip-lista .cl-qtd { margin-left: auto; font-size: 0.7rem; color: var(--texto-muted); font-variant-numeric: tabular-nums; }
  .chip-lista .cl-acoes { display: flex; gap: 0.3rem; padding: 0.25rem 0.45rem 0.4rem; border-bottom: 1px solid var(--borda); margin-bottom: 0.3rem; }
  .chip-lista .cl-acoes button {
    flex: 1; background: var(--bg3); border: 1px solid var(--borda); color: var(--texto-2);
    border-radius: 6px; font-size: 0.68rem; font-family: inherit; padding: 0.22rem; cursor: pointer;
  }
  .chip-lista .cl-acoes button:hover { background: var(--bg4); color: var(--texto); }

  /* ===================== TELAS / CARTOES ===================== */
  .tela { padding: 1.3rem 1.4rem 3.5rem; }
  .tela.oculto { display: none; }
  .secao-titulo {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.11em;
    color: var(--texto-muted); font-weight: 700; margin: 1.9rem 0 0.75rem;
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  }
  .secao-titulo.primeiro { margin-top: 0; }

  .grid { display: grid; gap: 0.85rem; }
  .g-kpi { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .g-2 { grid-template-columns: repeat(auto-fit, minmax(390px, 1fr)); }
  .g-3 { grid-template-columns: repeat(auto-fit, minmax(292px, 1fr)); }

  .cartao {
    background: var(--bg2); border: 1px solid var(--borda); border-radius: var(--radius);
    padding: 1rem 1.1rem; min-width: 0;
  }
  .cartao-titulo {
    font-size: 0.8rem; font-weight: 700; color: var(--texto);
    display: flex; align-items: center; gap: 0.45rem; margin-bottom: 0.15rem; flex-wrap: wrap;
  }
  .cartao-sub { font-size: 0.7rem; color: var(--texto-muted); line-height: 1.45; margin-bottom: 0.9rem; }

  /* Ladrilho de indicador */
  .kpi { background: var(--bg2); border: 1px solid var(--borda); border-radius: var(--radius); padding: 0.95rem 1rem; }
  .kpi-rotulo {
    font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--texto-muted); font-weight: 700; display: flex; align-items: center;
    gap: 0.35rem; margin-bottom: 0.45rem; line-height: 1.3;
  }
  .kpi-valor {
    font-size: 1.62rem; font-weight: 700; letter-spacing: -0.025em;
    font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--texto);
  }
  .kpi-valor.sm { font-size: 1.28rem; }
  .kpi-nota { font-size: 0.7rem; color: var(--texto-muted); margin-top: 0.3rem; line-height: 1.4; }
  .kpi-spark { margin-top: 0.5rem; height: 32px; }
  .delta {
    display: inline-flex; align-items: center; gap: 0.22rem; font-size: 0.72rem;
    font-weight: 700; font-variant-numeric: tabular-nums; padding: 0.1rem 0.36rem;
    border-radius: 6px; margin-top: 0.36rem;
  }
  .delta svg { width: 10px; height: 10px; }
  .delta.pos { color: #5fd35f; background: rgba(12,163,12,0.14); }
  .delta.neg { color: #e98a8a; background: rgba(208,59,59,0.14); }
  .delta.neu { color: var(--texto-muted); background: rgba(148,163,184,0.1); }

  /* Barra de ritmo (meta) */
  .ritmo { margin-top: 0.55rem; }
  .ritmo-trilha { height: 7px; background: var(--bg4); border-radius: 99px; position: relative; }
  .ritmo-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
  .ritmo-alvo { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--texto-2); opacity: .8; border-radius: 1px; }
  .ritmo-legenda {
    display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.66rem;
    color: var(--texto-muted); margin-top: 0.32rem; font-variant-numeric: tabular-nums;
  }

  /* Selo de status - cor sempre com icone + rotulo */
  .selo {
    display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.68rem;
    font-weight: 700; padding: 0.14rem 0.46rem; border-radius: 99px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .selo svg { width: 11px; height: 11px; flex-shrink: 0; }
  .selo.ok      { color: #5fd35f; background: rgba(12,163,12,0.13);  border-color: rgba(12,163,12,0.4); }
  .selo.atencao { color: #f3c45a; background: rgba(250,178,25,0.13); border-color: rgba(250,178,25,0.4); }
  .selo.grave   { color: #f0a681; background: rgba(236,131,90,0.13); border-color: rgba(236,131,90,0.4); }
  .selo.critico { color: #e98a8a; background: rgba(208,59,59,0.14);  border-color: rgba(208,59,59,0.42); }
  .selo.neutro  { color: var(--texto-2); background: var(--bg3); border-color: var(--borda); }

  /* Legenda de series */
  .legenda { display: flex; flex-wrap: wrap; gap: 0.5rem 0.95rem; margin-top: 0.7rem; }
  .legenda-item { display: inline-flex; align-items: center; gap: 0.38rem; font-size: 0.72rem; color: var(--texto-2); }
  .legenda-marca { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  /* ===================== TABELAS ===================== */
  .tabela-caixa { overflow: auto; max-height: 560px; border-radius: 10px; border: 1px solid var(--borda); }
  .tabela-caixa::-webkit-scrollbar { height: 9px; width: 9px; }
  .tabela-caixa::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 5px; }
  table.dados { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.78rem; }
  table.dados thead th {
    position: sticky; top: 0; z-index: 2; background: var(--bg3); color: var(--texto-2);
    font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
    text-align: left; padding: 0.55rem 0.7rem; white-space: nowrap; cursor: pointer;
    border-bottom: 1px solid var(--borda); user-select: none;
  }
  table.dados thead th:hover { background: var(--bg4); color: var(--texto); }
  table.dados thead th.nao-ord { cursor: default; }
  table.dados thead th .seta { opacity: .4; font-size: 0.72rem; margin-left: 0.15rem; }
  table.dados thead th.ord .seta { opacity: 1; color: var(--azul-claro); }
  table.dados tbody td {
    padding: 0.5rem 0.7rem; border-bottom: 1px solid rgba(30,45,74,0.6);
    color: var(--texto-2); vertical-align: middle; white-space: nowrap;
  }
  table.dados tbody tr:hover td { background: rgba(35,44,66,0.55); color: var(--texto); }
  table.dados td.num, table.dados th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.dados td.forte { color: var(--texto); font-weight: 600; }
  table.dados td.wrap { white-space: normal; min-width: 210px; max-width: 400px; }
  table.dados tfoot td {
    position: sticky; bottom: 0; background: var(--bg3); color: var(--texto);
    font-weight: 700; padding: 0.5rem 0.7rem; border-top: 1px solid var(--borda);
    font-variant-numeric: tabular-nums;
  }
  .tabela-rodape {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    flex-wrap: wrap; margin-top: 0.6rem; font-size: 0.72rem; color: var(--texto-muted);
  }
  .vazio { padding: 2.2rem 1rem; text-align: center; color: var(--texto-muted); font-size: 0.82rem; }

  .celula-barra { display: flex; align-items: center; gap: 0.45rem; min-width: 112px; }
  .celula-barra .cb-trilha { flex: 1; height: 6px; background: var(--bg4); border-radius: 99px; overflow: hidden; }
  .celula-barra .cb-fill { height: 100%; border-radius: 99px; }
  .celula-barra .cb-num { font-variant-numeric: tabular-nums; font-size: 0.74rem; min-width: 2.8em; text-align: right; }

  /* ===================== GRAFICOS ===================== */
  .viz { width: 100%; display: block; overflow: visible; }
  .viz text { font-family: "Segoe UI", system-ui, sans-serif; }
  .viz .eixo { fill: var(--texto-muted); font-size: 10.5px; }
  .viz .rotulo-dado { fill: var(--texto); font-size: 10.5px; font-weight: 600; }
  .viz .grade { stroke: var(--grade); stroke-width: 1; }
  .viz .alvo { fill: transparent; cursor: pointer; }
  .viz .ponto { stroke: var(--bg2); stroke-width: 2; }
  .viz .crosshair { stroke: var(--texto-muted); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; opacity: 0; }

  .dica {
    position: fixed; z-index: 500; pointer-events: none; opacity: 0;
    transition: opacity .1s; background: #0b0e14; border: 1px solid var(--borda);
    border-radius: 9px; padding: 0.5rem 0.65rem; font-size: 0.74rem;
    color: var(--texto); box-shadow: 0 10px 32px rgba(0,0,0,0.6); max-width: 300px; line-height: 1.5;
  }
  .dica.vis { opacity: 1; }
  .dica .d-tit { font-weight: 700; display: block; margin-bottom: 0.25rem; }
  .dica .d-linha { display: flex; align-items: center; gap: 0.45rem; }
  .dica .d-marca { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .dica .d-val { font-variant-numeric: tabular-nums; font-weight: 700; margin-left: auto; }

  /* ===================== AVISOS ===================== */
  .aviso {
    display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.8rem 0.95rem;
    border-radius: 10px; font-size: 0.79rem; line-height: 1.55; margin-bottom: 0.85rem;
    border: 1px solid transparent;
  }
  .aviso svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
  .aviso.critico { background: rgba(208,59,59,0.1);  border-color: rgba(208,59,59,0.4);  color: #f0b3b3; }

<script>
/* ==========================================================================
   PAINEL DO GESTOR COMERCIAL - Borges Macedo Advocacia
   --------------------------------------------------------------------------
   Reune num so lugar as planilhas que medem o comercial:

     1. Fluxo de Atendimentos [NOVA]  -> reunioes, proposta e esteira de FUP
     2. FLUXO DE CLIENTES [2026]      -> fechamentos, honorarios, ticket
     3. Campanhas Meta Ads            -> investimento, CPL, campanhas, reunioes
     4. Metas e Resultados [NOVA]     -> KPIs do mes, metas e plano de acao
     5. Metas e Resultados (antiga)   -> acumulado 2026, historico
     6. Leads Kommo [DASHBOARDS]      -> pre-qualificacao lead a lead

   Leitura: endpoint gviz das proprias planilhas (sem chave de API). Nao ha
   servidor: o navegador le a planilha e calcula tudo aqui. Cada fonte cai de
   pe sozinha - uma planilha fora do ar nao derruba o painel, aparece como
   lacuna declarada na aba Fontes.

   CPF/CNPJ do cliente NAO e lido: nao serve a nenhuma decisao comercial e
   nao precisa trafegar para ca.
   ========================================================================== */

/* ===== COFRE - os IDs das planilhas, cifrados com AES-256-GCM =====
   Sem a credencial correta a decifragem falha e a pagina nao sabe quais
   planilhas ler. A chave vem de PBKDF2-SHA256 (310 mil iteracoes) sobre
   login + senha. */
const COFRES = [
  {"v":1,"it":310000,"salt":"SFyEWvfqWRB/X6hNNHbE2Q==","iv":"W+6BQ6rq+kzkYVvs","ct":"PHOx8BafR3pP632k2+sP8pw1xNF4kHXPAzKb9fjaIdXuKXcihZ1uSMwauYq5nm7+vny3BCsn10giIRiX74LmAOclS4w0u1BG71PEze8POGxrjN6YkaIdAXNWJ3eXlwML+jLgR1NHT9h12pYSIp0eWC0ayD9WXutNZcMzi0b9vZ+/3fVEalI5iWagqTqSEeJqWUFgAFTGT6gzT7aFX+NerJub/Q0W4Voz5GgT6aHPHf+vGDsXW1/LrdviTmat6w6TclaZbvdYpAemL6nuDQi+RjzGRvlXKP8mescNOKiPn01vGW7PTDWxI1+b3GjjzVN6P3NFe95orCEEbwGJqOxP/j6ddoNlV9FhADKGoLhu43Wu9SoWNct8C/i+u1JsYhHQjZNHr6NmknNAWN7eRcLoVQbISo3Ca+ZN3T2i5O7uBZU0eNEBZPraL7wIBD8svD6QULltPmPe2Qt8XaE7HyDBtHehZ4yCOF8ri8f8IT2AcSt2iMMYvFai3b9z+dklykMdPhSXbotP1m0gUGiXhDu5tySiT6gfKw0gLP2wekWeZxcUtiJhkMMhP6nD16ml7t8e2OUZveRjOe+iJbLy4x6sF78oj/JC76rec7YqZ39Dv2RbWmj9krY7mJSn1Cypu0aJF0gINjkKerk0/2N7ctumPtkiZYNTNWOouTo="}
];

const b64bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const normUsuario = u => u.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

async function abrirUmCofre(cofre, usuario, senha) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey(
    'raw', enc.encode(normUsuario(usuario) + '\n' + senha), 'PBKDF2', false, ['deriveKey']);
  const chave = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64bytes(cofre.salt), iterations: cofre.it, hash: 'SHA-256' },
    material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const claro = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64bytes(cofre.iv) }, chave, b64bytes(cofre.ct));
  return JSON.parse(new TextDecoder().decode(claro));
}

async function abrirCofre(usuario, senha) {
  for (const cofre of COFRES) {
    try { return await abrirUmCofre(cofre, usuario, senha); } catch (e) {}
  }
  throw new Error('Login ou senha invalidos para este painel.');
}

const CONFIG = { SHEETS: null, perfil: null, AUTO_MIN: 10, PROXY: null };

const K_AUTH  = 'bm_ceo_auth';
const K_CRED  = 'bm_ceo_cred';
const K_TOKEN = 'bm_ceo_tok';
const K_PROXY = 'bm_ceo_proxy';

/* ==========================================================================
   TRANSPORTE
   --------------------------------------------------------------------------
   Dois caminhos para o mesmo dado, e a diferenca entre eles e de seguranca,
   nao de desempenho:

   . PROXY (preferido) - um web app Apps Script que roda com a conta dona das
     planilhas. As planilhas ficam PRIVADAS, a senha e conferida no servidor e
     CPF/CNPJ nem sai do Google. E o unico caminho que protege o dado, e nao
     so a descoberta dele.

   . GVIZ (retaguarda) - le a planilha direto do navegador. So funciona com
     planilha compartilhada por link, o que significa que quem tiver o ID le
     sem senha nenhuma. Fica aqui para o painel nao parar durante a virada.

   Qual esta em uso aparece declarado na tela "Fontes e dados".
   ========================================================================== */
let TOKEN = null;          /* derivado do login; credencial, nunca a senha */
let PROXY_DADOS = null;    /* resposta do proxy na carga atual */
let PROXY_ERROS = {};
let TRANSPORTE = 'gviz';
let PROXY_FALHA = null;

/* O navegador deriva PBKDF2-SHA256(login + senha) e manda so o resultado.
   A senha em si nunca trafega e nunca e guardada. O servidor compara o
   SHA-256 disto com o hash que ele guarda. */
async function derivarToken(usuario, senha) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey(
    'raw', enc.encode(normUsuario(usuario) + '\n' + senha), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode('bm-painel-comercial-v1'), iterations: 310000, hash: 'SHA-256' },
    material, 256);
  let s = '';
  new Uint8Array(bits).forEach(b => { s += String.fromCharCode(b); });
  return btoa(s);
}

function proxySalvo() {
  try { return localStorage.getItem(K_PROXY) || null; } catch (e) { return null; }
}
function salvarProxy(url) {
  try {
    if (url) localStorage.setItem(K_PROXY, url); else localStorage.removeItem(K_PROXY);
  } catch (e) {}
  CONFIG.PROXY = url || null;
}

async function proxyLer(fontes) {
  /* text/plain de proposito: mantem a requisicao "simples" e evita o
     preflight OPTIONS, que o Apps Script nao responde. */
  const resp = await fetch(CONFIG.PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ auth: TOKEN, fontes: fontes }),
    cache: 'no-store'
  });
  if (!resp.ok) throw new Error('o proxy respondeu HTTP ' + resp.status);
  let j;
  try { j = await resp.json(); }
  catch (e) { throw new Error('o endereco respondeu algo que nao e JSON - confira se termina em /exec'); }
  if (!j.ok) throw new Error(j.erro || 'o proxy recusou a credencial');
  return j;
}

/* ===================== FORMATACAO ===================== */
const fmtBRL  = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtBRL0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const fmtNum  = new Intl.NumberFormat('pt-BR');
const fmtNum1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

const MESES = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_CURTO = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const brl  = v => fmtBRL.format(Number(v) || 0);
const brl0 = v => fmtBRL0.format(Number(v) || 0);
const n0   = v => fmtNum.format(Math.round(Number(v) || 0));
const n1   = v => fmtNum1.format(Number(v) || 0);
const pct  = (v, casas) => (Number(v) || 0).toLocaleString('pt-BR', {
  minimumFractionDigits: casas == null ? 0 : casas,
  maximumFractionDigits: casas == null ? 0 : casas }) + '%';

/* Divisao que nao explode nem mente: sem denominador, nao ha taxa. */
const taxa = (a, b) => (b > 0 ? (a / b) * 100 : null);
const pctOuTraco = (v, casas) => (v == null ? '&mdash;' : pct(v, casas));

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const chaveBusca = s => String(s == null ? '' : s).toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
/* Cabecalhos reais trazem ordinais ("1o CONTATO", "No do Processo"): o
   indicador masculino/feminino nao e acento, o NFD nao o remove, e sem tirar
   ele aqui a coluna simplesmente nao e encontrada. */
const normCab = s => chaveBusca(s)
  .replace(/[ºª°]/g, '')
  .replace(/[?:.]/g, '')
  .replace(/\s+/g, ' ').trim();

/* ===== Numeros em pt-BR =====
   "R$ 2.033,28" -> 2033.28 | "1.100" -> 1100 | "66%" -> 66 | "-" -> 0
   Regra: se tem virgula, a virgula e o decimal e o ponto e milhar. Sem
   virgula, um ponto so e milhar quando separa grupos de 3 digitos. */
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v == null ? '' : v).trim();
  if (!s || s === '-' || s === '--') return 0;
  if (/^#(DIV\/0|N\/A|REF|VALUE|NAME)/i.test(s)) return 0;
  s = s.replace(/R\$/gi, '').replace(/\s| /g, '').replace(/%/g, '');
  const neg = /^\(.*\)$/.test(s) || s.startsWith('-');
  s = s.replace(/[()]/g, '').replace(/^-/, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const x = parseFloat(s);
  if (!isFinite(x)) return 0;
  return neg ? -x : x;
}

/* Percentual que na planilha pode vir "26%" ou 0,26 */
function numPct(v) {
  const s = String(v == null ? '' : v);
  const x = num(s);
  if (s.includes('%')) return x;
  return Math.abs(x) <= 1 && x !== 0 ? x * 100 : x;
}

/* ===== Datas =====
   O gviz devolve o valor FORMATADO: dd/mm/aaaa quando a celula e data de
   verdade e aaaa-mm-dd quando o coletor gravou texto. Ler as duas formas e
   o que impede o painel de perder meses inteiros sem dar erro. Datas-fantasma
   do Sheets (1899/1900) contam como vazio. */
function parseData(v) {
  if (v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v == null ? '' : v).trim();
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return valida(new Date(+m[1], +m[2] - 1, +m[3]));
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let a = +m[3]; if (a < 100) a += 2000;
    return valida(new Date(a, +m[2] - 1, +m[1]));
  }
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
  if (m) return valida(new Date(+m[3], +m[2] - 1, +m[1]));
  return null;
  function valida(d) { return (isNaN(d) || d.getFullYear() < 2015 || d.getFullYear() > 2100) ? null : d; }
}

const chaveMes      = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const rotuloMes     = k => k ? MESES[Number(k.slice(5, 7)) - 1] + '/' + k.slice(0, 4) : '&mdash;';
const rotuloMesCurto= k => k ? MESES_CURTO[Number(k.slice(5, 7)) - 1] + '/' + k.slice(2, 4) : '';
const fmtData       = d => d ? d.toLocaleDateString('pt-BR') : '&mdash;';
const hoje          = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const diasEntre     = (a, b) => Math.round((b - a) / 86400000);

/* "Mes/26" -> "2026-10" (rotulos automaticos das planilhas) */
function mesDeRotulo(s) {
  const t = chaveBusca(s);
  if (!t) return '';
  const i = MESES.findIndex(m => t.startsWith(chaveBusca(m).slice(0, 4)));
  if (i < 0) return '';
  const a = t.match(/(\d{2,4})\s*$/);
  if (!a) return '';
  let ano = +a[1]; if (ano < 100) ano += 2000;
  return ano + '-' + String(i + 1).padStart(2, '0');
}

/* ===================== CSV ===================== */
function parseCSV(txt) {
  const linhas = []; let linha = []; let cur = ''; let q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) {
      if (c === '"') { if (txt[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { linha.push(cur); cur = ''; }
    else if (c === '\n') { linha.push(cur); linhas.push(linha); linha = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || linha.length) { linha.push(cur); linhas.push(linha); }
  return linhas;
}

/* ===================== LEITURA (gviz) ===================== */
function colLetra(i) {
  let s = '';
  for (i = i + 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
  return s;
}
const letrasAte = n => Array.from({ length: n }, (_, i) => colLetra(i)).join(',');

/* O parametro headers diz quantas linhas de cima sao cabecalho, e ele NAO e
   opcional: sem ele o gviz adivinha, e quando adivinha errado devolve a
   celula de texto VAZIA em qualquer coluna que ele tipou como numero ou data
   - o cabecalho chega mutilado e o painel nao acha coluna nenhuma.
   Abas comuns: headers=1. Abas em matriz (titulo em cima do cabecalho, como
   as de Produtos Juridicos e KPIS): headers = a linha do cabecalho. */
function urlGviz(id, aba, tq, headers) {
  const p = new URLSearchParams({ tqx: 'out:csv', headers: String(headers == null ? 1 : headers), sheet: aba });
  if (tq) p.set('tq', tq);
  return 'https://docs.google.com/spreadsheets/d/' + id + '/gviz/tq?' + p.toString();
}

/* Erros que o gviz devolve com status 200 no corpo, e nao no codigo HTTP. */
function corpoEErro(txt) {
  const t = txt.slice(0, 400);
  if (/^\s*</.test(t)) return 'a planilha respondeu uma pagina de login, nao dados';
  if (/setResponse/.test(t) && /"status"\s*:\s*"error"/.test(t)) {
    const m = txt.match(/"detailed_message"\s*:\s*"([^"]+)"/) || txt.match(/"message"\s*:\s*"([^"]+)"/);
    return m ? m[1].replace(/<[^>]+>/g, '') : 'consulta rejeitada pelo gviz';
  }
  return null;
}

async function lerAba(id, aba, opc) {
  const o = opc || {};

  /* Com o proxy em uso, a leitura ja veio toda numa resposta so. */
  if (PROXY_DADOS && o.fonte) {
    if (PROXY_DADOS[o.fonte]) {
      const linhas = PROXY_DADOS[o.fonte].linhas || [];
      if (!linhas.length) throw new Error('aba vazia');
      conferirCabecalho(linhas, PROXY_DADOS[o.fonte].aba || aba, o);
      return linhas;
    }
    if (PROXY_ERROS[o.fonte]) throw new Error(PROXY_ERROS[o.fonte]);
    throw new Error('o proxy nao devolveu a fonte "' + o.fonte + '"');
  }
  /* Fontes que so existem pelo proxy (planilha privada). */
  if (o.soProxy) {
    throw new Error(CONFIG.PROXY
      ? 'esta planilha so e lida pelo proxy, e o proxy nao respondeu'
      : 'esta planilha e privada: so e lida pelo proxy Apps Script. Configure em "Fontes e dados".');
  }

  let resp;
  try {
    resp = await fetch(urlGviz(id, aba, o.tq, o.headers), { cache: 'no-store', credentials: 'omit' });
  } catch (e) {
    /* Planilha nao compartilhada: o navegador e desviado para a tela de login
       do Google e o CORS barra a resposta antes de ela chegar aqui. */
    throw new Error('sem acesso publico de leitura (compartilhe como "qualquer pessoa com o link")');
  }
  if (!resp.ok) {
    if (resp.status === 401 || resp.status === 403) {
      throw new Error('sem acesso publico de leitura (compartilhe como "qualquer pessoa com o link")');
    }
    throw new Error('a planilha respondeu HTTP ' + resp.status);
  }
  const txt = await resp.text();
  const err = corpoEErro(txt);
  if (err) throw new Error(err);

  const linhas = parseCSV(txt).filter(l => l.some(c => String(c).trim() !== ''));
  if (!linhas.length) throw new Error('aba vazia');
  conferirCabecalho(linhas, aba, o);
  return linhas;
}

/* O gviz devolve a PRIMEIRA aba da planilha quando o nome pedido nao existe,
   em vez de dar erro. Conferir o cabecalho e o que separa "aba renomeada" de
   "numeros errados em silencio". */
function conferirCabecalho(linhas, aba, o) {
  if (!o.esperado || !o.esperado.length) return;
  const cab = (linhas[o.linhaCab || 0] || []).map(normCab);
  const faltando = o.esperado.filter(e => !cab.some(c => c.includes(normCab(e))));
  if (faltando.length) {
    throw new Error('a aba "' + aba + '" nao tem as colunas esperadas (' +
      faltando.slice(0, 3).join(', ') + '). Foi renomeada ou reestruturada?');
  }
}

/* Cabecalho + linhas, com indice por nome de coluna (aceita apelidos). */
function tabela(linhas, iCab) {
  const i = iCab || 0;
  const cab = (linhas[i] || []).map(c => String(c).trim());
  return { cab, norm: cab.map(normCab), linhas: linhas.slice(i + 1) };
}

/* Tres passadas, da mais exigente para a mais tolerante. A ordem importa:
   com headers=N o gviz cola o texto da linha de cima no rotulo da coluna
   ("...OUTUBRO 2026 Responsavel"), e sem a passada exata vir primeiro um
   "Meta Mensal" acharia o "Res. Mensal x Meta Mensal" no lugar certo errado. */
function idxDe(t, apelidos) {
  const chaves = apelidos.map(normCab);
  for (const k of chaves) {                      /* 1. igual */
    const i = t.norm.indexOf(k);
    if (i >= 0) return i;
  }
  for (const k of chaves) {                      /* 2. termina com */
    const i = t.norm.findIndex(c => c && c !== k && c.endsWith(k));
    if (i >= 0) return i;
  }
  for (const k of chaves) {                      /* 3. contem - o rotulo mais curto ganha */
    let melhor = -1, menor = Infinity;
    t.norm.forEach((c, i) => {
      if (c && c.includes(k) && c.length < menor) { menor = c.length; melhor = i; }
    });
    if (melhor >= 0) return melhor;
  }
  return -1;
}

/* Mapa campo -> indice, e um leitor de celula que nunca estoura. */
function mapear(t, campos) {
  const idx = {}; const faltando = [];
  Object.keys(campos).forEach(k => {
    idx[k] = idxDe(t, campos[k]);
    if (idx[k] < 0) faltando.push(campos[k][0]);
  });
  const cel = (l, k) => {
    const i = idx[k];
    if (i < 0 || i >= l.length) return '';
    const v = l[i];
    return v == null ? '' : String(v).trim();
  };
  return { idx, cel, faltando };
}
/* ==========================================================================
   FONTES - uma funcao de leitura por planilha.
   Cada fonte cai de pe sozinha: o painel usa Promise.allSettled e registra o
   que faltou em ERROS, para a lacuna aparecer declarada em vez de virar zero.
   ========================================================================== */
const DADOS = {};
const ERROS = {};
const AVISOS = [];

/* ---------------------------------------------------------------- 1. ESTEIRA
   Fluxo de Atendimentos [NOVA] - reuniao, proposta e negociacao.
   Le a aba inteira e mapeia por NOME de coluna: a planilha e editada a mao e
   uma coluna nova no meio nao pode trocar o significado de todas as outras. */
const CAMPOS_ATEND = {
  id:         ['ID'],
  lead:       ['Lead'],
  telefone:   ['Telefone'],
  produto:    ['Produto Juridico'],
  sdr:        ['SDR'],
  closer:     ['Closer'],

  temperatura:['Temperatura da Negociacao'],
  vInicial:   ['Valor da Proposta (Honorarios Iniciais)'],
  vExito:     ['Valor da Proposta (Honorarios de Exito)'],

};

/* Etapas agrupadas pelo que elas significam para a gestao. */
const ETAPA_GANHO  = ['enviado a triagem e distribuicao'];
const ETAPA_PERDA  = ['lead perdido'];
const ETAPA_MUDA   = ['lead sem resposta'];

function grupoEtapa(etapa) {
  const k = chaveBusca(etapa);
  if (!k) return 'indefinido';
  if (ETAPA_GANHO.some(e => k.includes(e))) return 'ganho';
  if (ETAPA_PERDA.some(e => k.includes(e))) return 'perdido';
  if (ETAPA_MUDA.some(e => k.includes(e)))  return 'semresposta';
  return 'aberto';
}
const ROTULO_GRUPO = { ganho: 'Ganho', aberto: 'Em aberto', perdido: 'Perdido', semresposta: 'Sem resposta', indefinido: 'Sem etapa' };
const COR_GRUPO    = { ganho: 'var(--s3)', aberto: 'var(--s1)', perdido: 'var(--s8)', semresposta: 'var(--s4)', indefinido: 'var(--texto-muted)' };

/* Ordem da esteira, do mais longe ao mais perto da assinatura. */
const ORDEM_ETAPA = [
  'Reuniao Agendada', 'Remarcar Reuniao', 'Lead Sem Resposta', 'Em Negociacao',
  'Oferta de Honorarios em Liminar', 'Oferta de Honorarios Apenas no Exito', 'Buckner',
  'Confeccionar Contrato', 'Aguardando Assinatura do Contrato', 'Aguardando Pagamento',
  'Enviado a Triagem e Distribuicao', 'Lead Perdido'
];
const posEtapa = e => {
  const k = chaveBusca(e);
  const i = ORDEM_ETAPA.findIndex(o => chaveBusca(o) === k);
  return i < 0 ? 99 : i;
};

async function carregarAtend() {
  const linhas = await lerAba(CONFIG.SHEETS.atend, 'Fluxo de Atendimentos', {
    fonte: 'atend', esperado: ['ID', 'Lead', 'Etapa do Funil', 'Closer']
  });
  const t = tabela(linhas);
  const m = mapear(t, CAMPOS_ATEND);

  /* Os 9 follow ups da esteira (24h, 3d, 5d, 7d, 10d, 14d, 21d Buckner,
     28d liminar, 45d exito) vem em pares [Status] / [Data]. Acho pelo numero
     no cabecalho para nao depender da posicao nem do rotulo de prazo. */
  const fups = [];
  t.norm.forEach((c, i) => {
    const mm = c.match(/^follow up (\d+)/);
    if (!mm) return;
    const n = +mm[1];
    let f = fups.find(x => x.n === n);
    if (!f) { f = { n: n, rotulo: t.cab[i].replace(/\s*\[(status|data)\]\s*$/i, '').trim(), iStatus: -1, iData: -1 }; fups.push(f); }
    if (/\[status\]/.test(c)) f.iStatus = i;
    if (/\[data\]/.test(c))   f.iData = i;
  });
  fups.sort((a, b) => a.n - b.n);

  const h = hoje();
  const reg = t.linhas.map(l => {
    const dAtend  = parseData(m.cel(l, 'dtAtend'));
    const dAgenda = parseData(m.cel(l, 'dtAgenda'));
    const dFecha  = parseData(m.cel(l, 'dtFecha'));
    const etapa   = m.cel(l, 'etapa');
    const r = {
      id: m.cel(l, 'id'),
      lead: m.cel(l, 'lead') || 'Sem nome',
      telefone: m.cel(l, 'telefone'),
      produto: m.cel(l, 'produto') || 'Sem produto',
      sdr: m.cel(l, 'sdr') || 'Sem SDR',
      closer: m.cel(l, 'closer') || 'Sem closer',
      dAgenda: dAgenda, dAtend: dAtend, dFecha: dFecha,
      mes: dAtend ? chaveMes(dAtend) : (dAgenda ? chaveMes(dAgenda) : ''),
      mesFecha: dFecha ? chaveMes(dFecha) : '',
      resultado: m.cel(l, 'resultado'),
      etapa: etapa || 'Sem etapa',
      grupo: grupoEtapa(etapa),
      diasNeg: num(m.cel(l, 'diasNeg')),
      temperatura: m.cel(l, 'temperatura'),
      vInicial: num(m.cel(l, 'vInicial')),
      vExito: num(m.cel(l, 'vExito')),
      motivoPerda: m.cel(l, 'motivoPerda'),
      catPerda: m.cel(l, 'catPerda'),
      origem: m.cel(l, 'origem'),
      respFup: m.cel(l, 'respFup'),
      arquivado: /^(sim|true|1|x)$/i.test(m.cel(l, 'arquivado')),
      tipoPlano: m.cel(l, 'tipoPlano'),
      tipoContrato: m.cel(l, 'tipoContrato'),
      tipoHon: m.cel(l, 'tipoHon'),
      proxAcao: m.cel(l, 'proxAcao'),
      dProxAcao: parseData(m.cel(l, 'dtProxAcao')),
      historico: m.cel(l, 'historico'),
      pasta: m.cel(l, 'pasta'),
      processo: m.cel(l, 'processo'),
      atualizado: m.cel(l, 'atualizado')
    };

    /* Esteira de FUP: "Feito" conta como executado, "Pendente" como devido. */
    r.fups = fups.map(f => ({
      n: f.n, rotulo: f.rotulo,
      status: f.iStatus >= 0 ? String(l[f.iStatus] || '').trim() : '',
      data: f.iData >= 0 ? parseData(l[f.iData]) : null
    }));
    r.fupFeitos   = r.fups.filter(f => /feito/i.test(f.status)).length;
    r.fupPendentes= r.fups.filter(f => /pendente/i.test(f.status)).length;
    r.etapaFup    = r.fupFeitos ? Math.max.apply(null, r.fups.filter(f => /feito/i.test(f.status)).map(f => f.n)) : 0;

    /* Follow up com data no FUTURO e toque AGENDADO, nao toque dado. Misturar
       os dois fazia "dias sem toque" virar negativo (-10 dias), que nao quer
       dizer nada para quem precisa decidir quem cobrar hoje. */
    const passados = r.fups.filter(f => f.data && f.data <= h).sort((a, b) => b.data - a.data);
    const futuros  = r.fups.filter(f => f.data && f.data > h).sort((a, b) => a.data - b.data);
    r.ultimoFup   = passados.length ? passados[0].data : null;
    r.proximoFup  = futuros.length ? futuros[0].data : null;

    /* Dias sem toque: do contato mais recente que a planilha ja registra. */
    const marcos = [r.ultimoFup, r.dAtend].filter(d => d && d <= h);
    r.ultimoToque = marcos.length ? new Date(Math.max.apply(null, marcos)) : null;
    r.diasSemToque = r.ultimoToque ? Math.max(0, diasEntre(r.ultimoToque, h)) : null;
    r.emAberto = r.grupo === 'aberto' && !r.arquivado;
    /* Parado e quem nao tem toque recente NEM proximo toque agendado: com
       FUP marcado para frente, a negociacao esta em andamento. */
    r.parado   = r.emAberto && r.diasSemToque != null && r.diasSemToque > 7 && !r.proximoFup;
    return r;
  }).filter(r => r.id || r.lead !== 'Sem nome');

  return { reg: reg, fups: fups, faltando: m.faltando, linhas: t.linhas.length };
}

    };
  }).filter(r => r.dFecha);

  /* Honorarios zerados com pagamento "Liminar" nao sao venda sem valor: sao
     venda com honorario condicionado a liminar (politica D28). Marco para o
     ticket medio nao ser diluido por eles sem o gestor saber. */
  reg.forEach(r => { r.condicionado = r.honIni === 0 && /liminar/i.test(r.tipoPag); });

  return { reg: reg, faltando: m.faltando, linhas: t.linhas.length };
}

/* ------------------------------------------------------------ 4. METAS/KPIs
   Metas e Resultados [NOVA]. O cabecalho nao esta na linha 1: acho a linha
   que comeca com "Responsavel" e leio dali. */
function lerKpis(linhas) {
  const t = tabela(linhas, 0);
  if (idxDe(t, ['Resultados Chaves']) < 0) throw new Error('nao achei a coluna Resultados Chaves');
  const m = mapear(t, {
    resp: ['Responsavel'], kr: ['Resultados Chaves'], metaMes: ['Meta Mensal'],
    metaProp: ['Meta Proporcional'], resultado: ['Resultado do Mes'],
    vsProp: ['Res. Mensal x Meta Proporcional'], vsMes: ['Res. Mensal x Meta Mensal']
  });

  let respAtual = '';
  const krs = [];
  let diasMes = 0, diasComp = 0, atualizado = '';
  const soltos = [];

  t.linhas.forEach(l => {
    const rotulo = l.map(c => normCab(c));
    const iDias = rotulo.findIndex(c => c === 'dias no mes');
    if (iDias >= 0) diasMes = num(l[iDias + 1]);
    const iComp = rotulo.findIndex(c => c === 'dias computados');
    if (iComp >= 0) diasComp = num(l[iComp + 1]);
    const iUlt = rotulo.findIndex(c => c === 'ultima atualizacao');
    if (iUlt >= 0) atualizado = String(l[iUlt + 1] || '').trim();

    /* Guarda as linhas de rodape em que sobrou uma celula sozinha - ver a
       leitura por forma logo abaixo. */
    const cheias = l.map(c => String(c == null ? '' : c).trim()).filter(v => v !== '');
    if (cheias.length === 1) soltos.push(cheias[0]);

    const kr = m.cel(l, 'kr');
    if (!kr) return;
    const r = m.cel(l, 'resp');
    if (r) respAtual = r;
    const ehPct = /%/.test(m.cel(l, 'metaMes')) || /conversao/i.test(kr);
    const ehRS  = /R\$/.test(m.cel(l, 'metaMes'));
    krs.push({
      resp: respAtual, kr: kr,
      metaMes: num(m.cel(l, 'metaMes')),
      metaProp: num(m.cel(l, 'metaProp')),
      resultado: num(m.cel(l, 'resultado')),
      vsProp: numPct(m.cel(l, 'vsProp')),
      vsMes: numPct(m.cel(l, 'vsMes')),
      tipo: ehRS ? 'moeda' : (ehPct ? 'pct' : 'num'),
      /* No-Show e o unico KR em que menos e melhor. */
      inverso: /no.?show/i.test(kr)
    });
  });
  /* Rodape lido pela FORMA, nao pelo rotulo: o gviz devolve a celula de texto
     ("Dias no Mes") VAZIA quando tipou a coluna como numero, e sobra so o
     valor na ultima coluna. Entao, entre as celulas soltas do rodape, a data
     e a ultima atualizacao e, dos inteiros de 1 a 31, o maior e o total de
     dias do mes e o menor os dias ja computados. Nao depende da ordem. */
  if (!atualizado) {
    const d = soltos.find(v => /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(v));
    if (d) atualizado = d;
  }
  if (!diasMes || !diasComp) {
    const ints = soltos.filter(v => /^\d{1,2}$/.test(v)).map(num).filter(x => x >= 1 && x <= 31);
    if (ints.length) {
      if (!diasMes)  diasMes  = Math.max.apply(null, ints);
      if (!diasComp) diasComp = Math.min.apply(null, ints);
    }
  }
  return { krs: krs, diasMes: diasMes, diasComp: diasComp, atualizado: atualizado };
}

/* Funil de produto juridico: linhas rotuladas (Projecao Mensal, Resultado
   Real...) x colunas de etapa. Vale para a planilha NOVA e para a antiga. */
/* Etapas canonicas do funil de produto. O gviz cola o nome do produto no
   rotulo da primeira coluna ("Revisional de Plano de Saude Leads (Organico)"),
   e as abas de meses diferentes nao tem as mesmas colunas - por isso cada
   rotulo e reduzido a uma destas chaves antes de virar dado. */
const ETAPA_ROT = {
  'leads (organico)': 'Leads (Orgânico)',
  'leads (kommo)': 'Leads (Kommo)',
  'leads (meta ads)': 'Leads (Meta Ads)',
  'leads abordados ou que falaram no whatsapp': 'Leads abordados / WhatsApp',
  'responderam a triagem': 'Responderam a triagem',
  'elegiveis': 'Elegíveis',
  'responderam a qualificacao': 'Responderam a qualificação',
  'qualificados (aguardando documentacao)': 'Qualificados (aguardando documentação)',
  'diagnosticos': 'Diagnósticos',
  'viaveis': 'Viáveis',
  'atendimentos realizados': 'Atendimentos realizados',
  'clientes': 'Clientes',
  'ticket medio': 'Ticket médio',
  'faturamento': 'Faturamento',
  'cpl': 'CPL',
  'investimento mensal': 'Investimento mensal',
  'investimento diario': 'Investimento diário',
  'roi': 'ROI',
  'cac': 'CAC',
  'conversao total': 'Conversão total'
};
const CANON = Object.keys(ETAPA_ROT);
function canonEtapa(rotulo) {
  const k = normCab(rotulo);
  if (!k) return '';
  /* A mais longa primeiro: "leads (meta ads)" antes de um eventual "leads". */
  const hit = CANON.slice().sort((a, b) => b.length - a.length)
    .find(c => k === c || k.endsWith(c));
  return hit || k;
}

function lerProdutos(linhas) {
  const t = tabela(linhas, 0);
  const chaves = t.cab.map(canonEtapa);
  if (!chaves.includes('clientes')) throw new Error('nao achei a coluna Clientes no funil de produto');

  const linha = rot => {
    const k = normCab(rot);
    const l = t.linhas.find(x => normCab(x[0] || '') === k);
    if (!l) return null;
    const o = {};
    chaves.forEach((c, i) => { if (c && i > 0) o[c] = l[i] == null ? '' : String(l[i]).trim(); });
    return o;
  };
  const medicao = (() => {
    for (const l of t.linhas) {
      const i = l.map(c => normCab(c)).indexOf('data da medicao');
      if (i >= 0) return String(l[i + 1] || '').trim();
    }
    return '';
  })();
  return {
    etapas: chaves.slice(1).filter(Boolean).map(k => ({ k: k, rot: ETAPA_ROT[k] || k })),
    real: linha('Resultado Real'),
    projMes: linha('Projecao Mensal') || linha('Projecao Total'),
    projProp: linha('Projecao Proporcional'),
    difer: linha('Diferenca do Resultado Projetado'),
    taxasProj: linha('Dados Projetados'),
    taxasReal: linha('Dados Reais'),
    medicao: medicao
  };
}

/* Os nomes das abas seguem o calendario: "KPIS Outubro", "Produtos
   Juridicos - Out/2026". Monto os nomes a partir da data de hoje para o
   painel virar o mes sozinho, e tento as variantes com e sem acento. */
const MES_ABA  = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                  'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');

async function tentarAbas(sheet, nomes, leitor, headers, fonte) {
  let ultimo = null;
  for (const aba of nomes) {
    try { return { ok: leitor(await lerAba(sheet, aba, { headers: headers, fonte: fonte })) }; }
    catch (e) { ultimo = e; }
  }
  return { erro: ultimo ? ultimo.message : 'aba nao encontrada' };
}

async function carregarMetas() {
  const mi = new Date().getMonth();
  const ano = new Date().getFullYear();
  const out = { meses: {}, okrs: [], produtos: {} };

  /* Nas abas KPIS o cabecalho esta na linha 5 (linhas 1-4 sao titulo). */
  for (const i of [mi, (mi + 11) % 12]) {
    const nome = MES_ABA[i];
    const r = await tentarAbas(CONFIG.SHEETS.metas, ['KPIS ' + nome, 'KPIS ' + semAcento(nome)], lerKpis, 5,
      i === mi ? 'kpisAtual' : 'kpisAnterior');
    out.meses[nome] = r.ok || { erro: r.erro };
  }

  const abasProd = i => {
    const a = i > mi ? ano - 1 : ano;
    const base = ' - ' + MES_ABREV[i] + '/' + a;
    return ['Produtos Jurídicos' + base, 'Produtos Juridicos' + base];
  };
  /* Nas abas de Produtos Juridicos o cabecalho esta na linha 2. */
  const pa = await tentarAbas(CONFIG.SHEETS.metas, abasProd(mi), lerProdutos, 2, 'prodAtual');
  if (pa.ok) out.produtos.atual = pa.ok; else out.produtos.atualErro = pa.erro;
  const pb = await tentarAbas(CONFIG.SHEETS.metas, abasProd((mi + 11) % 12), lerProdutos, 2, 'prodAnterior');
  if (pb.ok) out.produtos.anterior = pb.ok;
  try {
    /* Na aba OKRS o cabecalho esta na linha 4. */
    const l = await lerAba(CONFIG.SHEETS.metas, 'OKRS', { headers: 4, fonte: 'okrs' });
    const t = tabela(l, 0);
    const m = mapear(t, { acao: ['Acao'], resp: ['Responsavel'], prazo: ['Data Conclusao (prevista)'], status: ['Status'], obs: ['Observacao do Resultado'] });
    out.okrs = t.linhas.map(x => ({
      acao: m.cel(x, 'acao'), resp: m.cel(x, 'resp'),
      prazo: parseData(m.cel(x, 'prazo')), status: m.cel(x, 'status'), obs: m.cel(x, 'obs')
    })).filter(x => x.acao);
  } catch (e) { out.okrsErro = e.message; }

  return out;
}

/* ------------------------------------------------- 5. DRE COMERCIAL (custo)
   FLUXO FINANCEIRO 2026, aba "DRE COMERCIAL". E o que permite sair do CAC de
   midia (so Meta Ads) para o CAC real: custo do setor comercial inteiro -
   SDR e closer (fixo e variavel), lider, estagiarios, CRM, automacoes, midia.

   Atencao ao regime: a DRE e de CAIXA (o que entrou e saiu no mes) e a
   planilha de clientes e de COMPETENCIA (contrato assinado no mes). Os dois
   numeros de receita nao batem de proposito - o painel mostra a diferenca em
   vez de escolher um e esconder o outro. */
const DRE_MESES = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO',
                   'JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];

/* Como cada linha de custo do setor comercial e lida pela gestao. */
const BUCKET_COMERCIAL = {
  pessoas: ['lider comercial (fixo)', 'lider comercial (variavel)',
            'sdrs e social selling (fixo)', 'sdrs e social selling (variavel)',
            'closers (fixo)', 'closers (variavel)',
            'rescisao do contrato (comercial)', 'estagiarios (comercial)'],
  midia:   ['meta ads', 'google ads', 'social media', 'outras despesas de marketing'],
  ferramentas: ['crm', 'programas e automacoes (comercial)', 'robo ia', 'robo i.a.', 'voip', 'v.o.i.p.']
};
function bucketDe(rotulo) {
  const k = normCab(rotulo);
  for (const b of Object.keys(BUCKET_COMERCIAL)) {
    if (BUCKET_COMERCIAL[b].some(x => normCab(x) === k)) return b;
  }
  return 'outros';
}

async function carregarFinanceiro() {
  const linhas = await lerAba(CONFIG.SHEETS.financeiro, 'DRE COMERCIAL', {
    fonte: 'fin', esperado: ['JANEIRO', 'DEZEMBRO']
  });
  const t = tabela(linhas, 0);
  const ano = new Date().getFullYear();

  /* Coluna de cada mes, achada pelo NOME - a planilha tem PROJECAO antes e
     MEDIA/ACUMULADO depois, e a posicao pode mudar. */
  const colMes = DRE_MESES.map(m => idxDe(t, [m]));
  const iProj = idxDe(t, ['PROJECAO']);

  const linhaDe = l => {
    const o = { rotulo: String(l[0] || '').trim(), meses: {}, projecao: iProj >= 0 ? num(l[iProj]) : 0, total: 0 };
    colMes.forEach((c, i) => {
      if (c < 0) return;
      const v = num(l[c]);
      o.meses[ano + '-' + String(i + 1).padStart(2, '0')] = v;
      o.total += v;
    });
    return o;
  };

  const todas = t.linhas.filter(l => String(l[0] || '').trim()).map(linhaDe);
  const achar = txt => {
    const k = normCab(txt);
    return todas.find(x => normCab(x.rotulo) === k) ||
           todas.find(x => normCab(x.rotulo).indexOf(k) === 0) || null;
  };

  /* As linhas de custo do setor comercial sao as que ficam ENTRE o cabecalho
     "(-) SETOR COMERCIAL" e a proxima secao "(-) IMPOSTOS". */
  const iCom = todas.findIndex(x => normCab(x.rotulo).indexOf('(-) setor comercial') === 0);
  const iImp = todas.findIndex((x, i) => i > iCom && normCab(x.rotulo).indexOf('(-) impostos') === 0);
  const itens = (iCom >= 0 ? todas.slice(iCom + 1, iImp > iCom ? iImp : undefined) : [])
    .filter(x => x.rotulo.indexOf('(') !== 0 && x.total !== 0)
    .map(x => Object.assign({ bucket: bucketDe(x.rotulo) }, x));

  /* Meses com movimento: o resto do ano esta zerado na planilha e entraria
     como "custo zero", nao como "mes que ainda nao aconteceu". */
  const receita = achar('(+) RECEITAS');
  const comercial = achar('(-) SETOR COMERCIAL');
  const mesesAtivos = Object.keys((receita && receita.meses) || {})
    .filter(k => (receita && receita.meses[k]) || (comercial && comercial.meses[k]));

  return {
    ano: ano, meses: mesesAtivos, itens: itens, todas: todas,
    receita: receita,
    honorarios: achar('HONORARIOS INICIAIS'),
    bancarias: achar('(-) DESPESAS BANCARIAS'),
    rateio: achar('(-) SETOR PROCESSUAL'),
    comercial: comercial,
    impostos: achar('(-) IMPOSTOS'),
    despesas: achar('(=) TOTAL DESPESAS'),
    lucro: achar('(=) LUCRO LIQUIDO')
  };
}

   Planilha antiga: uso so o acumulado do ano, que e o unico recorte com
   estrutura estavel entre as ~80 abas. */
async function carregarHistorico() {
  const ano = new Date().getFullYear();
  const r = await tentarAbas(CONFIG.SHEETS.antiga, [
    'Produtos Jurídicos [Acumulado ' + ano + ']',
    'Produtos Juridicos [Acumulado ' + ano + ']'
  ], lerProdutos, 2, 'hist');
  if (!r.ok) throw new Error(r.erro);
  return { acumulado: r.ok };
}

/* ------------------------------------------------------------- 6. KOMMO
   Leads Kommo [DASHBOARDS], aba Leads - pre-qualificacao lead a lead.
   Dois formatos convivem na aba hoje: o coletor foi reescrito para um layout
   largo (57 colunas, com valor/motivo de perda/utm) e a rodada falhou no meio,
   deixando o cabecalho novo sobre linhas no layout antigo (17 colunas).
   Detecto por linha: linha curta sob cabecalho largo = layout antigo. */
const LEGADO_KOMMO = ['id','lead','criado','hora','funil','etapa','situacao','origem','campanha',
  'produto','plano','tipoPlano','mensalidade','tempo','responsavel','reuniao','atualizado'];

async function carregarKommo() {
  const linhas = await lerAba(CONFIG.SHEETS.kommo, 'Leads', { fonte: 'kommo', tq: 'select ' + letrasAte(57) });
  const t = tabela(linhas);
  const largo = t.norm.includes('lead_id');
  const m = mapear(t, {
    id:        ['lead_id', 'ID'],
    lead:      ['nome', 'Lead', 'contato_nome'],
    criado:    ['criado_data', 'criado em', 'criado_em'],
    hora:      ['Hora'],
    funil:     ['funil'],
    etapa:     ['etapa'],
    situacao:  ['situacao'],
    origem:    ['Origem'],
    campanha:  ['Campanha'],
    produto:   ['Produto Juridico'],
    plano:     ['Qual seu plano de saude', 'plano de saude'],
    tipoPlano: ['Qual o tipo do seu plano', 'tipo do plano'],
    mensalidade:['Qual o valor da mensalidade', 'mensalidade'],
    tempo:     ['Quanto tempo voce esta nele', 'tempo de plano'],
    responsavel:['responsavel'],
    reuniao:   ['Proximo agendamento', 'reuniao em'],
    valor:     ['valor'],
    motivoPerda:['motivo_perda'],
    fechado:   ['fechado_data'],
    diasFechar:['dias_para_fechar']
  });

  let legadas = 0;
  const reg = t.linhas.map(l => {
    /* Linha curta sob cabecalho largo: le pela posicao do layout antigo. */
    const antiga = largo && l.length <= 18;
    if (antiga) legadas++;
    const pega = k => {
      if (!antiga) return m.cel(l, k);
      const i = LEGADO_KOMMO.indexOf(k);
      if (i < 0 || i >= l.length) return '';
      return l[i] == null ? '' : String(l[i]).trim();
    };
    const d = parseData(pega('criado'));
    const r = {
      id: pega('id'),
      lead: pega('lead') || 'Lead sem nome',
      d: d, mes: d ? chaveMes(d) : '',
      funil: pega('funil') || 'Sem funil',
      etapa: pega('etapa') || 'Sem etapa',
      situacao: pega('situacao') || 'Em aberto',
      origem: pega('origem') || 'Sem origem',
      campanha: pega('campanha'),
      produto: pega('produto') || 'Sem produto',
      plano: pega('plano'), tipoPlano: pega('tipoPlano'),
      mensalidade: pega('mensalidade'), tempo: pega('tempo'),
      responsavel: pega('responsavel') || 'Sem responsavel',
      reuniao: parseData(pega('reuniao')),
      valor: num(pega('valor')),
      motivoPerda: pega('motivoPerda'),
      legado: antiga
    };
    /* Pre-qualificado e quem respondeu a triagem. Uma resposta basta: quem
       comecou a responder passou pelo formulario. */
    r.preQual = !!(r.plano || r.tipoPlano || r.mensalidade || r.tempo);
    r.perdido = /perdid|lost/i.test(r.situacao);
    r.ganho   = /ganh|won/i.test(r.situacao);
    return r;
  }).filter(r => r.d);

  /* O funil Processual nao e comercial: sao clientes que ja estao na casa. */
  const comercial = reg.filter(r => !/processual/i.test(r.funil));

  return {
    reg: comercial, todos: reg, legadas: legadas,
    formato: largo ? 'largo' : 'antigo', faltando: m.faltando, linhas: t.linhas.length
  };
}

/* --------------------------------------------------- 7. CEREBRO COMERCIAL
   "TODOS OS LEADS [CEREBRO COMERCIAL]", aba TODOS OS LEADS: a espinha dorsal
   que ja junta Kommo, Fluxo de Atendimentos e Fluxo de Clientes (2025 e 2026)
   numa so tabela, um registro por linha, colunas padronizadas.

   Vale por duas coisas que as fontes separadas nao dao: 2025 inteiro e a
   JORNADA do mesmo lead atravessando os estagios. Em compensacao, o mesmo
   lead aparece em mais de uma linha - e o funil. Para contagem unica, agrupe
   por nome.

   So e lida pelo proxy: a planilha e privada, e e assim que deve ficar. */
async function carregarCerebro() {
  const linhas = await lerAba(CONFIG.SHEETS.cerebro, 'TODOS OS LEADS', {
    fonte: 'cerebro', soProxy: true, esperado: ['ESTAGIO', 'NOME']
  });
  const t = tabela(linhas, 0);
  const m = mapear(t, {
    estagio:   ['ESTAGIO'],
    fonte:     ['FONTE'],
    id:        ['ID'],
    nome:      ['NOME'],
    telefone:  ['TELEFONE'],
    produto:   ['PRODUTO JURIDICO'],
    origem:    ['ORIGEM'],
    campanha:  ['CAMPANHA'],
    funil:     ['FUNIL'],
    etapa:     ['ETAPA / SITUACAO', 'ETAPA'],
    motivoPerda:['MOTIVO DE PERDA'],
    temperatura:['TEMPERATURA'],
    sdr:       ['SDR'],
    closer:    ['CLOSER'],
    responsavel:['RESPONSAVEL'],
    primeiro:  ['DATA 1 CONTATO', 'DATA 1o CONTATO'],
    dReuniao:  ['DATA DA REUNIAO'],
    dFecha:    ['DATA DO FECHAMENTO'],
    diasFechar:['DIAS PARA FECHAR'],
    jornada:   ['JORNADA COMPLETA (DIAS)', 'JORNADA COMPLETA'],
    honIni:    ['HONORARIOS INICIAIS'],
    honFim:    ['HONORARIOS DE EXITO (%)', 'HONORARIOS DE EXITO'],
    entrada:   ['VALOR DA ENTRADA'],
    pagoOk:    ['PAGAMENTO CONFIRMADO'],
    tipoPag:   ['TIPO DE PAGAMENTO'],
    tipoHon:   ['TIPO DE CONTRATO (HONORARIOS)'],
    tipoPlano: ['TIPO DE PLANO'],
    mensalidade:['MENSALIDADE']
  });

  /* "1. Pre-qualificacao" / "2. Reuniao" / "3. Cliente" - o numero na frente
     e a ordem do funil, e e por ele que ordeno em vez de alfabetico. */
  const ordemEstagio = e => {
    const n = String(e || '').match(/^\s*(\d+)/);
    return n ? +n[1] : 99;
  };

  const reg = t.linhas.map(l => {
    const dF = parseData(m.cel(l, 'dFecha'));
    const dR = parseData(m.cel(l, 'dReuniao'));
    const d1 = parseData(m.cel(l, 'primeiro'));
    const estagio = m.cel(l, 'estagio') || 'Sem estagio';
    const r = {
      estagio: estagio, ordem: ordemEstagio(estagio),
      fonteOrig: m.cel(l, 'fonte'),
      id: m.cel(l, 'id'),
      nome: m.cel(l, 'nome') || 'Sem nome',
      chave: chaveBusca(m.cel(l, 'nome')),
      telefone: m.cel(l, 'telefone'),
      produto: m.cel(l, 'produto') || 'Sem produto',
      origem: m.cel(l, 'origem') || 'Sem origem',
      campanha: m.cel(l, 'campanha'),
      funil: m.cel(l, 'funil'),
      etapa: m.cel(l, 'etapa'),
      motivoPerda: m.cel(l, 'motivoPerda'),
      temperatura: m.cel(l, 'temperatura'),
      sdr: m.cel(l, 'sdr') || 'Sem SDR',
      closer: m.cel(l, 'closer') || 'Sem closer',
      primeiro: d1, dReuniao: dR, dFecha: dF,
      /* A data que situa o registro no tempo muda com o estagio. */
      d: dF || dR || d1,
      mes: (dF || dR || d1) ? chaveMes(dF || dR || d1) : '',
      diasFechar: num(m.cel(l, 'diasFechar')),
      jornada: num(m.cel(l, 'jornada')),
      honIni: num(m.cel(l, 'honIni')),
      honFim: numPct(m.cel(l, 'honFim')),
      entrada: num(m.cel(l, 'entrada')),
      pagoOk: /^(sim|s|true|1)$/i.test(m.cel(l, 'pagoOk').replace(/â/g, 'a')),
      tipoPag: m.cel(l, 'tipoPag'),
      tipoHon: m.cel(l, 'tipoHon'),
      tipoPlano: m.cel(l, 'tipoPlano'),
      mensalidade: m.cel(l, 'mensalidade')
    };
    r.cliente = r.ordem === 3;
    r.reuniao = r.ordem === 2;
    r.prequal = r.ordem === 1;
    return r;
  }).filter(r => r.nome !== 'Sem nome' || r.id);

  /* Pessoas unicas: o mesmo nome aparece em ate tres estagios. */
  const porPessoa = new Map();
  reg.forEach(r => {
    if (!r.chave) return;
    if (!porPessoa.has(r.chave)) porPessoa.set(r.chave, { nome: r.nome, estagios: new Set(), registros: [] });
    const p = porPessoa.get(r.chave);
    p.estagios.add(r.ordem);
    p.registros.push(r);
  });

  return { reg: reg, pessoas: porPessoa, faltando: m.faltando, linhas: t.linhas.length };
}

/* As chaves que o proxy conhece. Uma fonte do painel pode precisar de varias

const FONTES_PROXY = ['atend', 'clientes', 'metaDia', 'metaCamp', 'metaReun',

  'kpisAtual', 'kpisAnterior', 'prodAtual', 'prodAnterior', 'okrs',

async function carregarTudo() {
  Object.keys(ERROS).forEach(k => delete ERROS[k]);
  AVISOS.length = 0;
  PROXY_DADOS = null; PROXY_ERROS = {}; PROXY_FALHA = null; TRANSPORTE = 'gviz';

  /* Uma viagem so para tudo, quando o proxy esta configurado. Se ele nao
     responder, o painel cai para a leitura direta em vez de ficar vazio - e
     diz na tela de fontes que caiu. */
  if (CONFIG.PROXY && TOKEN) {
    try {
      const j = await proxyLer(FONTES_PROXY);
      PROXY_DADOS = j.dados || {};
      PROXY_ERROS = j.erros || {};
      TRANSPORTE = 'proxy';
    } catch (e) {
      PROXY_FALHA = e.message || String(e);
      AVISOS.push({ nivel: 'critico', fonte: 'Proxy Apps Script',
        txt: 'nao respondeu (' + PROXY_FALHA + '). O painel voltou a ler as planilhas direto, ' +
             'o que so funciona nas que ainda estao compartilhadas por link.' });
    }
  }

  const res = await Promise.allSettled(FONTES.map(f => f.fn()));
  res.forEach((r, i) => {
    const f = FONTES[i];
    if (r.status === 'fulfilled') {
      DADOS[f.k] = r.value;
      if (r.value && r.value.faltando && r.value.faltando.length) {
        AVISOS.push({ nivel: 'atencao', fonte: f.nome,
          txt: 'colunas nao encontradas: ' + r.value.faltando.join(', ') + '. Os campos ficam vazios no painel.' });
      }
    } else {
      delete DADOS[f.k];
      ERROS[f.k] = (r.reason && r.reason.message) || String(r.reason);
    }
  });
  ULTIMA_LEITURA = new Date();
  return DADOS;
}
/* ==========================================================================
   GRAFICOS - SVG inline, sem biblioteca.
   Regras seguidas aqui (paleta validada em validate_palette.js):
     . uma escala por grafico. Nunca dois eixos Y.
     . cor categorica em ordem fixa (--s1..--s8), nunca ciclada;
       da 9a serie em diante tudo cai em "Outros".
     . magnitude de etapa usa a rampa de um so tom (--r1..--r6).
     . marca fina, ponta arredondada 4px ancorada na linha de base,
       2px de respiro entre fatias empilhadas e barras vizinhas.
     . texto sempre em token de texto, nunca na cor da serie.
     . camada de hover por padrao em todo grafico.
   ========================================================================== */
const SERIES = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const RAMPA  = ['var(--r1)','var(--r2)','var(--r3)','var(--r4)','var(--r5)','var(--r6)'];
const corSerie = i => SERIES[i] || 'var(--texto-muted)';
const corRampa = (i, n) => RAMPA[Math.min(RAMPA.length - 1, Math.round((i / Math.max(1, n - 1)) * (RAMPA.length - 1)))];

/* Escala "bonita": topo arredondado para 1/2/5 x 10^n. */
function escalaTopo(max) {
  if (!(max > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(max)));
  const r = max / e;
  const p = r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10;
  return p * e;
}
function ticks(topo, n) {
  const out = [];
  for (let i = 0; i <= n; i++) out.push((topo / n) * i);
  return out;
}

/* Barra com a ponta de cima arredondada e a base reta (ancorada no eixo). */
function barraTopoRedondo(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h));
  if (h <= 0.5) return '';
  return 'M' + x + ',' + (y + h) + 'V' + (y + rr) +
         'q0,' + (-rr) + ' ' + rr + ',' + (-rr) +
         'h' + (w - 2 * rr) +
         'q' + rr + ',0 ' + rr + ',' + rr +
         'V' + (y + h) + 'Z';
}
/* Idem para barra horizontal: ponta da direita arredondada. */
function barraFimRedondo(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, h / 2, w));
  if (w <= 0.5) return '';
  return 'M' + x + ',' + y + 'H' + (x + w - rr) +
         'q' + rr + ',0 ' + rr + ',' + rr +
         'v' + (h - 2 * rr) +
         'q0,' + rr + ' ' + (-rr) + ',' + rr +
         'H' + x + 'Z';
}

const tipLinha = (cor, rot, val) =>
  '<div class="d-linha">' + (cor ? '<span class="d-marca" style="background:' + cor + '"></span>' : '') +
  '<span>' + rot + '</span><span class="d-val">' + val + '</span></div>';

/* ===== SISTEMA DE COORDENADAS =====
   O viewBox e escrito em unidades que valem ~1px na largura tipica de um
   cartao (600). Com width:100% e altura automatica, o SVG mantem a proporcao
   do viewBox e o texto escala junto, uniformemente.

   O erro a evitar aqui: viewBox estreito (100 unidades) com width:100%. A
   altura vira 6x a largura do cartao - um grafico de 1.100px de altura - e
   forcar a altura por CSS junto com preserveAspectRatio="none" distorce o
   texto na horizontal. Por isso: viewBox largo e escala uniforme. */
const VW = 600;

/* ---------------------------------------------------------- COLUNAS (tempo) */
function vizColunas(o) {
  const dados = o.dados || [];
  if (!dados.length) return '<div class="vazio">Sem dados no recorte.</div>';
  const W = VW, H = o.altura || 230;
  const mE = 52, mD = 12, mT = o.rotulos === false ? 12 : 22, mB = 30;
  const fmt = o.fmt || n0;
  const topo = escalaTopo(Math.max.apply(null, dados.map(d => d.v).concat([0])));
  const pw = (W - mE - mD) / dados.length;
  const bw = Math.max(4, Math.min(pw * 0.6, 44));
  const ph = H - mT - mB;
  const y = v => mT + ph - (v / topo) * ph;
  const passo = Math.ceil(dados.length / 12);

  let s = '<svg class="viz" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  ticks(topo, 4).forEach(t => {
    s += '<line class="grade" x1="' + mE + '" x2="' + (W - mD) + '" y1="' + y(t) + '" y2="' + y(t) + '" vector-effect="non-scaling-stroke"/>';
    s += '<text class="eixo" x="' + (mE - 8) + '" y="' + (y(t) + 3.6) + '" text-anchor="end">' + (o.fmtEixo || n0)(t) + '</text>';
  });
  dados.forEach((d, i) => {
    const cx = mE + pw * i + pw / 2;
    const h = Math.max(0, (d.v / topo) * ph);
    const cor = d.cor || o.cor || 'var(--s1)';
    const tip = '<span class="d-tit">' + esc(d.rot || d.k) + '</span>' + tipLinha(cor, o.nome || 'Valor', fmt(d.v)) +
      (d.extra || []).map(e => tipLinha(e.cor, esc(e.rot), e.val)).join('');
    s += '<g data-tip="' + esc(tip) + '">';
    s += '<rect class="alvo" x="' + (cx - pw / 2) + '" y="' + mT + '" width="' + pw + '" height="' + ph + '"/>';
    s += '<path d="' + barraTopoRedondo(cx - bw / 2, y(d.v), bw, h, 4) + '" fill="' + cor + '"/>';
    s += '</g>';
    if (o.rotulos !== false && dados.length <= 14 && d.v > 0)
      s += '<text class="rotulo-dado" x="' + cx + '" y="' + (y(d.v) - 7) + '" text-anchor="middle">' + fmt(d.v) + '</text>';
    if (i % passo === 0)
      s += '<text class="eixo" x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(d.k) + '</text>';
  });
  return s + '</svg>';
}

/* --------------------------------------------------------- BARRAS (ranking) */
function vizBarras(o) {
  const dados = (o.dados || []).filter(d => d.v != null);
  if (!dados.length) return '<div class="vazio">Sem dados no recorte.</div>';
  const fmt = o.fmt || n0;
  const linha = 30, W = VW;
  const H = dados.length * linha + 10;
  const rotW = o.rotuloW || 196;
  const numW = 96;
  const max = Math.max.apply(null, dados.map(d => Math.abs(d.v)).concat([0])) || 1;
  const pista = W - rotW - numW;

  let s = '<svg class="viz" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  dados.forEach((d, i) => {
    const yb = 5 + i * linha;
    const meio = yb + linha / 2;
    const w = (Math.abs(d.v) / max) * pista;
    const cor = d.cor || o.cor || 'var(--s1)';
    const tip = '<span class="d-tit">' + esc(d.k) + '</span>' + tipLinha(cor, o.nome || 'Valor', fmt(d.v)) +
      (d.extra || []).map(e => tipLinha(e.cor, esc(e.rot), e.val)).join('');
    s += '<g data-tip="' + esc(tip) + '">';
    s += '<rect class="alvo" x="0" y="' + yb + '" width="' + W + '" height="' + linha + '"/>';
    s += '<text class="eixo" x="0" y="' + (meio + 4) + '" style="fill:var(--texto-2);font-size:11.5px">' +
         esc(d.k.length > 32 ? d.k.slice(0, 31) + '…' : d.k) + '</text>';
    s += '<rect x="' + rotW + '" y="' + (meio - 6) + '" width="' + pista + '" height="12" rx="4" fill="var(--bg4)" opacity=".55"/>';
    s += '<path d="' + barraFimRedondo(rotW, meio - 6, Math.max(w, 2), 12, 4) + '" fill="' + cor + '"/>';
    s += '<text class="rotulo-dado" x="' + (W - 2) + '" y="' + (meio + 4) + '" text-anchor="end" style="font-size:11.5px">' + fmt(d.v) + '</text>';
    s += '</g>';
  });
  return s + '</svg>';
}

/* ----------------------------------------------------------- LINHAS (tempo) */
function vizLinhas(o) {
  const x = o.x || [];
  const series = (o.series || []).filter(s => s.vals && s.vals.length);
  if (!x.length || !series.length) return '<div class="vazio">Sem dados no recorte.</div>';
  const W = VW, H = o.altura || 240;
  const mE = 56, mD = 14, mT = 16, mB = 30;
  const fmt = o.fmt || n0;
  let max = 0;
  series.forEach(s => s.vals.forEach(v => { if (v != null && v > max) max = v; }));
  const topo = escalaTopo(max);
  const pw = x.length > 1 ? (W - mE - mD) / (x.length - 1) : 0;
  const ph = H - mT - mB;
  const px = i => mE + pw * i + (x.length > 1 ? 0 : (W - mE - mD) / 2);
  const py = v => mT + ph - (v / topo) * ph;
  const passo = Math.ceil(x.length / 12);

  let s = '<svg class="viz" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  ticks(topo, 4).forEach(t => {
    s += '<line class="grade" x1="' + mE + '" x2="' + (W - mD) + '" y1="' + py(t) + '" y2="' + py(t) + '" vector-effect="non-scaling-stroke"/>';
    s += '<text class="eixo" x="' + (mE - 8) + '" y="' + (py(t) + 3.6) + '" text-anchor="end">' + (o.fmtEixo || n0)(t) + '</text>';
  });
  series.forEach((se, si) => {
    const cor = se.cor || corSerie(si);
    let d = '', aberto = false;
    se.vals.forEach((v, i) => {
      if (v == null) { aberto = false; return; }
      d += (aberto ? 'L' : 'M') + px(i) + ',' + py(v); aberto = true;
    });
    if (o.area && series.length === 1) {
      const prim = se.vals.findIndex(v => v != null);
      let ult = -1; se.vals.forEach((v, i) => { if (v != null) ult = i; });
      if (prim >= 0 && ult > prim) {
        s += '<path d="' + d + 'L' + px(ult) + ',' + py(0) + 'L' + px(prim) + ',' + py(0) + 'Z" fill="' + cor + '" opacity=".12"/>';
      }
    }
    s += '<path d="' + d + '" fill="none" stroke="' + cor + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
    if (x.length <= 26) se.vals.forEach((v, i) => {
      if (v == null) return;
      s += '<circle class="ponto" cx="' + px(i) + '" cy="' + py(v) + '" r="3.4" fill="' + cor + '"/>';
    });
  });
  /* Faixa por ponto no eixo X: um alvo de hover maior que a marca, com todas
     as series do ponto no mesmo balao. */
  x.forEach((rot, i) => {
    const tip = '<span class="d-tit">' + esc(rot) + '</span>' + series.map((se, si) =>
      se.vals[i] == null ? '' : tipLinha(se.cor || corSerie(si), esc(se.nome), fmt(se.vals[i]))).join('');
    s += '<g class="banda" data-tip="' + esc(tip) + '">';
    s += '<line class="crosshair" x1="' + px(i) + '" x2="' + px(i) + '" y1="' + mT + '" y2="' + (mT + ph) + '" vector-effect="non-scaling-stroke"/>';
    s += '<rect class="alvo" x="' + (px(i) - (pw || 40) / 2) + '" y="' + mT + '" width="' + (pw || 40) + '" height="' + ph + '"/>';
    s += '</g>';
    if (i % passo === 0)
      s += '<text class="eixo" x="' + px(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(rot) + '</text>';
  });
  return s + '</svg>';
}

/* ------------------------------------------------------------------- FUNIL */
function vizFunil(etapas) {
  const et = (etapas || []).filter(e => e.v != null);
  if (!et.length) return '<div class="vazio">Sem dados de funil.</div>';
  const base = et[0].v || 1;
  let h = '<div style="display:flex;flex-direction:column;gap:2px">';
  et.forEach((e, i) => {
    const largura = Math.max(3, (e.v / base) * 100);
    const cor = corRampa(i, et.length);
    const ant = i > 0 ? et[i - 1].v : null;
    const conv = ant ? taxa(e.v, ant) : null;
    const tip = '<span class="d-tit">' + esc(e.k) + '</span>' +
      tipLinha(cor, 'Volume', n0(e.v)) +
      (conv != null ? tipLinha('', 'Conversao da etapa anterior', pct(conv, 1)) : '') +
      tipLinha('', 'Do topo do funil', pct(taxa(e.v, base), 2));
    h += '<div data-tip="' + esc(tip) + '" style="display:flex;align-items:center;gap:0.6rem;cursor:default">';
    h += '<div style="flex:0 0 40%;max-width:210px;font-size:0.74rem;color:var(--texto-2);line-height:1.3">' + esc(e.k) + '</div>';
    h += '<div style="flex:1;min-width:0;display:flex;align-items:center;gap:0.5rem">';
    h += '<div style="height:20px;border-radius:4px;background:' + cor + ';width:' + largura + '%;min-width:3px"></div>';
    h += '<span style="font-size:0.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--texto)">' + n0(e.v) + '</span>';
    if (conv != null) h += '<span style="font-size:0.7rem;color:var(--texto-muted);font-variant-numeric:tabular-nums">' + pct(conv, 0) + '</span>';
    h += '</div></div>';
  });
  return h + '</div>';
}

/* ------------------------------------------------------------------- DONUT */
function vizDonut(o) {
  const dados = (o.dados || []).filter(d => d.v > 0);
  if (!dados.length) return '<div class="vazio">Sem dados no recorte.</div>';
  const total = dados.reduce((a, d) => a + d.v, 0);
  const R = 104, r = 68, cx = 120, cy = 120;
  const fmt = o.fmt || n0;
  /* 2px de respiro entre fatias, em graus na borda externa. */
  const gap = 1.4;
  let ang = -90;
  let s = '<svg class="viz" viewBox="0 0 240 240" style="max-height:232px" role="img">';
  dados.forEach((d, i) => {
    const frac = d.v / total;
    const a0 = ang, a1 = ang + frac * 360;
    ang = a1;
    const cor = d.cor || corSerie(i);
    const ia0 = (a0 + gap / 2) * Math.PI / 180, ia1 = (a1 - gap / 2) * Math.PI / 180;
    if (ia1 <= ia0) return;
    const grande = (a1 - a0) > 180 ? 1 : 0;
    const p = [
      'M', cx + R * Math.cos(ia0), cy + R * Math.sin(ia0),
      'A', R, R, 0, grande, 1, cx + R * Math.cos(ia1), cy + R * Math.sin(ia1),
      'L', cx + r * Math.cos(ia1), cy + r * Math.sin(ia1),
      'A', r, r, 0, grande, 0, cx + r * Math.cos(ia0), cy + r * Math.sin(ia0), 'Z'
    ].join(' ');
    const tip = '<span class="d-tit">' + esc(d.k) + '</span>' + tipLinha(cor, 'Valor', fmt(d.v)) +
      tipLinha('', 'Participacao', pct(frac * 100, 1));
    s += '<path d="' + p + '" fill="' + cor + '" data-tip="' + esc(tip) + '" style="cursor:default"/>';
  });
  s += '<text x="120" y="118" text-anchor="middle" style="font-size:30px;font-weight:700;letter-spacing:-0.02em;fill:var(--texto)">' + (o.centro || fmt(total)) + '</text>';
  s += '<text x="120" y="138" text-anchor="middle" style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:var(--texto-muted)">' + esc(o.centroRot || 'total') + '</text>';
  return s + '</svg>';
}

/* --------------------------------------------------------------- EMPILHADO */
function vizEmpilhado(o) {
  const x = o.x || [];
  const series = o.series || [];
  if (!x.length || !series.length) return '<div class="vazio">Sem dados no recorte.</div>';
  const W = VW, H = o.altura || 240;
