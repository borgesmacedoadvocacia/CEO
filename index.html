/* ------------------------------------------------------------- 6. KOMMO
   Leads Kommo [DASHBOARDS], aba Leads - pre-qualificacao lead a lead.
   Dois formatos convivem na aba hoje: o coletor foi reescrito para um layout
   largo (57 colunas, com valor/motivo de perda/utm) e a rodada falhou no meio,
   deixando o cabecalho novo sobre linhas no layout antigo (17 colunas).
   Detecto por linha: linha curta sob cabecalho largo = layout antigo. */
const LEGADO_KOMMO = ['id','lead','criado','hora','funil','etapa','situacao','origem','campanha',
  'produto','plano','tipoPlano','mensalidade','tempo','responsavel','reuniao','atualizado'];

async function carregarKommo() {
  const linhas = await lerAba(CONFIG.SHEETS.kommo, 'Leads', { fonte: 'kommo', tq: 'select ' + letrasAte(57) });
  const t = tabela(linhas);
  const largo = t.norm.includes('lead_id');
  const m = mapear(t, {
    id:        ['lead_id', 'ID'],
    lead:      ['nome', 'Lead', 'contato_nome'],
    criado:    ['criado_data', 'criado em', 'criado_em'],
    hora:      ['Hora'],
    funil:     ['funil'],
    etapa:     ['etapa'],
    situacao:  ['situacao'],
    origem:    ['Origem'],
    campanha:  ['Campanha'],
    produto:   ['Produto Juridico'],
    plano:     ['Qual seu plano de saude', 'plano de saude'],
    tipoPlano: ['Qual o tipo do seu plano', 'tipo do plano'],
    mensalidade:['Qual o valor da mensalidade', 'mensalidade'],
    tempo:     ['Quanto tempo voce esta nele', 'tempo de plano'],
    responsavel:['responsavel'],
    reuniao:   ['Proximo agendamento', 'reuniao em'],
    valor:     ['valor'],
    motivoPerda:['motivo_perda'],
    fechado:   ['fechado_data'],
    diasFechar:['dias_para_fechar']
  });

  let legadas = 0;
  const reg = t.linhas.map(l => {
    /* Linha curta sob cabecalho largo: le pela posicao do layout antigo. */
    const antiga = largo && l.length <= 18;
    if (antiga) legadas++;
    const pega = k => {
      if (!antiga) return m.cel(l, k);
      const i = LEGADO_KOMMO.indexOf(k);
      if (i < 0 || i >= l.length) return '';
      return l[i] == null ? '' : String(l[i]).trim();
    };
    const d = parseData(pega('criado'));
    const r = {
      id: pega('id'),
      lead: pega('lead') || 'Lead sem nome',
      d: d, mes: d ? chaveMes(d) : '',
      funil: pega('funil') || 'Sem funil',
      etapa: pega('etapa') || 'Sem etapa',
      situacao: pega('situacao') || 'Em aberto',
      origem: pega('origem') || 'Sem origem',
      campanha: pega('campanha'),
      produto: pega('produto') || 'Sem produto',
      plano: pega('plano'), tipoPlano: pega('tipoPlano'),
      mensalidade: pega('mensalidade'), tempo: pega('tempo'),
      responsavel: pega('responsavel') || 'Sem responsavel',
      reuniao: parseData(pega('reuniao')),
      valor: num(pega('valor')),
      motivoPerda: pega('motivoPerda'),
      legado: antiga
    };
    /* Pre-qualificado e quem respondeu a triagem. Uma resposta basta: quem
       comecou a responder passou pelo formulario. */
    r.preQual = !!(r.plano || r.tipoPlano || r.mensalidade || r.tempo);
    r.perdido = /perdid|lost/i.test(r.situacao);
    r.ganho   = /ganh|won/i.test(r.situacao);
    return r;
  }).filter(r => r.d);

  /* O funil Processual nao e comercial: sao clientes que ja estao na casa. */
  const comercial = reg.filter(r => !/processual/i.test(r.funil));

  return {
    reg: comercial, todos: reg, legadas: legadas,
    formato: largo ? 'largo' : 'antigo', faltando: m.faltando, linhas: t.linhas.length
  };
}

/* --------------------------------------------------- 7. CEREBRO COMERCIAL
   "TODOS OS LEADS [CEREBRO COMERCIAL]", aba TODOS OS LEADS: a espinha dorsal
   que ja junta Kommo, Fluxo de Atendimentos e Fluxo de Clientes (2025 e 2026)
   numa so tabela, um registro por linha, colunas padronizadas.

   Vale por duas coisas que as fontes separadas nao dao: 2025 inteiro e a
   JORNADA do mesmo lead atravessando os estagios. Em compensacao, o mesmo
   lead aparece em mais de uma linha - e o funil. Para contagem unica, agrupe
   por nome.

   So e lida pelo proxy: a planilha e privada, e e assim que deve ficar. */
async function carregarCerebro() {
  const linhas = await lerAba(CONFIG.SHEETS.cerebro, 'TODOS OS LEADS', {
    fonte: 'cerebro', soProxy: true, esperado: ['ESTAGIO', 'NOME']
  });
  const t = tabela(linhas, 0);
  const m = mapear(t, {
    estagio:   ['ESTAGIO'],
    fonte:     ['FONTE'],
    id:        ['ID'],
    nome:      ['NOME'],
    telefone:  ['TELEFONE'],
    produto:   ['PRODUTO JURIDICO'],
    origem:    ['ORIGEM'],
    campanha:  ['CAMPANHA'],
    funil:     ['FUNIL'],
    etapa:     ['ETAPA / SITUACAO', 'ETAPA'],
    motivoPerda:['MOTIVO DE PERDA'],
    temperatura:['TEMPERATURA'],
    sdr:       ['SDR'],
    closer:    ['CLOSER'],
    responsavel:['RESPONSAVEL'],
    primeiro:  ['DATA 1 CONTATO', 'DATA 1o CONTATO'],
    dReuniao:  ['DATA DA REUNIAO'],
    dFecha:    ['DATA DO FECHAMENTO'],
    diasFechar:['DIAS PARA FECHAR'],
    jornada:   ['JORNADA COMPLETA (DIAS)', 'JORNADA COMPLETA'],
    honIni:    ['HONORARIOS INICIAIS'],
    honFim:    ['HONORARIOS DE EXITO (%)', 'HONORARIOS DE EXITO'],
    entrada:   ['VALOR DA ENTRADA'],
    pagoOk:    ['PAGAMENTO CONFIRMADO'],
    tipoPag:   ['TIPO DE PAGAMENTO'],
    tipoHon:   ['TIPO DE CONTRATO (HONORARIOS)'],
    tipoPlano: ['TIPO DE PLANO'],
    mensalidade:['MENSALIDADE']
  });

  /* "1. Pre-qualificacao" / "2. Reuniao" / "3. Cliente" - o numero na frente
     e a ordem do funil, e e por ele que ordeno em vez de alfabetico. */
  const ordemEstagio = e => {
    const n = String(e || '').match(/^\s*(\d+)/);
    return n ? +n[1] : 99;
  };

  const reg = t.linhas.map(l => {
    const dF = parseData(m.cel(l, 'dFecha'));
    const dR = parseData(m.cel(l, 'dReuniao'));
    const d1 = parseData(m.cel(l, 'primeiro'));
    const estagio = m.cel(l, 'estagio') || 'Sem estagio';
    const r = {
      estagio: estagio, ordem: ordemEstagio(estagio),
      fonteOrig: m.cel(l, 'fonte'),
      id: m.cel(l, 'id'),
      nome: m.cel(l, 'nome') || 'Sem nome',
      chave: chaveBusca(m.cel(l, 'nome')),
      telefone: m.cel(l, 'telefone'),
      produto: m.cel(l, 'produto') || 'Sem produto',
      origem: m.cel(l, 'origem') || 'Sem origem',
      campanha: m.cel(l, 'campanha'),
      funil: m.cel(l, 'funil'),
      etapa: m.cel(l, 'etapa'),
      motivoPerda: m.cel(l, 'motivoPerda'),
      temperatura: m.cel(l, 'temperatura'),
      sdr: m.cel(l, 'sdr') || 'Sem SDR',
      closer: m.cel(l, 'closer') || 'Sem closer',
      primeiro: d1, dReuniao: dR, dFecha: dF,
      /* A data que situa o registro no tempo muda com o estagio. */
      d: dF || dR || d1,
      mes: (dF || dR || d1) ? chaveMes(dF || dR || d1) : '',
      diasFechar: num(m.cel(l, 'diasFechar')),
      jornada: num(m.cel(l, 'jornada')),
      honIni: num(m.cel(l, 'honIni')),
      honFim: numPct(m.cel(l, 'honFim')),
      entrada: num(m.cel(l, 'entrada')),
      pagoOk: /^(sim|s|true|1)$/i.test(m.cel(l, 'pagoOk').replace(/â/g, 'a')),
      tipoPag: m.cel(l, 'tipoPag'),
      tipoHon: m.cel(l, 'tipoHon'),
      tipoPlano: m.cel(l, 'tipoPlano'),
      mensalidade: m.cel(l, 'mensalidade')
    };
    r.cliente = r.ordem === 3;
    r.reuniao = r.ordem === 2;
    r.prequal = r.ordem === 1;
    return r;
  }).filter(r => r.nome !== 'Sem nome' || r.id);

  /* Pessoas unicas: o mesmo nome aparece em ate tres estagios. */
  const porPessoa = new Map();
  reg.forEach(r => {
    if (!r.chave) return;
    if (!porPessoa.has(r.chave)) porPessoa.set(r.chave, { nome: r.nome, estagios: new Set(), registros: [] });
    const p = porPessoa.get(r.chave);
    p.estagios.add(r.ordem);
    p.registros.push(r);
  });

  return { reg: reg, pessoas: porPessoa, faltando: m.faltando, linhas: t.linhas.length };
}

/* As chaves que o proxy conhece. Uma fonte do painel pode precisar de varias
   abas (Metas usa cinco), por isso esta lista nao e igual a FONTES. */
const FONTES_PROXY = ['atend', 'clientes', 'metaDia', 'metaCamp', 'metaReun',
  'metaAnuncios', 'metaJanelas',
  'kpisAtual', 'kpisAnterior', 'kpisMkt', 'prodAtual', 'prodAnterior', 'okrs',

async function carregarTudo() {
  Object.keys(ERROS).forEach(k => delete ERROS[k]);
  AVISOS.length = 0;
  PROXY_DADOS = null; PROXY_ERROS = {}; PROXY_FALHA = null; TRANSPORTE = 'gviz';

  /* Uma viagem so para tudo, quando o proxy esta configurado. Se ele nao
     responder, o painel cai para a leitura direta em vez de ficar vazio - e
     diz na tela de fontes que caiu. */
  if (CONFIG.PROXY && TOKEN) {
    try {
      const j = await proxyLer(FONTES_PROXY);
      PROXY_DADOS = j.dados || {};
      PROXY_ERROS = j.erros || {};
      TRANSPORTE = 'proxy';
    } catch (e) {
      PROXY_FALHA = e.message || String(e);
      AVISOS.push({ nivel: 'critico', fonte: 'Proxy Apps Script',
        txt: 'nao respondeu (' + PROXY_FALHA + '). O painel voltou a ler as planilhas direto, ' +
             'o que so funciona nas que ainda estao compartilhadas por link.' });
    }
  }

  const res = await Promise.allSettled(FONTES.map(f => f.fn()));
  res.forEach((r, i) => {
    const f = FONTES[i];
    if (r.status === 'fulfilled') {
      DADOS[f.k] = r.value;
      if (r.value && r.value.faltando && r.value.faltando.length) {
        AVISOS.push({ nivel: 'atencao', fonte: f.nome,
          txt: 'colunas nao encontradas: ' + r.value.faltando.join(', ') + '. Os campos ficam vazios no painel.' });
      }
    } else {
      delete DADOS[f.k];
      ERROS[f.k] = (r.reason && r.reason.message) || String(r.reason);
    }
  });
  ULTIMA_LEITURA = new Date();
  /* Dado novo invalida a memoria das areas. */
  GERACAO++;
  return DADOS;
}
/* ==========================================================================
   GRAFICOS - SVG inline, sem biblioteca.
   Regras seguidas aqui (paleta validada em validate_palette.js):
     . uma escala por grafico. Nunca dois eixos Y.
     . cor categorica em ordem fixa (--s1..--s8), nunca ciclada;
       da 9a serie em diante tudo cai em "Outros".
     . magnitude de etapa usa a rampa de um so tom (--r1..--r6).
     . marca fina, ponta arredondada 4px ancorada na linha de base,
       2px de respiro entre fatias empilhadas e barras vizinhas.
     . texto sempre em token de texto, nunca na cor da serie.
     . camada de hover por padrao em todo grafico.
   ========================================================================== */
const SERIES = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const RAMPA  = ['var(--r1)','var(--r2)','var(--r3)','var(--r4)','var(--r5)','var(--r6)'];
const corSerie = i => SERIES[i] || 'var(--texto-muted)';
const corRampa = (i, n) => RAMPA[Math.min(RAMPA.length - 1, Math.round((i / Math.max(1, n - 1)) * (RAMPA.length - 1)))];

/* Escala "bonita": topo arredondado para 1/2/5 x 10^n. */
function escalaTopo(max) {
  if (!(max > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(max)));
  const r = max / e;
  const p = r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10;
  return p * e;
}
function ticks(topo, n) {
  const out = [];
  for (let i = 0; i <= n; i++) out.push((topo / n) * i);
  return out;
}

/* Barra com a ponta de cima arredondada e a base reta (ancorada no eixo). */
function barraTopoRedondo(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h));
  if (h <= 0.5) return '';
  return 'M' + x + ',' + (y + h) + 'V' + (y + rr) +
         'q0,' + (-rr) + ' ' + rr + ',' + (-rr) +
         'h' + (w - 2 * rr) +
         'q' + rr + ',0 ' + rr + ',' + rr +
         'V' + (y + h) + 'Z';
}
/* Idem para barra horizontal: ponta da direita arredondada. */
function barraFimRedondo(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, h / 2, w));
  if (w <= 0.5) return '';
  return 'M' + x + ',' + y + 'H' + (x + w - rr) +
         'q' + rr + ',0 ' + rr + ',' + rr +
         'v' + (h - 2 * rr) +
         'q0,' + rr + ' ' + (-rr) + ',' + rr +
         'H' + x + 'Z';
}

/* Faixa de leitura: vai ACIMA do grafico, porque quem olha quer o numero
   antes da forma. */
function faixaResumo(itens) {
  const l = (itens || []).filter(x => x && x.val != null && x.val !== '');
  if (!l.length) return '';
  return '<div class="viz-resumo">' + l.map(i =>
    '<span><i>' + esc(i.rot) + '</i><b>' + i.val + '</b></span>').join('') + '</div>';
}

const tipLinha = (cor, rot, val) =>
  '<div class="d-linha">' + (cor ? '<span class="d-marca" style="background:' + cor + '"></span>' : '') +
  '<span>' + rot + '</span><span class="d-val">' + val + '</span></div>';

/* ===== SISTEMA DE COORDENADAS =====
   O viewBox e escrito em unidades que valem ~1px na largura tipica de um
   cartao (600). Com width:100% e altura automatica, o SVG mantem a proporcao
   do viewBox e o texto escala junto, uniformemente.

   O erro a evitar aqui: viewBox estreito (100 unidades) com width:100%. A
   altura vira 6x a largura do cartao - um grafico de 1.100px de altura - e
   forcar a altura por CSS junto com preserveAspectRatio="none" distorce o
   texto na horizontal. Por isso: viewBox largo e escala uniforme. */
const VW = 600;

/* ---------------------------------------------------------- COLUNAS (tempo) */
function vizColunas(o) {
  const dados = o.dados || [];
  if (!dados.length) return '<div class="vazio">Sem dados no recorte.</div>';
  const W = VW, H = o.altura || 310;
  const mE = 52, mD = 12, mT = o.rotulos === false ? 12 : 22, mB = 30;
  const fmt = o.fmt || n0;
  const topo = escalaTopo(Math.max.apply(null, dados.map(d => d.v).concat([0])));
  const pw = (W - mE - mD) / dados.length;
  const bw = Math.max(4, Math.min(pw * 0.6, 44));
  const ph = H - mT - mB;
  const y = v => mT + ph - (v / topo) * ph;
  const passo = Math.ceil(dados.length / 12);

  /* Media sobre os pontos COM movimento: dividir por dias vazios faria a
     media despencar e dizer outra coisa. */
  const comValor = dados.filter(d => d.v > 0);
  const totalV = dados.reduce((a, d) => a + (d.v || 0), 0);
  const mediaV = comValor.length ? totalV / comValor.length : 0;
  const melhor = dados.slice().sort((a, b) => b.v - a.v)[0];

  let s = '';
  if (o.resumo !== false) s += faixaResumo([
    { rot: 'Total no recorte', val: fmt(totalV) },
    { rot: 'M\u00e9dia', val: fmt(mediaV) },
    (melhor && melhor.v > 0) ? { rot: 'Maior (' + (melhor.rot || melhor.k) + ')', val: fmt(melhor.v) } : null,
    { rot: 'Com movimento', val: n0(comValor.length) + ' de ' + n0(dados.length) }
  ]);
  s += '<svg class="viz" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  ticks(topo, 4).forEach(t => {
    s += '<line class="grade" x1="' + mE + '" x2="' + (W - mD) + '" y1="' + y(t) + '" y2="' + y(t) + '" vector-effect="non-scaling-stroke"/>';
    s += '<text class="eixo" x="' + (mE - 8) + '" y="' + (y(t) + 3.6) + '" text-anchor="end">' + (o.fmtEixo || n0)(t) + '</text>';
  });
  /* A media entra como referencia: sem ela, "foi um dia bom?" nao tem contra o que. */
  if (o.resumo !== false && mediaV > 0 && mediaV <= topo) {
    s += '<line x1="' + mE + '" x2="' + (W - mD) + '" y1="' + y(mediaV) + '" y2="' + y(mediaV) +
         '" stroke="var(--texto-2)" stroke-width="1" stroke-dasharray="4 4" opacity=".55" vector-effect="non-scaling-stroke"/>';
    s += '<text class="eixo" x="' + (W - mD) + '" y="' + (y(mediaV) - 5) + '" text-anchor="end" style="opacity:.75">m\u00e9dia</text>';
  }
  dados.forEach((d, i) => {
    const cx = mE + pw * i + pw / 2;
    const h = Math.max(0, (d.v / topo) * ph);
    const cor = d.cor || o.cor || 'var(--s1)';
    const tip = '<span class="d-tit">' + esc(d.rot || d.k) + '</span>' + tipLinha(cor, o.nome || 'Valor', fmt(d.v)) +
      (d.extra || []).map(e => tipLinha(e.cor, esc(e.rot), e.val)).join('');
    s += '<g data-tip="' + esc(tip) + '">';
    s += '<rect class="alvo" x="' + (cx - pw / 2) + '" y="' + mT + '" width="' + pw + '" height="' + ph + '"/>';
    s += '<path d="' + barraTopoRedondo(cx - bw / 2, y(d.v), bw, h, 4) + '" fill="' + cor + '"/>';
    s += '</g>';
    if (o.rotulos !== false && dados.length <= 14 && d.v > 0)
      s += '<text class="rotulo-dado" x="' + cx + '" y="' + (y(d.v) - 7) + '" text-anchor="middle">' + fmt(d.v) + '</text>';
    if (i % passo === 0)
      s += '<text class="eixo" x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(d.k) + '</text>';
  });
  return s + '</svg>';
}

/* --------------------------------------------------------- BARRAS (ranking) */
function vizBarras(o) {
  const dados = (o.dados || []).filter(d => d.v != null);
  if (!dados.length) return '<div class="vazio">Sem dados no recorte.</div>';
  const fmt = o.fmt || n0;
  const linha = 34, W = VW;
  const H = dados.length * linha + 10;
  const rotW = o.rotuloW || 196;
  const numW = 96;
  /* A referencia entra na escala: senao uma linha de 100% nunca apareceria
     num grafico em que todas as barras estao abaixo de 100. */
  const max = Math.max.apply(null, dados.map(d => Math.abs(d.v)).concat([0, o.ref || 0])) || 1;
  const pista = W - rotW - numW;

  let s = '<svg class="viz" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  dados.forEach((d, i) => {
    const yb = 5 + i * linha;
    const meio = yb + linha / 2;
    const w = (Math.abs(d.v) / max) * pista;
    const cor = d.cor || o.cor || 'var(--s1)';
    const tip = '<span class="d-tit">' + esc(d.k) + '</span>' + tipLinha(cor, o.nome || 'Valor', fmt(d.v)) +
      (d.extra || []).map(e => tipLinha(e.cor, esc(e.rot), e.val)).join('');
    s += '<g data-tip="' + esc(tip) + '">';
    s += '<rect class="alvo" x="0" y="' + yb + '" width="' + W + '" height="' + linha + '"/>';
    s += '<text class="eixo" x="0" y="' + (meio + 4) + '" style="fill:var(--texto-2);font-size:11.5px">' +
         esc(d.k.length > 32 ? d.k.slice(0, 31) + '…' : d.k) + '</text>';
    s += '<rect x="' + rotW + '" y="' + (meio - 6) + '" width="' + pista + '" height="12" rx="4" fill="var(--bg4)" opacity=".55"/>';
    s += '<path d="' + barraFimRedondo(rotW, meio - 6, Math.max(w, 2), 12, 4) + '" fill="' + cor + '"/>';
    s += '<text class="rotulo-dado" x="' + (W - 2) + '" y="' + (meio + 4) + '" text-anchor="end" style="font-size:11.5px">' + fmt(d.v) + '</text>';
    s += '</g>';
  });
  /* Referencia opcional (ex.: 100% da meta). Linha unica, tracejada, sem
     rotulo: o que ela significa esta dito no subtitulo do cartao. */
  if (o.ref != null && o.ref > 0 && o.ref <= max) {
    const xr = rotW + (o.ref / max) * pista;
    s += '<line x1="' + xr + '" x2="' + xr + '" y1="4" y2="' + (H - 4) +
         '" stroke="var(--texto-2)" stroke-width="1" stroke-dasharray="3 3" opacity=".7" vector-effect="non-scaling-stroke"/>';
  }
  return s + '</svg>';
}

/* ------------------------------------------------- COLUNAS AGRUPADAS (x2/x3)
   Mesma unidade, duas ou tres series lado a lado. E a forma certa para
   "este mes x mes anterior": empilhar somaria coisas que nao se somam, e uma
   linha com dois pontos nao desenha tendencia nenhuma. */
function vizGrupos(o) {
  const x = o.x || [];
  const series = (o.series || []).slice(0, 3);
  if (!x.length || !series.length) return '<div class="vazio">Sem dados no recorte.</div>';
  const W = VW, H = o.altura || 310;
  const mE = 54, mD = 12, mT = 20, mB = 30;
  const fmt = o.fmt || n0;
  let max = 0;
  series.forEach(se => se.vals.forEach(v => { if (v != null && v > max) max = v; }));
  const topo = escalaTopo(max);
  const pw = (W - mE - mD) / x.length;
  /* 2px de respiro entre as barras do grupo, e o grupo ocupa 64% do passo. */
  const gw = Math.min(pw * 0.64, 54 * series.length);
  const bw = Math.max(4, (gw - 2 * (series.length - 1)) / series.length);
  const ph = H - mT - mB;
  const py = v => mT + ph - (v / topo) * ph;

  let s = '<svg class="viz" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  ticks(topo, 4).forEach(t => {
    s += '<line class="grade" x1="' + mE + '" x2="' + (W - mD) + '" y1="' + py(t) + '" y2="' + py(t) + '" vector-effect="non-scaling-stroke"/>';
    s += '<text class="eixo" x="' + (mE - 8) + '" y="' + (py(t) + 3.6) + '" text-anchor="end">' + (o.fmtEixo || n0)(t) + '</text>';
  });
  x.forEach((rot, i) => {
    const cx = mE + pw * i + pw / 2;
    const x0 = cx - gw / 2;
    const tip = '<span class="d-tit">' + esc(rot) + '</span>' + series.map((se, si) =>
      se.vals[i] == null ? '' : tipLinha(se.cor || corSerie(si), esc(se.nome), fmt(se.vals[i]))).join('');
    s += '<g data-tip="' + esc(tip) + '">';
    s += '<rect class="alvo" x="' + (cx - pw / 2) + '" y="' + mT + '" width="' + pw + '" height="' + ph + '"/>';
    series.forEach((se, si) => {
      const v = se.vals[i];
      if (v == null || v <= 0) return;
      const bx = x0 + si * (bw + 2);
      s += '<path d="' + barraTopoRedondo(bx, py(v), bw, ph - (py(v) - mT), 4) + '" fill="' + (se.cor || corSerie(si)) + '"/>';
    });
    s += '</g>';
    s += '<text class="eixo" x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(rot) + '</text>';
  });
  return s + '</svg>';
}

/* ----------------------------------------------------------- LINHAS (tempo) */
function vizLinhas(o) {
  const x = o.x || [];
  const series = (o.series || []).filter(s => s.vals && s.vals.length);
  if (!x.length || !series.length) return '<div class="vazio">Sem dados no recorte.</div>';
  const W = VW, H = o.altura || 318;
  const mE = 56, mD = 14, mT = 16, mB = 30;
  const fmt = o.fmt || n0;
  let max = 0;
  series.forEach(s => s.vals.forEach(v => { if (v != null && v > max) max = v; }));
  const topo = escalaTopo(max);
  const pw = x.length > 1 ? (W - mE - mD) / (x.length - 1) : 0;
  const ph = H - mT - mB;
  const px = i => mE + pw * i + (x.length > 1 ? 0 : (W - mE - mD) / 2);
  const py = v => mT + ph - (v / topo) * ph;
  const passo = Math.ceil(x.length / 12);

  let s = '';
  if (o.resumo !== false) {
    /* Numa serie so, o resumo fala dela. Em varias, fala do ultimo ponto de
       cada uma - que e a pergunta "como esta agora". */
    if (series.length === 1) {
      const v = series[0].vals.filter(x => x != null && isFinite(x));
      const ult = v.length ? v[v.length - 1] : null;
      const mx = v.length ? Math.max.apply(null, v) : null;
      const mn = v.length ? Math.min.apply(null, v) : null;
      s += faixaResumo([
        { rot: 'Agora', val: ult == null ? null : fmt(ult) },
        { rot: 'M\u00e9dia do recorte', val: v.length ? fmt(v.reduce((a, b) => a + b, 0) / v.length) : null },
        { rot: 'Melhor', val: mx == null ? null : fmt(mx) },
        { rot: 'Pior', val: mn == null ? null : fmt(mn) }
      ]);
    } else {
      s += faixaResumo(series.map((se2, i2) => {
        const v = se2.vals.filter(x => x != null && isFinite(x));
        return { rot: se2.nome, val: v.length ? fmt(v[v.length - 1]) : null };
      }));
    }
  }
  s += '<svg class="viz" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  ticks(topo, 4).forEach(t => {
    s += '<line class="grade" x1="' + mE + '" x2="' + (W - mD) + '" y1="' + py(t) + '" y2="' + py(t) + '" vector-effect="non-scaling-stroke"/>';
    s += '<text class="eixo" x="' + (mE - 8) + '" y="' + (py(t) + 3.6) + '" text-anchor="end">' + (o.fmtEixo || n0)(t) + '</text>';
  });
  series.forEach((se, si) => {
    const cor = se.cor || corSerie(si);
    let d = '', aberto = false;
    se.vals.forEach((v, i) => {
      if (v == null) { aberto = false; return; }
      d += (aberto ? 'L' : 'M') + px(i) + ',' + py(v); aberto = true;
    });
    if (o.area && series.length === 1) {
      const prim = se.vals.findIndex(v => v != null);
      let ult = -1; se.vals.forEach((v, i) => { if (v != null) ult = i; });
      /* Com buraco no meio, o preenchimento fecha por baixo dos trechos
         soltos e desenha um triangulo que nao existe nos dados. */
      let inteiro = true;
      for (let i = prim; i <= ult; i++) if (se.vals[i] == null) inteiro = false;
      if (prim >= 0 && ult > prim && inteiro) {
        s += '<path d="' + d + 'L' + px(ult) + ',' + py(0) + 'L' + px(prim) + ',' + py(0) + 'Z" fill="' + cor + '" opacity=".12"/>';
      }
    }
    s += '<path d="' + d + '" fill="none" stroke="' + cor + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
    if (x.length <= 26) se.vals.forEach((v, i) => {
      if (v == null) return;
      s += '<circle class="ponto" cx="' + px(i) + '" cy="' + py(v) + '" r="3.4" fill="' + cor + '"/>';
    });
  });
  /* Faixa por ponto no eixo X: um alvo de hover maior que a marca, com todas
     as series do ponto no mesmo balao. */
  x.forEach((rot, i) => {
    const tip = '<span class="d-tit">' + esc(rot) + '</span>' + series.map((se, si) =>
      se.vals[i] == null ? '' : tipLinha(se.cor || corSerie(si), esc(se.nome), fmt(se.vals[i]))).join('');
    s += '<g class="banda" data-tip="' + esc(tip) + '">';
    s += '<line class="crosshair" x1="' + px(i) + '" x2="' + px(i) + '" y1="' + mT + '" y2="' + (mT + ph) + '" vector-effect="non-scaling-stroke"/>';
    s += '<rect class="alvo" x="' + (px(i) - (pw || 40) / 2) + '" y="' + mT + '" width="' + (pw || 40) + '" height="' + ph + '"/>';
    s += '</g>';
    if (i % passo === 0)
      s += '<text class="eixo" x="' + px(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(rot) + '</text>';
  });
  return s + '</svg>';
}

/* ------------------------------------------------------------------- FUNIL */
function vizFunil(etapas) {
  const et = (etapas || []).filter(e => e.v != null);
  if (!et.length) return '<div class="vazio">Sem dados de funil.</div>';
  const base = et[0].v || 1;
  let h = '<div style="display:flex;flex-direction:column;gap:2px">';
  et.forEach((e, i) => {
    const largura = Math.max(3, (e.v / base) * 100);
    const cor = corRampa(i, et.length);
    const ant = i > 0 ? et[i - 1].v : null;
    const conv = ant ? taxa(e.v, ant) : null;
    const tip = '<span class="d-tit">' + esc(e.k) + '</span>' +
      tipLinha(cor, 'Volume', n0(e.v)) +
      (conv != null ? tipLinha('', 'Conversao da etapa anterior', pct(conv, 1)) : '') +
      tipLinha('', 'Do topo do funil', pct(taxa(e.v, base), 2));
    h += '<div data-tip="' + esc(tip) + '" style="display:flex;align-items:center;gap:0.6rem;cursor:default">';
    h += '<div style="flex:0 0 40%;max-width:210px;font-size:0.74rem;color:var(--texto-2);line-height:1.3">' + esc(e.k) + '</div>';
    h += '<div style="flex:1;min-width:0;display:flex;align-items:center;gap:0.5rem">';
    h += '<div style="height:20px;border-radius:4px;background:' + cor + ';width:' + largura + '%;min-width:3px"></div>';
    h += '<span style="font-size:0.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--texto)">' + n0(e.v) + '</span>';
    if (conv != null) h += '<span style="font-size:0.7rem;color:var(--texto-muted);font-variant-numeric:tabular-nums">' + pct(conv, 0) + '</span>';
    h += '</div></div>';
  });
  return h + '</div>';
}

/* ------------------------------------------------------------------- DONUT */
function vizDonut(o) {
  const dados = (o.dados || []).filter(d => d.v > 0);
  if (!dados.length) return '<div class="vazio">Sem dados no recorte.</div>';
  const total = dados.reduce((a, d) => a + d.v, 0);
  const R = 118, r = 77, cx = 134, cy = 134;
  const fmt = o.fmt || n0;
  /* 2px de respiro entre fatias, em graus na borda externa. */
  const gap = 1.4;
  let ang = -90;
  let s = '<svg class="viz" viewBox="0 0 268 268" style="max-height:272px" role="img">';
  dados.forEach((d, i) => {
    const frac = d.v / total;
    const a0 = ang, a1 = ang + frac * 360;
    ang = a1;
    const cor = d.cor || corSerie(i);
    const ia0 = (a0 + gap / 2) * Math.PI / 180, ia1 = (a1 - gap / 2) * Math.PI / 180;
    if (ia1 <= ia0) return;
    const grande = (a1 - a0) > 180 ? 1 : 0;
    const p = [
      'M', cx + R * Math.cos(ia0), cy + R * Math.sin(ia0),
      'A', R, R, 0, grande, 1, cx + R * Math.cos(ia1), cy + R * Math.sin(ia1),
      'L', cx + r * Math.cos(ia1), cy + r * Math.sin(ia1),
      'A', r, r, 0, grande, 0, cx + r * Math.cos(ia0), cy + r * Math.sin(ia0), 'Z'
    ].join(' ');
    const tip = '<span class="d-tit">' + esc(d.k) + '</span>' + tipLinha(cor, 'Valor', fmt(d.v)) +
      tipLinha('', 'Participacao', pct(frac * 100, 1));
    s += '<path d="' + p + '" fill="' + cor + '" data-tip="' + esc(tip) + '" style="cursor:default"/>';
  });
  s += '<text x="134" y="132" text-anchor="middle" style="font-size:30px;font-weight:700;letter-spacing:-0.02em;fill:var(--texto)">' + (o.centro || fmt(total)) + '</text>';
  s += '<text x="134" y="152" text-anchor="middle" style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:var(--texto-muted)">' + esc(o.centroRot || 'total') + '</text>';
  return s + '</svg>';
}

/* --------------------------------------------------------------- EMPILHADO */
function vizEmpilhado(o) {
  const x = o.x || [];
  const series = o.series || [];
  if (!x.length || !series.length) return '<div class="vazio">Sem dados no recorte.</div>';
  const W = VW, H = o.altura || 318;
  const mE = 52, mD = 12, mT = 16, mB = 30;
  const fmt = o.fmt || n0;
  const totais = x.map((_, i) => series.reduce((a, s) => a + (s.vals[i] || 0), 0));
  const topo = escalaTopo(Math.max.apply(null, totais.concat([0])));
  const pw = (W - mE - mD) / x.length;
  const bw = Math.max(5, Math.min(pw * 0.6, 48));
  const ph = H - mT - mB;
  const py = v => mT + ph - (v / topo) * ph;
  const passo = Math.ceil(x.length / 12);

  let s = '<svg class="viz" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  ticks(topo, 4).forEach(t => {
    s += '<line class="grade" x1="' + mE + '" x2="' + (W - mD) + '" y1="' + py(t) + '" y2="' + py(t) + '" vector-effect="non-scaling-stroke"/>';
    s += '<text class="eixo" x="' + (mE - 8) + '" y="' + (py(t) + 3.6) + '" text-anchor="end">' + (o.fmtEixo || n0)(t) + '</text>';
  });
  x.forEach((rot, i) => {
    const cx = mE + pw * i + pw / 2;
    let acc = 0;
    const tip = '<span class="d-tit">' + esc(rot) + '</span>' +
      series.map((se, si) => (se.vals[i] ? tipLinha(se.cor || corSerie(si), esc(se.nome), fmt(se.vals[i])) : '')).join('') +
      tipLinha('', 'Total', fmt(totais[i]));
    s += '<g data-tip="' + esc(tip) + '">';
    s += '<rect class="alvo" x="' + (cx - pw / 2) + '" y="' + mT + '" width="' + pw + '" height="' + ph + '"/>';
    series.forEach((se, si) => {
      const v = se.vals[i] || 0;
      if (v <= 0) return;
      const y0 = py(acc + v), alt = py(acc) - py(acc + v);
      acc += v;
      /* 2px de respiro entre fatias: encurto a fatia por baixo. */
      const respiro = Math.min(2, alt * 0.14);
      s += '<rect x="' + (cx - bw / 2) + '" y="' + y0 + '" width="' + bw + '" height="' + Math.max(1, alt - respiro) +
           '" rx="' + (si === series.length - 1 ? 4 : 0) + '" fill="' + (se.cor || corSerie(si)) + '"/>';
    });
    s += '</g>';
    if (i % passo === 0)
      s += '<text class="eixo" x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(rot) + '</text>';
  });
  return s + '</svg>';
}

/* ------------------------------------------------------------------- RADAR
   Comparacao de poucas entidades em varios eixos. Cada eixo e normalizado
   pelo MELHOR valor da tela (0 a 100%), senao "dias para fechar" em dezenas
   esmagaria "clientes" em unidades e a forma nao diria nada.

   Limite de 3 series de proposito: o radar e uma forma de todos-contra-todos,
   e a paleta so garante separacao para daltonismo em todos os pares ate a
   terceira cor. Acima disso, a propria leitura vira sopa de poligonos. */
function vizRadar(o) {
  const eixos = o.eixos || [];
  const series = (o.series || []).slice(0, 3);
  if (eixos.length < 3 || !series.length) return '<div class="vazio">Dados insuficientes para o radar.</div>';

  /* cy abaixo do centro geometrico e R folgado: os rotulos ficam a 1.17 do
     raio e, sem essa folga, o eixo de cima encosta na borda do cartao. */
  const R = 124, cx = 212, cy = 182, W = 424, H = 338;
  const ang = i => (i / eixos.length) * Math.PI * 2 - Math.PI / 2;
  const ponto = (i, f) => [cx + R * f * Math.cos(ang(i)), cy + R * f * Math.sin(ang(i))];

  /* Melhor valor por eixo = 100%. Em eixo "inverso" (dias, custo) o melhor
     e o MENOR, entao a fracao se inverte. */
  const melhor = eixos.map((e, i) => {
    const vals = series.map(s => s.vals[i]).filter(v => v != null && isFinite(v));
    if (!vals.length) return null;
    return e.inverso ? Math.min.apply(null, vals.filter(v => v > 0)) : Math.max.apply(null, vals);
  });
  const fracao = (v, i) => {
    if (v == null || !isFinite(v) || melhor[i] == null || !melhor[i]) return 0;
    const f = eixos[i].inverso ? melhor[i] / v : v / melhor[i];
    return Math.max(0.04, Math.min(1, f));
  };

  let s = '<svg class="viz" viewBox="0 0 ' + W + ' ' + H + '" style="max-height:340px" role="img">';
  /* Teia de fundo */
  [0.25, 0.5, 0.75, 1].forEach(f => {
    const p = eixos.map((_, i) => ponto(i, f).join(',')).join(' ');
    s += '<polygon points="' + p + '" fill="none" stroke="var(--grade)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  });
  eixos.forEach((e, i) => {
    const [x, y] = ponto(i, 1);
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '" stroke="var(--grade)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    const [lx, ly] = ponto(i, 1.17);
    const anchor = Math.abs(lx - cx) < 12 ? 'middle' : (lx > cx ? 'start' : 'end');
    s += '<text class="eixo" x="' + lx + '" y="' + (ly + 3.5) + '" text-anchor="' + anchor + '">' + esc(e.rot) + '</text>';
  });
  /* Poligonos */
  series.forEach((se, si) => {
    const cor = se.cor || corSerie(si);
    const pts = eixos.map((_, i) => ponto(i, fracao(se.vals[i], i)).join(',')).join(' ');
    s += '<polygon points="' + pts + '" fill="' + cor + '" fill-opacity="0.14" stroke="' + cor +
         '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
    eixos.forEach((e, i) => {
      const [x, y] = ponto(i, fracao(se.vals[i], i));
      const tip = '<span class="d-tit">' + esc(se.nome) + '</span>' +
        tipLinha(cor, esc(e.rot), se.vals[i] == null ? '—' : (e.fmt || n0)(se.vals[i]));
      s += '<circle class="ponto" cx="' + x + '" cy="' + y + '" r="4" fill="' + cor +
           '" data-tip="' + esc(tip) + '" style="cursor:default"/>';
    });
  });
  return s + '</svg>';
}

/* ---------------------------------------------------------------- SPARKLINE */
function spark(vals, cor) {
  const v = (vals || []).filter(x => x != null);
  if (v.length < 2) return '';
  const max = Math.max.apply(null, v), min = Math.min.apply(null, v);
  const amp = (max - min) || 1;
  const pw = 100 / (v.length - 1);
  const pts = v.map((x, i) => (i * pw).toFixed(2) + ',' + (26 - ((x - min) / amp) * 22).toFixed(2));
  return '<svg class="viz" viewBox="0 0 100 30" preserveAspectRatio="none" style="height:30px">' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + (cor || 'var(--s1)') +
    '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="100" cy="' + (26 - ((v[v.length - 1] - min) / amp) * 22).toFixed(2) + '" r="2" fill="' + (cor || 'var(--s1)') + '"/></svg>';
}

/* ===================== LEGENDA ===================== */
function legenda(itens) {
  if (!itens || itens.length < 2) return '';
  return '<div class="legenda">' + itens.map((it, i) =>
    '<span class="legenda-item"><span class="legenda-marca" style="background:' + (it.cor || corSerie(i)) + '"></span>' +
    esc(it.nome) + (it.val != null ? ' <b style="color:var(--texto)">' + it.val + '</b>' : '') + '</span>').join('') + '</div>';
}

/* ===================== PECAS DE UI ===================== */
const ICO = {
  ok:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  alerta:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  sobe:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
  desce:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>',
  igual:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>'
};

/* Selo de status: a cor nunca vem sozinha - sempre com icone e rotulo. */
function selo(nivel, texto) {
  const ic = nivel === 'ok' ? ICO.ok : nivel === 'neutro' ? ICO.info : ICO.alerta;
  return '<span class="selo ' + nivel + '">' + ic + esc(texto) + '</span>';
}

/* Classifica atingimento contra a meta proporcional do mes. */
function nivelMeta(p) {
  if (p == null) return 'neutro';
  if (p >= 100) return 'ok';
  if (p >= 85) return 'atencao';
  if (p >= 60) return 'grave';
  return 'critico';
}

function delta(v, opc) {
  const o = opc || {};
  if (v == null || !isFinite(v)) return '<span class="delta neu">' + ICO.igual + '&mdash;</span>';
  const bom = o.inverso ? v < 0 : v > 0;
  const zero = Math.abs(v) < 0.05;
  const cls = zero ? 'neu' : (bom ? 'pos' : 'neg');
  const ic = zero ? ICO.igual : (v > 0 ? ICO.sobe : ICO.desce);
  const txt = (v > 0 ? '+' : '') + (o.fmt ? o.fmt(v) : pct(v, 1));
  return '<span class="delta ' + cls + '">' + ic + txt + (o.sufixo ? ' ' + esc(o.sufixo) : '') + '</span>';
}

function kpi(o) {
  let h = '<div class="kpi">';
  h += '<div class="kpi-rotulo">' + esc(o.rotulo) +
       (o.dica ? '<span data-tip="' + esc(o.dica) + '" style="cursor:help;opacity:.6">&#9432;</span>' : '') + '</div>';
  h += '<div class="kpi-valor' + (o.pequeno ? ' sm' : '') + '">' + (o.valor == null ? '&mdash;' : o.valor) + '</div>';
  if (o.delta) h += o.delta;
  if (o.selo) h += ' ' + o.selo;
  if (o.nota) h += '<div class="kpi-nota">' + o.nota + '</div>';
  if (o.ritmo) h += o.ritmo;
  if (o.spark) h += '<div class="kpi-spark">' + o.spark + '</div>';
  return h + '</div>';
}

/* ===== MESMA HIERARQUIA, PARA QUEM JA MONTA O LADRILHO PRONTO =====
   Os modulos de indicador separam heroi e lista a partir do registro do
   KPI. As telas de detalhe montam o ladrilho direto, com o valor ja
   formatado - elas tem casos que o registro nao cobre, como "0 paradas"
   virar selo verde. Entao os dois ladrilhos abaixo aceitam exatamente as
   mesmas opcoes de kpi(), e so mudam o peso visual.

   O resultado e uma linguagem so no produto inteiro: numero grande para o
   que decide, linha densa para o que se consulta. */
function ladrilhoGrande(o) {
  let h = '<div class="destaque">';
  h += '<div class="destaque-rot">' + esc(o.rotulo) +
    (o.dica ? '<span data-tip="' + esc(o.dica) + '" style="cursor:help;opacity:.55;margin-left:auto">&#9432;</span>' : '') +
    '</div>';
  h += '<div class="destaque-val' + (o.pequeno ? ' sm' : '') + '">' + (o.valor == null ? '&mdash;' : o.valor) + '</div>';
  if (o.delta || o.selo) h += '<div class="destaque-linha">' + (o.delta || '') + (o.selo || '') + '</div>';
  if (o.nota) h += '<div class="destaque-pe">' + o.nota + '</div>';
  if (o.ritmo) h += o.ritmo;
  if (o.spark) h += '<div class="kpi-spark">' + o.spark + '</div>';
  return h + '</div>';
}
function ladrilhoLinha(o) {
  return '<div class="met-linha">' +
    '<div class="met-rot"><b>' + esc(o.rotulo) + '</b>' +
      (o.dica ? '<span data-tip="' + esc(o.dica) + '" style="cursor:help;opacity:.55"> &#9432;</span>' : '') +
      (o.nota ? '<i>' + o.nota + '</i>' : '') + '</div>' +
    '<div class="met-val">' + (o.valor == null ? '&mdash;' : o.valor) + '</div>' +
    '<div class="met-barra">' + (o.selo || '') + '</div>' +
    '<div class="met-fim">' + (o.delta || '') + '</div>' +
    '</div>';
}
/* Os primeiros em cartao, o resto em lista. */
function hierarquiaKpi(itens, nHeroi) {
  const lista = (itens || []).filter(Boolean);
  if (!lista.length) return '';
  const n = nHeroi == null ? 4 : nHeroi;
  const herois = lista.slice(0, n), resto = lista.slice(n);
  let h = '<div class="grid g-destaque">' + herois.map(ladrilhoGrande).join('') + '</div>';
  if (resto.length) h += '<div style="height:0.85rem"></div><div class="lista-met">' +
    resto.map(ladrilhoLinha).join('') + '</div>';
  return h;
}

/* Barra de ritmo: quanto do mes passou x quanto da meta foi entregue. */
function ritmo(o) {
  const feito = o.feito || 0, meta = o.meta || 0;
  const p = meta > 0 ? Math.min(100, (feito / meta) * 100) : 0;
  const alvo = o.alvoPct == null ? null : Math.min(100, Math.max(0, o.alvoPct));
  const atingimento = meta > 0 && alvo != null && alvo > 0 ? (p / alvo) * 100 : null;
  const nv = nivelMeta(atingimento);
  const cor = nv === 'ok' ? 'var(--ok)' : nv === 'atencao' ? 'var(--atencao)' : nv === 'grave' ? 'var(--grave)' : nv === 'critico' ? 'var(--critico)' : 'var(--s1)';
  let h = '<div class="ritmo"><div class="ritmo-trilha">';
  h += '<div class="ritmo-fill" style="width:' + p.toFixed(1) + '%;background:' + cor + '"></div>';
  if (alvo != null) h += '<div class="ritmo-alvo" style="left:' + alvo.toFixed(1) + '%" data-tip="' +
    esc('Ritmo esperado para hoje: ' + pct(alvo, 0) + ' da meta do mes') + '"></div>';
  h += '</div><div class="ritmo-legenda"><span>' + (o.fmt || n0)(feito) + ' de ' + (o.fmt || n0)(meta) +
       (o.escopo ? ' <span style="opacity:.75">&middot; ' + esc(o.escopo) + '</span>' : '') + '</span>' +
       '<span>' + pct(p, 0) + ' da meta</span></div></div>';
  return h;
}

function cartao(titulo, sub, corpo, extra) {
  return '<div class="cartao"><div class="cartao-titulo">' + esc(titulo) + (extra || '') + '</div>' +
    (sub ? '<div class="cartao-sub">' + sub + '</div>' : '<div style="height:0.6rem"></div>') + corpo + '</div>';
}

function aviso(nivel, html) {
  const ic = nivel === 'info' ? ICO.info : ICO.alerta;
  return '<div class="aviso ' + nivel + '">' + ic + '<div>' + html + '</div></div>';
}

/* ===================== TABELAS INTERATIVAS =====================
   Ordenar pelo cabecalho, buscar, limitar e exportar. O estado fica no
   registro para o redesenho nao perder a ordenacao escolhida. */
const TABELAS = {};
let TABELA_ATIVA = null;

function tabelaInterativa(id, cols, dados, opc) {
  const o = opc || {};
  TABELAS[id] = {
    cols: cols, dados: dados,
    ord: o.ord || null, dir: o.dir || -1,
    limite: o.limite || 60, passo: o.limite || 60,
    titulo: o.titulo || id, total: o.total || null
  };
  if (o.ativa !== false) TABELA_ATIVA = id;
  return '<div id="tbl-' + id + '">' + desenharTabela(id) + '</div>';
}

function valOrd(r, c) {
  const v = typeof c.v === 'function' ? c.v(r) : r[c.k];
  if (v instanceof Date) return v.getTime();
  if (v == null || v === '') return c.tipo === 'txt' ? '' : -Infinity;
  return typeof v === 'number' ? v : (c.tipo && c.tipo !== 'txt' ? num(v) : chaveBusca(v));
}

function linhasOrdenadas(id) {
  const t = TABELAS[id];
  let d = t.dados.slice();
  if (t.ord) {
    const c = t.cols.find(x => x.k === t.ord);
    if (c) d.sort((a, b) => {
      const va = valOrd(a, c), vb = valOrd(b, c);
      if (va === vb) return 0;
      return (va > vb ? 1 : -1) * t.dir;
    });
  }
  return d;
}

function celula(r, c) {
  if (c.html) return c.html(r);
  const v = typeof c.v === 'function' ? c.v(r) : r[c.k];
  if (v == null || v === '') return '&mdash;';
  switch (c.tipo) {
    case 'moeda': return brl(v);
    case 'moeda0':return brl0(v);
    case 'num':   return n0(v);
    case 'num1':  return n1(v);
    case 'pct':   return pct(v, c.casas == null ? 0 : c.casas);
    case 'data':  return fmtData(v);
    default:      return esc(v);
  }
}

function desenharTabela(id) {
  const t = TABELAS[id];
  const d = linhasOrdenadas(id);
  if (!d.length) return '<div class="vazio">Nenhum registro no recorte atual.</div>';
  const vis = d.slice(0, t.limite);

  let h = '<div class="tabela-caixa"><table class="dados"><thead><tr>';
  t.cols.forEach(c => {
    const num_ = c.tipo && c.tipo !== 'txt' && c.tipo !== 'data';
    const ordenavel = c.ord !== false;
    h += '<th class="' + (num_ ? 'num ' : '') + (ordenavel ? '' : 'nao-ord ') + (t.ord === c.k ? 'ord' : '') +
      '" ' + (ordenavel ? 'data-tabela="' + id + '" data-col="' + esc(c.k) + '"' : '') + '>' + esc(c.rot) +
      (ordenavel ? '<span class="seta">' + (t.ord === c.k ? (t.dir > 0 ? '▲' : '▼') : '⇅') + '</span>' : '') + '</th>';
  });
  h += '</tr></thead><tbody>';
  vis.forEach(r => {
    h += '<tr>';
    t.cols.forEach(c => {
      const num_ = c.tipo && c.tipo !== 'txt' && c.tipo !== 'data';
      /* data-rot alimenta o ::before do modo cartao no telefone. */
      h += '<td data-rot="' + esc(c.rot) + '" class="' + (num_ ? 'num ' : '') + (c.cls || '') + '">' + celula(r, c) + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody>';
  if (t.total) {
    h += '<tfoot><tr>';
    t.cols.forEach((c, i) => {
      const tv = t.total[c.k];
      const num_ = c.tipo && c.tipo !== 'txt' && c.tipo !== 'data';
      h += '<td class="' + (num_ ? 'num' : '') + '">' + (i === 0 ? 'Total (' + n0(d.length) + ')' : (tv ? tv(d) : '')) + '</td>';
    });
    h += '</tr></tfoot>';
  }
  h += '</table></div>';

  /* O CSV fica na tabela, nao no cabecalho da pagina: la em cima nunca
     ficava claro QUAL tabela seria exportada. Aqui, exporta esta. */
  h += '<div class="tabela-rodape"><span>Exibindo ' + n0(vis.length) + ' de ' + n0(d.length) + ' registros</span>';
  h += '<span class="tabela-acoes">';
  if (d.length > t.limite)
    h += '<button class="btn-acao" data-mais="' + id + '" type="button">Mostrar mais ' + n0(Math.min(t.passo, d.length - t.limite)) + '</button>';
  h += '<button class="btn-acao" data-csv="' + id + '" type="button" title="Baixar as ' + n0(d.length) + ' linhas em CSV">' +
       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
       '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>CSV</button>';
  h += '</span></div>';
  return h;
}

function repintarTabela(id) {
  const el = document.getElementById('tbl-' + id);
  if (el) el.innerHTML = desenharTabela(id);
}

/* Cabecalho de tabela explicada: titulo, glossario das colunas e a dica de
   uso. Vai antes da tabela, nunca depois - quem le a coluna primeiro ja leu
   errado. */
function tabelaExplicada(titulo, glossario, dica) {
  return '<div class="tab-expl"><div class="tab-expl-tit">' + esc(titulo) + '</div>' +
    '<div class="tab-expl-glo">' + glossario + '</div>' +
    (dica ? '<div class="tab-expl-dica">' + dica + '</div>' : '') + '</div>';
}
/* A dica de uso e sempre a mesma: vale a pena ser literal. */
const DICA_ORDENAR = '<b>Clique no t\u00edtulo de uma coluna para ordenar</b> &mdash; clicar de novo inverte. ' +
  'Linha sem valor fica sempre no fim. O total do rodap\u00e9 e os gr\u00e1ficos acima n\u00e3o mudam com a ordem, ' +
  'e o bot\u00e3o CSV leva o recorte inteiro, n\u00e3o s\u00f3 as linhas \u00e0 vista.';

/* Barra "mostrar" com pilulas de recorte, no padrao da central. */
function barraMostrar(opcoes) {
  return '<div class="mostrar"><span class="mostrar-rot">Mostrar</span>' +
    opcoes.map(o => '<button class="btn-acao' + (o.ativa ? ' primario' : '') + '" type="button" ' +
      o.attr + '>' + esc(o.rot) + (o.n == null ? '' :
      ' <b style="font-variant-numeric:tabular-nums">' + n0(o.n) + '</b>') + '</button>').join('') + '</div>';
}

/* Mini barra dentro da celula - comparacao rapida sem sair da tabela. */
function barraCelula(v, max, cor, texto) {
  const p = max > 0 ? Math.min(100, (Math.abs(v) / max) * 100) : 0;
  return '<div class="celula-barra"><div class="cb-trilha"><div class="cb-fill" style="width:' + p.toFixed(1) +
    '%;background:' + (cor || 'var(--s1)') + '"></div></div><span class="cb-num">' + (texto == null ? n0(v) : texto) + '</span></div>';
}
/* ==========================================================================
   RECORTE (filtros) - um unico estado global que todas as telas respeitam.
   ========================================================================== */
const F = {
  /* O painel abre no MES CORRENTE: e a pergunta de quem abre o painel hoje.
     Historico se pede no filtro, nao se recebe por padrao. */
  periodo: 'mes',
  produtos: new Set(), sdrs: new Set(), closers: new Set(), origens: new Set(),
  busca: '',
  /* Recorte de situacao, so da tabela da esteira. Comeca em "em aberto"
     porque e nela que da para agir - mas os botoes mostram todas as
     contagens, para nada ficar escondido sem o gestor ver. */
  grupo: 'aberto',
  /* Recorte de campanhas ativas, so da tela de trafego. */
  soAtivas: false,
  /* Mes inspecionado na tela de KPIs. */
  mesKpi: null
};

const MES_ATUAL = chaveMes(new Date());
function mesMais(chave, delta) {
  const a = +chave.slice(0, 4), m = +chave.slice(5, 7) - 1 + delta;
  const d = new Date(a, m, 1);
  return chaveMes(d);
}

const PERIODOS = [
  { k: 'mes',   rot: 'Mês atual' },
  { k: 'ant',   rot: 'Mês anterior' },
  { k: 'u3',    rot: 'Últimos 3 meses' },
  { k: 'u6',    rot: 'Últimos 6 meses' },
  { k: 'u12',   rot: 'Últimos 12 meses' },
  { k: 'ano',   rot: 'Ano corrente' },
  { k: 'tudo',  rot: 'Todo o histórico' }
];

/* Resolve o periodo em uma faixa de datas e na lista de meses do eixo X. */
function faixa() {
  const h = new Date();
  const fimMes = new Date(h.getFullYear(), h.getMonth() + 1, 0, 23, 59, 59);
  let de, ate = fimMes;
  switch (F.periodo) {
    case 'mes': de = new Date(h.getFullYear(), h.getMonth(), 1); break;
    case 'ant': de = new Date(h.getFullYear(), h.getMonth() - 1, 1);
                ate = new Date(h.getFullYear(), h.getMonth(), 0, 23, 59, 59); break;
    case 'u3':  de = new Date(h.getFullYear(), h.getMonth() - 2, 1); break;
    case 'u6':  de = new Date(h.getFullYear(), h.getMonth() - 5, 1); break;
    case 'u12': de = new Date(h.getFullYear(), h.getMonth() - 11, 1); break;
    case 'ano': de = new Date(h.getFullYear(), 0, 1); break;
    default:    de = new Date(2000, 0, 1);
  }
  return { de: de, ate: ate };
}

function mesesDoEixo(minimo) {
  const f = faixa();
  const out = [];
  let k = chaveMes(f.de);
  const fim = chaveMes(f.ate);
  let guarda = 0;
  while (k <= fim && guarda++ < 240) { out.push(k); k = mesMais(k, 1); }
  if (minimo && out.length < 2 && minimo.length) return minimo;
  return out;
}

const noPeriodo = d => { if (!d) return false; const f = faixa(); return d >= f.de && d <= f.ate; };
const passaSet = (s, v) => !s.size || s.has(v);
function passaBusca(campos) {
  if (!F.busca) return true;
  const k = chaveBusca(F.busca);
  return campos.some(c => chaveBusca(c).includes(k));
}

/* Recortes por fonte */
function selAtend() {
  const d = DADOS.atend;
  if (!d) return [];
  return d.reg.filter(r =>
    noPeriodo(r.dAtend || r.dAgenda) &&
    passaSet(F.produtos, r.produto) && passaSet(F.sdrs, r.sdr) &&
    passaSet(F.closers, r.closer) &&
    passaBusca([r.lead, r.id, r.etapa, r.closer, r.sdr, r.produto, r.telefone, r.resultado]));
}
function selClientes() {
  const d = DADOS.clientes;
  if (!d) return [];
  return d.reg.filter(r =>
    noPeriodo(r.dFecha) &&
    passaSet(F.produtos, r.produto) && passaSet(F.sdrs, r.sdr) &&
    passaSet(F.closers, r.closer) && passaSet(F.origens, r.origem) &&
    passaBusca([r.contato, r.cliente, r.produto, r.closer, r.sdr, r.origem, r.tipoPag]));
}
function selMetaDia() {
  const d = DADOS.metaDia;
  if (!d) return [];
  return d.reg.filter(r => noPeriodo(r.d) && passaBusca([r.campanha]));
}
function selMetaReun() {
  const d = DADOS.metaReun;
  if (!d) return [];
  return d.reg.filter(r => noPeriodo(r.d) && passaSet(F.produtos, r.produto) && passaSet(F.origens, r.origem));
}
function selKommo() {
  const d = DADOS.kommo;
  if (!d) return [];
  return d.reg.filter(r =>
    noPeriodo(r.d) && passaSet(F.produtos, r.produto) && passaSet(F.origens, r.origem) &&
    passaBusca([r.lead, r.id, r.etapa, r.funil, r.campanha, r.produto]));
}

/* ===================== AGREGACAO ===================== */
function agrupar(lista, chaveFn, valorFn) {
  const m = new Map();
  lista.forEach(r => {
    const k = (chaveFn(r) || '').toString().trim() || '—';
    if (!m.has(k)) m.set(k, { k: k, n: 0, v: 0, itens: [] });
    const o = m.get(k);
    o.n++; o.v += valorFn ? (valorFn(r) || 0) : 1; o.itens.push(r);
  });
  return Array.from(m.values());
}
const porVolume = a => a.sort((x, y) => y.v - x.v || y.n - x.n);
const porN      = a => a.sort((x, y) => y.n - x.n);
/* Barra de R$ 0 nao informa nada e ocupa linha: fora dos recortes de valor. */
const semZero   = a => a.filter(x => (x.v || 0) !== 0);

/* Concentra a cauda em "Outros": a 9a cor categorica nao existe. */
function topN(arr, n, rotulo) {
  if (arr.length <= n) return arr;
  const cab = arr.slice(0, n - 1);
  const resto = arr.slice(n - 1);
  cab.push({
    k: rotulo || 'Outros (' + resto.length + ')',
    n: resto.reduce((a, x) => a + x.n, 0),
    v: resto.reduce((a, x) => a + x.v, 0),
    itens: resto.reduce((a, x) => a.concat(x.itens || []), []),
    cor: 'var(--texto-muted)'
  });
  return cab;
}

function serieMensal(lista, dataFn, valorFn, meses) {
  const m = {};
  lista.forEach(r => {
    const d = dataFn(r); if (!d) return;
    const k = chaveMes(d);
    m[k] = (m[k] || 0) + (valorFn ? (valorFn(r) || 0) : 1);
  });
  return meses.map(k => m[k] || 0);
}

const soma  = (l, f) => l.reduce((a, r) => a + (f(r) || 0), 0);

/* ===== EIXO DO TEMPO =====
   Com o recorte num mes so, um grafico de "evolucao" vira uma coluna - e uma
   coluna nao e evolucao, e um numero com moldura em volta. Entao a
   granularidade acompanha o recorte: ate dois meses o eixo e DIARIO, acima
   disso e mensal. E o que o painel precisa fazer agora que abre no mes
   corrente, senao o padrao de abertura mataria metade dos graficos. */
const chaveDia = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
                      '-' + String(d.getDate()).padStart(2, '0');

function eixoTempo() {
  const meses = mesesDoEixo();
  if (meses.length > 2) {
    return { tipo: 'mes', chaves: meses, rot: rotuloMesCurto, rotLongo: rotuloMes, chave: chaveMes };
  }
  const f = faixa();
  const agora = new Date();
  const fim = f.ate < agora ? f.ate : agora;
  const chaves = [];
  const d = new Date(f.de.getFullYear(), f.de.getMonth(), f.de.getDate());
  /* Teto de 93 dias: acima disso o eixo diario vira um borrao. */
  while (d <= fim && chaves.length < 93) { chaves.push(chaveDia(d)); d.setDate(d.getDate() + 1); }
  if (!chaves.length) chaves.push(chaveDia(agora));
  return { tipo: 'dia', chaves: chaves,
           rot: k => k.slice(8, 10), rotLongo: k => k.slice(8, 10) + '/' + k.slice(5, 7),
           chave: chaveDia };
}
const rotuloEixo = e => e.tipo === 'dia' ? 'dia a dia' : 'mes a mes';

/* Itens de cada balde do eixo - base de todo grafico de evolucao. */
function baldes(lista, dataFn) {
  const e = eixoTempo();
  const m = {};
  (lista || []).forEach(r => {
    const d = dataFn(r); if (!d) return;
    const k = e.chave(d);
    (m[k] = m[k] || []).push(r);
  });
  return { eixo: e, x: e.chaves.map(e.rot), itens: e.chaves.map(k => m[k] || []) };
}
/* Soma por balde, pronta para vizColunas. */
function evolucao(lista, dataFn, valorFn) {
  const b = baldes(lista, dataFn);
  return b.eixo.chaves.map((k, i) => ({
    k: b.eixo.rot(k), rot: b.eixo.rotLongo(k),
    v: valorFn ? soma(b.itens[i], valorFn) : b.itens[i].length
  }));
}
/* Serie de RAZAO (ticket, CPL, ROI): o valor do balde depende dos itens
   dele, nao de uma soma - dividir somas de baldes diferentes daria outra
   coisa.

   No eixo DIARIO a razao fica rarefeita: a maioria dos dias nao tem nenhum
   fechamento, e a linha vira ponto solto com buraco no meio - que parece
   ruido e nao e leitura nenhuma. Entao ela passa a ser ACUMULADA no recorte:
   "o ticket medio do mes ate aqui", que e justamente o numero que a gestao
   acompanha no meio do mes. No eixo mensal cada mes fecha sozinho. */
function evolucaoRazao(lista, dataFn, fn) {
  const b = baldes(lista, dataFn);
  if (b.eixo.tipo === 'dia') {
    let acc = [];
    return { x: b.x, acum: true,
             vals: b.itens.map(it => { acc = acc.concat(it); return acc.length ? fn(acc) : null; }) };
  }
  return { x: b.x, acum: false, vals: b.itens.map(fn) };
}
/* Sufixo honesto para o subtitulo do cartao. */
const notaAcum = e => e.acum ? ' Acumulado no recorte, dia a dia.' : '';

/* ===== TICKET MEDIO =====
   Conta SO quem teve honorario inicial. Fechamento com honorario condicionado
   a liminar entra na planilha como R$ 0: e venda, mas nao e preco. Deixar
   esses zeros no divisor achataria o ticket (R$ 888 no lugar de R$ 2.565 em
   out/26) e esconderia por quanto o escritorio de fato negocia.
   A contagem de CLIENTES segue sendo todos - o que muda e so o ticket. */
function ticketMedio(lista) {
  const com = (lista || []).filter(r => (r.honIni || 0) > 0);
  return com.length ? soma(com, r => r.honIni) / com.length : null;
}
const semTicket = lista => (lista || []).filter(r => (r.honIni || 0) <= 0).length;
const media = (l, f) => { const v = l.map(f).filter(x => x != null && isFinite(x) && x !== 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

/* KR do mes na planilha de metas, por nome. */
function kr(nomeMes, texto) {
  const m = DADOS.metas && DADOS.metas.meses && DADOS.metas.meses[nomeMes];
  if (!m || !m.krs) return null;
  const k = chaveBusca(texto);
  return m.krs.find(x => chaveBusca(x.kr).includes(k)) || null;
}
function metasMesAtual() {
  const m = DADOS.metas && DADOS.metas.meses;
  if (!m) return null;
  const nome = MESES_ACENTO[new Date().getMonth()];
  return m[nome] && !m[nome].erro ? m[nome] : null;
}
const MESES_ACENTO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* Quanto do mes ja passou - base de toda leitura de ritmo. */
function ritmoDoMes() {
  const m = metasMesAtual();
  const h = new Date();
  const diasMes = (m && m.diasMes) || new Date(h.getFullYear(), h.getMonth() + 1, 0).getDate();
  const diasComp = (m && m.diasComp) || h.getDate();
  return { diasMes: diasMes, diasComp: diasComp, pct: diasMes ? (diasComp / diasMes) * 100 : 0 };
}

/* ==========================================================================
   TELA 2 - FUNIL E PRE-QUALIFICACAO
   ========================================================================== */
function telaFunil(aba) {
  aba = aba || 'produto';
  let h = '';
  const p = DADOS.metas && DADOS.metas.produtos;
  const atual = p && p.atual;

  if (aba === 'produto') {
  if (atual && atual.real) {
    const ordem = ['leads (organico)', 'leads (kommo)', 'leads (meta ads)', 'responderam a triagem', 'elegiveis',
      'responderam a qualificacao', 'qualificados (aguardando documentacao)', 'diagnosticos', 'viaveis',
      'atendimentos realizados', 'clientes'];
    /* As linhas de ORIGEM de lead (Organico, Kommo, Meta Ads) sao paralelas
       entre si, nao etapas em sequencia: encadear uma na outra produziria
       "conversao de 1.981%". Elas entram somadas como topo do funil, e a
       cadeia de conversao comeca na triagem. */
    const FONTES_LEAD = ['leads (organico)', 'leads (kommo)', 'leads (meta ads)',
                         'leads abordados ou que falaram no whatsapp'];
    const valorDe = k => (atual.real && atual.real[k] != null && atual.real[k] !== '') ? num(atual.real[k]) : null;

    const origens = FONTES_LEAD.map(k => {
      const v = valorDe(k);
      if (!v) return null;
      const e = atual.etapas.find(x => x.k === k);
      return { k: (e && e.rot) || k, v: v };
    }).filter(Boolean);
    const totalLeads = origens.reduce((a, o) => a + o.v, 0);

    const etapas = totalLeads ? [{ k: 'Leads (todas as origens)', v: totalLeads }] : [];
    ordem.filter(k => FONTES_LEAD.indexOf(k) < 0).forEach(k => {
      const v = valorDe(k);
      if (!v) return;
      const e = atual.etapas.find(x => x.k === k);
      etapas.push({ k: (e && e.rot) || k, v: v });
    });

    h += '<div class="secao-titulo primeiro">Funil do produto &middot; ' +
      (atual.medicao ? 'medicao de ' + esc(atual.medicao) : rotuloMes(MES_ATUAL)) + '</div>';
    h += aviso('info', 'Este funil vem da aba <b>Produtos Juridicos</b> da planilha de Metas &mdash; ' +
      'e a contagem que o time mantem a mao. A percentagem ao lado de cada etapa e a conversao sobre a etapa anterior. ' +
      'As origens de lead entram somadas no topo (elas sao paralelas, nao etapas em sequencia).');
    h += '<div class="grid g-2">';
    h += cartao('Funil realizado no mês', 'Volume por etapa e conversão etapa a etapa.', vizFunil(etapas));

    if (origens.length > 1) {
      h += cartao('De onde vieram os leads do mês', 'Origens somadas no topo do funil.',
        /* Barra horizontal ja carrega o proprio rotulo: legenda aqui seria
           repetir a mesma lista duas vezes. */
        vizBarras({ dados: origens.map((o, i) => ({ k: o.k, v: o.v, cor: corSerie(i),
          extra: [{ rot: 'Participação', val: pct(taxa(o.v, totalLeads), 1) }] })), nome: 'Leads' }));
    }

    /* Real x projetado: a planilha ja traz as duas projecoes. Mostro o texto
       original da celula (R$, %, decimal) em vez de reformatar - assim a
       linha de ROI nao vira "2" no lugar de "2,02". */
    const cel = (o, k) => (o && o[k] != null && o[k] !== '') ? String(o[k]).trim() : '';
    const linhas = atual.etapas.map(e => ({
      etapa: e.rot,
      real: num(cel(atual.real, e.k)),        realTxt: cel(atual.real, e.k),
      projProp: num(cel(atual.projProp, e.k)), projPropTxt: cel(atual.projProp, e.k),
      projMes: num(cel(atual.projMes, e.k)),   projMesTxt: cel(atual.projMes, e.k)
    })).filter(l => l.realTxt || l.projMesTxt);
    const txtOuNum = (txt, n) => txt ? esc(txt) : (n ? n0(n) : '&mdash;');

    h += cartao('Realizado x projetado', 'Comparacao com a projeção proporcional (ritmo esperado para hoje) e com a meta cheia do mês.',
      tabelaInterativa('funil-proj', [
        { k: 'etapa', rot: 'Etapa', tipo: 'txt', cls: 'forte' },
        { k: 'real', rot: 'Real', tipo: 'num',
          html: r => '<b style="color:var(--texto)">' + txtOuNum(r.realTxt, r.real) + '</b>' },
        { k: 'projProp', rot: 'Proj. proporcional', tipo: 'num', html: r => txtOuNum(r.projPropTxt, r.projProp) },
        { k: 'atingProp', rot: 'vs proporcional', tipo: 'num', ord: false,
          html: r => { const t = taxa(r.real, r.projProp); return t == null ? '&mdash;' : selo(nivelMeta(t), pct(t, 0)); } },
        { k: 'projMes', rot: 'Meta do mês', tipo: 'num', html: r => txtOuNum(r.projMesTxt, r.projMes) },
        { k: 'atingMes', rot: 'vs meta', tipo: 'num', ord: false,
          html: r => { const t = taxa(r.real, r.projMes); return t == null ? '&mdash;' : pct(t, 0); } }
      ], linhas, { titulo: 'Funil realizado x projetado', limite: 25, ativa: false }));
    h += '</div>';

    /* ----- Avanco etapa a etapa, em numero e em percentual -----
       Duas taxas diferentes, e confundi-las e o erro classico de leitura de
       funil: o AVANCO e sobre a etapa imediatamente anterior (mede aquela
       passagem) e o ACUMULADO e sobre o topo (mede o funil inteiro ate ali).
       A coluna de perda mostra quantos ficaram pelo caminho naquele degrau. */
    if (etapas.length > 1) {
      const passos = etapas.map((e, i) => {
        const ant = i > 0 ? etapas[i - 1].v : null;
        return {
          etapa: e.k, ordem: i + 1, volume: e.v,
          avanco: ant ? taxa(e.v, ant) : null,
          perda: ant ? ant - e.v : null,
          perdaPct: ant ? taxa(ant - e.v, ant) : null,
          acumulado: taxa(e.v, etapas[0].v)
        };
      });
      /* O degrau que mais sangra, para o olho ir direto nele. */
      const pior = passos.filter(p => p.perda != null)
        .sort((a, b) => b.perda - a.perda)[0];

      h += '<div class="secao-titulo">Avanco etapa a etapa</div>';
      if (pior && pior.perda > 0) {
        h += aviso('atencao', 'O degrau que mais perde gente e <b>' + esc(pior.etapa) + '</b>: ' +
          'entram ' + n0(pior.volume + pior.perda) + ', seguem ' + n0(pior.volume) + ' &mdash; ' +
          '<b>' + n0(pior.perda) + ' ficam pelo caminho</b> (' + pct(pior.perdaPct, 0) + ' daquela etapa).');
      }
      h += tabelaInterativa('funil-passos', [
        { k: 'ordem', rot: '#', tipo: 'num' },
        { k: 'etapa', rot: 'Etapa', tipo: 'txt', cls: 'forte' },
        { k: 'volume', rot: 'Volume', tipo: 'num',
          html: r => barraCelula(r.volume, etapas[0].v, corRampa(r.ordem - 1, etapas.length), n0(r.volume)) },
        { k: 'avanco', rot: 'Avanco da etapa anterior', tipo: 'num', ord: false,
          html: r => r.avanco == null ? '<span style="color:var(--texto-muted)">topo do funil</span>'
            : selo(r.avanco >= 80 ? 'ok' : r.avanco >= 50 ? 'atencao' : 'critico', pct(r.avanco, 1)) },
        { k: 'perda', rot: 'Perda no degrau', tipo: 'num',
          html: r => r.perda == null ? '&mdash;' : (r.perda > 0
            ? '<span style="color:#e98a8a">-' + n0(r.perda) + '</span> <span style="color:var(--texto-muted)">(' + pct(r.perdaPct, 0) + ')</span>'
            : n0(0)) },
        { k: 'acumulado', rot: 'Do topo do funil', tipo: 'num', ord: false,
          html: r => pct(r.acumulado, r.acumulado < 10 ? 2 : 1) }
      ], passos, { titulo: 'Avanco do funil', limite: 20, ativa: false });
    }

    /* ----- Origem dos leads: campanha a campanha ----- */
    /* Escopo do MES, nao do filtro de periodo: o organico e o total do CRM
       vem da aba de Produtos Juridicos, que e mensal. Somar 6 meses de
       campanha contra 1 mes de organico daria uma participacao mentirosa. */
    h += '<div class="secao-titulo">Origem dos leads &middot; ' + rotuloMes(atual.medicao ? MES_ATUAL : MES_ATUAL) + '</div>';
    const midiaMes = (DADOS.metaDia ? DADOS.metaDia.reg : []).filter(r => r.mes === MES_ATUAL);
    const porCampanha = porN(agrupar(midiaMes.filter(r => r.leadsTotal > 0),
      r => r.campanha, r => r.leadsTotal)).map(g => ({ k: g.k, v: g.v, tipo: 'Campanha paga' }));
    const leadsPagos = soma(porCampanha, g => g.v);
    const organico = valorDe('leads (organico)') || 0;
    const totalCrm = valorDe('leads (kommo)') || 0;
    /* O que o CRM registrou e a midia nao explica: parceria, indicacao,
       recompra, direct. So entra se for positivo - numero negativo aqui
       significaria atribuicao furada, e inventar uma fatia esconderia isso. */
    const outras = Math.max(0, totalCrm - leadsPagos - organico);
    const fatias = porCampanha.slice();
    if (organico) fatias.push({ k: 'Organico', v: organico, tipo: 'Organico' });
    if (outras)   fatias.push({ k: 'Outras origens (nao atribuido)', v: outras, tipo: 'Outras' });
    const totalFatias = soma(fatias, f => f.v);

    if (!fatias.length) {
      h += '<div class="cartao"><div class="vazio">Sem leads com origem identificada no recorte.</div></div>';
    } else {
      const corTipo = t => t === 'Organico' ? 'var(--s3)' : t === 'Outras' ? 'var(--texto-muted)' : 'var(--s1)';
      h += '<div class="grid g-2">';
      h += cartao('De onde vieram os leads', 'Campanha paga pelos insights do Meta, organico pela planilha de Metas.',
        vizBarras({ rotuloW: 230, nome: 'Leads', dados: topN(fatias.map(f =>
          ({ k: f.k, v: f.v, n: 1, cor: corTipo(f.tipo),
             extra: [{ rot: 'Participação', val: pct(taxa(f.v, totalFatias), 1) }] })), 9) }) +
        legenda([{ nome: 'Campanha paga', cor: 'var(--s1)', val: n0(leadsPagos) },
                 { nome: 'Organico', cor: 'var(--s3)', val: n0(organico) },
                 { nome: 'Outras origens', cor: 'var(--texto-muted)', val: n0(outras) }]));

      h += cartao('Pago, organico e outras', 'Participacao de cada natureza de origem no total de leads.',
        vizDonut({ centro: n0(totalFatias), centroRot: 'leads', dados: [
          { k: 'Campanha paga', v: leadsPagos, cor: 'var(--s1)' },
          { k: 'Organico', v: organico, cor: 'var(--s3)' },
          { k: 'Outras origens', v: outras, cor: 'var(--texto-muted)' }
        ] }));
      h += '</div>';

      /* Tabela com custo e CPL por campanha - a leitura que decide verba. */
      const invPorCamp = {};
      midiaMes.forEach(r => { invPorCamp[r.campanha] = (invPorCamp[r.campanha] || 0) + r.gasto; });
      const tabOrigem = fatias.map(f => ({
        origem: f.k, tipo: f.tipo, leads: f.v,
        share: taxa(f.v, totalFatias),
        gasto: f.tipo === 'Campanha paga' ? (invPorCamp[f.k] || 0) : null,
        cpl: f.tipo === 'Campanha paga' && f.v ? (invPorCamp[f.k] || 0) / f.v : null
      }));
      h += tabelaInterativa('funil-origem', [
        { k: 'origem', rot: 'Origem', tipo: 'txt', cls: 'forte wrap' },
        { k: 'tipo', rot: 'Natureza', tipo: 'txt', ord: false,
          html: r => '<span style="color:' + corTipo(r.tipo) + '">&#9679;</span> ' + esc(r.tipo) },
        { k: 'leads', rot: 'Leads', tipo: 'num' },
        { k: 'share', rot: '% do total', tipo: 'pct', casas: 1 },
        { k: 'gasto', rot: 'Investimento', tipo: 'moeda0' },
        { k: 'cpl', rot: 'CPL', tipo: 'moeda',
          html: r => r.cpl == null ? '<span style="color:var(--texto-muted)">sem custo de midia</span>' : brl(r.cpl) }
      ], tabOrigem, { ord: 'leads', dir: -1, titulo: 'Origem dos leads', limite: 40,
        total: { leads: d => n0(soma(d, r => r.leads)), gasto: d => brl0(soma(d, r => r.gasto)),
                 cpl: d => { const l = soma(d.filter(r => r.cpl != null), r => r.leads);
                             return l ? brl(soma(d, r => r.gasto) / l) : ''; } } });

      if (totalCrm && leadsPagos + organico > totalCrm) {
        h += aviso('atencao', 'A soma de campanha paga (' + n0(leadsPagos) + ') com organico (' + n0(organico) +
          ') passa o total de leads que o CRM registrou no mes (' + n0(totalCrm) + '). ' +
          'Os insights do Meta contam lead por plataforma e o CRM conta lead criado &mdash; a diferenca costuma ser ' +
          'lead duplicado ou que nao chegou a virar registro.');
      }
    }

    /* Taxas de conversao projetadas x reais, quando a planilha informa. */
    if (atual.taxasReal && atual.taxasProj) {
      const tx = atual.etapas.map(e => {
        const r = atual.taxasReal[e.k], pj = atual.taxasProj[e.k];
        if (!r || !pj || !/%/.test(String(r)) && !/%/.test(String(pj))) return null;
        return { etapa: e.rot, real: numPct(r), proj: numPct(pj) };
      }).filter(Boolean);
      if (tx.length) {
        h += '<div class="secao-titulo">Taxas de conversão &middot; real x projetada</div>';
        h += cartao('Conversão por etapa', 'Onde a operação esta acima e abaixo do que o modelo assume.',
          vizLinhas({ x: tx.map(t => t.etapa.length > 14 ? t.etapa.slice(0, 13) + '…' : t.etapa), fmt: v => pct(v, 0),
            series: [{ nome: 'Projetada', vals: tx.map(t => t.proj), cor: 'var(--s4)' },
                     { nome: 'Real', vals: tx.map(t => t.real), cor: 'var(--s1)' }] }) +
          legenda([{ nome: 'Projetada', cor: 'var(--s4)' }, { nome: 'Real', cor: 'var(--s1)' }]));
      }
    }
  } else if (p && p.atualErro) {
    h += aviso('atencao', 'Nao consegui ler a aba de funil da planilha de Metas: ' + esc(p.atualErro));
  }
  return h;
  }

  /* ----- Pre-qualificacao lead a lead (Kommo) ----- */
  h += '<div class="secao-titulo primeiro">Pré-qualificação lead a lead &middot; Kommo</div>';
  if (ERROS.kommo) {
    h += aviso('critico', '<b>A planilha Leads Kommo [DASHBOARDS] nao pode ser lida pelo navegador.</b><br>' +
      esc(ERROS.kommo) + '<br><br>Das seis planilhas do painel, ela e a unica sem leitura por link. ' +
      'Para liberar: abra a planilha &rarr; <b>Compartilhar</b> &rarr; <i>Acesso geral</i> &rarr; ' +
      '<b>Qualquer pessoa com o link</b>, no papel <b>Leitor</b>. ' +
      'Enquanto isso, o funil acima continua vindo da planilha de Metas.');
  } else if (DADOS.kommo) {
    const kk = selKommo();
    const d = DADOS.kommo;
    if (d.legadas) {
      h += aviso('atencao', '<b>A aba Leads esta no meio de uma reescrita.</b> ' +
        'O cabecalho ja esta no formato novo (57 colunas), mas ' + n0(d.legadas) +
        ' linhas ainda estao no formato antigo (17 colunas) &mdash; o coletor falhou antes de terminar. ' +
        'O painel le os dois formatos, mas os campos novos (valor, motivo de perda, UTM) so existem nas linhas ja migradas.');
    }
    const preq = kk.filter(r => r.preQual);
    h += '<div class="grid g-kpi">';
    h += kpi({ rotulo: 'Leads no recorte', valor: n0(kk.length), nota: 'Funil Processual fora: não e lead comercial' });
    h += kpi({ rotulo: 'Responderam a triagem', valor: n0(preq.length),
      nota: pctOuTraco(taxa(preq.length, kk.length), 1) + ' dos leads',
      dica: 'Conta quem respondeu ao menos um campo do formulario (plano, tipo, mensalidade ou tempo de plano).' });
    h += kpi({ rotulo: 'Marcados como perdidos', valor: n0(kk.filter(r => r.perdido).length),
      nota: pctOuTraco(taxa(kk.filter(r => r.perdido).length, kk.length), 1) + ' dos leads' });
    h += kpi({ rotulo: 'Com reunião agendada', valor: n0(kk.filter(r => r.reuniao).length) });
    h += '</div>';

    const evK = evolucao(kk, r => r.d);
    h += '<div class="grid g-2" style="margin-top:0.85rem">';
    h += cartao('Leads por data de entrada', 'Total e quantos responderam a triagem.',
      vizLinhas({ x: evK.map(x => x.k), fmt: n0, series: [
        { nome: 'Leads', vals: evK.map(x => x.v), cor: 'var(--s1)' },
        { nome: 'Responderam a triagem', vals: evolucao(preq, r => r.d).map(x => x.v), cor: 'var(--s3)' }
      ] }) + legenda([{ nome: 'Leads', cor: 'var(--s1)' }, { nome: 'Responderam a triagem', cor: 'var(--s3)' }]));

    h += cartao('Etapas do CRM', 'Onde os leads do recorte estao parados.',
      vizBarras({ dados: porN(topN(agrupar(kk, r => r.etapa), 10)).map((g, i) => ({ k: g.k, v: g.n, cor: g.cor || corRampa(i, 10) })), nome: 'Leads' }));

    h += cartao('Campanhas que trouxeram lead', 'Pelo campo Campanha do CRM.',
      vizBarras({ dados: porN(topN(agrupar(kk.filter(r => r.campanha), r => r.campanha), 8)).map((g, i) => ({ k: g.k, v: g.n, cor: g.cor || corSerie(i) })), nome: 'Leads' }));

    h += cartao('Perfil de quem responde', 'Tipo de plano declarado na triagem.',
      vizBarras({ dados: porN(topN(agrupar(preq.filter(r => r.tipoPlano), r => r.tipoPlano), 7)).map((g, i) => ({ k: g.k, v: g.n, cor: g.cor || corSerie(i) })), nome: 'Leads' }));
    h += '</div>';

    h += '<div class="secao-titulo">Leads do recorte</div>';
    h += tabelaInterativa('kommo-leads', [
      { k: 'd', rot: 'Entrada', tipo: 'data' },
      { k: 'lead', rot: 'Lead', tipo: 'txt', cls: 'forte' },
      { k: 'funil', rot: 'Funil', tipo: 'txt' },
      { k: 'etapa', rot: 'Etapa', tipo: 'txt' },
      { k: 'situacao', rot: 'Situação', tipo: 'txt' },
      { k: 'produto', rot: 'Produto', tipo: 'txt' },
      { k: 'campanha', rot: 'Campanha', tipo: 'txt' },
      { k: 'tipoPlano', rot: 'Tipo de plano', tipo: 'txt' },
      { k: 'mensalidade', rot: 'Mensalidade', tipo: 'txt' },
      { k: 'preQual', rot: 'Triagem', tipo: 'txt', ord: false,
        html: r => r.preQual ? selo('ok', 'respondeu') : selo('neutro', 'sem resposta') },
      { k: 'responsavel', rot: 'Responsável', tipo: 'txt' }
    ], kk, { ord: 'd', dir: -1, titulo: 'Leads Kommo', limite: 50 });
  }
  return h;
}

/* ==========================================================================
   TELA 3 - NEGOCIACAO (ESTEIRA)
   ========================================================================== */
function telaEsteira() {
  if (ERROS.atend) return aviso('critico', '<b>Fluxo de Atendimentos nao entrou:</b> ' + esc(ERROS.atend));
  const at = selAtend();
  const todos = DADOS.atend ? DADOS.atend.reg : [];
  const abertos = at.filter(r => r.emAberto);
  const ganhos = at.filter(r => r.grupo === 'ganho');
  const perdidos = at.filter(r => r.grupo === 'perdido');
  const semResp = at.filter(r => r.grupo === 'semresposta');
  const decididos = ganhos.length + perdidos.length;

  let h = '';
  h += '<div class="secao-titulo primeiro">Esteira de negociação &middot; ' + esc(rotuloPeriodo()) + '</div>';
  const Ke = [];
  Ke.push({ rotulo: 'Em aberto', valor: n0(abertos.length),
    nota: 'Negociações vivas (fora ganho, perda e sem resposta)' });
  Ke.push({ rotulo: 'Proposta em aberto', valor: brl0(soma(abertos, r => r.vInicial)), pequeno: true,
    nota: 'Soma dos honorários iniciais propostos nas negociações vivas',
    dica: 'Só conta quem tem valor de proposta preenchido na planilha.' });
  Ke.push({ rotulo: 'Ganhos no recorte', valor: n0(ganhos.length),
    nota: 'Etapa "Enviado a Triagem e Distribuição"' });
  Ke.push({ rotulo: 'Taxa de ganho', valor: pctOuTraco(taxa(ganhos.length, decididos), 1),
    dica: 'Ganhos dividido por ganhos + perdidos. Quem esta sem resposta não entra: ainda não decidiu.',
    nota: n0(ganhos.length) + ' de ' + n0(decididos) + ' decididos' });
  Ke.push({ rotulo: 'Sem resposta', valor: n0(semResp.length),
    nota: pctOuTraco(taxa(semResp.length, at.length), 0) + ' dos atendimentos do recorte',
    selo: taxa(semResp.length, at.length) > 40 ? selo('critico', 'maior gargalo') : null });
  Ke.push({ rotulo: 'Tempo médio em negociação', valor: (() => { const m = media(abertos, r => r.diasNeg); return m == null ? '&mdash;' : n0(m) + ' dias'; })(), pequeno: true });
  Ke.push({ rotulo: 'Paradas ha mais de 7 dias', valor: n0(abertos.filter(r => r.parado).length),
    selo: abertos.filter(r => r.parado).length ? selo('atencao', 'retomar contato') : selo('ok', 'em dia'),
    dica: 'Dias desde o último follow up registrado ou, na falta dele, desde o atendimento.' });
  Ke.push({ rotulo: 'FUP pendentes', valor: n0(soma(abertos, r => r.fupPendentes)),
    nota: n0(abertos.filter(r => r.fupPendentes > 0).length) + ' negociacoes com pendencia' });
  h += hierarquiaKpi(Ke, 4);

  /* ----- Distribuicao pela esteira ----- */
  h += '<div class="secao-titulo">Como a esteira está distribuída</div>';
  h += '<div class="grid g-2">';
  const etapas = agrupar(at, r => r.etapa).sort((a, b) => posEtapa(a.k) - posEtapa(b.k));
  h += cartao('Etapas do funil de negociação', 'Na ordem da esteira, do primeiro contato ao fechamento.',
    vizBarras({ dados: etapas.map((g, i) => ({
      k: g.k, v: g.n, cor: COR_GRUPO[grupoEtapa(g.k)],
      extra: [{ rot: 'Proposta somada', val: brl0(soma(g.itens, r => r.vInicial)) }]
    })), nome: 'Negociações' }) +
    legenda(['ganho', 'aberto', 'semresposta', 'perdido'].map(g => ({ nome: ROTULO_GRUPO[g], cor: COR_GRUPO[g] }))));

  const sit = ['ganho', 'aberto', 'semresposta', 'perdido'].map(g => ({
    k: ROTULO_GRUPO[g], v: at.filter(r => r.grupo === g).length, cor: COR_GRUPO[g]
  }));
  h += cartao('Desfecho dos atendimentos', 'Participação de cada situação no recorte.',
    vizDonut({ dados: sit, centro: n0(at.length), centroRot: 'atendimentos' }) + legenda(sit.map(s => ({ nome: s.k, cor: s.cor, val: n0(s.v) }))));

  /* Esteira de FUP: onde cada negociacao viva parou. */
  const fupDef = DADOS.atend.fups || [];
  if (fupDef.length) {
    const passos = fupDef.map(f => ({
      k: f.rotulo,
