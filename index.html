      v: at.filter(r => r.fups.some(x => x.n === f.n && /feito/i.test(x.status))).length,
      pend: at.filter(r => r.fups.some(x => x.n === f.n && /pendente/i.test(x.status))).length
    }));
    h += cartao('Esteira de follow up', 'Quantos atendimentos do recorte tiveram cada follow up marcado como Feito. O degrau onde a barra cai e onde a esteira perde gente.',
      vizBarras({ dados: passos.map((p, i) => ({
        k: p.k, v: p.v, cor: corRampa(i, passos.length),
        extra: p.pend ? [{ rot: 'Pendentes', val: n0(p.pend), cor: 'var(--atencao)' }] : []
      })), nome: 'Feitos' }));
  }

  const perdaMotivo = porN(agrupar(perdidos.filter(r => r.motivoPerda), r => r.motivoPerda));
  h += cartao('Motivos de perda', perdidos.length ? 'Entre as ' + n0(perdidos.length) + ' perdas do recorte, ' +
      n0(perdidos.filter(r => r.motivoPerda).length) + ' tem motivo registrado.' : 'Sem perdas no recorte.',
    perdaMotivo.length ? vizBarras({ dados: perdaMotivo.map((g, i) => ({ k: g.k, v: g.n, cor: corSerie(i) })), nome: 'Perdas' })
      : '<div class="vazio">Nenhuma perda com motivo preenchido no recorte.</div>');
  h += '</div>';

  /* ----- Oferta e temperatura ----- */
  const comHon = at.filter(r => r.tipoHon);
  if (comHon.length) {
    h += '<div class="secao-titulo">Formato de honorário oferecido</div>';
    h += '<div class="grid g-3">';
    h += cartao('Tipo de contrato de honorários', 'Reflete a esteira de oferta: inicial, liminar (D28) e exito.',
      vizBarras({ dados: porN(agrupar(comHon, r => r.tipoHon)).map((g, i) => ({
        k: g.k, v: g.n, cor: corSerie(i),
        extra: [{ rot: 'Proposta somada', val: brl0(soma(g.itens, r => r.vInicial)) }] })), nome: 'Negociações' }));
    const temp = at.filter(r => r.temperatura);
    h += cartao('Temperatura da negociação', temp.length ? 'Preenchida em ' + n0(temp.length) + ' de ' + n0(at.length) + ' atendimentos.' : 'Campo pouco preenchido na planilha.',
      temp.length ? vizBarras({ dados: porN(agrupar(temp, r => r.temperatura)).map(g => ({
        k: g.k, v: g.n, cor: /quente/i.test(g.k) ? 'var(--s2)' : /fria/i.test(g.k) ? 'var(--s1)' : 'var(--s4)' })), nome: 'Negociações' })
        : '<div class="vazio">Sem temperatura registrada no recorte.</div>');
    h += cartao('Proposta por faixa de valor', 'Honorários iniciais propostos.',
      (() => {
        const faixas = [{ k: 'Ate R$ 1.000', t: v => v > 0 && v <= 1000 }, { k: 'R$ 1.000 a 2.000', t: v => v > 1000 && v <= 2000 },
          { k: 'R$ 2.000 a 3.000', t: v => v > 2000 && v <= 3000 }, { k: 'R$ 3.000 a 5.000', t: v => v > 3000 && v <= 5000 },
          { k: 'Acima de R$ 5.000', t: v => v > 5000 }];
        const d = faixas.map((f, i) => ({ k: f.k, v: at.filter(r => f.t(r.vInicial)).length, cor: corRampa(i, faixas.length) }));
        return d.some(x => x.v) ? vizBarras({ dados: d, nome: 'Propostas' }) : '<div class="vazio">Sem valor de proposta preenchido no recorte.</div>';
      })());
    h += '</div>';
  }

  /* ----- Tabela operacional ----- */
  h += '<div class="secao-titulo">Negociações &middot; ordene por dias sem toque para achar o que esfriou</div>';
  const TOG = [{ k: '', rot: 'Todas' }, { k: 'aberto', rot: 'Em aberto' }, { k: 'ganho', rot: 'Ganhos' },
               { k: 'semresposta', rot: 'Sem resposta' }, { k: 'perdido', rot: 'Perdidos' }];
  h += '<div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.75rem">' + TOG.map(g => {
    const qt = g.k ? at.filter(r => r.grupo === g.k).length : at.length;
    return '<button class="btn-acao' + (F.grupo === g.k ? ' primario' : '') + '" type="button" data-grupo="' + g.k + '">' +
      esc(g.rot) + ' <b style="font-variant-numeric:tabular-nums">' + n0(qt) + '</b></button>';
  }).join('') + '</div>';
  const linhasTab = F.grupo ? at.filter(r => r.grupo === F.grupo) : at;
  h += tabelaInterativa('esteira-tab', [
    { k: 'dAtend', rot: 'Atendimento', tipo: 'data' },
    { k: 'lead', rot: 'Lead', tipo: 'txt', cls: 'forte' },
    { k: 'etapa', rot: 'Etapa', tipo: 'txt',
      html: r => '<span style="color:' + COR_GRUPO[r.grupo] + ';font-weight:600">&#9679;</span> ' + esc(r.etapa) },
    { k: 'closer', rot: 'Closer', tipo: 'txt' },
    { k: 'sdr', rot: 'SDR', tipo: 'txt' },
    { k: 'produto', rot: 'Produto', tipo: 'txt' },
    { k: 'vInicial', rot: 'Proposta inicial', tipo: 'moeda0' },
    { k: 'tipoHon', rot: 'Honorários', tipo: 'txt' },
    { k: 'diasNeg', rot: 'Dias em neg.', tipo: 'num' },
    { k: 'diasSemToque', rot: 'Dias sem toque', tipo: 'num',
      html: r => r.diasSemToque == null ? '&mdash;' :
        (r.parado ? '<span style="color:#f3c45a;font-weight:700">' + n0(r.diasSemToque) + '</span>' : n0(r.diasSemToque)) },
    { k: 'etapaFup', rot: 'FUP feitos', tipo: 'num',
      html: r => barraCelula(r.fupFeitos, (DADOS.atend.fups || []).length || 9, 'var(--s1)', n0(r.fupFeitos) + '/' + ((DADOS.atend.fups || []).length || 9)) },
    { k: 'proximoFup', rot: 'Próximo FUP', tipo: 'data' },
    { k: 'temperatura', rot: 'Temp.', tipo: 'txt' },
    { k: 'motivoPerda', rot: 'Motivo da perda', tipo: 'txt' },
    { k: 'telefone', rot: 'Telefone', tipo: 'txt' }
  ], linhasTab, { ord: 'diasSemToque', dir: -1, titulo: 'Esteira de negociação', limite: 60 });

  return h;
}

/* ==========================================================================
   TELA 4 - VENDAS E RECEITA
   ========================================================================== */
function telaVendas(modo) {
  if (ERROS.clientes) return aviso('critico', '<b>FLUXO DE CLIENTES nao entrou:</b> ' + esc(ERROS.clientes));
  /* No modulo, a linha de KPI e as quebras por closer/produto/origem ja
     aparecem em KPIS e Dashboards e no modulo Fluxo de clientes. Repetir aqui
     seria o mesmo numero em tres lugares - o que o painel evita por regra. */
  const soEvolucao = modo === 'modulo';
  const cli = selClientes();
  const meses = mesesDoEixo();
  const hon = soma(cli, r => r.honIni);
  const entrada = soma(cli, r => r.entrada);
  const cond = cli.filter(r => r.condicionado);
  const comValor = cli.filter(r => r.honIni > 0);

  let h = '';
  if (!soEvolucao) {
  h += '<div class="secao-titulo primeiro">Vendas &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Clientes fechados', valor: n0(cli.length) });
  h += kpi({ rotulo: 'Honorários iniciais', valor: brl0(hon), pequeno: true });
  h += kpi({ rotulo: 'Ticket médio', valor: ticketMedio(cli) == null ? '&mdash;' : brl0(ticketMedio(cli)), pequeno: true,
    dica: 'Média dos honorários iniciais entre os clientes que tiveram honorário inicial.',
    nota: semTicket(cli) ? 'Entre os ' + n0(comValor.length) + ' com honorario inicial &mdash; ' +
      n0(semTicket(cli)) + ' condicionado(s) a liminar ficam fora' : 'Sobre os ' + n0(cli.length) + ' clientes do recorte' });
  h += kpi({ rotulo: 'Fechados com honorário inicial', valor: n0(comValor.length), pequeno: true,
    nota: pctOuTraco(taxa(comValor.length, cli.length), 0) + ' dos clientes do recorte',
    dica: 'Os demais fecharam com honorário condicionado a liminar: contam como cliente, mas não entram no ticket médio.' });
  h += kpi({ rotulo: 'Entrada recebida', valor: brl0(entrada), pequeno: true,
    nota: pctOuTraco(taxa(entrada, hon), 0) + ' dos honorarios iniciais' });
  h += kpi({ rotulo: 'Pagamento confirmado', valor: pctOuTraco(taxa(cli.filter(r => r.pagoOk).length, cli.length), 0),
    nota: n0(cli.filter(r => r.pagoOk).length) + ' de ' + n0(cli.length) + ' clientes' });
  h += kpi({ rotulo: 'Dias para fechar (médio)', valor: (() => { const m = media(cli, r => r.diasFechar); return m == null ? '&mdash;' : n0(m) + ' dias'; })(), pequeno: true,
    dica: 'Da reunião ao fechamento, pela coluna DIAS PARA FECHAR.' });
  h += kpi({ rotulo: 'Jornada completa (média)', valor: (() => { const m = media(cli, r => r.jornada); return m == null ? '&mdash;' : n0(m) + ' dias'; })(), pequeno: true,
    dica: 'Do primeiro contato ao fechamento.' });
  h += '</div>';

  }
  if (cond.length) h += aviso('info', '<b>' + n0(cond.length) + ' fechamento(s) do recorte tem honorario inicial R$ 0 com pagamento em Liminar.</b> ' +
    'Sao vendas com honorario condicionado (politica D28), nao vendas sem valor. Elas contam como cliente, ' +
    'mas <b>ficam fora do ticket medio</b>: e venda, nao e preco. O ticket mede por quanto o escritorio negocia.');

  const eixoVd = eixoTempo();
  h += '<div class="secao-titulo' + (soEvolucao ? ' primeiro' : '') + '">Evolução' +
    '<span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--texto-muted)">&middot; ' +
    rotuloEixo(eixoVd) + '</span></div>';
  h += '<div class="grid g-2">';
  h += cartao('Honorários iniciais', 'Por data de fechamento.',
    vizColunas({ dados: evolucao(cli, r => r.dFecha, r => r.honIni),
      cor: 'var(--s1)', fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', nome: 'Honorários', rotulos: false }));
  h += cartao('Clientes fechados', 'Duas escalas diferentes, dois graficos: aqui o volume.',
    vizColunas({ dados: evolucao(cli, r => r.dFecha), cor: 'var(--s3)', nome: 'Clientes' }));
  const evTk = evolucaoRazao(cli, r => r.dFecha, ticketMedio);
  h += cartao('Ticket médio', 'Honorários iniciais divididos por quem teve honorário inicial.' + notaAcum(evTk),
    vizLinhas({ x: evTk.x, fmt: brl0, area: true, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k',
      series: [{ nome: 'Ticket médio', vals: evTk.vals, cor: 'var(--s4)' }] }));
  const evDias = evolucaoRazao(cli, r => r.dFecha, l => media(l, r => r.diasFechar));
  h += cartao('Tempo para fechar', 'Média de dias da reunião ao fechamento.' + notaAcum(evDias),
    vizLinhas({ x: evDias.x, fmt: v => n0(v) + ' d', area: true,
      series: [{ nome: 'Dias para fechar', vals: evDias.vals, cor: 'var(--s7)' }] }));
  h += '</div>';

  if (!soEvolucao) {
  h += '<div class="secao-titulo">Quebras da receita</div>';
  h += '<div class="grid g-3">';
  [['closer', 'Closer'], ['sdr', 'SDR'], ['produto', 'Produto juridico'], ['origem', 'Origem'], ['tipoPag', 'Tipo de pagamento']].forEach(([campo, rot]) => {
    const g = semZero(porVolume(topN(agrupar(cli, r => r[campo], r => r.honIni), 7)));
    h += cartao(rot, 'Honorários iniciais no recorte.',
      vizBarras({ dados: g.map((x, i) => ({ k: x.k, v: x.v, cor: x.cor || corSerie(i),
        extra: [{ rot: 'Clientes', val: n0(x.n) }, { rot: 'Ticket médio', val: ticketMedio(x.itens) == null ? '—' : brl0(ticketMedio(x.itens)) }] })), fmt: brl0, nome: 'Honorários' }));
  });
  h += '</div>';
  }

  h += '<div class="secao-titulo">Clientes fechados no recorte</div>';
  h += tabelaInterativa('vendas-tab', [
    { k: 'dFecha', rot: 'Fechamento', tipo: 'data' },
    { k: 'contato', rot: 'Contato', tipo: 'txt', cls: 'forte' },
    { k: 'produto', rot: 'Produto', tipo: 'txt' },
    { k: 'origem', rot: 'Origem', tipo: 'txt' },
    { k: 'sdr', rot: 'SDR', tipo: 'txt' },
    { k: 'closer', rot: 'Closer', tipo: 'txt' },
    { k: 'honIni', rot: 'Hon. iniciais', tipo: 'moeda' },
    { k: 'entrada', rot: 'Entrada', tipo: 'moeda' },
    { k: 'honFim', rot: 'Hon. exito', tipo: 'pct' },
    { k: 'tipoPag', rot: 'Pagamento', tipo: 'txt' },
    { k: 'pagoOk', rot: 'Confirmado', tipo: 'txt', ord: false,
      html: r => r.pagoOk ? selo('ok', 'sim') : selo('atencao', 'nao') },
    { k: 'diasFechar', rot: 'Dias p/ fechar', tipo: 'num' },
    { k: 'jornada', rot: 'Jornada', tipo: 'num' }
  ], cli, { ord: 'dFecha', dir: -1, titulo: 'Clientes fechados', limite: 60,
    total: { honIni: d => brl0(soma(d, r => r.honIni)), entrada: d => brl0(soma(d, r => r.entrada)),
             diasFechar: d => { const m = media(d, r => r.diasFechar); return m == null ? '' : n0(m) + ' d'; } } });
  return h;
}

/* ==========================================================================
   TELA 5 - TRAFEGO (META ADS)
   ========================================================================== */
function telaTrafego(aba) {
  aba = aba || 'ind';
  if (ERROS.metaDia) return aviso('critico', '<b>Insights do Meta Ads nao entraram:</b> ' + esc(ERROS.metaDia));
  const md = selMetaDia();
  const cli = selClientes();
  const meses = mesesDoEixo();
  const reun = selMetaReun();

  /* A tela tem DOIS escopos, de proposito, e o aviso diz qual e qual:
     . os INDICADORES sao do mes selecionado, porque meta e mensal - nao
       existe meta de "ultimos 6 meses";
     . o DETALHE de campanha, criativo e alerta segue o filtro de periodo da
       barra de cima, porque e ali que se investiga. */
  const c = ctxAreaMemo();
  const KT = kpisArea('trafego');
  const todosT = KT.principais.concat(KT.grupos.reduce((a, g) => a.concat(g.l), []));

  let h = '';
  h += barraTela(c, true);
  h += avisoFiltro(c);
  h += resumoArea(todosT);
  h += '<div class="secao-titulo">Principais</div>';
  h += blocoPrincipais(KT.principais);

  h += '<div class="secao-titulo">Comparativos</div>';
  h += '<div class="grid g-2">';
  h += cartao('Atingimento dos principais', 'Percentual da meta de referência &mdash; a única escala em que indicadores de unidades diferentes dividem o mesmo gráfico. A linha tracejada marca 100%.',
    vizAtingimento(KT.principais, { rotuloW: 246 }));

  h += cartao('Investimento por campanha · ' + rotuloMesCurto(c.mes) + ' x ' + rotuloMesCurto(c.ant),
    'Onde a verba mudou de lugar de um mês para o outro. Mesma unidade nas duas barras.',
    (() => {
      const atual = porVolume(agrupar(c.md, r => r.campanha, r => r.gasto)).slice(0, 6);
      if (!atual.length) return '<div class="vazio">Sem investimento no mes selecionado.</div>';
      const antPor = {};
      c.mdAnt.forEach(r => { antPor[chaveBusca(r.campanha)] = (antPor[chaveBusca(r.campanha)] || 0) + r.gasto; });
      const curto = s2 => s2.length > 18 ? s2.slice(0, 17) + '…' : s2;
      return vizGrupos({ x: atual.map(g => curto(g.k)), fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k',
        series: [
          { nome: rotuloMes(c.ant), cor: 'var(--s4)', vals: atual.map(g => antPor[chaveBusca(g.k)] || 0) },
          { nome: rotuloMes(c.mes), cor: 'var(--s2)', vals: atual.map(g => g.v) }
        ] }) + legenda([{ nome: rotuloMes(c.ant), cor: 'var(--s4)' }, { nome: rotuloMes(c.mes), cor: 'var(--s2)' }]);
    })());

  h += cartao('Leads por tipo de conversão · ' + rotuloMesCurto(c.mes) + ' x ' + rotuloMesCurto(c.ant),
    'Formulário, conversa no WhatsApp e pixel. Mesma unidade, magnitudes comparáveis.',
    vizGrupos({ x: ['Formulário', 'Conversas', 'Pixel'], fmt: n0, series: [
      { nome: rotuloMes(c.ant), cor: 'var(--s4)', vals: [soma(c.mdAnt, r => r.leadsForm), soma(c.mdAnt, r => r.conversas), soma(c.mdAnt, r => r.leadsPixel)] },
      { nome: rotuloMes(c.mes), cor: 'var(--s1)', vals: [soma(c.md, r => r.leadsForm), soma(c.md, r => r.conversas), soma(c.md, r => r.leadsPixel)] }
    ] }) + legenda([{ nome: rotuloMes(c.ant), cor: 'var(--s4)' }, { nome: rotuloMes(c.mes), cor: 'var(--s1)' }]));
  h += '</div>';

  h += '<div class="secao-titulo">Diagnóstico do gestor de tráfego</div>';
  h += '<div style="font-size:0.73rem;color:var(--texto-muted);line-height:1.5;margin:-0.35rem 0 0.9rem;max-width:74ch">' +
    'O detalhe que se consulta quando um principal acende. Indicador com borda tracejada não tem fonte: ' +
    'o pé do cartão diz exatamente o que falta para ele existir.</div>';
  KT.grupos.forEach(g => { h += blocoEsp(g.t, g.s, g.l); });

  h += '<div class="secao-titulo">Todos os indicadores da area</div>';
  h += tabelaKpi('kpi-trafego', todosT, 'Indicadores de tráfego');
  /* A aba de indicadores para aqui: assim ela nem monta o recorte de
     campanha, que varre os insights dia a dia. */
  if (aba === 'ind') return h;

  if (aba === 'camp') {
  h += '<div class="secao-titulo primeiro">Evolução &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += aviso('info', 'Daqui para baixo o recorte volta a ser o <b>filtro de período</b> da barra de cima (' +
    esc(rotuloPeriodo()) + '), não o mês do painel: é a parte de investigar campanha e criativo.');
  h += '<div class="grid g-2">';
  h += cartao('Investimento', 'Gasto no Meta Ads.',
    vizColunas({ dados: evolucao(md, r => r.d, r => r.gasto),
      cor: 'var(--s2)', fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', nome: 'Investimento', rotulos: false }));
  h += cartao('Leads', 'Soma dos leads atribuidos as campanhas.',
    vizColunas({ dados: evolucao(md, r => r.d, r => r.leadsTotal), cor: 'var(--s1)', nome: 'Leads' }));
  const evCpl = evolucaoRazao(md, r => r.d, l => { const q = soma(l, x => x.leadsTotal); return q ? soma(l, x => x.gasto) / q : null; });
  h += cartao('CPL', 'Investimento dividido pelos leads do mesmo recorte. Linha subindo = lead encarecendo.' + notaAcum(evCpl),
    vizLinhas({ x: evCpl.x, fmt: brl, area: true, fmtEixo: v => 'R$' + n0(v),
      series: [{ nome: 'CPL', vals: evCpl.vals, cor: 'var(--s4)' }] }));
  h += cartao('Retorno sobre a mídia', 'Honorários iniciais por real investido.' + (eixoTempo().tipo === 'dia' ? ' Acumulado no recorte, dia a dia.' : ''),
    (() => {
      /* As duas pontas vivem em fontes diferentes: os baldes sao montados em
         separado e casados pela posicao do eixo. No dia a dia, as duas somas
         acumulam - ROI de um dia so seria spike, nao leitura. */
      const g = evolucao(md, r => r.d, x => x.gasto);
      const hn = evolucao(cli, r => r.dFecha, x => x.honIni);
      const dia = eixoTempo().tipo === 'dia';
      let ag = 0, ah = 0;
      const vals = g.map((x, i) => {
        const gi = x.v, hi = hn[i] ? hn[i].v : 0;
        if (!dia) return gi ? hi / gi : null;
        ag += gi; ah += hi;
        return ag ? ah / ag : null;
      });
      return vizLinhas({ x: g.map(x => x.k), fmt: v => n1(v) + 'x', area: true, fmtEixo: v => n1(v) + 'x',
        series: [{ nome: 'ROI', vals: vals, cor: 'var(--s3)' }] });
    })());
  h += '</div>';
  }

  /* ===== FUNIL POR CAMPANHA =====
     A cadeia inteira: investimento -> lead -> reuniao -> cliente -> honorario,
     campanha a campanha. E possivel porque tres fontes falam o mesmo nome de
     campanha: os insights do Meta, a coluna Campanha da aba Reunioes e a
     coluna ORIGEM da planilha de clientes.

     E a leitura que decide verba: CPL baixo com conversao em reuniao baixa e
     lead barato que nao vira nada - gastar mais ali so compra volume ruim. */
  const porCamp = porVolume(agrupar(md, r => r.campanha, r => r.gasto));
  /* O cadastro guarda uma LISTA por nome, nao um registro: a conta tem
     campanhas homonimas - "[LEADS] [CALCULADORA REV. PLANO]" existe duas
     vezes, uma pausada desde maio e outra criada em 16/10. O gasto das duas
     soma no mesmo nome, e assim tem de ser, porque o CRM so anota o NOME da
     campanha - mas o status e o orcamento nao podem vir de uma so delas. */
  const cadastro = {};
  (DADOS.metaCamp ? DADOS.metaCamp.reg : []).forEach(c => {
    const k = chaveBusca(c.campanha);
    (cadastro[k] = cadastro[k] || []).push(c);
  });

  /* ELEGIVEIS POR CAMPANHA vem do KOMMO, nao do Meta: quem sabe se o lead
     passou da elegibilidade e o CRM. O Kommo guarda a etapa ATUAL do lead,
     nao a data em que ele entrou em cada etapa - entao a contagem e pela
     etapa de hoje, com o lead situado no tempo pela data de criacao. Esta e
     a diferenca para o painel da central, e ela esta escrita no glossario. */
  const elegPorCamp = {};
  (DADOS.kommo ? selKommo() : []).forEach(r => {
    if (!temCampanha(r) || !ehElegivel(r)) return;
    const k = chaveBusca(r.campanha);
    elegPorCamp[k] = (elegPorCamp[k] || 0) + 1;
  });
  const diasDoMes = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();

  /* Reunioes e clientes indexados pelo nome da campanha / origem. */
  const reunPorCamp = {}, cliPorCamp = {}, honPorCamp = {};
  reun.forEach(r => { const k = chaveBusca(r.campanha); if (k) reunPorCamp[k] = (reunPorCamp[k] || 0) + 1; });
  cli.forEach(r => {
    const k = chaveBusca(r.origem);
    if (!k) return;
    cliPorCamp[k] = (cliPorCamp[k] || 0) + 1;
    honPorCamp[k] = (honPorCamp[k] || 0) + r.honIni;
  });

  const campanhas = porCamp.map(g => {
    const k = chaveBusca(g.k);
    const homonimas = cadastro[k] || [];
    const ativas = homonimas.filter(x => /^active$/i.test(x.status || ''));
    /* Prefere a ativa para status e objetivo; o orcamento diario soma so as
       que estao no ar, senao o ritmo do mes contaria verba de campanha morta. */
    const c = ativas[0] || homonimas[0] || {};
    const l = soma(g.itens, r => r.leadsTotal);
    const rn = reunPorCamp[k] || 0;
    const cl = cliPorCamp[k] || 0;
    const hon = honPorCamp[k] || 0;
    const el = elegPorCamp[k] || 0;
    return {
      campanha: g.k, gasto: g.v, leads: l, cpl: l ? g.v / l : null,
      elegiveis: el, custoEleg: el ? g.v / el : null, taxaEleg: taxa(el, l),
      impressoes: soma(g.itens, r => r.impressoes), cliques: soma(g.itens, r => r.cliques),
      ctr: taxa(soma(g.itens, r => r.cliques), soma(g.itens, r => r.impressoes)),
      reunioes: rn, convReuniao: taxa(rn, l),
      clientes: cl, convCliente: taxa(cl, l), convReunCli: taxa(cl, rn),
      honorarios: hon, cac: cl ? g.v / cl : null, roi: g.v ? hon / g.v : null,
      custoReuniao: rn ? g.v / rn : null,
      status: c.status || '', ativa: ativas.length > 0, homonimas: homonimas.length,
      objetivo: c.objetivo || '', origemOrc: c.origemOrc || '',
      orcDia: soma(ativas, x => x.orcDia), orcMes: soma(ativas, x => x.orcDia) * diasDoMes,
      dias: new Set(g.itens.map(r => chaveMes(r.d) + r.d.getDate())).size
    };
  });
  const campVis = F.soAtivas ? campanhas.filter(c => c.ativa) : campanhas;

  /* ===== COBERTURA DA ATRIBUICAO =====
     Antes de comparar campanhas, e preciso saber se da para comparar. Se a
     coluna Campanha vem vazia na maioria das reunioes, "0 reuniao" nao
     significa que a campanha nao converteu - significa que ninguem anotou.
     Acusar a campanha por isso seria inventar um diagnostico. */
  const reunComCamp = reun.filter(r => r.campanha).length;
  const cobReun = taxa(reunComCamp, reun.length);
  const cliComOrigem = cli.filter(r => r.origem && r.origem !== 'Sem origem').length;
  const cobCli = taxa(cliComOrigem, cli.length);
  const atribuicaoFraca = cobReun != null && cobReun < 60;

  if (aba === 'camp') {
  h += '<div class="secao-titulo">Campanhas &middot; do investimento ao honorário</div>';
  if (atribuicaoFraca) {
    h += aviso('critico', '<b>A atribuicao de reuniao por campanha esta incompleta.</b> ' +
      'So <b>' + pctOuTraco(cobReun, 0) + '</b> das ' + n0(reun.length) + ' reunioes do recorte tem a coluna ' +
      '<i>Campanha</i> preenchida na aba Reunioes. Entao a conversao em reuniao abaixo esta ' +
      '<b>subestimada</b>, e campanha com zero reuniao pode so nao ter sido anotada. ' +
      'Enquanto estiver assim, o painel nao acusa campanha por falta de reuniao &mdash; seria diagnostico inventado. ' +
      'Para destravar esta leitura, o preenchimento da campanha na reuniao precisa virar regra.' +
      (cobCli != null ? '<br>Na planilha de clientes a atribuicao esta melhor: ' + pct(cobCli, 0) +
        ' dos fechamentos tem origem preenchida.' : ''));
  } else {
    h += aviso('info', 'A ligacao entre campanha, reuniao e cliente e feita pelo <b>nome da campanha</b>: ' +
      'os insights do Meta, a aba Reunioes e a coluna ORIGEM da planilha de clientes usam o mesmo rotulo. ' +
      'Cobertura hoje: ' + pctOuTraco(cobReun, 0) + ' das reunioes e ' + pctOuTraco(cobCli, 0) +
      ' dos clientes com origem preenchida.');
  }

  h += barraMostrar([
    { rot: 'Todas as campanhas', n: campanhas.length, ativa: !F.soAtivas, attr: 'data-ativas="false"' },
    { rot: 'S\u00f3 as ativas', n: campanhas.filter(c => c.ativa).length, ativa: !!F.soAtivas, attr: 'data-ativas="true"' }
  ]);

  h += '<div class="grid g-2">';
  h += cartao('Conversão em reunião por campanha', 'Reuniões marcadas dividido pelos leads da campanha. Só campanhas com 10 leads ou mais &mdash; abaixo disso a taxa e ruido.',
    (() => {
      const d = campVis.filter(c => c.leads >= 10 && c.convReuniao != null)
        .sort((a, b) => b.convReuniao - a.convReuniao).slice(0, 10);
      return d.length ? vizBarras({ rotuloW: 230, fmt: v => pct(v, 2), nome: 'Conversão em reunião',
        dados: d.map(c => ({ k: c.campanha, v: c.convReuniao,
          cor: c.convReuniao >= 2 ? 'var(--s3)' : c.convReuniao >= 1 ? 'var(--s4)' : 'var(--s2)',
          extra: [{ rot: 'Leads', val: n0(c.leads) }, { rot: 'Reuniões', val: n0(c.reunioes) },
                  { rot: 'CPL', val: c.cpl == null ? '—' : brl(c.cpl) }] })) })
        : '<div class="vazio">Nenhuma campanha com 10 ou mais leads no recorte.</div>';
    })());

  h += cartao('Custo por reunião marcada', 'Investimento da campanha dividido pelas reuniões que ela gerou. Mais direto que o CPL para decidir verba.',
    (() => {
      const d = campVis.filter(c => c.custoReuniao != null && c.reunioes >= 2)
        .sort((a, b) => a.custoReuniao - b.custoReuniao).slice(0, 10);
      return d.length ? vizBarras({ rotuloW: 230, fmt: brl0, nome: 'Custo por reunião',
        dados: d.map(c => ({ k: c.campanha, v: c.custoReuniao,
          cor: c.custoReuniao <= 300 ? 'var(--s3)' : c.custoReuniao <= 600 ? 'var(--s4)' : 'var(--s2)',
          extra: [{ rot: 'Reuniões', val: n0(c.reunioes) }, { rot: 'Investimento', val: brl0(c.gasto) }] })) })
        : '<div class="vazio">Nenhuma campanha com 2 ou mais reunioes no recorte.</div>';
    })());

  h += cartao('Investimento por campanha', 'Onde o dinheiro foi.',
    vizBarras({ rotuloW: 230, fmt: brl0, nome: 'Investimento',
      dados: topN(campVis.slice(0, 9).map(c => ({ k: c.campanha, v: c.gasto, n: 1 })), 8)
        .map((x, i) => ({ k: x.k, v: x.v, cor: x.cor || corSerie(i) })) }));

  h += cartao('CPL por campanha', 'Só campanhas com 3 leads ou mais.',
    (() => {
      const d = campVis.filter(c => c.cpl != null && c.leads >= 3).sort((a, b) => a.cpl - b.cpl).slice(0, 10);
      return d.length ? vizBarras({ rotuloW: 230, fmt: brl, nome: 'CPL',
        dados: d.map(c => ({ k: c.campanha, v: c.cpl,
          cor: c.cpl <= 15 ? 'var(--s3)' : c.cpl <= 30 ? 'var(--s4)' : 'var(--s2)',
          extra: [{ rot: 'Leads', val: n0(c.leads) }, { rot: 'Gasto', val: brl0(c.gasto) }] })) })
        : '<div class="vazio">Nenhuma campanha com 3 ou mais leads no recorte.</div>';
    })());
  h += '</div>';

  h += tabelaExplicada('Campanha a campanha',
    '<b>CPL</b> = gasto \u00f7 leads &middot; ' +
    '<b>Eleg\u00edveis</b> = leads da campanha cuja etapa no Kommo j\u00e1 passou da elegibilidade ' +
    '(qualifica\u00e7\u00e3o, documenta\u00e7\u00e3o, agendamento, diagn\u00f3stico, ADVBOX ou p\u00f3s-venda) &middot; ' +
    '<b>Custo/eleg.</b> = gasto \u00f7 eleg\u00edveis &middot; ' +
    '<b>Reuni\u00f5es</b> = reuni\u00f5es com esta campanha anotada na aba Reuni\u00f5es do Meta &middot; ' +
    '<b>Conv. reun.</b> = reuni\u00f5es \u00f7 leads &middot; <b>Custo/reun.</b> = gasto \u00f7 reuni\u00f5es &middot; ' +
    '<b>Clientes</b> = fechamentos cuja ORIGEM \u00e9 esta campanha &middot; <b>Conv. cliente</b> = clientes \u00f7 leads &middot; ' +
    '<b>Retorno</b> = honor\u00e1rios iniciais desses clientes &middot; <b>CAC</b> = gasto \u00f7 clientes &middot; ' +
    '<b>ROI</b> = retorno \u00f7 gasto (quanto voltou por R$ 1) &middot; ' +
    '<b>Or\u00e7./dia</b> e <b>Or\u00e7./m\u00eas</b> = soma do or\u00e7amento das campanhas <b>ativas</b> com este nome, ' +
    'a segunda multiplicada por ' + n0(diasDoMes) + ' dias do m\u00eas corrente.',
    DICA_ORDENAR + '<br><b>O Kommo n\u00e3o guarda a data de entrada em cada etapa</b>, s\u00f3 a etapa atual: ' +
    'os eleg\u00edveis s\u00e3o contados pela etapa de hoje e situados no tempo pela data de cria\u00e7\u00e3o do lead.' +
    '<br><b>Campanhas de mesmo nome entram na mesma linha</b>, e a linha avisa quando isso acontece. ' +
    'Tem de ser assim porque o CRM anota o <i>nome</i> da campanha, n\u00e3o o ID: separar por ID quebraria ' +
    'a liga\u00e7\u00e3o com reuni\u00e3o e cliente.');

  h += tabelaInterativa('trafego-tab', [
    { k: 'campanha', rot: 'Campanha', tipo: 'txt', cls: 'forte wrap',
      html: r => esc(r.campanha) + (r.objetivo || r.origemOrc || r.homonimas > 1
        ? '<span class="cel-sub">' + esc(r.objetivo) +
          (r.origemOrc ? ' &middot; or\u00e7amento por ' + esc(r.origemOrc) : '') +
          (r.homonimas > 1 ? ' &middot; <b style="color:#f3c45a">' + n0(r.homonimas) +
            ' campanhas com este nome</b>' : '') + '</span>' : '') },
    { k: 'status', rot: 'Status', tipo: 'txt', ord: true, html: r => !r.status ? '&mdash;' :
      (r.ativa ? selo('ok', 'ativa') : selo('neutro', r.status.toLowerCase())) },
    { k: 'orcDia', rot: 'Or\u00e7./dia', tipo: 'moeda0' },
    { k: 'orcMes', rot: 'Or\u00e7./m\u00eas', tipo: 'moeda0' },
    { k: 'gasto', rot: 'Gasto', tipo: 'moeda0', cls: 'forte' },
    { k: 'leads', rot: 'Leads', tipo: 'num' },
    { k: 'cpl', rot: 'CPL', tipo: 'moeda' },
    { k: 'elegiveis', rot: 'Eleg\u00edveis', tipo: 'num', cls: 'forte',
      html: r => !r.elegiveis ? '&mdash;' : n0(r.elegiveis) },
    { k: 'custoEleg', rot: 'Custo/eleg.', tipo: 'moeda' },
    { k: 'reunioes', rot: 'Reuni\u00f5es', tipo: 'num', cls: 'forte',
      html: r => !r.reunioes ? '&mdash;' : n0(r.reunioes) },
    { k: 'convReuniao', rot: 'Conv. reun.', tipo: 'pct', casas: 1 },
    { k: 'custoReuniao', rot: 'Custo/reun.', tipo: 'moeda0' },
    { k: 'clientes', rot: 'Clientes', tipo: 'num' },
    { k: 'honorarios', rot: 'Retorno', tipo: 'moeda0', cls: 'forte' },
    { k: 'convCliente', rot: 'Conv. cliente', tipo: 'pct', casas: 1 },
    { k: 'cac', rot: 'CAC', tipo: 'moeda0' },
    { k: 'roi', rot: 'ROI', tipo: 'num1',
      html: r => r.roi == null ? '&mdash;' : (r.roi >= 3 ? selo('ok', n1(r.roi) + 'x')
        : r.roi >= 1 ? selo('atencao', n1(r.roi) + 'x') : selo('critico', n1(r.roi) + 'x')) },
    { k: 'ctr', rot: 'CTR', tipo: 'pct', casas: 2 },
    { k: 'dias', rot: 'Dias com gasto', tipo: 'num' }
  ], campVis, { ord: 'gasto', dir: -1, titulo: 'Campanhas Meta Ads', limite: 50,
    total: { orcDia: d => brl0(soma(d, r => r.orcDia)), orcMes: d => brl0(soma(d, r => r.orcMes)),
             gasto: d => brl0(soma(d, r => r.gasto)), leads: d => n0(soma(d, r => r.leads)),
             elegiveis: d => n0(soma(d, r => r.elegiveis)),
             reunioes: d => n0(soma(d, r => r.reunioes)), clientes: d => n0(soma(d, r => r.clientes)),
             honorarios: d => brl0(soma(d, r => r.honorarios)),
             cac: d => { const c2 = soma(d, r => r.clientes); return c2 ? brl0(soma(d, r => r.gasto) / c2) : ''; },
             custoEleg: d => { const e = soma(d, r => r.elegiveis); return e ? brl(soma(d, r => r.gasto) / e) : ''; },
             cpl: d => { const l = soma(d, r => r.leads); return l ? brl(soma(d, r => r.gasto) / l) : ''; } } });
  }

  /* ===== CRIATIVO ===== */
  if (aba === 'criativo' && DADOS.metaAnuncios && DADOS.metaAnuncios.reg.length) {
    const jan = DADOS.metaAnuncios.janelas[0] || '';
    const ads = DADOS.metaAnuncios.reg.filter(r => !jan || r.janela === jan)
      .filter(r => !F.soAtivas || campanhas.some(c => c.ativa && chaveBusca(c.campanha) === chaveBusca(r.campanha)));
    h += '<div class="secao-titulo primeiro">Anúncios &middot; qual criativo esta ganhando' +
      (jan ? ' <span style="text-transform:none;letter-spacing:0;font-weight:500">(janela de ' + esc(jan) + ')</span>' : '') + '</div>';
    h += aviso('info', 'A campanha pode ir bem na media e carregar um criativo que so queima verba. ' +
      'Esta aba mede por peca, na janela recente &mdash; nao no historico inteiro.');
    h += tabelaInterativa('trafego-ads', [
      { k: 'anuncio', rot: 'Anúncio', tipo: 'txt', cls: 'forte' },
      { k: 'campanha', rot: 'Campanha', tipo: 'txt', cls: 'wrap' },
      { k: 'gasto', rot: 'Investimento', tipo: 'moeda0' },
      { k: 'leads', rot: 'Leads', tipo: 'num' },
      { k: 'cpl', rot: 'CPL', tipo: 'moeda',
        html: r => !r.leads ? '<span style="color:var(--texto-muted)">sem lead</span>' : brl(r.gasto / r.leads) },
      { k: 'impressoes', rot: 'Impressões', tipo: 'num' },
      { k: 'ctrLink', rot: 'CTR do link', tipo: 'pct', casas: 2 },
      { k: 'cpc', rot: 'CPC', tipo: 'moeda' },
      { k: 'cpm', rot: 'CPM', tipo: 'moeda' },
      { k: 'frequencia', rot: 'Frequência', tipo: 'num1',
        html: r => !r.frequencia ? '&mdash;' : (r.frequencia >= 3
          ? '<span style="color:#f3c45a" title="publico saturando">' + n1(r.frequencia) + '</span>' : n1(r.frequencia)) }
    ], ads, { ord: 'gasto', dir: -1, titulo: 'Anúncios Meta Ads', limite: 40, ativa: false });
  }

  /* ===== PONTOS DE ATENCAO ===== */
  if (aba !== 'camp') return h;
  const alertas = [];
  campVis.filter(c => c.gasto >= 500 && !c.leads).forEach(c =>
    alertas.push({ nivel: 'critico', txt: '<b>' + esc(c.campanha) + '</b> gastou ' + brl0(c.gasto) + ' e nao registrou nenhum lead.' }));
  /* Com a atribuicao furada, "nenhuma reuniao" e "retorno baixo" podem ser
     falta de anotacao em vez de falta de resultado. Nesses casos o alerta
     vira um so, sobre a atribuicao - nao uma lista acusando campanhas. */
  if (!atribuicaoFraca) {
    campVis.filter(c => c.leads >= 20 && c.reunioes === 0).forEach(c =>
      alertas.push({ nivel: 'atencao', txt: '<b>' + esc(c.campanha) + '</b> trouxe ' + n0(c.leads) +
        ' leads e nenhuma reuniao marcada &mdash; lead barato que nao avanca.' }));
    campVis.filter(c => c.roi != null && c.roi < 1 && c.gasto >= 1000).forEach(c =>
      alertas.push({ nivel: 'atencao', txt: '<b>' + esc(c.campanha) + '</b> tem retorno de ' + n1(c.roi) +
        'x: ' + brl0(c.gasto) + ' investidos para ' + brl0(c.honorarios) + ' em honorarios atribuidos.' }));
  } else {
    alertas.push({ nivel: 'atencao', txt: 'Alertas de conversao por campanha estao <b>suspensos</b>: com ' +
      pctOuTraco(cobReun, 0) + ' das reunioes sem campanha anotada, nao da para separar campanha ruim de ' +
      'campanha mal atribuida. O investimento sem nenhum lead, esse sim, segue sendo acusado.' });
  }
  if (DADOS.metaAnuncios) {
    const jan = DADOS.metaAnuncios.janelas[0] || '';
    DADOS.metaAnuncios.reg.filter(r => (!jan || r.janela === jan) && r.frequencia >= 3.5 && r.gasto >= 200).forEach(a =>
      alertas.push({ nivel: 'atencao', txt: 'O criativo <b>' + esc(a.anuncio) + '</b> (' + esc(a.campanha) +
        ') esta com frequencia ' + n1(a.frequencia) + ': o mesmo publico ja viu a peca vezes demais.' }));
  }
  if (alertas.length) {
    h += '<div class="secao-titulo">Pontos de atenção</div>';
    h += alertas.slice(0, 12).map(a => aviso(a.nivel, a.txt)).join('');
  }
  return h;
}

/* ==========================================================================
   TELA - FLUXO DE CLIENTES (porte do painel da central)
   --------------------------------------------------------------------------
   Mesmo recorte do painel "Dashboard CRM - Fluxo de Clientes", com a fonte
   trocada: perfil de quem assina, por canal, meio de pagamento, produto,
   natureza juridica e por quem atendeu.

   A tela de Vendas responde "quanto entrou e como evoluiu". Esta responde
   "QUEM assina, por onde chega e quem fecha" - por isso cada quebra traz
   ticket, jornada, dias para fechar e pagamento confirmado juntos: e a
   combinacao deles que separa canal bom de canal volumoso.
   ========================================================================== */

/* Bloco de metricas por dimensao, reusado em origem, produto, pagamento... */
function quebraClientes(lista, chaveFn) {
  return agrupar(lista, chaveFn).map(g => ({
    chave: g.k,
    clientes: g.n,
    total: soma(g.itens, r => r.honIni),
    ticket: ticketMedio(g.itens),
    jornada: media(g.itens, r => r.jornada),
    diasFechar: media(g.itens, r => r.diasFechar),
    confirmado: taxa(g.itens.filter(r => r.pagoOk).length, g.n),
    itens: g.itens
  })).sort((a, b) => b.total - a.total);
}

function telaClientesFluxo() {
  if (ERROS.clientes) return aviso('critico', '<b>FLUXO DE CLIENTES nao entrou:</b> ' + esc(ERROS.clientes));
  const cli = selClientes();
  if (!cli.length) return aviso('info', 'Nenhum cliente no recorte atual. Amplie o periodo ou limpe os filtros.');

  const total = soma(cli, r => r.honIni);
  const tk = ticketMedio(cli);
  let h = '';

  /* ----- VISAO GERAL ----- */
  /* Os sete cartoes abaixo sao os MESMOS do painel da central, na mesma
     ordem e com os mesmos rotulos - inclusive o ticket medio dividido por
     TODOS os clientes, que e como ele e calculado la. O oitavo cartao e o
     unico acrescimo: o ticket pela regra desta casa, que nao conta
     fechamento com honorario condicionado a liminar. Os dois lado a lado,
     para a diferenca ficar explicita em vez de parecer erro. */
  const pj = cli.filter(r => r.tipoPessoa === 'PJ').length;
  const pf = cli.filter(r => r.tipoPessoa === 'PF').length;
  const confirmados = cli.filter(r => r.pagoOk).length;
  const entradaTot = soma(cli, r => r.entrada);

  h += '<div class="secao-titulo primeiro">Vis\u00e3o Geral &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Total de Clientes', valor: n0(cli.length), nota: 'contratos no per\u00edodo' });
  h += kpi({ rotulo: 'Total em Honor\u00e1rios', valor: brl(total), pequeno: true,
    nota: 'honor\u00e1rios iniciais acumulados' });
  h += kpi({ rotulo: 'Honor\u00e1rios de Entrada', valor: brl(entradaTot), pequeno: true,
    nota: 'valor de entrada acumulado' });
  h += kpi({ rotulo: 'Ticket M\u00e9dio', valor: cli.length ? brl(total / cli.length) : '&mdash;', pequeno: true,
    nota: 'por cliente no per\u00edodo',
    dica: 'Divide os honor\u00e1rios por TODOS os clientes, como o painel da central. O cart\u00e3o ao lado usa a regra desta casa.' });
  h += kpi({ rotulo: 'Jornada Completa M\u00e9dia',
    valor: (() => { const m = media(cli, r => r.jornada); return m == null ? '&mdash;' : n1(m) + ' dias'; })(), pequeno: true,
    nota: '1\u00ba contato &rarr; fechamento' });
  h += kpi({ rotulo: 'Dias para Fechar',
    valor: (() => { const m = media(cli, r => r.diasFechar); return m == null ? '&mdash;' : n1(m) + ' dias'; })(), pequeno: true,
    nota: 'da reuni\u00e3o ao fechamento' });
  h += kpi({ rotulo: 'PJ / PF / Confirmados', valor: n0(pj) + ' / ' + n0(pf) + ' / ' + n0(confirmados), pequeno: true,
    nota: 'PJ &middot; PF &middot; pagamento confirmado',
    dica: 'PJ e PF saem da contagem de d\u00edgitos do CPF/CNPJ. O identificador \u00e9 lido, classificado e descartado na mesma linha: n\u00e3o entra em nenhum registro, nem na tela, nem no CSV.' });
  h += kpi({ rotulo: 'Ticket m\u00e9dio (s\u00f3 com honor\u00e1rio)', valor: tk == null ? '&mdash;' : brl(tk), pequeno: true,
    nota: semTicket(cli) ? 'entre os ' + n0(cli.filter(r => r.honIni > 0).length) + ' com honor\u00e1rio inicial' : 'todos tiveram honor\u00e1rio',
    dica: 'Fechamento com honor\u00e1rio condicionado a liminar entra como R$ 0: \u00e9 venda, mas n\u00e3o \u00e9 pré\u00e7o.' });
  h += '</div>';
  if (semTicket(cli)) {
    h += aviso('info', 'Os dois tickets medem a mesma planilha de jeitos diferentes: <b>' +
      brl(total / cli.length) + '</b> divide os honor\u00e1rios por todos os ' + n0(cli.length) +
      ' clientes (como o painel da central) e <b>' + brl0(tk) + '</b> conta s\u00f3 os ' +
      n0(cli.filter(r => r.honIni > 0).length) + ' que tiveram honor\u00e1rio inicial. A diferen\u00e7a s\u00e3o os ' +
      n0(semTicket(cli)) + ' fechamentos com honor\u00e1rio condicionado a liminar, que entram como R$ 0: ' +
      's\u00e3o venda, mas n\u00e3o s\u00e3o pre\u00e7o.');
  }

  /* Colunas comuns das tabelas de quebra. */
  const colsQuebra = rotulo => [
    { k: 'chave', rot: rotulo, tipo: 'txt', cls: 'forte wrap' },
    { k: 'clientes', rot: 'Clientes', tipo: 'num' },
    { k: 'total', rot: 'Total honorários', tipo: 'moeda0' },
    { k: 'share', rot: '% do total', tipo: 'pct', casas: 1,
      html: r => pct(taxa(r.total, total), 1) },
    { k: 'ticket', rot: 'Ticket médio', tipo: 'moeda0' },
    { k: 'jornada', rot: 'Jornada média', tipo: 'num1',
      html: r => r.jornada == null ? '&mdash;' : n0(r.jornada) + ' d' },
    { k: 'diasFechar', rot: 'Dias p/ fechar', tipo: 'num1',
      html: r => r.diasFechar == null ? '&mdash;' : n0(r.diasFechar) + ' d' },
    { k: 'confirmado', rot: '% confirm.', tipo: 'pct', casas: 0,
      html: r => r.confirmado == null ? '&mdash;' : barraCelula(r.confirmado, 100,
        r.confirmado >= 80 ? 'var(--s3)' : r.confirmado >= 50 ? 'var(--s4)' : 'var(--s2)', pct(r.confirmado, 0)) }
  ];
  const totQuebra = { clientes: d => n0(soma(d, r => r.clientes)), total: d => brl0(soma(d, r => r.total)) };

  /* ----- POR ORIGEM -----
     Campanha do Meta entra como "Meta Ads", nao com o nome dela: a pergunta
     aqui e por qual CANAL o cliente chegou, e seis linhas de campanha no
     meio de organico, indicacao e recompra escondem exatamente isso. O
     detalhe campanha a campanha vem logo abaixo, em quadro proprio. */
  const rotuloCanal = o => naturezaOrigem(o) === 'ads' ? 'Meta Ads' : (o || 'Sem origem');
  const porOrigem = quebraClientes(cli, r => rotuloCanal(r.origem));
  h += '<div class="secao-titulo">KPIs por Origem</div>';
  h += '<div class="grid g-2">';
  h += cartao('Distribui\u00e7\u00e3o por Canal', 'De onde vem a receita.',
    vizBarras({ rotuloW: 230, fmt: brl0, nome: 'Honorários',
      dados: topN(porOrigem.map(g => ({ k: g.chave, v: g.total, n: g.clientes })), 9)
        .map((g, i) => ({ k: g.k, v: g.v, cor: g.cor || corSerie(i),
          extra: [{ rot: 'Clientes', val: n0(g.n) }] })) }));
  h += cartao('Clientes por Origem', 'Volume, que nem sempre anda junto com a receita.',
    vizBarras({ rotuloW: 230, nome: 'Clientes',
      dados: topN(porOrigem.slice().sort((a, b) => b.clientes - a.clientes)
        .map(g => ({ k: g.chave, v: g.clientes, n: g.clientes })), 9)
        .map((g, i) => ({ k: g.k, v: g.v, cor: g.cor || corSerie(i) })) }));
  h += '</div>';
  h += tabelaInterativa('cli-origem', colsQuebra('Canal / origem'), porOrigem,
    { ord: 'total', dir: -1, titulo: 'Clientes por origem', limite: 30, total: totQuebra });

  /* ----- META ADS, CAMPANHA A CAMPANHA -----
     Quem veio de anuncio, de qual campanha veio. E a quebra que o canal
     "Meta Ads" esconde por construcao. */
  const cliAds = cli.filter(r => naturezaOrigem(r.origem) === 'ads');
  h += '<div class="secao-titulo">Clientes do Meta Ads &middot; campanha a campanha</div>';
  if (!cliAds.length) {
    h += '<div class="cartao"><div class="vazio">Nenhum cliente de campanha no recorte atual.</div></div>';
  } else {
    const porCampanha = quebraClientes(cliAds, r => r.origem);
    h += aviso('info', 'S\u00e3o os <b>' + n0(cliAds.length) + ' clientes</b> que no canal acima aparecem como ' +
      '<b>Meta Ads</b> (' + pctOuTraco(taxa(cliAds.length, cli.length), 0) + ' dos ' + n0(cli.length) +
      ' do recorte), abertos pela campanha anotada na coluna ORIGEM da planilha de clientes.');
    h += '<div class="grid g-2">';
    h += cartao('Honor\u00e1rios por campanha', 'Qual campanha traz receita, n\u00e3o s\u00f3 volume.',
      vizBarras({ rotuloW: 240, fmt: brl0, nome: 'Honor\u00e1rios',
        dados: topN(porCampanha.map(g => ({ k: g.chave, v: g.total, n: g.clientes })), 8)
          .map((g, i) => ({ k: g.k, v: g.v, cor: g.cor || corSerie(i),
            extra: [{ rot: 'Clientes', val: n0(g.n) }] })) }));
    h += cartao('Clientes por campanha', 'Participa\u00e7\u00e3o de cada campanha em quem assinou.',
      vizDonut({ centro: n0(cliAds.length), centroRot: 'clientes',
        dados: topN(porCampanha.slice().sort((a, b) => b.clientes - a.clientes)
          .map(g => ({ k: g.chave, v: g.clientes, n: g.clientes })), 7)
          .map((g, i) => ({ k: g.k, v: g.v, cor: g.cor || corSerie(i) })) }));
    h += '</div>';
    h += tabelaInterativa('cli-campanha', colsQuebra('Campanha'), porCampanha,
      { ord: 'total', dir: -1, titulo: 'Clientes do Meta Ads por campanha', limite: 30, total: totQuebra });
  }

  /* ----- MEIOS DE PAGAMENTO ----- */
  const porPag = quebraClientes(cli, r => r.tipoPag);
  h += '<div class="secao-titulo">Meios de Pagamento</div>';
  h += '<div class="grid g-2">';
  h += cartao('Distribui\u00e7\u00e3o por Tipo de Pagamento', 'Participa\u00e7\u00e3o de cada meio no n\u00famero de clientes.',
    vizDonut({ centro: n0(cli.length), centroRot: 'clientes',
      dados: topN(porPag.slice().sort((a, b) => b.clientes - a.clientes)
        .map(g => ({ k: g.chave, v: g.clientes })), 6) }) +
    legenda(topN(porPag.slice().sort((a, b) => b.clientes - a.clientes)
      .map(g => ({ k: g.chave, v: g.clientes })), 6)
      .map((g, i) => ({ nome: g.k, cor: g.cor || corSerie(i), val: n0(g.v) }))));
  const porParc = quebraClientes(cli, r => r.rotParcelas);
  h += cartao('Distribui\u00e7\u00e3o por N\u00famero de Parcelas', 'Lido da coluna OBSERVA\u00c7\u00d5ES, onde a planilha guarda "12x", "6x" ou "a vista".',
    vizBarras({ rotuloW: 150, nome: 'Clientes',
      dados: porParc.slice().sort((a, b) => (a.chave === 'A vista' ? -1 : b.chave === 'A vista' ? 1 : num(a.chave) - num(b.chave)))
        .map((g, i) => ({ k: g.chave, v: g.clientes, cor: corRampa(i, porParc.length),
          extra: [{ rot: 'Ticket médio', val: g.ticket == null ? '—' : brl0(g.ticket) }] })) }));
  h += '</div>';
  h += tabelaInterativa('cli-pag', [
    { k: 'chave', rot: 'Tipo', tipo: 'txt', cls: 'forte' },
    { k: 'clientes', rot: 'Qtd', tipo: 'num' },
    { k: 'pctCli', rot: '% clientes', tipo: 'pct', casas: 1, html: r => pct(taxa(r.clientes, cli.length), 1) },
    { k: 'total', rot: 'Total', tipo: 'moeda0' },
    { k: 'ticket', rot: 'Ticket médio', tipo: 'moeda0' },
    { k: 'confirmado', rot: '% confirm.', tipo: 'pct', casas: 0 }
  ], porPag, { ord: 'total', dir: -1, titulo: 'Meios de pagamento', limite: 20, ativa: false, total: totQuebra });

  /* ----- PRODUTOS ----- */
  const porProduto = quebraClientes(cli, r => r.produto);
  h += '<div class="secao-titulo">Produtos Jur\u00eddicos</div>';
  h += cartao('Honor\u00e1rios por Produto', 'Concentra\u00e7\u00e3o da receita por tese.',
    vizBarras({ rotuloW: 230, fmt: brl0, nome: 'Honorários',
      dados: semZero(topN(porProduto.map(g => ({ k: g.chave, v: g.total, n: g.clientes })), 8))
        .map((g, i) => ({ k: g.k, v: g.v, cor: g.cor || corSerie(i),
          extra: [{ rot: 'Clientes', val: n0(g.n) }] })) }));
  h += tabelaInterativa('cli-produto', colsQuebra('Produto'), porProduto,
    { ord: 'total', dir: -1, titulo: 'Clientes por produto', limite: 25, ativa: false, total: totQuebra });

  /* ----- PJ x PF ----- */
  h += '<div class="secao-titulo">Perfil de Clientes &mdash; PJ \u00d7 PF</div>';
  const temTipo = cli.some(r => r.tipoPessoa);
  if (!temTipo) {
    h += aviso('info', 'A natureza juridica e deduzida do CPF/CNPJ, que <b>nao trafega para o painel</b>. ' +
      'Com o proxy Apps Script publicado, o servidor conta os digitos e devolve so <b>PJ</b> ou <b>PF</b> &mdash; ' +
      'a classificacao chega, o identificador nao. Enquanto a leitura for direta do navegador, esta secao fica vazia.');
  } else {
    const porTipo = quebraClientes(cli.filter(r => r.tipoPessoa), r => r.tipoPessoa);
    h += '<div class="grid g-2">';
    h += cartao('PJ x PF', 'Participação no número de clientes.',
      vizDonut({ centro: n0(soma(porTipo, g => g.clientes)), centroRot: 'clientes',
        dados: porTipo.map((g, i) => ({ k: g.chave, v: g.clientes, cor: corSerie(i) })) }) +
      legenda(porTipo.map((g, i) => ({ nome: g.chave, cor: corSerie(i), val: n0(g.clientes) }))));
    h += cartao('Ticket médio por natureza', 'Onde o contrato vale mais.',
      vizBarras({ rotuloW: 120, fmt: brl0, nome: 'Ticket médio',
        dados: porTipo.filter(g => g.ticket != null).map((g, i) => ({ k: g.chave, v: g.ticket, cor: corSerie(i),
          extra: [{ rot: 'Clientes', val: n0(g.clientes) }, { rot: 'Total', val: brl0(g.total) }] })) }));
    h += '</div>';
    h += tabelaInterativa('cli-tipo', [
      { k: 'chave', rot: 'Tipo', tipo: 'txt', cls: 'forte' },
      { k: 'clientes', rot: 'Qtd', tipo: 'num' },
      { k: 'pct', rot: '%', tipo: 'pct', casas: 1, html: r => pct(taxa(r.clientes, soma(porTipo, g => g.clientes)), 1) },
      { k: 'total', rot: 'Total honorários', tipo: 'moeda0' },
      { k: 'ticket', rot: 'Ticket médio', tipo: 'moeda0' },
      { k: 'jornada', rot: 'Jornada média', tipo: 'num1', html: r => r.jornada == null ? '&mdash;' : n0(r.jornada) + ' d' }
    ], porTipo, { ord: 'total', dir: -1, titulo: 'PJ x PF', limite: 10, ativa: false });
  }

  /* ----- CLOSERS ----- */
  const porCloser = quebraClientes(cli, r => r.closer);
  h += '<div class="secao-titulo">Performance por Closer</div>';
  h += '<div class="grid g-2">';
  h += cartao('Honor\u00e1rios por Closer', 'Receita fechada no recorte.',
    vizBarras({ rotuloW: 150, fmt: brl0, nome: 'Honorários',
      dados: semZero(porCloser.map(g => ({ k: g.chave, v: g.total })))
        .map((g, i) => ({ k: g.k, v: g.v, cor: corSerie(i) })) }));
  h += cartao('Radar de Performance — Closers', 'Cada eixo normalizado pelo melhor do recorte. Em jornada e dias para fechar, menos e melhor &mdash; o eixo já considera isso.',
    vizRadar({
      eixos: [
        { rot: 'Clientes', fmt: n0 },
        { rot: 'Honorários', fmt: brl0 },
        { rot: 'Ticket', fmt: brl0 },
        { rot: 'Rapidez', fmt: v => n0(v) + ' d', inverso: true },
        { rot: '% pago', fmt: v => pct(v, 0) }
      ],
      series: porCloser.slice(0, 3).map((g, i) => ({
        nome: g.chave, cor: corSerie(i),
        vals: [g.clientes, g.total, g.ticket, g.diasFechar, g.confirmado]
      }))
    }) + legenda(porCloser.slice(0, 3).map((g, i) => ({ nome: g.chave, cor: corSerie(i) }))));
  h += '</div>';
  h += tabelaInterativa('cli-closer', [
    { k: 'pos', rot: '#', tipo: 'num', ord: false, html: r => n0(porCloser.indexOf(r) + 1) }
  ].concat(colsQuebra('Closer').slice(1)), porCloser,
    { ord: 'total', dir: -1, titulo: 'Ranking de closers', limite: 20, ativa: false, total: totQuebra });

  /* ----- SDRs ----- */
  const porSdr = quebraClientes(cli, r => r.sdr);
  h += '<div class="secao-titulo">Performance por SDR</div>';
  h += cartao('Clientes Qualificados por SDR', 'Fechamentos atribu\u00eddos a quem originou.',
    vizBarras({ rotuloW: 150, nome: 'Clientes',
      dados: porSdr.slice().sort((a, b) => b.clientes - a.clientes).map((g, i) => ({
        k: g.chave, v: g.clientes, cor: corSerie(i),
        extra: [{ rot: 'Honorários', val: brl0(g.total) }, { rot: 'Ticket médio', val: g.ticket == null ? '—' : brl0(g.ticket) }] })) }));
  h += tabelaInterativa('cli-sdr', [
    { k: 'pos', rot: '#', tipo: 'num', ord: false, html: r => n0(porSdr.indexOf(r) + 1) }
  ].concat(colsQuebra('SDR').slice(1)), porSdr,
    { ord: 'total', dir: -1, titulo: 'Ranking de SDRs', limite: 20, ativa: false, total: totQuebra });

  /* ----- ANALISES ADICIONAIS ----- */
  h += '<div class="secao-titulo">An\u00e1lises Adicionais</div>';
  h += '<div class="grid g-2">';
  h += cartao('Evolu\u00e7\u00e3o — Honor\u00e1rios', 'Duas escalas, dois gr\u00e1ficos. Aqui a receita.',
    vizColunas({ dados: evolucao(cli, r => r.dFecha, r => r.honIni),
      cor: 'var(--s1)', fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', nome: 'Honorários', rotulos: false }));
  h += cartao('Evolu\u00e7\u00e3o — Clientes', 'E aqui o volume.',
    vizColunas({ dados: evolucao(cli, r => r.dFecha), cor: 'var(--s3)', nome: 'Clientes' }));

  const faixas = [
    { k: 'Ate R$ 1.000', t: v => v > 0 && v <= 1000 },
    { k: 'R$ 1.000 a 2.000', t: v => v > 1000 && v <= 2000 },
    { k: 'R$ 2.000 a 3.000', t: v => v > 2000 && v <= 3000 },
    { k: 'R$ 3.000 a 5.000', t: v => v > 3000 && v <= 5000 },
    { k: 'Acima de R$ 5.000', t: v => v > 5000 },
    { k: 'Condicionado (R$ 0)', t: v => !v }
  ];
  h += cartao('Distribuição por faixa de honorário', 'Onde o ticket se concentra.',
    vizBarras({ rotuloW: 170, nome: 'Clientes',
      dados: faixas.map((f, i) => ({ k: f.k, v: cli.filter(r => f.t(r.honIni)).length,
        cor: f.k.indexOf('Condicionado') === 0 ? 'var(--texto-muted)' : corRampa(i, faixas.length) })) }));

  h += cartao('Ticket médio por canal', 'Canal que traz volume nem sempre traz valor.',
    vizBarras({ rotuloW: 230, fmt: brl0, nome: 'Ticket médio',
      dados: porOrigem.filter(g => g.ticket != null && g.clientes >= 3)
        .sort((a, b) => b.ticket - a.ticket).slice(0, 9)
        .map((g, i) => ({ k: g.chave, v: g.ticket, cor: corSerie(i),
          extra: [{ rot: 'Clientes', val: n0(g.clientes) }] })) }));
  h += '</div>';
  return h;
}

/* ==========================================================================
   TELA - FINANCEIRO E EFICIENCIA (CAC real)
   --------------------------------------------------------------------------
   O CAC de midia responde "quanto custou o anuncio por cliente". O CAC real
   responde "quanto custou a MAQUINA comercial por cliente": SDR e closer
   (fixo + variavel), lider, estagiarios, CRM, automacoes e midia. E a
   diferenca entre os dois que diz se o gargalo e de trafego ou de operacao.
   ========================================================================== */
function telaFinanceiro() {
  if (ERROS.fin) return aviso('critico', '<b>DRE COMERCIAL nao entrou:</b> ' + esc(ERROS.fin));
  const f = DADOS.fin;
  if (!f || !f.comercial) return aviso('atencao', 'A aba DRE COMERCIAL foi lida, mas nao achei a linha "(-) SETOR COMERCIAL".');

  const cli = DADOS.clientes ? DADOS.clientes.reg : [];
  const at  = DADOS.atend ? DADOS.atend.reg : [];
  const md  = DADOS.metaDia ? DADOS.metaDia.reg : [];

  /* So os meses que a DRE ja fechou E que estao no recorte de periodo. */
  const noRec = k => { const fx = faixa(); const d = new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, 15); return d >= fx.de && d <= fx.ate; };
  const meses = f.meses.filter(noRec);
  if (!meses.length) return aviso('info', 'Nenhum mes da DRE COMERCIAL cai no periodo selecionado. Amplie o periodo no filtro acima.');

  /* A DRE e mensal por natureza: nao existe DRE de um dia. Com o recorte num
     mes so, os numeros do topo seguem o recorte e os GRAFICOS olham os
     ultimos seis meses fechados - e a secao diz isso. */
  const mesesGraf = meses.length >= 3 ? meses : f.meses.slice(-6);
  const somaMes = (linha, ks) => (ks || meses).reduce((a, k) => a + ((linha && linha.meses[k]) || 0), 0);
  const nClientes = ks => cli.filter(r => (ks || meses).indexOf(r.mes) >= 0).length;
  const honComp   = ks => soma(cli.filter(r => (ks || meses).indexOf(r.mes) >= 0), r => r.honIni);
  const nReunioes = ks => at.filter(r => r.dAtend && (ks || meses).indexOf(r.mes) >= 0).length;
  const nLeads    = ks => soma(md.filter(r => (ks || meses).indexOf(r.mes) >= 0), r => r.leadsTotal);

  const custoCom = somaMes(f.comercial);
  const custoMidia = soma(f.itens.filter(i => i.bucket === 'midia'), i => somaMes(i));
  const custoPessoas = soma(f.itens.filter(i => i.bucket === 'pessoas'), i => somaMes(i));
  const custoFerr = soma(f.itens.filter(i => i.bucket === 'ferramentas'), i => somaMes(i));
  const receita = somaMes(f.receita);
  const lucro = somaMes(f.lucro);
  const rateio = somaMes(f.rateio);
  const impostos = somaMes(f.impostos);
  const bancarias = somaMes(f.bancarias);
  const clientes = nClientes();
  const cacReal = clientes ? custoCom / clientes : null;
  const cacMidia = clientes ? custoMidia / clientes : null;
  const tk = ticketMedio(cli.filter(r => meses.indexOf(r.mes) >= 0));

  let h = '';
  h += '<div class="secao-titulo primeiro">Financeiro do comercial &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += aviso('info', 'Fonte: aba <b>DRE COMERCIAL</b> do FLUXO FINANCEIRO ' + f.ano + '. ' +
    'A DRE e por <b>regime de caixa</b> (o que entrou e saiu no mes) e a planilha de clientes e por ' +
    '<b>competencia</b> (contrato assinado no mes) &mdash; os dois numeros de receita nao batem de proposito. ' +
    'O painel mostra os dois e a diferenca, em vez de escolher um.');

  const Kf = [];
  Kf.push({ rotulo: 'Receita (caixa)', valor: brl0(receita), pequeno: true,
    nota: 'Honorários iniciais recebidos na DRE' });
  Kf.push({ rotulo: 'Custo do setor comercial', valor: brl0(custoCom), pequeno: true,
    nota: 'Pessoas + mídia + ferramentas' });
  Kf.push({ rotulo: 'Lucro líquido do comercial', valor: brl0(lucro), pequeno: true,
    selo: selo(lucro > 0 ? 'ok' : lucro === 0 ? 'neutro' : 'critico', lucro > 0 ? 'positivo' : 'no vermelho'),
    nota: 'Já descontados rateio, impostos e taxas' });
  Kf.push({ rotulo: 'Margem liquida', valor: pctOuTraco(taxa(lucro, receita), 1),
    dica: 'Lucro líquido do setor sobre a receita de caixa do setor.' });
  Kf.push({ rotulo: 'CAC real', valor: cacReal == null ? '&mdash;' : brl0(cacReal), pequeno: true,
    dica: 'Custo do setor comercial inteiro dividido pelos clientes fechados no mesmo período. Inclui SDR, closer, lider, estagiarios, CRM, automações e mídia.',
    nota: n0(clientes) + ' clientes no periodo' });
  Kf.push({ rotulo: 'CAC de mídia', valor: cacMidia == null ? '&mdash;' : brl0(cacMidia), pequeno: true,
    nota: cacReal && cacMidia ? 'Midia e ' + pct(taxa(custoMidia, custoCom), 0) + ' do custo comercial' : '' });
  Kf.push({ rotulo: 'Ticket médio', valor: tk == null ? '&mdash;' : brl0(tk), pequeno: true,
    nota: 'Só quem teve honorário inicial' });
  Kf.push({ rotulo: 'Margem por cliente', valor: (tk != null && cacReal != null) ? brl0(tk - cacReal) : '&mdash;', pequeno: true,
    selo: (tk != null && cacReal != null) ? selo(tk - cacReal > 0 ? 'ok' : 'critico',
      tk - cacReal > 0 ? 'ticket cobre o CAC' : 'CAC acima do ticket') : null,
    dica: 'Ticket médio menos CAC real. Não inclui honorário de exito, que entra depois e muda esta conta.' });
  Kf.push({ rotulo: 'Retorno sobre o custo', valor: custoCom ? n1(receita / custoCom) + 'x' : '&mdash;', pequeno: true,
    selo: custoCom ? selo(receita / custoCom >= 2 ? 'ok' : receita / custoCom >= 1 ? 'atencao' : 'critico',
      receita / custoCom >= 2 ? 'saudavel' : receita / custoCom >= 1 ? 'no limite' : 'queima caixa') : null,
    dica: 'Receita de caixa dividida pelo custo do setor comercial. Diferente do ROI de mídia, que olha só o anúncio.' });
  h += hierarquiaKpi(Kf, 4);

  /* ----- Evolucao ----- */
  h += '<div class="secao-titulo">Evolução mês a mês</div>';
  if (mesesGraf !== meses) {
    h += aviso('info', 'Os numeros acima seguem o recorte de <b>' + esc(rotuloPeriodo()) +
      '</b>. Os graficos abaixo olham os <b>ultimos ' + n0(mesesGraf.length) +
      ' meses fechados da DRE</b>: nao existe DRE de um dia, e uma linha com um ponto nao mostra tendencia.');
  }
  h += '<div class="grid g-2">';
  const eixo = mesesGraf.map(rotuloMesCurto);

  h += cartao('Receita e custo do comercial', 'Mesma unidade (R$), por isso dividem o grafico. A distancia entre as linhas e o lucro.',
    vizLinhas({ x: eixo, fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', series: [
      { nome: 'Receita (caixa)', vals: mesesGraf.map(k => somaMes(f.receita, [k])), cor: 'var(--s1)' },
      { nome: 'Custo do comercial', vals: mesesGraf.map(k => somaMes(f.comercial, [k])), cor: 'var(--s2)' }
    ] }) + legenda([{ nome: 'Receita (caixa)', cor: 'var(--s1)' }, { nome: 'Custo do comercial', cor: 'var(--s2)' }]));

  /* Lucro: positivo x negativo pede par divergente, nao rampa. */
  h += cartao('Lucro líquido do comercial', 'Barra abaixo de zero e mês em que o setor consumiu caixa.',
    vizColunas({ dados: mesesGraf.map(k => {
      const v = somaMes(f.lucro, [k]);
      return { k: rotuloMesCurto(k), rot: rotuloMes(k), v: Math.abs(v),
               cor: v >= 0 ? 'var(--s1)' : 'var(--s8)',
               extra: [{ rot: v >= 0 ? 'Lucro' : 'Prejuizo', val: brl0(v), cor: v >= 0 ? 'var(--s1)' : 'var(--s8)' },
                       { rot: 'Receita', val: brl0(somaMes(f.receita, [k])) },
                       { rot: 'Custo comercial', val: brl0(somaMes(f.comercial, [k])) }] };
    }), fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', nome: 'Resultado', rotulos: false }) +
    legenda([{ nome: 'Mês com lucro', cor: 'var(--s1)' }, { nome: 'Mês com prejuizo', cor: 'var(--s8)' }]));

  h += cartao('CAC real x ticket médio', 'As duas em R$ por cliente: quando o CAC encosta no ticket, cada venda nova para de pagar a operação.',
    vizLinhas({ x: eixo, fmt: brl0, fmtEixo: v => 'R$' + n0(v), series: [
      { nome: 'CAC real', vals: mesesGraf.map(k => { const n = nClientes([k]); return n ? somaMes(f.comercial, [k]) / n : null; }), cor: 'var(--s2)' },
      { nome: 'CAC de mídia', vals: mesesGraf.map(k => { const n = nClientes([k]); return n ? soma(f.itens.filter(i => i.bucket === 'midia'), i => somaMes(i, [k])) / n : null; }), cor: 'var(--s4)' },
      { nome: 'Ticket médio', vals: mesesGraf.map(k => ticketMedio(cli.filter(r => r.mes === k))), cor: 'var(--s3)' }
    ] }) + legenda([{ nome: 'CAC real', cor: 'var(--s2)' }, { nome: 'CAC de mídia', cor: 'var(--s4)' }, { nome: 'Ticket médio', cor: 'var(--s3)' }]));

  h += cartao('Estrutura do custo comercial', 'Quanto do custo e gente, quanto e mídia e quanto e ferramenta.',
    vizEmpilhado({ x: eixo, fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', series: [
      { nome: 'Pessoas', vals: mesesGraf.map(k => soma(f.itens.filter(i => i.bucket === 'pessoas'), i => somaMes(i, [k]))), cor: 'var(--s1)' },
      { nome: 'Mídia', vals: mesesGraf.map(k => soma(f.itens.filter(i => i.bucket === 'midia'), i => somaMes(i, [k]))), cor: 'var(--s2)' },
      { nome: 'Ferramentas', vals: mesesGraf.map(k => soma(f.itens.filter(i => i.bucket === 'ferramentas'), i => somaMes(i, [k]))), cor: 'var(--s3)' }
    ] }) + legenda([
      { nome: 'Pessoas', cor: 'var(--s1)', val: brl0(custoPessoas) },
      { nome: 'Mídia', cor: 'var(--s2)', val: brl0(custoMidia) },
      { nome: 'Ferramentas', cor: 'var(--s3)', val: brl0(custoFerr) }]));
  h += '</div>';

  /* ----- Eficiencia por etapa ----- */
  h += '<div class="secao-titulo">Custo por etapa do funil</div>';
  const leads = nLeads(), reun = nReunioes();
  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Custo por lead', valor: leads ? brl(custoCom / leads) : '&mdash;', pequeno: true,
    nota: n0(leads) + ' leads de midia no periodo', dica: 'Custo comercial inteiro por lead, não só o anúncio. O CPL da tela de tráfego usa só a mídia.' });
  h += kpi({ rotulo: 'Custo por reunião', valor: reun ? brl0(custoCom / reun) : '&mdash;', pequeno: true,
    nota: n0(reun) + ' reunioes realizadas' });
  h += kpi({ rotulo: 'Custo por cliente', valor: cacReal == null ? '&mdash;' : brl0(cacReal), pequeno: true,
    nota: n0(clientes) + ' clientes fechados' });
  h += kpi({ rotulo: 'Rateio do processual', valor: brl0(rateio), pequeno: true,
    dica: 'Parte do custo do setor processual, liderancas e despesas extraordinarias atribuida ao comercial na DRE. Não entra no CAC: e custo de entrega, não de aquisicao.' });
  h += kpi({ rotulo: 'Impostos', valor: brl0(impostos), pequeno: true });
  h += kpi({ rotulo: 'Taxas bancarias', valor: brl0(bancarias), pequeno: true,
    nota: pctOuTraco(taxa(bancarias, receita), 1) + ' da receita',
    dica: 'Custo de maquininha, link e parcelamento. Sobe junto com a fatia de venda parcelada.' });
  h += '</div>';

  /* ----- Reconciliacao caixa x competencia ----- */
  h += '<div class="secao-titulo">Caixa x competência &middot; onde os dois números divergem</div>';
  const recon = meses.map(k => {
    const caixa = somaMes(f.receita, [k]);
    const comp = honComp([k]);
    return { mes: rotuloMes(k), caixa: caixa, comp: comp, dif: caixa - comp,
             difPct: comp ? ((caixa - comp) / comp) * 100 : null, clientes: nClientes([k]) };
  });
  h += cartao('Receita na DRE x honorários assinados', 'Diferenca grande e sinal de contrato assinado que ainda não virou caixa &mdash; ou de lancamento faltando em uma das duas planilhas.',
    tabelaInterativa('fin-recon', [
      { k: 'mes', rot: 'Mês', tipo: 'txt', cls: 'forte' },
      { k: 'clientes', rot: 'Clientes', tipo: 'num' },
      { k: 'comp', rot: 'Assinado (competência)', tipo: 'moeda0' },
      { k: 'caixa', rot: 'Recebido (caixa)', tipo: 'moeda0' },
      { k: 'dif', rot: 'Diferenca', tipo: 'moeda0',
        html: r => '<span style="color:' + (Math.abs(r.difPct || 0) > 15 ? '#f3c45a' : 'var(--texto-2)') + '">' + brl0(r.dif) + '</span>' },
      { k: 'difPct', rot: '%', tipo: 'num', ord: false,
        html: r => r.difPct == null ? '&mdash;' : delta(r.difPct, { fmt: v => pct(v, 0) }) }
    ], recon, { titulo: 'Caixa x competência', limite: 24, ativa: false }));

  /* ----- Linhas de custo ----- */
  h += '<div class="secao-titulo">Linhas de custo do setor comercial</div>';
  const itens = f.itens.map(i => {
    const v = somaMes(i);
    return { rotulo: i.rotulo, bucket: i.bucket, valor: v,
             share: taxa(v, custoCom), porCliente: clientes ? v / clientes : null,
             projecao: i.projecao, media: meses.length ? v / meses.length : 0 };
  }).filter(i => i.valor !== 0).sort((a, b) => b.valor - a.valor);
  const maxItem = itens.length ? itens[0].valor : 0;
  const ROT_BUCKET = { pessoas: 'Pessoas', midia: 'Midia', ferramentas: 'Ferramentas', outros: 'Outros' };
  const COR_BUCKET = { pessoas: 'var(--s1)', midia: 'var(--s2)', ferramentas: 'var(--s3)', outros: 'var(--texto-muted)' };
  h += tabelaInterativa('fin-itens', [
    { k: 'rotulo', rot: 'Linha de custo', tipo: 'txt', cls: 'forte wrap' },
    { k: 'bucket', rot: 'Grupo', tipo: 'txt', ord: false,
      html: r => '<span style="color:' + COR_BUCKET[r.bucket] + '">&#9679;</span> ' + esc(ROT_BUCKET[r.bucket] || r.bucket) },
    { k: 'valor', rot: 'Total no período', tipo: 'moeda0',
      html: r => barraCelula(r.valor, maxItem, COR_BUCKET[r.bucket], brl0(r.valor)) },
    { k: 'share', rot: '% do custo', tipo: 'pct', casas: 1 },
    { k: 'media', rot: 'Média mensal', tipo: 'moeda0' },
    { k: 'porCliente', rot: 'Por cliente', tipo: 'moeda0' }
  ], itens, { ord: 'valor', dir: -1, titulo: 'Linhas de custo do comercial', limite: 30,
    total: { valor: d => brl0(soma(d, r => r.valor)), porCliente: d => clientes ? brl0(soma(d, r => r.valor) / clientes) : '' } });
  return h;
}

/* ==========================================================================
   TELA - KPIs DO COMERCIAL (ritmo e projecao)
   --------------------------------------------------------------------------
   Porte do painel "KPIs Comercial" da central: mesmo layout, fonte trocada.
   Em vez de ler a planilha antiga, cada realizado vem das fontes vivas.

   A leitura central e de RITMO, com tres numeros que respondem coisas
   diferentes e vivem sendo confundidos:
     . Realizado (MTD)      - o que ja entrou no mes ate hoje
     . Meta proporcional    - o que DEVERIA ter entrado ate hoje
     . Projecao do mes      - onde o mes termina se o ritmo de hoje continuar
   Comparar realizado com meta MENSAL no dia 10 so produz panico; comparar com
   a proporcional e o que diz se esta atrasado de verdade.
   ========================================================================== */
const METAS_PADRAO = {
  leadsAds:    { rot: 'Leads (Meta Ads)',       meta: 1500,  tipo: 'num',   acumula: true },
  leadsAbord:  { rot: 'Leads Abordados',        meta: 900,   tipo: 'num',   acumula: true },
  leadsQual:   { rot: 'Leads Qualificados',     meta: 300,   tipo: 'num',   acumula: true },
  reunioes:    { rot: 'Reuniões Realizadas',    meta: 100,   tipo: 'num',   acumula: true },
  clientes:    { rot: 'Clientes Fechados',      meta: 32,    tipo: 'num',   acumula: true },
  faturamento: { rot: 'Faturamento',            meta: 80000, tipo: 'moeda', acumula: true },
  ticket:      { rot: 'Ticket Médio',           meta: 2500,  tipo: 'moeda', acumula: false },
  investimento:{ rot: 'Investimento (Ads)',     meta: 16000, tipo: 'moeda', acumula: true },
  cac:         { rot: 'CAC',                    meta: 500,   tipo: 'moeda', acumula: false, inverso: true },
  convReunCli: { rot: 'Conv. Reunião → Cliente', meta: 20, tipo: 'pct', acumula: false },
  convLeadReun:{ rot: 'Conv. Lead → Reunião',    meta: 12, tipo: 'pct', acumula: false },
  convLeadCli: { rot: 'Conv. Lead → Cliente',    meta: 2.5, tipo: 'pct', acumula: false },
  roi:         { rot: 'ROI',                    meta: 5,     tipo: 'mult',  acumula: false }
};
const K_METAS = 'bm_ceo_metas';

function metasAtivas() {
  const m = {};
  Object.keys(METAS_PADRAO).forEach(k => { m[k] = METAS_PADRAO[k].meta; });
  try {
    const salvo = JSON.parse(localStorage.getItem(K_METAS) || 'null');
    if (salvo) Object.keys(salvo).forEach(k => { if (m[k] != null && isFinite(salvo[k])) m[k] = Number(salvo[k]); });
  } catch (e) {}
  return m;
}

const fmtPorTipo = t => t === 'moeda' ? brl0 : t === 'pct' ? (v => pct(v, v < 10 ? 2 : 1))
  : t === 'mult' ? (v => n1(v) + 'x') : n0;

/* ==========================================================================
   TELA 6 - EQUIPE
   ========================================================================== */
function telaEquipe(modo) {
  const at = selAtend(), cli = selClientes();
  let h = '';
  h += '<div class="secao-titulo' + (modo === 'modulo' ? '' : ' primeiro') + '">Equipe comercial &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += aviso('info', 'Closers aparecem pela coluna <b>Closer</b> e SDRs pela coluna <b>SDR</b> das planilhas de atendimento e de clientes. ' +
    'A conversao e do recorte, nao de coorte: um cliente pode ter vindo de reuniao de mes anterior.');

  /* --- Closers --- */
  const closers = Array.from(new Set(at.map(r => r.closer).concat(cli.map(r => r.closer)))).filter(x => x && x !== 'Sem closer');
  const linhasCloser = closers.map(nome => {
    const a = at.filter(r => r.closer === nome);
    const c = cli.filter(r => r.closer === nome);
    const reun = a.filter(r => r.dAtend).length;
    const ganhos = a.filter(r => r.grupo === 'ganho').length;
    const perdidos = a.filter(r => r.grupo === 'perdido').length;
    const hon = soma(c, r => r.honIni);
    return {
      nome: nome, reun: reun, abertos: a.filter(r => r.emAberto).length,
      ganhos: ganhos, perdidos: perdidos,
      taxaGanho: taxa(ganhos, ganhos + perdidos),
      clientes: c.length, hon: hon, ticket: ticketMedio(c),
      conv: taxa(c.length, reun), dias: media(c, r => r.diasFechar),
      propAberta: soma(a.filter(r => r.emAberto), r => r.vInicial),
      parados: a.filter(r => r.parado).length
    };
  }).sort((a, b) => b.hon - a.hon);

  h += '<div class="secao-titulo">Closers</div>';
  h += '<div class="grid g-3">';
  h += cartao('Honorários por closer', 'Receita inicial fechada no recorte.',
    vizBarras({ dados: linhasCloser.filter(c => c.hon > 0).map((c, i) => ({ k: c.nome, v: c.hon, cor: corSerie(i),
      extra: [{ rot: 'Clientes', val: n0(c.clientes) }, { rot: 'Ticket médio', val: c.ticket == null ? '—' : brl0(c.ticket) }] })), fmt: brl0, nome: 'Honorários' }));
  h += cartao('Conversão reunião → cliente', 'Clientes sobre reuniões realizadas.',
    vizBarras({ dados: linhasCloser.filter(c => c.conv != null).map((c, i) => ({ k: c.nome, v: c.conv, cor: corSerie(i),
      extra: [{ rot: 'Reuniões', val: n0(c.reun) }, { rot: 'Clientes', val: n0(c.clientes) }] })), fmt: v => pct(v, 1), nome: 'Conversão' }));
  h += cartao('Taxa de ganho na negociação', 'Ganhos sobre ganhos + perdidos. Sem resposta não entra.',
    vizBarras({ dados: linhasCloser.filter(c => c.taxaGanho != null).map((c, i) => ({ k: c.nome, v: c.taxaGanho, cor: corSerie(i),
      extra: [{ rot: 'Ganhos', val: n0(c.ganhos) }, { rot: 'Perdidos', val: n0(c.perdidos) }] })), fmt: v => pct(v, 1), nome: 'Taxa de ganho' }));
  h += '</div>';

  h += tabelaInterativa('closer-tab', [
    { k: 'nome', rot: 'Closer', tipo: 'txt', cls: 'forte' },
    { k: 'reun', rot: 'Reuniões', tipo: 'num' },
    { k: 'clientes', rot: 'Clientes', tipo: 'num' },
    { k: 'conv', rot: 'Conversão', tipo: 'pct', casas: 1 },
    { k: 'ganhos', rot: 'Ganhos', tipo: 'num' },
    { k: 'perdidos', rot: 'Perdidos', tipo: 'num' },
    { k: 'taxaGanho', rot: 'Taxa de ganho', tipo: 'pct', casas: 1 },
    { k: 'hon', rot: 'Honorários', tipo: 'moeda0' },
    { k: 'ticket', rot: 'Ticket médio', tipo: 'moeda0' },
    { k: 'dias', rot: 'Dias p/ fechar', tipo: 'num1' },
    { k: 'abertos', rot: 'Em aberto', tipo: 'num' },
    { k: 'propAberta', rot: 'Proposta em aberto', tipo: 'moeda0' },
    { k: 'parados', rot: 'Parados > 7d', tipo: 'num',
      html: r => r.parados ? '<span style="color:#f3c45a;font-weight:700">' + n0(r.parados) + '</span>' : '0' }
  ], linhasCloser, { ord: 'hon', dir: -1, titulo: 'Desempenho por closer', limite: 30 });

  /* --- SDRs --- */
  const sdrs = Array.from(new Set(at.map(r => r.sdr).concat(cli.map(r => r.sdr)))).filter(x => x && x !== 'Sem SDR');
  const linhasSdr = sdrs.map(nome => {
    const a = at.filter(r => r.sdr === nome);
    const c = cli.filter(r => r.sdr === nome);
    const agendadas = a.filter(r => r.dAgenda).length;
    const realizadas = a.filter(r => r.dAtend).length;
    return {
      nome: nome, agendadas: agendadas, realizadas: realizadas,
      noShow: Math.max(0, agendadas - realizadas),
      presenca: taxa(realizadas, agendadas),
      clientes: c.length, hon: soma(c, r => r.honIni),
      conv: taxa(c.length, realizadas),
      semResposta: a.filter(r => r.grupo === 'semresposta').length
    };
  }).sort((a, b) => b.realizadas - a.realizadas);

  h += '<div class="secao-titulo">SDR &middot; agendamento e comparecimento</div>';
  h += '<div class="grid g-2">';
  h += cartao('Reuniões agendadas x realizadas', 'A diferenca e o no-show da agenda.',
    vizEmpilhado({ x: linhasSdr.map(s => s.nome), fmt: n0, series: [
      { nome: 'Realizadas', vals: linhasSdr.map(s => s.realizadas), cor: 'var(--s3)' },
      { nome: 'Não realizadas', vals: linhasSdr.map(s => s.noShow), cor: 'var(--s4)' }
    ] }) + legenda([{ nome: 'Realizadas', cor: 'var(--s3)' }, { nome: 'Não realizadas', cor: 'var(--s4)' }]));
  h += cartao('Clientes gerados por SDR', 'Fechamentos atribuidos ao SDR que originou.',
    vizBarras({ dados: linhasSdr.map((s, i) => ({ k: s.nome, v: s.clientes, cor: corSerie(i),
      extra: [{ rot: 'Honorários', val: brl0(s.hon) }] })), nome: 'Clientes' }));
  h += '</div>';

  h += tabelaInterativa('sdr-tab', [
    { k: 'nome', rot: 'SDR', tipo: 'txt', cls: 'forte' },
    { k: 'agendadas', rot: 'Agendadas', tipo: 'num' },
    { k: 'realizadas', rot: 'Realizadas', tipo: 'num' },
    { k: 'noShow', rot: 'Não realizadas', tipo: 'num' },
    { k: 'presenca', rot: 'Comparecimento', tipo: 'pct', casas: 1 },
    { k: 'semResposta', rot: 'Sem resposta', tipo: 'num' },
    { k: 'clientes', rot: 'Clientes', tipo: 'num' },
    { k: 'conv', rot: 'Conversão', tipo: 'pct', casas: 1 },
    { k: 'hon', rot: 'Honorários', tipo: 'moeda0' }
  ], linhasSdr, { ord: 'realizadas', dir: -1, titulo: 'Desempenho por SDR', limite: 30, ativa: false });
  return h;
}

/* ==========================================================================
   TELA 7 - METAS E OKRS
   ========================================================================== */
function telaMetas() {
  let h = '';
  if (ERROS.metas) return aviso('critico', '<b>Planilha de Metas nao entrou:</b> ' + esc(ERROS.metas));
  const m = DADOS.metas || {};
  const nomeAtual = MESES_ACENTO[new Date().getMonth()];
  const nomeAnt = MESES_ACENTO[(new Date().getMonth() + 11) % 12];
  const rm = ritmoDoMes();

  const atual = m.meses && m.meses[nomeAtual] && !m.meses[nomeAtual].erro ? m.meses[nomeAtual] : null;
  const ant = m.meses && m.meses[nomeAnt] && !m.meses[nomeAnt].erro ? m.meses[nomeAnt] : null;

  h += '<div class="secao-titulo primeiro">Metas do mês &middot; ' + esc(nomeAtual) + '</div>';
  if (!atual) {
    h += aviso('atencao', 'Nao encontrei a aba <code>KPIS ' + esc(nomeAtual) + '</code> na planilha de Metas. ' +
      'Quando o time criar a aba do mes, ela aparece aqui sozinha.');
  } else {
    h += aviso('info', 'Medicao de <b>' + esc(atual.atualizado || 'data nao informada na planilha') + '</b> &middot; ' +
      rm.diasComp + ' de ' + rm.diasMes + ' dias do mes (' + pct(rm.pct, 0) + '). ' +
      'A <b>meta proporcional</b> e o quanto deveria estar entregue hoje; e contra ela que o ritmo e lido.');

    const fmtKr = k => k.tipo === 'moeda' ? brl0 : (k.tipo === 'pct' ? (v => pct(v, 0)) : n0);
    h += tabelaInterativa('metas-tab', [
      { k: 'resp', rot: 'Responsável', tipo: 'txt', cls: 'forte' },
      { k: 'kr', rot: 'Resultado chave', tipo: 'txt', cls: 'wrap' },
      { k: 'metaMes', rot: 'Meta do mês', tipo: 'num', html: r => fmtKr(r)(r.metaMes) },
      { k: 'metaProp', rot: 'Meta proporcional', tipo: 'num', html: r => fmtKr(r)(r.metaProp) },
      { k: 'resultado', rot: 'Resultado', tipo: 'num', html: r => '<b style="color:var(--texto)">' + fmtKr(r)(r.resultado) + '</b>' },
      { k: 'vsProp', rot: 'vs proporcional', tipo: 'num', ord: false,
        html: r => selo(nivelMeta(r.inverso ? (r.vsProp ? 200 - r.vsProp : null) : r.vsProp), pct(r.vsProp, 0)) },
      { k: 'vsMes', rot: 'vs meta do mês', tipo: 'num', ord: false,
        html: r => barraCelula(r.vsMes, 120, r.vsMes >= 100 ? 'var(--ok)' : r.vsMes >= 60 ? 'var(--atencao)' : 'var(--critico)', pct(r.vsMes, 0)) },
      { k: 'ritmo', rot: 'Ritmo', tipo: 'txt', ord: false,
        html: r => ritmo({ feito: r.resultado, meta: r.metaMes, alvoPct: rm.pct, fmt: fmtKr(r) }) }
    ], atual.krs, { titulo: 'Metas do mês', limite: 40 });

    /* Comparacao com o mes anterior pelos KRs de mesmo nome. */
    if (ant) {
      const comp = atual.krs.map(k => {
        const a = ant.krs.find(x => chaveBusca(x.kr) === chaveBusca(k.kr));
        if (!a) return null;
        return { kr: k.kr, resp: k.resp, atual: k.resultado, ant: a.resultado,
                 var: a.resultado ? ((k.resultado - a.resultado) / Math.abs(a.resultado)) * 100 : null, inverso: k.inverso, tipo: k.tipo };
      }).filter(Boolean);
      if (comp.length) {
        h += '<div class="secao-titulo">' + esc(nomeAtual) + ' x ' + esc(nomeAnt) +
          ' <span style="text-transform:none;letter-spacing:0;font-weight:500">(' + esc(nomeAtual) + ' ainda em curso &mdash; compare com o ritmo, nao com o total)</span></div>';
        h += tabelaInterativa('metas-comp', [
          { k: 'kr', rot: 'Resultado chave', tipo: 'txt', cls: 'forte wrap' },
          { k: 'resp', rot: 'Responsável', tipo: 'txt' },
          { k: 'ant', rot: esc(nomeAnt), tipo: 'num', html: r => (r.tipo === 'moeda' ? brl0 : r.tipo === 'pct' ? (v => pct(v, 0)) : n0)(r.ant) },
          { k: 'atual', rot: esc(nomeAtual) + ' (parcial)', tipo: 'num', html: r => (r.tipo === 'moeda' ? brl0 : r.tipo === 'pct' ? (v => pct(v, 0)) : n0)(r.atual) },
          { k: 'var', rot: 'Variação', tipo: 'num', ord: false, html: r => delta(r.var, { inverso: r.inverso }) }
        ], comp, { titulo: 'Comparativo de metas', limite: 40, ativa: false });
      }
    }
  }

  /* --- Plano de acao --- */
  h += '<div class="secao-titulo">Plano de ação</div>';
  if (m.okrs && m.okrs.length) {
    h += tabelaInterativa('okr-tab', [
      { k: 'acao', rot: 'Ação', tipo: 'txt', cls: 'forte wrap' },
      { k: 'resp', rot: 'Responsável', tipo: 'txt' },
      { k: 'prazo', rot: 'Conclusao prevista', tipo: 'data' },
      { k: 'status', rot: 'Status', tipo: 'txt', ord: false,
        html: r => !r.status ? '&mdash;' : selo(/conclu|feito|pronto/i.test(r.status) ? 'ok' :
          /execu|andamento/i.test(r.status) ? 'neutro' : 'atencao', r.status) },
      { k: 'atraso', rot: 'Prazo', tipo: 'num', ord: false,
        html: r => { if (!r.prazo) return '&mdash;';
          const d = diasEntre(r.prazo, hoje());
