  const principais = [
    B({ k: 'leadsOrg', rot: 'Leads orgânicos', valor: organicoLeads, ant: organicoAnt,
        falta: organicoLeads == null ? 'A linha <b>Leads (Orgânico)</b> da aba Produtos Jurídicos não foi lida para ' + esc(c.rotMes) + '.' : null,
        fonte: 'Produtos Jurídicos, linha Leads (Orgânico)',
        nota: organicoLeads ? 'Contra ' + n0(soma(c.md, r => r.leadsTotal)) + ' leads de campanha paga' : null }),
    B({ k: 'pctIndicacao', rot: '% de clientes por indicação', tipo: 'pct',
        valor: taxa(cliInd.length, c.cli.length), ant: taxa(cliIndAnt.length, c.cliAnt.length),
        serie: c.serie.map(k => taxa(porNat(c.serieCli(k), 'indicacao').length, c.serieCli(k).length)),
        fonte: 'ORIGEM = Indicação na planilha de clientes',
        nota: n0(cliInd.length) + ' de ' + n0(c.cli.length) + ' clientes do mês' }),
    B({ k: 'socialSeller', rot: 'Conversas do social seller', valor: soc.length || null,
        ant: socAnt.length || null, acumula: true, falta: semSocial,
        fonte: 'Funil <b>Instagram</b> do Kommo',
        nota: soc.length ? n0(porEtapaSoc('direct')) + ' direct &middot; ' +
          n0(porEtapaSoc('comentarios')) + ' coment\u00e1rios &middot; ' + n0(pediuContato) + ' pediram contato' : null,
        dica: 'Interação recebida no Instagram, contada pelo CRM: direct, comentário e pedido de telefone. Só a partir de interação recebida — abordagem fria é captação vedada pelo Provimento 205. Este funil não tem campanha por natureza, e por isso não entra nas contas do módulo Meta Ads.' }),
    kMkt('seguidores', 'Novos seguidores (líquido)', 'novos seguidores'),
    kMkt('conteudo', 'Conteúdo publicado (feed)', 'conteudo publicado')
  ];

  const audiencia = [
    kMkt('crescimento', 'Taxa de crescimento de seguidores', 'taxa de crescimento de seguidores', { tipo: 'pct', acumula: false }),
    kMkt('visitas', 'Visitas ao perfil', 'visitas ao perfil'),
    kMkt('bio', 'Cliques no link da bio', 'cliques no link da bio'),
    kMkt('wpp', 'Cliques no botão de WhatsApp', 'cliques no whatsapp'),
    kMkt('alcanceOrg', 'Alcance orgânico', 'alcance organico'),
    kMkt('naoSeguidores', '% de alcance de não seguidores', 'alcance de nao seguidores', { tipo: 'pct', acumula: false })
  ];
  const conteudo = [
    kMkt('publicados', 'Volume publicado (posts, Reels, stories)', 'volume publicado'),
    kMkt('calendario', 'Cumprimento do calendário', 'cumprimento do calendario', { tipo: 'pct', acumula: false }),
    kMkt('engajamento', 'Taxa de engajamento', 'taxa de engajamento', { tipo: 'pct', acumula: false }),
    kMkt('salvamentos', 'Salvamentos e compartilhamentos', 'salvamentos'),
    kMkt('comentarios', 'Comentários', 'comentarios'),
    kMkt('retencaoReels', 'Retenção dos Reels', 'retencao dos reels', { tipo: 'pct', acumula: false })
  ];
  const seller = [
    B({ k: 'igDirect', rot: 'Direct recebido', valor: porEtapaSoc('direct') || null,
        acumula: true, falta: semSocial, fonte: 'Funil Instagram, etapa DIRECT' }),
    B({ k: 'igComentarios', rot: 'Comentários respondidos', valor: porEtapaSoc('comentarios') || null,
        acumula: true, falta: semSocial, fonte: 'Funil Instagram, etapa COMENTÁRIOS' }),
    B({ k: 'igContato', rot: 'Pediram contato', valor: pediuContato || null,
        ant: pediuContatoAnt || null, acumula: true, falta: semSocial,
        fonte: 'Funil Instagram: telefone solicitado ou já no WhatsApp',
        dica: 'A conversa saiu do social e virou canal direto. É o degrau que separa interação de lead.' }),
    B({ k: 'convLead', rot: 'Conversa → lead', tipo: 'pct',
        valor: taxa(pediuContato, soc.length), falta: semSocial,
        fonte: 'Pediram contato ÷ conversas do social seller',
        nota: soc.length ? n0(pediuContato) + ' de ' + n0(soc.length) + ' interações' : null }),
    B({ k: 'encaminhados', rot: 'Leads encaminhados à SDR', valor: foiParaWpp || null,
        acumula: true, falta: semSocial, fonte: 'Funil Instagram, etapa JÁ ESTÁ NO WPP',
        dica: 'Passaram do Instagram para o WhatsApp, que é onde a pré-venda começa.' }),
    kMkt('tempoResp', 'Tempo de resposta nas redes', 'tempo de resposta', { tipo: 'dias', acumula: false })
  ];
  const site = [
    B({ k: 'cliSite', rot: 'Clientes vindos do site', valor: c.cli.filter(r => /site|calculadora/.test(chaveBusca(r.origem))).length,
        fonte: 'ORIGEM = Site ou Calculadora',
        dica: 'É o que a planilha de clientes registra. Sessões e leads do site exigiriam uma fonte de analytics.' }),
    B({ k: 'sessoes', rot: 'Sessões orgânicas do Google', falta: 'Nenhuma fonte de site conectada ao painel.' }),
    B({ k: 'palavras', rot: 'Palavras-chave na 1ª página', falta: 'Nenhuma fonte de SEO conectada.' }),
    B({ k: 'gbp', rot: 'Perfil da Empresa no Google', falta: 'Nenhuma fonte do Google Business Profile conectada.' })
  ];
  const demanda = [
    B({ k: 'clientesOrg', rot: 'Clientes de origem orgânica', valor: cliOrg.length, ant: cliOrgAnt.length,
        serie: c.serie.map(k => porNat(c.serieCli(k), 'organico').length), fonte: 'ORIGEM da planilha de clientes' }),
    B({ k: 'honOrg', rot: 'Honorários de origem orgânica', tipo: 'moeda', valor: honOrg,
        ant: soma(cliOrgAnt, r => r.honIni), fonte: 'ORIGEM da planilha de clientes' }),
    B({ k: 'ticketOrg', rot: 'Ticket médio orgânico', tipo: 'moeda', valor: ticketMedio(cliOrg),
        fonte: 'Honorários iniciais dos clientes orgânicos',
        nota: ticketMedio(cliAds) != null ? 'Campanha paga: ' + brl0(ticketMedio(cliAds)) : null }),
    B({ k: 'custoLeadOrg', rot: 'Custo por lead orgânico', tipo: 'moeda2', inverso: true,
        valor: (custoMkt && organicoLeads) ? custoMkt / organicoLeads : null,
        falta: custoMkt ? null : 'Depende das linhas <b>SOCIAL MEDIA</b> e <b>OUTRAS DESPESAS DE MARKETING</b> da DRE.',
        fonte: 'Custo de marketing (DRE) ÷ leads orgânicos',
        nota: custoMkt ? brl0(custoMkt) + ' de custo de marketing no mês' : null }),
    B({ k: 'dependencia', rot: 'Dependência de mídia paga', tipo: 'pct', inverso: true,
        valor: taxa(cliAds.length, c.cli.length),
        serie: c.serie.map(k => taxa(porNat(c.serieCli(k), 'ads').length, c.serieCli(k).length)),
        fonte: 'Clientes de campanha ÷ clientes do mês',
        dica: 'Quanto maior, mais o resultado do mês depende de verba. Menos é melhor.' }),
    B({ k: 'qualOrg', rot: 'Taxa de qualificação orgânica', falta:
        'A planilha mede elegibilidade e qualificação no total, sem separar por origem. O corte existiria se o CRM marcasse a origem em cada etapa.' })
  ];
  const marca = [
    B({ k: 'clientesInd', rot: 'Clientes por indicação', valor: cliInd.length, ant: cliIndAnt.length,
        fonte: 'ORIGEM = Indicação' }),
    B({ k: 'recompra', rot: 'Clientes por recompra', valor: cliBase.length,
        fonte: 'ORIGEM = Recompra (Cliente BM)',
        nota: pctOuTraco(taxa(cliBase.length, c.cli.length), 0) + ' dos clientes do mês' }),
    kMkt('nps', 'NPS', 'nps', { acumula: false }),
    kMkt('google', 'Nota no Google', 'nota no google', { tipo: 'mult', acumula: false }),
    kMkt('avaliacoes', 'Avaliações novas', 'avaliacoes novas'),
    kMkt('mencoes', 'Menções e marcações', 'mencoes')
  ];
  const etica = [
    kMkt('oab', 'Peças revisadas pela regra da OAB', 'pecas revisadas', { tipo: 'pct', acumula: false,
      dica: 'Meta 100%: nenhuma peça publicada sem passar pela revisão de publicidade.' })
  ];

  const grupos = [
    { t: 'Audiência', s: 'Quem chega ao perfil e o que faz depois de chegar.', l: audiencia },
    { t: 'Conteúdo', s: 'Volume, cumprimento do calendário e o que de fato engaja.', l: conteudo },
    { t: 'Social seller', s: 'Só a partir de interação recebida — abordagem fria é captação vedada pelo Provimento 205.', l: seller },
    { t: 'Site e SEO', s: 'O que o site e o Google trazem por conta própria.', l: site },
    { t: 'Geração de demanda e resultado', s: 'O que o marketing entrega em cliente e em honorário, sem passar pela verba.', l: demanda },
    { t: 'Marca e reputação', s: 'Indicação, recompra e o que se diz da banca.', l: marca },
    { t: 'Ética', s: 'Publicidade de advocacia tem regra própria, e ela é um indicador.', l: etica }
  ];
  grupos.forEach(g => g.l.forEach(k => { k.grupo = g.t; k.tela = 'marketing'; }));
  principais.forEach(k => { k.grupo = 'Principais'; k.tela = 'marketing'; });
  return { principais: principais, grupos: grupos };
}

/* ==========================================================================
   AREA 3 - COMERCIAL  (pre-qualificacao + atendimento e fechamento)
   ========================================================================== */
function kpisComercial(c) {
  const B = c.base;
  const metas = metasAtivas();
  const gasto = soma(c.md, r => r.gasto);
  const leadsAds = soma(c.md, r => r.leadsTotal), leadsAdsAnt = soma(c.mdAnt, r => r.leadsTotal);
  const organico = c.vProd(c.prod, 'leads (organico)');
  const crm = c.vProd(c.prod, 'leads (kommo)');

  const krLeads = c.kr('novos leads'), krEleg = c.kr('leads elegiveis'),
        krQual = c.kr('leads qualificados'), krDiag = c.kr('diagnosticos'),
        krReun = c.kr('reunioes realizadas'), krNoShow = c.kr('no show'),
        krCli = c.kr('clientes'), krHon = c.kr('honorarios iniciais'),
        krLig = c.kr('ligacoes');

  const diagnosticos = c.vProd(c.prod, 'diagnosticos');
  const viaveis = c.vProd(c.prod, 'viaveis');

  const esteiraTodos = (DADOS.atend && DADOS.atend.reg) || [];
  /* Recuperacao da esteira e win rate se medem no HISTORICO inteiro: as duas
     pontas precisam do mesmo escopo, e um mes so nao tem negociacao
     suficiente chegando ao D21 para a taxa dizer alguma coisa. */
  const ganhosTodos = esteiraTodos.filter(r => r.grupo === 'ganho');
  const ganhosHist = ganhosTodos.length;
  const perdidosTodos = esteiraTodos.filter(r => r.grupo === 'perdido');
  const cli = c.cli, cliAnt = c.cliAnt;
  const hon = soma(cli, r => r.honIni), honAnt = soma(cliAnt, r => r.honIni);
  const cliAds = porNat(cli, 'ads'), cliOrg = porNat(cli, 'organico');

  /* O KR de um indicador vem com meta e meta proporcional ja calculadas pela
     planilha - uso as duas em vez de rateiar de novo. */
  const doKr = (k, rot, kk, calc, o) => B(Object.assign({
    k: k, rot: rot, valor: kk ? kk.resultado : null,
    meta: kk ? kk.metaMes : null, metaProp: kk ? kk.metaProp : null, acumula: true,
    falta: kk ? null : 'O KR correspondente não foi lido na aba KPIS ' + esc(c.nomeMes) + '.',
    fonte: 'KR da aba KPIS ' + c.nomeMes
  }, o || {}));

  /* ----- PRE-QUALIFICACAO ----- */
  const outras = crm != null ? Math.max(0, crm - leadsAds) : null;
  const prequal = [
    B({ hero: true, k: 'leadsTotal', rot: 'Leads · total (CRM)', valor: krLeads ? krLeads.resultado : null,
        ant: c.krAnt('novos leads'), meta: krLeads ? krLeads.metaMes : null,
        metaProp: krLeads ? krLeads.metaProp : null, acumula: true,
        falta: krLeads ? null : 'KR Novos Leads não lido na aba KPIS ' + esc(c.nomeMes) + '.',
        fonte: 'KR Novos Leads (Meta Ads + Orgânico + Parcerias)' }),
    B({ k: 'leadsAds', rot: 'Leads · Meta Ads (plataforma)', valor: leadsAds, ant: leadsAdsAnt,
        serie: c.serie.map(k => soma(c.serieMd(k), r => r.leadsTotal)),
        fonte: 'Insights diários do Meta Ads',
        dica: 'O Meta conta lead por plataforma e o CRM conta lead criado — os dois números não batem de propósito.' }),
    B({ k: 'leadsOrg', rot: 'Leads · orgânicos', valor: organico,
        nota: (organico != null && crm != null) ? 'De ' + n0(crm) + ' leads que o CRM registrou no mês' : null,
        falta: organico == null ? 'A linha Leads (Orgânico) da aba Produtos Jurídicos não foi lida.' : null,
        fonte: 'Produtos Jurídicos, linha Leads (Orgânico)' }),
    doKr('eleg', 'Leads elegíveis · total', krEleg, null, { hero: true, nota: 'Sem corte por origem na planilha' }),
    B({ k: 'elegAds', rot: 'Elegíveis, qualificados e diagnósticos por origem', falta:
        'A planilha anota essas etapas <b>no total</b>, sem separar pago de orgânico — valendo para elegíveis, qualificados, taxa de qualificação, diagnósticos positivos e taxa de agendamento. O corte existiria com a origem marcada em cada etapa do CRM: é o que a planilha <b>Cérebro Comercial</b> já faz, e ela só abre pelo proxy. Clientes e faturamento, esses sim, têm o corte — a origem fica no registro.' }),
    doKr('qual', 'Leads qualificados · total', krQual, null, { hero: true }),
    B({ k: 'txQual', rot: 'Taxa de qualificação', tipo: 'pct',
        valor: (krQual && krLeads) ? taxa(krQual.resultado, krLeads.resultado) : null,
        meta: (krQual && krLeads) ? taxa(krQual.metaMes, krLeads.metaMes) : null,
        falta: (krQual && krLeads) ? null : 'Depende dos KRs Novos Leads e Leads Qualificados.',
        fonte: 'KR Leads Qualificados ÷ KR Novos Leads' }),
    doKr('diagKr', 'Diagnósticos (cálculos)', krDiag, null,
      { nota: diagnosticos != null ? 'A aba de produto conta ' + n0(diagnosticos) + ' no recorte dela' : null,
        dica: 'O KR é da SDR e cobre todos os produtos; a aba Produtos Jurídicos conta só o produto dela e com outra data de medição.' }),
    B({ k: 'diagPos', rot: 'Diagnósticos positivos', valor: viaveis,
        falta: viaveis == null ? 'A linha <b>Viáveis</b> da aba Produtos Jurídicos não foi lida.' : null,
        fonte: 'Produtos Jurídicos, linha Viáveis',
        dica: 'Diagnóstico positivo é o caso viável: o cálculo fechou com direito a revisar.' }),
    B({ k: 'diagPct', rot: 'Diagnósticos positivos (%)', tipo: 'pct', valor: taxa(viaveis, diagnosticos),
        meta: (c.prod && c.prod.taxasProj && numPct(c.prod.taxasProj['viaveis'])) || null,
        falta: (viaveis != null && diagnosticos != null) ? null : 'Depende das linhas Diagnósticos e Viáveis.',
        fonte: 'Viáveis ÷ Diagnósticos' }),
    B({ k: 'agendamento', rot: 'Taxa de agendamento', tipo: 'pct',
        valor: (krEleg && krEleg.resultado) ? taxa(c.marc.length, krEleg.resultado) : null,
        falta: krEleg ? null : 'Depende do KR Leads Elegíveis.',
        fonte: 'Reuniões marcadas ÷ leads elegíveis',
        nota: n0(c.marc.length) + ' reuniões marcadas no mês' }),
    doKr('noshow', 'No-show', krNoShow, null, { hero: true, inverso: true,
      nota: c.marc.length ? 'Marcadas no mês: ' + n0(c.marc.length) : null,
      dica: 'Vem do KR da planilha. Deduzir pela diferença entre marcadas e realizadas erra: reunião marcada no fim do mês é atendida no mês seguinte.' }),
    B({ hero: true, k: 'convLeadCliente', rot: 'Lead em cliente', tipo: 'pct',
        valor: krLeads ? taxa(cli.length, krLeads.resultado) : null,
        ant: (c.krAnt('novos leads')) ? taxa(cliAnt.length, c.krAnt('novos leads')) : null,
        /* A meta sai dos proprios KRs - clientes sobre leads, a mesma base do
           realizado. A meta fixa do painel foi escrita contra os leads do
           Meta, que sao quase quatro vezes os do CRM: compararia bases
           diferentes e daria um atingimento inventado. */
        meta: (krCli && krLeads && krLeads.metaMes) ? taxa(krCli.metaMes, krLeads.metaMes) : metas.convLeadCli,
        falta: krLeads ? null : 'Depende do KR Novos Leads da aba KPIS ' + esc(c.nomeMes) + '.',
        fonte: 'Clientes ÷ KR Novos Leads' + ((krCli && krLeads) ? ' · meta = ' + n0(krCli.metaMes) + ' ÷ ' + n0(krLeads.metaMes) : ''),
        dica: 'Conversão de ponta a ponta: de cada 100 leads que o CRM registrou, quantos assinaram no mês.' }),
    B({ k: 'tempoReuniao', rot: 'Entrada do lead até a reunião', tipo: 'dias',
        valor: media(cli, r => (r.primeiro && r.dReuniao) ? diasEntre(r.primeiro, r.dReuniao) : null),
        fonte: 'Planilha de clientes: 1º CONTATO até DATA DA REUNIÃO',
        dica: 'Medido nos clientes fechados — é o único recorte em que a planilha tem as duas datas. Lead que não fechou não entra, então o número é otimista.' })
  ];

  /* ----- ATENDIMENTO E FECHAMENTO ----- */
  /* Fechamento se conta pela DATA DO FECHAMENTO. Pelo mes da reuniao, out/26
     mostrava 3 fechamentos enquanto a planilha de clientes registrava 26 - os
     outros 23 foram reunioes de meses anteriores que fecharam agora. */
  const ganhos = esteiraTodos.filter(r => r.grupo === 'ganho' && r.mesFecha === c.mes);
  /* A perda nao tem data: a coluna "Data da perda" existe e esta vazia nas
     907 linhas. Entao a perda e contada pelo mes da REUNIAO, e isso esta
     dito no cartao - nao da para fingir precisao que o dado nao tem. */
  const perdidos = c.at.filter(r => r.grupo === 'perdido');
  const comProposta = c.reun.filter(r => r.vInicial > 0);
  const porEtapa = ETAPA_FECHA.map(e => ({
    k: e.k, rot: e.rot, cor: e.cor,
    n: ganhos.filter(r => etapaFechamento(r) === e.k).length
  }));
  const totEtapa = soma(porEtapa, x => x.n);

  const fecha = [
    B({ hero: true, k: 'reunioes', rot: 'Reuniões realizadas', valor: c.reun.length, ant: c.reunAnt.length,
        meta: krReun ? krReun.metaMes : metas.reunioes, metaProp: krReun ? krReun.metaProp : null, acumula: true,
        serie: c.serie.map(k => c.serieReun(k).length), fonte: 'Fluxo de Atendimentos (data do atendimento)' }),
    B({ hero: true, k: 'txFecha', rot: 'Taxa de fechamento', tipo: 'pct', valor: taxa(cli.length, c.reun.length),
        /* A planilha tem KR proprio para isto ("Conversao em Vendas"): usar a
           meta fixa do painel ignoraria o numero que o time combinou. */
        ant: taxa(cliAnt.length, c.reunAnt.length),
        meta: (c.kr('conversao em vendas') || {}).metaMes || metas.convReunCli,
        serie: c.serie.map(k => taxa(c.serieCli(k).length, c.serieReun(k).length)),
        fonte: 'Clientes ÷ reuniões realizadas',
        dica: 'Reunião e fechamento podem cair em meses diferentes: no mês em curso a taxa é otimista por construção.' }),
    B({ k: 'tempoFechar', rot: 'Reunião até o fechamento', tipo: 'dias', valor: media(cli, r => r.diasFechar),
        ant: media(cliAnt, r => r.diasFechar), inverso: true,
        serie: c.serie.map(k => media(c.serieCli(k), r => r.diasFechar)),
        fonte: 'Planilha de clientes: DIAS PARA FECHAR' }),
    B({ hero: true, k: 'clientes', rot: 'Clientes · total', valor: cli.length, ant: cliAnt.length,
        meta: krCli ? krCli.metaMes : metas.clientes, metaProp: krCli ? krCli.metaProp : null, acumula: true,
        serie: c.serie.map(k => c.serieCli(k).length), fonte: 'Planilha de clientes',
        nota: krCli && krCli.resp ? 'A meta de ' + n0(krCli.metaMes) + ' é o KR de ' + esc(krCli.resp) : null }),
    B({ k: 'clientesAds', rot: 'Clientes · Meta Ads', valor: cliAds.length,
        ant: porNat(cliAnt, 'ads').length, fonte: 'ORIGEM entre colchetes = campanha' }),
    B({ k: 'clientesOrg', rot: 'Clientes · orgânicos', valor: cliOrg.length,
        ant: porNat(cliAnt, 'organico').length, fonte: 'ORIGEM = Orgânico, Site, Calculadora ou Reunião Fechada' }),
    B({ hero: true, k: 'fat', rot: 'Faturamento · total', tipo: 'moeda', valor: hon, ant: honAnt,
        meta: krHon ? krHon.metaMes : metas.faturamento, metaProp: krHon ? krHon.metaProp : null, acumula: true,
        serie: c.serie.map(k => soma(c.serieCli(k), r => r.honIni)), fonte: 'Honorários iniciais contratados' }),
    B({ k: 'fatAds', rot: 'Faturamento · Meta Ads', tipo: 'moeda', valor: soma(cliAds, r => r.honIni),
        ant: soma(porNat(cliAnt, 'ads'), r => r.honIni), fonte: 'ORIGEM = campanha' }),
    B({ k: 'fatOrg', rot: 'Faturamento · orgânico', tipo: 'moeda', valor: soma(cliOrg, r => r.honIni),
        ant: soma(porNat(cliAnt, 'organico'), r => r.honIni), fonte: 'ORIGEM não paga' }),
    B({ k: 'ticket', rot: 'Ticket médio', tipo: 'moeda', valor: ticketMedio(cli), ant: ticketMedio(cliAnt),
        meta: metas.ticket, serie: c.serie.map(k => ticketMedio(c.serieCli(k))),
        fonte: 'Honorários iniciais de quem teve honorário inicial',
        nota: semTicket(cli) ? n0(semTicket(cli)) + ' fechamento(s) condicionado(s) a liminar ficam fora da média' : null,
        dica: 'Fechamento com honorário condicionado a liminar entra na planilha como R$ 0: é venda, mas não é preço. Deixar esses zeros no divisor achataria o ticket.' }),
    B({ hero: true, k: 'cac', rot: 'CAC (só Meta Ads)', tipo: 'moeda', inverso: true,
        valor: cliAds.length ? gasto / cliAds.length : null, meta: metas.cac,
        fonte: 'Investimento ÷ clientes de campanha',
        dica: 'Como pedido: só os leads do Meta Ads no cálculo. O CAC do escritório inteiro está em Financeiro e CAC.' })
  ];

  /* ----- ESPECIALISTA: resultado ----- */
  const fin = DADOS.fin;
  const recebido = fin && fin.honorarios ? fin.honorarios.meses[c.mes] : null;
  const abertos = esteiraTodos.filter(r => r.emAberto);
  const resultado = [
    B({ k: 'recebido', rot: 'Honorários recebidos (caixa)', tipo: 'moeda', valor: recebido,
        falta: recebido == null ? 'Depende da linha HONORÁRIOS INICIAIS da DRE para ' + esc(c.rotMes) + '.' : null,
        fonte: 'DRE COMERCIAL (regime de caixa)',
        nota: recebido != null && hon ? 'Contratado no mês: ' + brl0(hon) + ' (competência)' : null,
        dica: 'A DRE é de caixa e a planilha de clientes é de competência. Os dois números não batem de propósito.' }),
    B({ k: 'projecao', rot: 'Projeção de fechamento do mês', tipo: 'moeda',
        valor: c.emCurso && c.fracao ? hon / c.fracao : hon, meta: krHon ? krHon.metaMes : metas.faturamento,
        fonte: 'Ritmo de hoje projetado até o fim do mês' }),
    B({ k: 'pjpf', rot: 'Perfil PJ × PF', falta:
        'Depende do CPF/CNPJ, que não trafega para o painel. Com o proxy publicado o servidor conta os dígitos e devolve só PJ ou PF.' })
  ];

  /* ----- ESPECIALISTA: pre-venda (SDR) ----- */
  const triagem = c.vProd(c.prod, 'responderam a triagem');
  const remarcar = esteiraTodos.filter(r => /remarcar/i.test(r.etapa)).length;
  const preVenda = [
    B({ k: 'primeiraResposta', rot: 'Tempo de 1ª resposta', falta:
        'Nenhuma planilha guarda a hora da chegada do lead e a hora da primeira resposta. Precisa das duas marcas de tempo no CRM.' }),
    doKr('ligacoes', 'Ligações', krLig, null, { fonte: 'KR Ligações da aba KPIS ' + c.nomeMes }),
    B({ k: 'contatoEfetivo', rot: 'Contato efetivo', tipo: 'pct', valor: taxa(triagem, crm),
        falta: (triagem != null && crm) ? null : 'Depende das linhas Leads (Kommo) e Responderam a Triagem.',
        fonte: 'Responderam a triagem ÷ leads do CRM' }),
    B({ k: 'remarcacoes', rot: 'Negociações para remarcar', valor: remarcar,
        fonte: 'Etapa do Funil = Remarcar Reunião' }),
    B({ k: 'leadsCrm', rot: 'Leads registrados no CRM', falta:
        'Para medir os 100% seria preciso comparar o CRM com uma fonte de entrada independente. A planilha Kommo só abre pelo proxy.' }),
    B({ k: 'tentativas', rot: 'Tentativas por lead antes de desistir', falta:
        'A esteira conta follow up de negociação, não tentativa de contato na pré-venda.' })
  ];

  /* ----- ESPECIALISTA: reuniao e fechamento (closer) ----- */
  const ganhos24h = ganhos.filter(r => etapaFechamento(r) === '24h').length;
  const piso = cli.filter(r => r.honIni > 0 && r.honIni <= 997).length;
  const comValor = cli.filter(r => r.honIni > 0).length;
  const semProximo = abertos.filter(r => !r.proxAcao && !r.proximoFup).length;
  const triagemAnot = c.reun.filter(r => r.resultado || r.historico).length;
  /* Estas tres colunas existem na planilha e ainda nao sao preenchidas. O
     painel mede a COBERTURA em vez de declarar lacuna de fora: o numero diz
     se o preenchimento comecou, e acende sozinho quando comecar. */
  const comDesfecho = c.reun.filter(r => r.desfecho).length;
  const comDesconto = esteiraTodos.filter(r => r.desconto > 0);
  const comFormalizacao = esteiraTodos.filter(r => r.dAceite && r.dPagto && r.dPagto >= r.dAceite);
  const closer = [
    B({ k: 'txProposta', rot: 'Taxa de proposta', tipo: 'pct', valor: taxa(comProposta.length, c.reun.length),
        fonte: 'Reuniões com valor de proposta ÷ reuniões realizadas' }),
    B({ k: 'winRate', rot: 'Ganho entre os decididos', tipo: 'pct',
        valor: taxa(ganhosHist, ganhosHist + perdidosTodos.length),
        fonte: 'Ganhos ÷ (ganhos + perdidos), histórico inteiro',
        nota: n0(ganhosHist) + ' ganhos, ' + n0(perdidosTodos.length) + ' perdas e ' +
          n0(esteiraTodos.filter(r => r.grupo === 'semresposta').length) + ' sem resposta, que ficam fora',
        dica: 'Do histórico, não do mês: a coluna Data da perda está vazia, e cruzar ganho do mês com perda sem data daria uma taxa inventada. Exclui quem não respondeu — misturar "sem resposta" com "perdido" afunda a taxa sem dizer nada.' }),
    B({ k: 'fecha24h', rot: 'Fechamento na janela de 24h', tipo: 'pct', valor: taxa(ganhos24h, totEtapa),
        fonte: 'Follow Up 1 (24h) como degrau de fechamento',
        nota: n0(ganhos24h) + ' de ' + n0(totEtapa) + ' fechamentos do mês' }),
    B({ k: 'piso', rot: 'Fechamentos no piso de R$ 997', tipo: 'pct', valor: taxa(piso, comValor), inverso: true,
        fonte: 'Honorário inicial de até R$ 997',
        nota: n0(piso) + ' de ' + n0(comValor) + ' com honorário inicial' }),
    B({ k: 'continuacao', rot: 'Negociações sem próximo passo', tipo: 'pct', valor: taxa(semProximo, abertos.length),
        inverso: true, fonte: 'Em aberto sem próxima ação nem follow up futuro',
        nota: n0(semProximo) + ' de ' + n0(abertos.length) + ' em aberto' }),
    B({ k: 'necessidade', rot: 'Necessidade explícita registrada', tipo: 'pct',
        valor: taxa(triagemAnot, c.reun.length),
        fonte: 'Resultado do Atendimento ou Histórico preenchido',
        dica: 'A planilha não tem campo próprio para a dor nas palavras do cliente. O Resultado do Atendimento é texto livre e é onde isso aparece hoje.' }),
    B({ k: 'desfecho', rot: 'Desfecho da reunião anotado', tipo: 'pct',
        valor: taxa(comDesfecho, c.reun.length), meta: 100,
        fonte: 'Coluna Desfecho da reunião',
        nota: comDesfecho ? null : 'A coluna existe e está vazia nas ' + n0(esteiraTodos.length) + ' linhas da planilha',
        dica: 'Pedido / avanço / continuação / não-venda. A coluna já está criada e o painel já a lê: assim que o time preencher, o indicador acende sozinho.' }),
    B({ k: 'desconto', rot: 'Desconto médio concedido', tipo: 'moeda', inverso: true,
        valor: media(comDesconto, r => r.desconto),
        falta: comDesconto.length ? null : 'A coluna <b>Desconto extra autorizado</b> existe e está vazia nas ' + n0(esteiraTodos.length) + ' linhas. O painel já a lê — falta preencher.',
        fonte: 'Coluna Desconto extra autorizado',
        nota: comDesconto.length ? 'Entre ' + n0(comDesconto.length) + ' negociações com desconto anotado' : null }),
    B({ k: 'formalizacao', rot: 'Do sim ao pagamento', tipo: 'dias', inverso: true,
        valor: media(comFormalizacao, r => diasEntre(r.dAceite, r.dPagto)),
        falta: comFormalizacao.length ? null : 'As colunas <b>Data do aceite</b> e <b>Data do pagamento</b> existem e estão vazias. São elas que medem a formalização.',
        fonte: 'Data do aceite até Data do pagamento' })
  ];

  /* ----- ESPECIALISTA: esteira de follow up ----- */
  const chegaram = n => esteiraTodos.filter(r => r.fups.some(f => f.n === n && f.status)).length;
  /* Fechou NAQUELE degrau, pelo mesmo criterio do grafico de fechamentos por
     etapa - senao a mesma venda cairia em degraus diferentes nos dois
     lugares da tela, e o painel se contradiria. */
  const fecharamNo = degrau => ganhosTodos.filter(r => etapaFechamento(r) === degrau).length;
  const esteira = [
    B({ k: 'abertas', rot: 'Negociações em aberto', valor: abertos.length,
        fonte: 'Etapa do Funil em negociação, não arquivada',
        nota: brl0(soma(abertos, r => r.vInicial)) + ' em proposta' }),
    B({ k: 'paradas', rot: 'Negociações paradas', valor: esteiraTodos.filter(r => r.parado).length, inverso: true,
        fonte: 'Sem toque há mais de 7 dias e sem follow up agendado',
        dica: 'Follow up marcado para o futuro é toque agendado, não negociação parada.' }),
    B({ k: 'comAcao', rot: 'Com próxima ação agendada', tipo: 'pct',
        valor: taxa(abertos.length - semProximo, abertos.length), meta: 100,
        fonte: 'Próxima ação ou follow up futuro preenchido' }),
    B({ k: 'recD21', rot: 'Recuperação no D21 (Buckner)', tipo: 'pct',
        valor: taxa(fecharamNo('buckner'), chegaram(7)),
        fonte: 'Fechados que passaram do FUP 7 ÷ que chegaram ao FUP 7 (histórico inteiro)',
        nota: n0(chegaram(7)) + ' negociações chegaram ao D21' }),
    B({ k: 'recD28', rot: 'Recuperação no D28 (liminar)', tipo: 'pct',
        valor: taxa(fecharamNo('liminar'), chegaram(8)),
        fonte: 'Fechados que passaram do FUP 8 ÷ que chegaram ao FUP 8 (histórico inteiro)' }),
    B({ k: 'ciclo', rot: 'Ciclo de venda', tipo: 'dias', valor: media(cli, r => r.jornada), inverso: true,
        serie: c.serie.map(k => media(c.serieCli(k), r => r.jornada)),
        fonte: 'Planilha de clientes: JORNADA COMPLETA (1º contato até assinatura)' })
  ];

  /* ----- ESPECIALISTA: perdas ----- */
  const perdComMotivo = perdidosTodos.filter(r => r.motivoPerda).length;
  const perdComCat = perdidosTodos.filter(r => r.catPerda).length;
  const perdas = [
    B({ k: 'perdidos', rot: 'Perdas no mês', valor: perdidos.length, inverso: true,
        fonte: 'Etapa do Funil = Lead Perdido, pelo mês da reunião',
        nota: 'A coluna <b>Data da perda</b> está vazia: a perda é datada pela reunião' }),
    B({ k: 'motivoPct', rot: 'Perdas com motivo anotado', tipo: 'pct', valor: taxa(perdComMotivo, perdidosTodos.length),
        meta: 100, fonte: 'Coluna Motivo de Perda do Lead (histórico inteiro)',
        nota: n0(perdComMotivo) + ' de ' + n0(perdidosTodos.length) + ' perdas' }),
    B({ k: 'catPct', rot: 'Perdas com categoria anotada', tipo: 'pct', valor: taxa(perdComCat, perdidosTodos.length),
        meta: 100, fonte: 'Coluna Categoria da perda (histórico inteiro)',
        nota: perdComCat ? null : 'A coluna existe e está vazia em toda a planilha' }),
    B({ k: 'objecoes', rot: 'Objeções mais frequentes', falta:
        'Não há campo de objeção. O motivo de perda é o mais próximo, e ele é anotado no fim, não durante a reunião.' })
  ];

  /* ----- ESPECIALISTA: equipe e economia ----- */
  const custoComercial = fin && fin.comercial ? (fin.comercial.meses[c.mes] || 0) : null;
  /* ultimoFup guarda so o toque mais recente de cada linha: contar por ele
     daria no maximo uma atividade por negociacao. Conto os follow ups
     executados com data no mes, um por um. */
  const fupsNoMes = esteiraTodos.reduce((a, r) => a +
    r.fups.filter(f => f.data && /feito/i.test(f.status) && chaveMes(f.data) === c.mes).length, 0);
  const atividades = c.reun.length + fupsNoMes;
  const equipe = [
    B({ k: 'cacTotal', rot: 'CAC total', tipo: 'moeda', inverso: true,
        valor: (custoComercial && cli.length) ? custoComercial / cli.length : null,
        falta: custoComercial ? null : 'Depende da linha (-) SETOR COMERCIAL da DRE para ' + esc(c.rotMes) + '.',
        fonte: 'Linha (-) SETOR COMERCIAL da DRE ÷ clientes do mês',
        nota: custoComercial ? brl0(custoComercial) + ' de custo comercial no mês' : null,
        dica: 'A linha da DRE JÁ inclui a mídia, além de SDR, closer, liderança, CRM e automações: somar o investimento do Meta por fora dobraria a conta. É o mesmo número que "CAC real" em Financeiro e CAC.' }),
    B({ k: 'atividades', rot: 'Atividades por dia', tipo: 'num', valor: c.dias ? atividades / c.dias : null,
        fonte: 'Reuniões + ' + n0(fupsNoMes) + ' follow ups executados, ÷ dias do mês',
        dica: 'Conta o que a planilha registra: reunião realizada e follow up com data. Mensagem e ligação sem registro não entram.' }),
    B({ k: 'ltvCac', rot: 'LTV ÷ CAC', falta:
        'LTV exigiria o honorário de êxito efetivamente recebido por caso, que só aparece no fim do processo. A planilha guarda o percentual contratado, não o valor realizado.' }),
    B({ k: 'payback', rot: 'Payback do CAC', falta: 'Mesma lacuna do LTV: sem honorário de êxito realizado não há curva de retorno.' })
  ];

  const grupos = [
    { t: 'Resultado', s: 'O que foi contratado, o que entrou em caixa e por quanto se negocia.', l: resultado },
    { t: 'Pré-venda (SDR)', s: 'Da chegada do lead até a reunião marcada.', l: preVenda },
    { t: 'Reunião e fechamento (closer)', s: 'O que acontece dentro da reunião e no caminho até a assinatura.', l: closer },
    { t: 'Esteira de follow up', s: 'A política de 9 toques: o que ela recupera e onde ela para.', l: esteira },
    { t: 'Perdas', s: 'Perda sem motivo anotado é perda que não ensina nada.', l: perdas },
    { t: 'Equipe e economia', s: 'Custo de aquisição com o comercial inteiro dentro.', l: equipe }
  ];
  grupos.forEach(g => g.l.forEach(k => { k.grupo = g.t; k.tela = 'comercial'; }));
  prequal.forEach(k => { k.grupo = 'Pré-qualificação'; k.tela = 'comercial'; });
  fecha.forEach(k => { k.grupo = 'Atendimento e fechamento'; k.tela = 'comercial'; });

  return { prequal: prequal, fecha: fecha, grupos: grupos,
           porEtapa: porEtapa, totEtapa: totEtapa, outras: outras,
           principais: prequal.concat(fecha) };
}

/* ==========================================================================
   TELA - COMERCIAL
   ========================================================================== */
/* ==========================================================================
   INDICADORES DE PRE-QUALIFICACAO
   --------------------------------------------------------------------------
   A metade de cima do funil: do lead que chega ate a reuniao marcada.
   ========================================================================== */
function prequalIndicadores(parcial) {
  const c = ctxAreaMemo();
  const K = kpisArea('comercial');
  const preVenda = (K.grupos.find(g => g.t.indexOf('Pré-venda') === 0) || { l: [] });
  const todos = K.prequal.concat(preVenda.l);

  let h = '';
  if (parcial) h += '<div class="secao-titulo primeiro">Pré-qualificação &middot; principais</div>';
  if (!parcial) h += barraTela(c, true) + resumoArea(todos);
  if (!parcial && c.emCurso) h += aviso('info', 'Cada indicador principal traz o quadro das quatro leituras: o <b>realizado</b>, ' +
    'o quanto ele representa da <b>meta proporcional</b> (com cor), a <b>meta mensal</b> cheia e a ' +
    '<b>projeção</b> do mês pelo ritmo de hoje. No dia ' + n0(c.dias) + ' o certo é ter ' +
    pct(c.fracao * 100, 0) + ' da meta &mdash; é onde a marca da barra de ritmo está.');

  /* Os dois numeros de lead nao sao o mesmo lead, e sem dizer isso o cartao
     de Meta Ads parece maior que o total - o que faria duvidar da tela toda. */
  const leadsPlataforma = soma(c.md, r => r.leadsTotal);
  const krL = c.kr('novos leads');
  if (krL && krL.resultado && leadsPlataforma > krL.resultado) {
    h += aviso('atencao', '<b>Há duas contagens de lead, e elas não são o mesmo lead.</b> ' +
      'O Meta conta <b>' + n0(leadsPlataforma) + '</b> na plataforma (cada formulário, conversa e evento de pixel) ' +
      'e o CRM registrou <b>' + n0(krL.resultado) + '</b> no mês. A diferença costuma ser lead duplicado, ' +
      'evento contado duas vezes ou lead que nunca chegou a virar registro. ' +
      'Os indicadores de custo usam o número do <b>CRM</b> quando ele existe &mdash; é o que virou gente de verdade.');
  }
  h += blocoPrincipais(K.prequal);

  h += '<div class="secao-titulo">Comparativos</div>';
  h += '<div class="grid g-2">';
  h += cartao('Atingimento dos principais', 'Única escala em que indicadores de unidades diferentes dividem o gráfico: percentual da meta de referência. A linha tracejada marca 100%.',
    vizAtingimento(K.prequal, { rotuloW: 236 }));

  h += cartao('Leads do Meta Ads, mês a mês', 'Campanha paga pelos insights do Meta; o orgânico vem da planilha de Metas e só existe no mês corrente e no anterior.',
    (() => {
      const xs = c.serie;
      return vizColunas({ dados: xs.map(k => ({ k: rotuloMesCurto(k), rot: rotuloMes(k),
          v: soma(c.serieMd(k), r => r.leadsTotal) })),
        cor: 'var(--s1)', nome: 'Leads do Meta Ads', rotulos: false }) +
        (c.vProd(c.prod, 'leads (organico)') != null
          ? '<div style="font-size:0.7rem;color:var(--texto-muted);margin-top:0.5rem;line-height:1.5">Orgânico em ' +
            esc(c.rotMes) + ': <b style="color:var(--texto-2)">' + n0(c.vProd(c.prod, 'leads (organico)')) + '</b> leads.</div>' : '');
    })());

  h += cartao('Este mês x mês anterior', 'Mesma unidade nas duas barras: volume de cada etapa até a reunião.',
    vizGrupos({ x: ['Reuniões marcadas', 'Reuniões realizadas'],
      fmt: n0, series: [
        { nome: rotuloMesCurto(c.ant), vals: [c.marcAnt.length, c.reunAnt.length], cor: 'var(--s4)' },
        { nome: rotuloMesCurto(c.mes), vals: [c.marc.length, c.reun.length], cor: 'var(--s1)' }
      ] }) + legenda([{ nome: rotuloMes(c.ant), cor: 'var(--s4)' }, { nome: rotuloMes(c.mes), cor: 'var(--s1)' }]));
  h += '</div>';

  h += '<div class="secao-titulo">Diagnóstico da pré-venda</div>';
  h += '<div style="font-size:0.73rem;color:var(--texto-muted);line-height:1.5;margin:-0.35rem 0 0.9rem;max-width:74ch">' +
    'O detalhe que se consulta quando um principal acende. Indicador com borda tracejada não tem fonte: ' +
    'o pé do cartão diz o que falta para ele existir.</div>';
  h += blocoEsp(preVenda.t || 'Pré-venda (SDR)', preVenda.s, preVenda.l);

  if (!parcial) {
    h += '<div class="secao-titulo">Todos os indicadores da pré-qualificação</div>';
    h += tabelaKpi('kpi-prequal', todos, 'Indicadores da pré-qualificação');
  }
  return h;
}

/* ==========================================================================
   INDICADORES DE NEGOCIACAO E FECHAMENTO
   --------------------------------------------------------------------------
   A metade de baixo: da reuniao realizada ate o honorario assinado - e o
   custo do que foi preciso para chegar la.
   ========================================================================== */
function fechamentoIndicadores(parcial) {
  const c = ctxAreaMemo();
  const K = kpisArea('comercial');
  const grupos = K.grupos.filter(g => g.t.indexOf('Pré-venda') !== 0);
  const todos = K.fecha.concat(grupos.reduce((a, g) => a.concat(g.l), []));

  let h = '';
  if (!parcial) h += barraTela(c, true) + resumoArea(todos);
  h += '<div class="secao-titulo' + (parcial ? '' : ' primeiro') + '">Atendimento e fechamento &middot; principais</div>';
  h += blocoPrincipais(K.fecha);

  h += '<div class="secao-titulo">Comparativos</div>';
  h += '<div class="grid g-2">';
  h += cartao('Atingimento dos principais', 'Única escala em que indicadores de unidades diferentes dividem o gráfico: percentual da meta de referência. A linha tracejada marca 100%.',
    vizAtingimento(K.fecha, { rotuloW: 236 }));

  h += cartao('Reuniões realizadas x clientes fechados', 'Mesma escala (contagem), por isso dividem o gráfico. A distância entre as linhas é o que a reunião não converteu.',
    (() => {
      const rr = evolucao((DADOS.atend && DADOS.atend.reg || []).filter(x => x.dAtend), x => x.dAtend);
      const cl = evolucao((DADOS.clientes && DADOS.clientes.reg || []), x => x.dFecha);
      return vizLinhas({ x: rr.map(x => x.k), fmt: n0, series: [
        { nome: 'Reuniões', vals: rr.map(x => x.v), cor: 'var(--s1)' },
        { nome: 'Clientes', vals: cl.map(x => x.v), cor: 'var(--s3)' }
      ] }) + legenda([{ nome: 'Reuniões', cor: 'var(--s1)' }, { nome: 'Clientes', cor: 'var(--s3)' }]);
    })());

  h += cartao('Reunião e fechamento · este mês x anterior', 'Mesma unidade nas duas barras.',
    vizGrupos({ x: ['Reuniões realizadas', 'Clientes'],
      fmt: n0, series: [
        { nome: rotuloMesCurto(c.ant), vals: [c.reunAnt.length, c.cliAnt.length], cor: 'var(--s4)' },
        { nome: rotuloMesCurto(c.mes), vals: [c.reun.length, c.cli.length], cor: 'var(--s1)' }
      ] }) + legenda([{ nome: rotuloMes(c.ant), cor: 'var(--s4)' }, { nome: rotuloMes(c.mes), cor: 'var(--s1)' }]));

  /* A barra conta CLIENTES, nao honorario: fechamento condicionado a liminar
     entra como R$ 0, e uma barra de zero esconderia que o canal trouxe
     cliente. O honorario e o ticket vao no balao. */
  h += cartao('Clientes por natureza da origem', 'O único corte pago x não pago que existe em nível de registro. Honorário e ticket no balão &mdash; a barra conta cliente, porque fechamento em liminar entra como R$ 0.',
    (() => {
      const d = NATS.map(nat => ({ nat: nat, itens: porNat(c.cli, nat) })).filter(x => x.itens.length);

/* ==========================================================================
   METAS  -  configurar todas, com a media realizada ao lado
   --------------------------------------------------------------------------
   Meta sem referencia e chute. Ao lado de cada campo vai a MEDIA REALIZADA
   dos ultimos meses fechados: nao para virar meta - media nao e meta -, mas
   para a conversa comecar do que a operacao de fato entrega.

   O mes corrente fica FORA da media de proposito: ele esta pela metade, e
   incluir um mes parcial puxaria toda referencia para baixo.
   ========================================================================== */
const MESES_REFERENCIA = 6;

/* Realizado de um indicador num mes fechado. As contas sao as mesmas dos
   cartoes - se divergirem, a referencia mente. */
function realizadoNoMes(chave, mes) {
  const cli = (DADOS.clientes && DADOS.clientes.reg || []).filter(r => r.mes === mes);
  const md  = (DADOS.metaDia && DADOS.metaDia.reg || []).filter(r => r.mes === mes);
  const reun = (DADOS.atend && DADOS.atend.reg || []).filter(r => r.dAtend && chaveMes(r.dAtend) === mes);
  const leads = soma(md, r => r.leadsTotal);
  const invest = soma(md, r => r.gasto);
  const fat = soma(cli, r => r.honIni);
  const nomeMes = MESES_ACENTO[+mes.slice(5, 7) - 1];
  const krDe = txt => {
    const m = DADOS.metas && DADOS.metas.meses && DADOS.metas.meses[nomeMes];
    if (!m || m.erro || !m.krs) return null;
    const k = chaveBusca(txt).replace(/[^a-z0-9]+/g, ' ').trim();
    const x = m.krs.find(y => chaveBusca(y.kr).replace(/[^a-z0-9]+/g, ' ').trim().indexOf(k) >= 0);
    return x ? x.resultado : null;
  };
  switch (chave) {
    case 'leadsAds':     return leads || null;
    case 'leadsAbord':   return krDe('novos leads');
    case 'leadsQual':    return krDe('leads qualificados');
    case 'reunioes':     return reun.length || null;
    case 'clientes':     return cli.length || null;
    case 'faturamento':  return fat || null;
    case 'ticket':       return ticketMedio(cli);
    case 'investimento': return invest || null;
    case 'cac':          return cli.length ? invest / cli.length : null;
    case 'convReunCli':  return taxa(cli.length, reun.length);
    case 'convLeadReun': return taxa(reun.length, leads);
    case 'convLeadCli':  return taxa(cli.length, leads);
    case 'roi':          return invest ? fat / invest : null;
    default:             return null;
  }
}

/* Media dos ultimos meses FECHADOS em que houve movimento. */
function referenciaDaMeta(chave) {
  const vals = [];
  for (let i = 1; i <= MESES_REFERENCIA; i++) {
    const v = realizadoNoMes(chave, mesMais(MES_ATUAL, -i));
    if (v != null && isFinite(v)) vals.push(v);
  }
  if (!vals.length) return null;
  return { media: vals.reduce((a, b) => a + b, 0) / vals.length,
           n: vals.length,
           melhor: Math.max.apply(null, vals),
           pior: Math.min.apply(null, vals) };
}

/* Salvar, restaurar e usar a media - a memoria das areas cai junto, senao a
   tela continuaria mostrando o atingimento calculado com a meta antiga. */
document.addEventListener('click', ev => {
  const usar = ev.target.closest('[data-usar-media]');
  if (usar) {
    const campo = document.querySelector('[data-meta="' + usar.dataset.usarMedia + '"]');
    if (campo) {
      const d = METAS_PADRAO[usar.dataset.usarMedia];
      const v = Number(usar.dataset.valor);
      campo.value = d.tipo === 'num' || d.tipo === 'moeda' ? Math.round(v) : Math.round(v * 100) / 100;
      campo.focus();
    }
    return;
  }
  if (ev.target.closest('[data-metas-salvar]')) {
    const novas = {};
    document.querySelectorAll('[data-meta]').forEach(c => {
      const v = Number(c.value);
      if (c.value !== '' && isFinite(v) && v >= 0) novas[c.dataset.meta] = v;
    });
    try { localStorage.setItem(K_METAS, JSON.stringify(novas)); } catch (e) {}
    GERACAO++;
    redesenhar();
    return;
  }
  if (ev.target.closest('[data-metas-padrao]')) {
    try { localStorage.removeItem(K_METAS); } catch (e) {}
    GERACAO++;
    redesenhar();
  }
});

function opcoesDe(campo, fontes) {
  const m = new Map();
  (fontes || []).forEach(lista => (lista || []).forEach(r => {
    const v = r[campo];
    if (!v) return;
    m.set(v, (m.get(v) || 0) + 1);
  }));
  return Array.from(m.entries()).sort((a, b) => b[1] - a[1]).map(([k, n]) => ({ k: k, n: n }));
}

function ligarFiltros() {
  const f = document.getElementById('filtros');

  f.addEventListener('change', ev => {
    const t = ev.target;
    if (t.id === 'fPeriodo') { F.periodo = t.value; redesenhar(); return; }
    if (t.dataset.dimv) {
      const s = F[t.dataset.dimv];
      if (t.checked) s.add(t.value); else s.delete(t.value);
      atualizarBotaoDim(t.dataset.dimv);
      redesenhar();
    }
  });

  f.addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.abre) {
      const lista = f.querySelector('[data-lista="' + b.dataset.abre + '"]');
      const jaAberta = !lista.classList.contains('oculto');
      f.querySelectorAll('.chip-lista').forEach(x => x.classList.add('oculto'));
      lista.classList.toggle('oculto', jaAberta);
      ev.stopPropagation();
      return;
    }
    if (b.dataset.todos || b.dataset.nenhum) {
      const dim = b.dataset.todos || b.dataset.nenhum;
      const marcar = !!b.dataset.todos;
      F[dim].clear();
      f.querySelectorAll('[data-dimv="' + dim + '"]').forEach(c => {
        c.checked = marcar;
        if (marcar) F[dim].add(c.value);
      });
      atualizarBotaoDim(dim);
      redesenhar();
      return;
    }
    if (b.id === 'btnLimpar') {
      F.periodo = 'mes'; F.busca = '';
      DIMS.forEach(d => F[d.k].clear());
      montarFiltros(); redesenhar();
    }
  });

  let deb;
  f.addEventListener('input', ev => {
    if (ev.target.id !== 'fBusca') return;
    clearTimeout(deb);
    deb = setTimeout(() => { F.busca = ev.target.value.trim(); redesenhar(); }, 220);
  });

  document.addEventListener('click', ev => {
    if (!ev.target.closest('.chip-multi')) f.querySelectorAll('.chip-lista').forEach(x => x.classList.add('oculto'));
  });
}

function atualizarBotaoDim(dim) {
  const b = document.querySelector('[data-abre="' + dim + '"]');
  if (!b) return;
  const s = F[dim];
  b.innerHTML = '<span>' + (s.size ? n0(s.size) + ' selecionado(s)' : 'Todos') + '</span>' +
    (s.size ? '<span class="cnt">' + n0(s.size) + '</span>' : '<span style="opacity:.5">&#9662;</span>');
}

/* ==========================================================================
   DICA (camada de hover) - um balao para todos os graficos e selos
   ========================================================================== */
(function () {
  const d = document.getElementById('dica');
  let alvo = null;
  document.addEventListener('mousemove', ev => {
    const el = ev.target.closest ? ev.target.closest('[data-tip]') : null;
    if (!el) { if (alvo) { alvo = null; d.classList.remove('vis'); } return; }
    if (el !== alvo) { alvo = el; d.innerHTML = el.getAttribute('data-tip'); d.classList.add('vis'); }
    const m = 14;
    let x = ev.clientX + m, y = ev.clientY + m;
    const r = d.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - m;
    if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - m;
    d.style.left = Math.max(8, x) + 'px';
    d.style.top = Math.max(8, y) + 'px';
  }, { passive: true });
  document.addEventListener('mouseleave', () => d.classList.remove('vis'));
  /* No toque, o balao atrapalha mais do que ajuda. */
  document.addEventListener('touchstart', () => d.classList.remove('vis'), { passive: true });
})();

document.addEventListener('click', ev => {
  const th = ev.target.closest('th[data-col]');
  if (th) {

  const csv = ev.target.closest('[data-csv]');
  if (csv) { exportarCSV(csv.dataset.csv); return; }

    if (t) { t.limite += t.passo; repintarTabela(mais.dataset.mais); }
    return;
  }
  const ir = ev.target.closest('[data-ir]');
  if (ir) {

    /* "tela:aba" leva para a tela JA na aba certa - senao o atalho deixava a

    const [tela, aba] = ir.dataset.ir.split(':');
    if (aba && F.aba[tela] !== undefined) F.aba[tela] = aba;
    irPara(tela, !!aba);

});

/* ==========================================================================
   EXPORTAR CSV - leva o recorte inteiro, na ordem da tela
   ========================================================================== */
function exportarCSV(qual) {
  const id = qual || TABELA_ATIVA;
  const t = id && TABELAS[id];
  if (!t) return;
  const d = linhasOrdenadas(id);
  const tiraTag = s => String(s).replace(/<[^>]*>/g, '').replace(/&mdash;/g, '').replace(/&nbsp;/g, ' ')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").trim();
  const campo = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';

  const linhas = [t.cols.map(c => campo(c.rot)).join(';')];
  d.forEach(r => linhas.push(t.cols.map(c => {
    const v = typeof c.v === 'function' ? c.v(r) : r[c.k];
    if (v instanceof Date) return campo(v.toLocaleDateString('pt-BR'));
    if (typeof v === 'number') return campo(String(v).replace('.', ','));
    if (typeof v === 'boolean') return campo(v ? 'Sim' : 'Nao');
    if (v == null || v === '') return campo(tiraTag(celula(r, c)));
    return campo(v);
  }).join(';')));

  /* BOM para o Excel em pt-BR abrir com acento certo. */
  const blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bm-' + id + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ==========================================================================
   SEGURANCA DA SESSAO
   --------------------------------------------------------------------------
   O que este bloco garante de verdade:
     . a pagina so mostra numero depois de abrir o cofre com login + senha;
     . a sessao vive na ABA (sessionStorage), morre ao fechar e expira sozinha
       depois de 30 minutos sem uso;
     . a SENHA nunca e guardada - o que fica na aba e o conteudo ja decifrado,
       para o F5 nao exigir login de novo;
     . tentativa errada custa tempo (PBKDF2 de 310 mil iteracoes ja e lento) e
       o contador trava por 30s depois de 5 erros;
     . a pagina se recusa a rodar dentro de iframe de terceiro.
   O que ele NAO garante: privacidade dos dados na origem. As planilhas lidas
   estao compartilhadas por link no Google - quem tiver o ID de uma delas le
   direto, sem passar por aqui. Ver a nota em "Fontes e dados".
   ========================================================================== */
const INATIVIDADE_MIN = 30;
let tmrInatividade = null;

function marcarAtividade() {
  clearTimeout(tmrInatividade);
  tmrInatividade = setTimeout(() => sair('Sessao encerrada por inatividade.'), INATIVIDADE_MIN * 60000);
}

function sair(msg) {
  try {
    sessionStorage.removeItem(K_AUTH);
    sessionStorage.removeItem(K_CRED);
    sessionStorage.removeItem(K_TOKEN);
  } catch (e) {}
  CONFIG.SHEETS = null; CONFIG.perfil = null;
  TOKEN = null; PROXY_DADOS = null; PROXY_ERROS = {}; TRANSPORTE = 'gviz';
  Object.keys(DADOS).forEach(k => delete DADOS[k]);
  clearTimeout(tmrInatividade);
  if (msg) {
    const el = document.getElementById('loginErro');
    el.textContent = msg; el.classList.remove('oculto');
  }
  document.getElementById('app').classList.add('oculto');
  document.getElementById('loginOverlay').classList.remove('oculto');
  document.getElementById('campoSenha').value = '';
}

function entrar(segredo, doCache) {
  CONFIG.SHEETS = segredo.SHEETS;
  CONFIG.perfil = segredo.perfil || 'Gestor Comercial';
  CONFIG.PROXY = proxySalvo();
  if (!doCache) {
    /* Guarda o conteudo ja decifrado e a credencial derivada - nunca a senha.
       sessionStorage e por aba: fechou a aba, acabou. */
    try {
      sessionStorage.setItem(K_AUTH, '1');
      sessionStorage.setItem(K_CRED, JSON.stringify(segredo));
      if (TOKEN) sessionStorage.setItem(K_TOKEN, TOKEN);
    } catch (e) {}
  }
  document.getElementById('loginOverlay').classList.add('oculto');
  document.getElementById('app').classList.remove('oculto');
  marcarAtividade();
  montarNav();
  iniciar();
}

let erros = 0, travadoAte = 0;

document.getElementById('loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('btnEntrar');
  const erroEl = document.getElementById('loginErro');
  const usuario = document.getElementById('campoUsuario').value;
  const senha = document.getElementById('campoSenha').value;

  if (Date.now() < travadoAte) {
    erroEl.textContent = 'Muitas tentativas. Aguarde ' + Math.ceil((travadoAte - Date.now()) / 1000) + 's.';
    erroEl.classList.remove('oculto');
    return;
  }
  btn.disabled = true; btn.textContent = 'Verificando…';
  erroEl.classList.add('oculto');
  try {
    /* O cofre prova a senha neste navegador; o token e o que o proxy
       confere no servidor. Os dois saem da mesma senha, em paralelo. */
    const [segredo, tok] = await Promise.all([
      abrirCofre(usuario, senha),
      derivarToken(usuario, senha).catch(() => null)
    ]);
    TOKEN = tok;
    erros = 0;
    document.getElementById('campoSenha').value = '';
    entrar(segredo);
  } catch (e) {
    erros++;
    if (erros >= 5) { travadoAte = Date.now() + 30000; erros = 0; }
    await new Promise(r => setTimeout(r, 400));
    erroEl.textContent = e.message || 'Login ou senha invalidos.';
    erroEl.classList.remove('oculto');
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});

document.getElementById('btnSair').addEventListener('click', () => sair(null));
['click', 'keydown', 'wheel', 'touchstart'].forEach(e =>
  document.addEventListener(e, () => { if (CONFIG.SHEETS) marcarAtividade(); }, { passive: true }));

/* ==========================================================================
   CARGA E ATUALIZACAO
   ========================================================================== */
let carregando = false;

async function iniciar(recarregar) {
  if (carregando) return;
  carregando = true;
  const btn = document.getElementById('btnAtualizar');
  btn.disabled = true;
  const alvo = document.getElementById('carregando');
  if (!recarregar) { alvo.classList.remove('oculto'); }

  try {
    await carregarTudo();
    alvo.classList.add('oculto');
    montarFiltros();
    irPara(TELA_ATIVA, true);
    const quantas = FONTES.length - Object.keys(ERROS).length;
    document.getElementById('rodapeAtualizado').innerHTML =
      'Leitura de ' + ULTIMA_LEITURA.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) +
      '<br>' + quantas + ' de ' + FONTES.length + ' fontes lidas' +
      (Object.keys(ERROS).length ? ' &middot; <a href="#" data-ir="fontes" style="color:var(--atencao)">ver falhas</a>' : '');
  } catch (e) {
    alvo.innerHTML = aviso('critico', '<b>Nao consegui ler as planilhas:</b> ' + esc(e.message));
    alvo.classList.remove('oculto');
  } finally {
    carregando = false;
    btn.disabled = false;
  }
}

document.getElementById('btnAtualizar').addEventListener('click', () => iniciar(true));
document.getElementById('btnFiltros').addEventListener('click', () => {
  const el = document.getElementById('filtros');
  el.classList.toggle('aberto');
  const n = DIMS.reduce((a, d) => a + F[d.k].size, 0) + (F.busca ? 1 : 0);
  document.getElementById('btnFiltros').classList.toggle('primario', !el.classList.contains('aberto') && n > 0);
});
document.getElementById('btnMenu').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('aberta');
  document.getElementById('sidebarOverlay').classList.add('vis');
});
document.getElementById('sidebarOverlay').addEventListener('click', fecharSidebar);

/* Mes inspecionado e metas da tela de KPIs. */
document.addEventListener('change', ev => {
  if (ev.target.dataset && ev.target.dataset.selmes !== undefined) { F.mesKpi = ev.target.value; redesenhar(); }
});
/* Configurar metas abre a TELA de metas. Antes eram treze prompt() em
   fila: para mudar a ultima era preciso passar por todas as outras, e
   cancelar no meio perdia tudo. */
document.addEventListener('click', ev => {
  if (ev.target.closest('[data-metas]')) irPara('metasconfig');
});

/* Endereco do proxy: fica no navegador, nao no codigo. */
document.addEventListener('click', ev => {
  if (ev.target.closest('#btnUsarProxy')) {
    const url = (document.getElementById('campoProxy').value || '').trim();
    if (url && !/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)) {
      alert('O endereco deve ser o do app da Web do Apps Script e terminar em /exec.');
      return;
    }
    salvarProxy(url);
    iniciar(true);
    return;
  }
  if (ev.target.closest('#btnTirarProxy')) {
    salvarProxy(null);
    iniciar(true);
  }
});
document.getElementById('nav').addEventListener('click', ev => {
  const b = ev.target.closest('[data-tela]');
  if (b) irPara(b.dataset.tela);
});

/* Releitura automatica enquanto a aba esta a vista. */
setInterval(() => {
  if (CONFIG.SHEETS && document.visibilityState === 'visible' && !carregando) iniciar(true);
}, CONFIG.AUTO_MIN * 60000);

ligarFiltros();

/* Sessao da aba: volta sem pedir senha de novo, sem nunca ter guardado a senha. */
(async function () {
  CONFIG.PROXY = proxySalvo();
  let cred = null;
  try {
    if (sessionStorage.getItem(K_AUTH) === '1') {
      cred = JSON.parse(sessionStorage.getItem(K_CRED) || 'null');
      TOKEN = sessionStorage.getItem(K_TOKEN) || null;
    }
  } catch (e) {}
  if (cred && cred.SHEETS) { entrar(cred, true); return; }
  document.getElementById('campoUsuario').focus();
})();
</script>
