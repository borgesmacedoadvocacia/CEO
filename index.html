  const noRec = k => { const fx = faixa(); const d = new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, 15); return d >= fx.de && d <= fx.ate; };
  const meses = f.meses.filter(noRec);
  if (!meses.length) return aviso('info', 'Nenhum mes da DRE COMERCIAL cai no periodo selecionado. Amplie o periodo no filtro acima.');

  const somaMes = (linha, ks) => (ks || meses).reduce((a, k) => a + ((linha && linha.meses[k]) || 0), 0);
  const nClientes = ks => cli.filter(r => (ks || meses).indexOf(r.mes) >= 0).length;
  const honComp   = ks => soma(cli.filter(r => (ks || meses).indexOf(r.mes) >= 0), r => r.honIni);
  const nReunioes = ks => at.filter(r => r.dAtend && (ks || meses).indexOf(r.mes) >= 0).length;
  const nLeads    = ks => soma(md.filter(r => (ks || meses).indexOf(r.mes) >= 0), r => r.leadsTotal);

  const custoCom = somaMes(f.comercial);
  const custoMidia = soma(f.itens.filter(i => i.bucket === 'midia'), i => somaMes(i));
  const custoPessoas = soma(f.itens.filter(i => i.bucket === 'pessoas'), i => somaMes(i));
  const custoFerr = soma(f.itens.filter(i => i.bucket === 'ferramentas'), i => somaMes(i));
  const receita = somaMes(f.receita);
  const lucro = somaMes(f.lucro);
  const rateio = somaMes(f.rateio);
  const impostos = somaMes(f.impostos);
  const bancarias = somaMes(f.bancarias);
  const clientes = nClientes();
  const cacReal = clientes ? custoCom / clientes : null;
  const cacMidia = clientes ? custoMidia / clientes : null;
  const tk = ticketMedio(cli.filter(r => meses.indexOf(r.mes) >= 0));

  let h = '';
  h += '<div class="secao-titulo primeiro">Financeiro do comercial &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += aviso('info', 'Fonte: aba <b>DRE COMERCIAL</b> do FLUXO FINANCEIRO ' + f.ano + '. ' +
    'A DRE e por <b>regime de caixa</b> (o que entrou e saiu no mes) e a planilha de clientes e por ' +
    '<b>competencia</b> (contrato assinado no mes) &mdash; os dois numeros de receita nao batem de proposito. ' +
    'O painel mostra os dois e a diferenca, em vez de escolher um.');

  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Receita (caixa)', valor: brl0(receita), pequeno: true,
    nota: 'Honorarios iniciais recebidos na DRE' });
  h += kpi({ rotulo: 'Custo do setor comercial', valor: brl0(custoCom), pequeno: true,
    nota: 'Pessoas + midia + ferramentas' });
  h += kpi({ rotulo: 'Lucro liquido do comercial', valor: brl0(lucro), pequeno: true,
    selo: selo(lucro > 0 ? 'ok' : lucro === 0 ? 'neutro' : 'critico', lucro > 0 ? 'positivo' : 'no vermelho'),
    nota: 'Ja descontados rateio, impostos e taxas' });
  h += kpi({ rotulo: 'Margem liquida', valor: pctOuTraco(taxa(lucro, receita), 1),
    dica: 'Lucro liquido do setor sobre a receita de caixa do setor.' });
  h += kpi({ rotulo: 'CAC real', valor: cacReal == null ? '&mdash;' : brl0(cacReal), pequeno: true,
    dica: 'Custo do setor comercial inteiro dividido pelos clientes fechados no mesmo periodo. Inclui SDR, closer, lider, estagiarios, CRM, automacoes e midia.',
    nota: n0(clientes) + ' clientes no periodo' });
  h += kpi({ rotulo: 'CAC de midia', valor: cacMidia == null ? '&mdash;' : brl0(cacMidia), pequeno: true,
    nota: cacReal && cacMidia ? 'Midia e ' + pct(taxa(custoMidia, custoCom), 0) + ' do custo comercial' : '' });
  h += kpi({ rotulo: 'Ticket medio', valor: tk == null ? '&mdash;' : brl0(tk), pequeno: true,
    nota: 'So quem teve honorario inicial' });
  h += kpi({ rotulo: 'Margem por cliente', valor: (tk != null && cacReal != null) ? brl0(tk - cacReal) : '&mdash;', pequeno: true,
    selo: (tk != null && cacReal != null) ? selo(tk - cacReal > 0 ? 'ok' : 'critico',
      tk - cacReal > 0 ? 'ticket cobre o CAC' : 'CAC acima do ticket') : null,
    dica: 'Ticket medio menos CAC real. Nao inclui honorario de exito, que entra depois e muda esta conta.' });
  h += kpi({ rotulo: 'Retorno sobre o custo', valor: custoCom ? n1(receita / custoCom) + 'x' : '&mdash;', pequeno: true,
    selo: custoCom ? selo(receita / custoCom >= 2 ? 'ok' : receita / custoCom >= 1 ? 'atencao' : 'critico',
      receita / custoCom >= 2 ? 'saudavel' : receita / custoCom >= 1 ? 'no limite' : 'queima caixa') : null,
    dica: 'Receita de caixa dividida pelo custo do setor comercial. Diferente do ROI de midia, que olha so o anuncio.' });
  h += '</div>';

  /* ----- Evolucao ----- */
  h += '<div class="secao-titulo">Evolucao mes a mes</div>';
  h += '<div class="grid g-2">';
  const eixo = meses.map(rotuloMesCurto);

  h += cartao('Receita e custo do comercial', 'Mesma unidade (R$), por isso dividem o grafico. A distancia entre as linhas e o lucro.',
    vizLinhas({ x: eixo, fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', series: [
      { nome: 'Receita (caixa)', vals: meses.map(k => somaMes(f.receita, [k])), cor: 'var(--s1)' },
      { nome: 'Custo do comercial', vals: meses.map(k => somaMes(f.comercial, [k])), cor: 'var(--s2)' }
    ] }) + legenda([{ nome: 'Receita (caixa)', cor: 'var(--s1)' }, { nome: 'Custo do comercial', cor: 'var(--s2)' }]));

  /* Lucro: positivo x negativo pede par divergente, nao rampa. */
  h += cartao('Lucro liquido do comercial', 'Barra abaixo de zero e mes em que o setor consumiu caixa.',
    vizColunas({ dados: meses.map(k => {
      const v = somaMes(f.lucro, [k]);
      return { k: rotuloMesCurto(k), rot: rotuloMes(k), v: Math.abs(v),
               cor: v >= 0 ? 'var(--s1)' : 'var(--s8)',
               extra: [{ rot: v >= 0 ? 'Lucro' : 'Prejuizo', val: brl0(v), cor: v >= 0 ? 'var(--s1)' : 'var(--s8)' },
                       { rot: 'Receita', val: brl0(somaMes(f.receita, [k])) },
                       { rot: 'Custo comercial', val: brl0(somaMes(f.comercial, [k])) }] };
    }), fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', nome: 'Resultado', rotulos: false }) +
    legenda([{ nome: 'Mes com lucro', cor: 'var(--s1)' }, { nome: 'Mes com prejuizo', cor: 'var(--s8)' }]));

  h += cartao('CAC real x ticket medio', 'As duas em R$ por cliente: quando o CAC encosta no ticket, cada venda nova para de pagar a operacao.',
    vizLinhas({ x: eixo, fmt: brl0, fmtEixo: v => 'R$' + n0(v), series: [
      { nome: 'CAC real', vals: meses.map(k => { const n = nClientes([k]); return n ? somaMes(f.comercial, [k]) / n : null; }), cor: 'var(--s2)' },
      { nome: 'CAC de midia', vals: meses.map(k => { const n = nClientes([k]); return n ? soma(f.itens.filter(i => i.bucket === 'midia'), i => somaMes(i, [k])) / n : null; }), cor: 'var(--s4)' },
      { nome: 'Ticket medio', vals: meses.map(k => ticketMedio(cli.filter(r => r.mes === k))), cor: 'var(--s3)' }
    ] }) + legenda([{ nome: 'CAC real', cor: 'var(--s2)' }, { nome: 'CAC de midia', cor: 'var(--s4)' }, { nome: 'Ticket medio', cor: 'var(--s3)' }]));

  h += cartao('Estrutura do custo comercial', 'Quanto do custo e gente, quanto e midia e quanto e ferramenta.',
    vizEmpilhado({ x: eixo, fmt: brl0, fmtEixo: v => 'R$' + Math.round(v / 1000) + 'k', series: [
      { nome: 'Pessoas', vals: meses.map(k => soma(f.itens.filter(i => i.bucket === 'pessoas'), i => somaMes(i, [k]))), cor: 'var(--s1)' },
      { nome: 'Midia', vals: meses.map(k => soma(f.itens.filter(i => i.bucket === 'midia'), i => somaMes(i, [k]))), cor: 'var(--s2)' },
      { nome: 'Ferramentas', vals: meses.map(k => soma(f.itens.filter(i => i.bucket === 'ferramentas'), i => somaMes(i, [k]))), cor: 'var(--s3)' }
    ] }) + legenda([
      { nome: 'Pessoas', cor: 'var(--s1)', val: brl0(custoPessoas) },
      { nome: 'Midia', cor: 'var(--s2)', val: brl0(custoMidia) },
      { nome: 'Ferramentas', cor: 'var(--s3)', val: brl0(custoFerr) }]));
  h += '</div>';

  /* ----- Eficiencia por etapa ----- */
  h += '<div class="secao-titulo">Custo por etapa do funil</div>';
  const leads = nLeads(), reun = nReunioes();
  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Custo por lead', valor: leads ? brl(custoCom / leads) : '&mdash;', pequeno: true,
    nota: n0(leads) + ' leads de midia no periodo', dica: 'Custo comercial inteiro por lead, nao so o anuncio. O CPL da tela de trafego usa so a midia.' });
  h += kpi({ rotulo: 'Custo por reuniao', valor: reun ? brl0(custoCom / reun) : '&mdash;', pequeno: true,
    nota: n0(reun) + ' reunioes realizadas' });
  h += kpi({ rotulo: 'Custo por cliente', valor: cacReal == null ? '&mdash;' : brl0(cacReal), pequeno: true,
    nota: n0(clientes) + ' clientes fechados' });
  h += kpi({ rotulo: 'Rateio do processual', valor: brl0(rateio), pequeno: true,
    dica: 'Parte do custo do setor processual, liderancas e despesas extraordinarias atribuida ao comercial na DRE. Nao entra no CAC: e custo de entrega, nao de aquisicao.' });
  h += kpi({ rotulo: 'Impostos', valor: brl0(impostos), pequeno: true });
  h += kpi({ rotulo: 'Taxas bancarias', valor: brl0(bancarias), pequeno: true,
    nota: pctOuTraco(taxa(bancarias, receita), 1) + ' da receita',
    dica: 'Custo de maquininha, link e parcelamento. Sobe junto com a fatia de venda parcelada.' });
  h += '</div>';

  /* ----- Reconciliacao caixa x competencia ----- */
  h += '<div class="secao-titulo">Caixa x competencia &middot; onde os dois numeros divergem</div>';
  const recon = meses.map(k => {
    const caixa = somaMes(f.receita, [k]);
    const comp = honComp([k]);
    return { mes: rotuloMes(k), caixa: caixa, comp: comp, dif: caixa - comp,
             difPct: comp ? ((caixa - comp) / comp) * 100 : null, clientes: nClientes([k]) };
  });
  h += cartao('Receita na DRE x honorarios assinados', 'Diferenca grande e sinal de contrato assinado que ainda nao virou caixa &mdash; ou de lancamento faltando em uma das duas planilhas.',
    tabelaInterativa('fin-recon', [
      { k: 'mes', rot: 'Mes', tipo: 'txt', cls: 'forte' },
      { k: 'clientes', rot: 'Clientes', tipo: 'num' },
      { k: 'comp', rot: 'Assinado (competencia)', tipo: 'moeda0' },
      { k: 'caixa', rot: 'Recebido (caixa)', tipo: 'moeda0' },
      { k: 'dif', rot: 'Diferenca', tipo: 'moeda0',
        html: r => '<span style="color:' + (Math.abs(r.difPct || 0) > 15 ? '#f3c45a' : 'var(--texto-2)') + '">' + brl0(r.dif) + '</span>' },
      { k: 'difPct', rot: '%', tipo: 'num', ord: false,
        html: r => r.difPct == null ? '&mdash;' : delta(r.difPct, { fmt: v => pct(v, 0) }) }
    ], recon, { titulo: 'Caixa x competencia', limite: 24, ativa: false }));

  /* ----- Linhas de custo ----- */
  h += '<div class="secao-titulo">Linhas de custo do setor comercial</div>';
  const itens = f.itens.map(i => {
    const v = somaMes(i);
    return { rotulo: i.rotulo, bucket: i.bucket, valor: v,
             share: taxa(v, custoCom), porCliente: clientes ? v / clientes : null,
             projecao: i.projecao, media: meses.length ? v / meses.length : 0 };
  }).filter(i => i.valor !== 0).sort((a, b) => b.valor - a.valor);
  const maxItem = itens.length ? itens[0].valor : 0;
  const ROT_BUCKET = { pessoas: 'Pessoas', midia: 'Midia', ferramentas: 'Ferramentas', outros: 'Outros' };
  const COR_BUCKET = { pessoas: 'var(--s1)', midia: 'var(--s2)', ferramentas: 'var(--s3)', outros: 'var(--texto-muted)' };
  h += tabelaInterativa('fin-itens', [
    { k: 'rotulo', rot: 'Linha de custo', tipo: 'txt', cls: 'forte wrap' },
    { k: 'bucket', rot: 'Grupo', tipo: 'txt', ord: false,
      html: r => '<span style="color:' + COR_BUCKET[r.bucket] + '">&#9679;</span> ' + esc(ROT_BUCKET[r.bucket] || r.bucket) },
    { k: 'valor', rot: 'Total no periodo', tipo: 'moeda0',
      html: r => barraCelula(r.valor, maxItem, COR_BUCKET[r.bucket], brl0(r.valor)) },
    { k: 'share', rot: '% do custo', tipo: 'pct', casas: 1 },
    { k: 'media', rot: 'Media mensal', tipo: 'moeda0' },
    { k: 'porCliente', rot: 'Por cliente', tipo: 'moeda0' }
  ], itens, { ord: 'valor', dir: -1, titulo: 'Linhas de custo do comercial', limite: 30,
    total: { valor: d => brl0(soma(d, r => r.valor)), porCliente: d => clientes ? brl0(soma(d, r => r.valor) / clientes) : '' } });
  return h;
}

/* ==========================================================================
   TELA - KPIs DO COMERCIAL (ritmo e projecao)
   --------------------------------------------------------------------------
   Porte do painel "KPIs Comercial" da central: mesmo layout, fonte trocada.
   Em vez de ler a planilha antiga, cada realizado vem das fontes vivas.

   A leitura central e de RITMO, com tres numeros que respondem coisas
   diferentes e vivem sendo confundidos:
     . Realizado (MTD)      - o que ja entrou no mes ate hoje
     . Meta proporcional    - o que DEVERIA ter entrado ate hoje
     . Projecao do mes      - onde o mes termina se o ritmo de hoje continuar
   Comparar realizado com meta MENSAL no dia 10 so produz panico; comparar com
   a proporcional e o que diz se esta atrasado de verdade.
   ========================================================================== */
const METAS_PADRAO = {
  leadsAds:    { rot: 'Leads (Meta Ads)',       meta: 1500,  tipo: 'num',   acumula: true },
  leadsAbord:  { rot: 'Leads Abordados',        meta: 900,   tipo: 'num',   acumula: true },
  leadsQual:   { rot: 'Leads Qualificados',     meta: 300,   tipo: 'num',   acumula: true },
  reunioes:    { rot: 'Reunioes Realizadas',    meta: 100,   tipo: 'num',   acumula: true },
  clientes:    { rot: 'Clientes Fechados',      meta: 32,    tipo: 'num',   acumula: true },
  faturamento: { rot: 'Faturamento',            meta: 80000, tipo: 'moeda', acumula: true },
  ticket:      { rot: 'Ticket Medio',           meta: 2500,  tipo: 'moeda', acumula: false },
  investimento:{ rot: 'Investimento (Ads)',     meta: 16000, tipo: 'moeda', acumula: true },
  cac:         { rot: 'CAC',                    meta: 500,   tipo: 'moeda', acumula: false, inverso: true },
  convReunCli: { rot: 'Conv. Reuniao → Cliente', meta: 20, tipo: 'pct', acumula: false },
  convLeadReun:{ rot: 'Conv. Lead → Reuniao',    meta: 12, tipo: 'pct', acumula: false },
  convLeadCli: { rot: 'Conv. Lead → Cliente',    meta: 2.5, tipo: 'pct', acumula: false },
  roi:         { rot: 'ROI',                    meta: 5,     tipo: 'mult',  acumula: false }
};
const K_METAS = 'bm_ceo_metas';

function metasAtivas() {
  const m = {};
  Object.keys(METAS_PADRAO).forEach(k => { m[k] = METAS_PADRAO[k].meta; });
  try {
    const salvo = JSON.parse(localStorage.getItem(K_METAS) || 'null');
    if (salvo) Object.keys(salvo).forEach(k => { if (m[k] != null && isFinite(salvo[k])) m[k] = Number(salvo[k]); });
  } catch (e) {}
  return m;
}

const fmtPorTipo = t => t === 'moeda' ? brl0 : t === 'pct' ? (v => pct(v, v < 10 ? 2 : 1))
  : t === 'mult' ? (v => n1(v) + 'x') : n0;

/* Um bloco de KPI: valor grande + as linhas de ritmo. */
function blocoKpi(c) {
  const f = fmtPorTipo(c.tipo);
  const emCurso = c.emCurso;
  const projecao = c.acumula && c.fracao > 0 ? c.valor / c.fracao : null;
  const metaProp = c.acumula ? c.meta * c.fracao : c.meta;
  const base = c.acumula ? (emCurso ? projecao : c.valor) : c.valor;
  const vsProp = c.inverso
    ? (c.valor > 0 ? taxa(metaProp, c.valor) : null)
    : taxa(c.valor, metaProp);
  const vsMeta = c.inverso
    ? (base > 0 ? taxa(c.meta, base) : null)
    : taxa(base, c.meta);

  let h = '<div class="cartao">';
  h += '<div class="cartao-titulo">' + esc(c.rot) +
    (emCurso ? ' <span class="selo neutro" style="font-weight:600">em curso</span>' : '') + '</div>';
  h += '<div class="kpi-valor" style="margin:0.35rem 0 0.7rem">' + (c.valor == null ? '&mdash;' : f(c.valor)) + '</div>';
  h += '<div style="display:flex;flex-direction:column;gap:0.3rem;font-size:0.73rem">';
  const linha = (rot, val, forte) =>
    '<div style="display:flex;justify-content:space-between;gap:0.8rem;align-items:baseline">' +
    '<span style="color:var(--texto-muted)">' + rot + '</span>' +
    '<span style="font-variant-numeric:tabular-nums;' + (forte ? 'font-weight:700;color:var(--texto)' : 'color:var(--texto-2)') + '">' +
    val + '</span></div>';
  h += linha('Realizado' + (emCurso ? ' (MTD)' : ''), f(c.valor));
  if (projecao != null && emCurso) h += linha('Projecao (mes)', f(projecao));
  if (c.acumula) h += linha('Meta proporcional' + (emCurso ? ' (' + c.dias + 'd)' : ''), f(metaProp));
  h += linha('Meta mensal', f(c.meta));
  h += '</div><div class="ritmo"><div class="ritmo-trilha">';
  const pTrilha = c.inverso
    ? (c.valor > 0 ? Math.min(100, (c.meta / c.valor) * 100) : 0)
    : Math.min(100, taxa(c.valor, c.meta) || 0);
  const nv = nivelMeta(c.acumula ? vsProp : vsMeta);
  const cor = nv === 'ok' ? 'var(--ok)' : nv === 'atencao' ? 'var(--atencao)' : nv === 'grave' ? 'var(--grave)' : 'var(--critico)';
  h += '<div class="ritmo-fill" style="width:' + pTrilha.toFixed(1) + '%;background:' + cor + '"></div>';
  if (c.acumula && emCurso) h += '<div class="ritmo-alvo" style="left:' + (c.fracao * 100).toFixed(1) + '%"></div>';
  h += '</div><div class="ritmo-legenda">';
  h += '<span>' + (c.acumula ? 'vs proporcional ' : 'vs meta ') + pctOuTraco(c.acumula ? vsProp : vsMeta, 1) + '</span>';
  /* O painel original mostrava aqui "projecao vs meta", mas esse numero e
     algebricamente IGUAL ao "vs proporcional" (valor/(meta*f) dos dois lados):
     repetir o mesmo numero sob dois rotulos faz duvidar do resto da tela. No
     lugar entra o que de fato falta e em que ritmo diario, que da para agir. */
  if (c.acumula && emCurso && c.meta > c.valor) {
    const faltam = c.meta - c.valor;
    const diasRest = Math.max(1, c.diasMes - c.dias);
    h += '<span>faltam ' + f(faltam) + ' &middot; ' + f(faltam / diasRest) + '/dia</span>';
  } else if (c.acumula && emCurso) {
    h += '<span style="color:#5fd35f">meta do mes ja batida</span>';
  }
  h += '</div></div></div>';
  return { html: h, noVerde: (c.acumula ? vsProp : vsMeta) >= 100 };
}

function telaKpis() {
  const mes = F.mesKpi || MES_ATUAL;
  const emCurso = mes === MES_ATUAL;
  const metas = metasAtivas();
  const hoje_ = new Date();
  const diasMes = new Date(+mes.slice(0, 4), +mes.slice(5, 7), 0).getDate();
  const dias = emCurso ? hoje_.getDate() : diasMes;
  const fracao = dias / diasMes;

  const cli = (DADOS.clientes ? DADOS.clientes.reg : []).filter(r => r.mes === mes);
  const at  = (DADOS.atend ? DADOS.atend.reg : []).filter(r => r.mes === mes && r.dAtend);
  const md  = (DADOS.metaDia ? DADOS.metaDia.reg : []).filter(r => r.mes === mes);
  const nomeMes = MESES_ACENTO[+mes.slice(5, 7) - 1];
  const kpisMes = DADOS.metas && DADOS.metas.meses && DADOS.metas.meses[nomeMes];
  const krDe = txt => {
    if (!kpisMes || !kpisMes.krs) return null;
    const k = chaveBusca(txt);
    const x = kpisMes.krs.find(y => chaveBusca(y.kr).includes(k));
    return x ? x.resultado : null;
  };

  const leadsAds = soma(md, r => r.leadsTotal);
  const invest = soma(md, r => r.gasto);
  const reunioes = at.length;
  const clientes = cli.length;
  const faturamento = soma(cli, r => r.honIni);
  const tk = ticketMedio(cli);
  const leadsAbord = krDe('novos leads');
  const leadsQual = krDe('leads qualificados');

  let h = '';
  h += '<div class="secao-titulo primeiro">KPIs do comercial &middot; ' + rotuloMes(mes) + '</div>';

  /* Seletor de mes e botao de metas, no lugar do original. */
  const meses12 = [];
  for (let i = 0; i < 12; i++) meses12.push(mesMais(MES_ATUAL, -i));
  h += '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:0.9rem">' +
    '<div class="filtro"><label class="filtro-rotulo">Mes</label><select id="selMesKpi">' +
    meses12.filter(k => k >= '2026-01').map(k =>
      '<option value="' + k + '"' + (k === mes ? ' selected' : '') + '>' + rotuloMes(k) + '</option>').join('') +
    '</select></div>' +
    '<button class="btn-acao" id="btnMetas" type="button">&#9881; Configurar metas</button></div>';

  if (emCurso) {
    h += aviso('info', '<b>Mes em andamento</b> &mdash; dados parciais ate ' + hoje_.toLocaleDateString('pt-BR') +
      ' (' + dias + ' de ' + diasMes + ' dias). A <b>projecao</b> assume que o ritmo de hoje continua ate o fim do mes; ' +
      'a <b>meta proporcional</b> e o quanto deveria estar entregue a esta altura.');
  }

  /* Blocos, na mesma ordem e agrupamento do painel original. */
  const def = (chave, valor) => Object.assign({}, METAS_PADRAO[chave], {
    valor: valor, meta: metas[chave], emCurso: emCurso, dias: dias, diasMes: diasMes, fracao: fracao
  });
  const blocos = {
    'Volume de leads': [
      blocoKpi(def('leadsAds', leadsAds)),
      blocoKpi(def('leadsAbord', leadsAbord)),
      blocoKpi(def('leadsQual', leadsQual))
    ],
    'Resultados comerciais': [
      blocoKpi(def('reunioes', reunioes)),
      blocoKpi(def('clientes', clientes))
    ],
    'Financeiro': [
      blocoKpi(def('faturamento', faturamento)),
      blocoKpi(def('ticket', tk)),
      blocoKpi(def('investimento', invest)),
      blocoKpi(def('cac', clientes ? invest / clientes : null))
    ],
    'Taxas de conversao': [
      blocoKpi(def('convReunCli', taxa(clientes, reunioes))),
      blocoKpi(def('convLeadReun', taxa(reunioes, leadsAds))),
      blocoKpi(def('convLeadCli', taxa(clientes, leadsAds))),
      blocoKpi(def('roi', invest ? faturamento / invest : null))
    ]
  };
  const todos = Object.keys(blocos).reduce((a, k) => a.concat(blocos[k]), []);
  const verdes = todos.filter(b => b.noVerde).length;

  /* Linha de destaque, igual ao original. */
  h += '<div class="grid g-kpi">';
  h += kpi({ rotulo: 'Faturamento', valor: brl0(faturamento), pequeno: true,
    nota: 'Meta: ' + brl0(metas.faturamento), selo: selo(nivelMeta(taxa(faturamento, metas.faturamento * fracao)),
      pctOuTraco(taxa(faturamento, metas.faturamento), 1) + ' da meta') });
  h += kpi({ rotulo: 'Clientes', valor: n0(clientes),
    nota: 'Meta: ' + n0(metas.clientes), selo: selo(nivelMeta(taxa(clientes, metas.clientes * fracao)),
      pctOuTraco(taxa(clientes, metas.clientes), 1) + ' da meta') });
  h += kpi({ rotulo: 'ROI', valor: invest ? n1(faturamento / invest) + 'x' : '&mdash;', pequeno: true,
    nota: 'Meta: ' + n1(metas.roi) + 'x',
    selo: invest ? selo(nivelMeta(taxa(faturamento / invest, metas.roi)), pctOuTraco(taxa(faturamento / invest, metas.roi), 1)) : null });
  h += kpi({ rotulo: 'Investimento', valor: brl0(invest), pequeno: true,
    nota: 'Orcamento: ' + brl0(metas.investimento),
    selo: selo(taxa(invest, metas.investimento) > 100 ? 'critico' : 'neutro',
      pctOuTraco(taxa(invest, metas.investimento), 1) + ' do orcamento') });
  h += kpi({ rotulo: 'KPIs no verde', valor: n0(verdes) + '/' + n0(todos.length),
    nota: emCurso ? 'atingindo a meta proporcional' : 'atingindo a meta do mes',
    selo: selo(nivelMeta(taxa(verdes, todos.length)), pctOuTraco(taxa(verdes, todos.length), 0)) });
  h += '</div>';

  Object.keys(blocos).forEach(secao => {
    h += '<div class="secao-titulo">' + esc(secao) + '</div>';
    h += '<div class="grid g-3">' + blocos[secao].map(b => b.html).join('') + '</div>';
  });

  if (!kpisMes || kpisMes.erro) {
    h += aviso('atencao', 'Leads abordados e qualificados vem da aba <code>KPIS ' + esc(nomeMes) +
      '</code> da planilha de Metas, que nao foi lida neste recorte &mdash; esses dois blocos ficam sem numero.');
  }
  return h;
}

/* ==========================================================================
   TELA 6 - EQUIPE
   ========================================================================== */
function telaEquipe() {
  const at = selAtend(), cli = selClientes();
  let h = '';
  h += '<div class="secao-titulo primeiro">Equipe comercial &middot; ' + esc(rotuloPeriodo()) + '</div>';
  h += aviso('info', 'Closers aparecem pela coluna <b>Closer</b> e SDRs pela coluna <b>SDR</b> das planilhas de atendimento e de clientes. ' +
    'A conversao e do recorte, nao de coorte: um cliente pode ter vindo de reuniao de mes anterior.');

  /* --- Closers --- */
  const closers = Array.from(new Set(at.map(r => r.closer).concat(cli.map(r => r.closer)))).filter(x => x && x !== 'Sem closer');
  const linhasCloser = closers.map(nome => {
    const a = at.filter(r => r.closer === nome);
    const c = cli.filter(r => r.closer === nome);
    const reun = a.filter(r => r.dAtend).length;
    const ganhos = a.filter(r => r.grupo === 'ganho').length;
    const perdidos = a.filter(r => r.grupo === 'perdido').length;
    const hon = soma(c, r => r.honIni);
    return {
      nome: nome, reun: reun, abertos: a.filter(r => r.emAberto).length,
      ganhos: ganhos, perdidos: perdidos,
      taxaGanho: taxa(ganhos, ganhos + perdidos),
      clientes: c.length, hon: hon, ticket: ticketMedio(c),
      conv: taxa(c.length, reun), dias: media(c, r => r.diasFechar),
      propAberta: soma(a.filter(r => r.emAberto), r => r.vInicial),
      parados: a.filter(r => r.parado).length
    };
  }).sort((a, b) => b.hon - a.hon);

  h += '<div class="secao-titulo">Closers</div>';
  h += '<div class="grid g-3">';
  h += cartao('Honorarios por closer', 'Receita inicial fechada no recorte.',
    vizBarras({ dados: linhasCloser.filter(c => c.hon > 0).map((c, i) => ({ k: c.nome, v: c.hon, cor: corSerie(i),
      extra: [{ rot: 'Clientes', val: n0(c.clientes) }, { rot: 'Ticket medio', val: c.ticket == null ? '—' : brl0(c.ticket) }] })), fmt: brl0, nome: 'Honorarios' }));
  h += cartao('Conversao reuniao → cliente', 'Clientes sobre reunioes realizadas.',
    vizBarras({ dados: linhasCloser.filter(c => c.conv != null).map((c, i) => ({ k: c.nome, v: c.conv, cor: corSerie(i),
      extra: [{ rot: 'Reunioes', val: n0(c.reun) }, { rot: 'Clientes', val: n0(c.clientes) }] })), fmt: v => pct(v, 1), nome: 'Conversao' }));
  h += cartao('Taxa de ganho na negociacao', 'Ganhos sobre ganhos + perdidos. Sem resposta nao entra.',
    vizBarras({ dados: linhasCloser.filter(c => c.taxaGanho != null).map((c, i) => ({ k: c.nome, v: c.taxaGanho, cor: corSerie(i),
      extra: [{ rot: 'Ganhos', val: n0(c.ganhos) }, { rot: 'Perdidos', val: n0(c.perdidos) }] })), fmt: v => pct(v, 1), nome: 'Taxa de ganho' }));
  h += '</div>';

  h += tabelaInterativa('closer-tab', [
    { k: 'nome', rot: 'Closer', tipo: 'txt', cls: 'forte' },
    { k: 'reun', rot: 'Reunioes', tipo: 'num' },
    { k: 'clientes', rot: 'Clientes', tipo: 'num' },
    { k: 'conv', rot: 'Conversao', tipo: 'pct', casas: 1 },
    { k: 'ganhos', rot: 'Ganhos', tipo: 'num' },
    { k: 'perdidos', rot: 'Perdidos', tipo: 'num' },
    { k: 'taxaGanho', rot: 'Taxa de ganho', tipo: 'pct', casas: 1 },
    { k: 'hon', rot: 'Honorarios', tipo: 'moeda0' },
    { k: 'ticket', rot: 'Ticket medio', tipo: 'moeda0' },
    { k: 'dias', rot: 'Dias p/ fechar', tipo: 'num1' },
    { k: 'abertos', rot: 'Em aberto', tipo: 'num' },
    { k: 'propAberta', rot: 'Proposta em aberto', tipo: 'moeda0' },
    { k: 'parados', rot: 'Parados > 7d', tipo: 'num',
      html: r => r.parados ? '<span style="color:#f3c45a;font-weight:700">' + n0(r.parados) + '</span>' : '0' }
  ], linhasCloser, { ord: 'hon', dir: -1, titulo: 'Desempenho por closer', limite: 30 });

  /* --- SDRs --- */
  const sdrs = Array.from(new Set(at.map(r => r.sdr).concat(cli.map(r => r.sdr)))).filter(x => x && x !== 'Sem SDR');
  const linhasSdr = sdrs.map(nome => {
    const a = at.filter(r => r.sdr === nome);
    const c = cli.filter(r => r.sdr === nome);
    const agendadas = a.filter(r => r.dAgenda).length;
    const realizadas = a.filter(r => r.dAtend).length;
    return {
      nome: nome, agendadas: agendadas, realizadas: realizadas,
      noShow: Math.max(0, agendadas - realizadas),
      presenca: taxa(realizadas, agendadas),
      clientes: c.length, hon: soma(c, r => r.honIni),
      conv: taxa(c.length, realizadas),
      semResposta: a.filter(r => r.grupo === 'semresposta').length
    };
  }).sort((a, b) => b.realizadas - a.realizadas);

  h += '<div class="secao-titulo">SDR &middot; agendamento e comparecimento</div>';
  h += '<div class="grid g-2">';
  h += cartao('Reunioes agendadas x realizadas', 'A diferenca e o no-show da agenda.',
    vizEmpilhado({ x: linhasSdr.map(s => s.nome), fmt: n0, series: [
      { nome: 'Realizadas', vals: linhasSdr.map(s => s.realizadas), cor: 'var(--s3)' },
      { nome: 'Nao realizadas', vals: linhasSdr.map(s => s.noShow), cor: 'var(--s4)' }
    ] }) + legenda([{ nome: 'Realizadas', cor: 'var(--s3)' }, { nome: 'Nao realizadas', cor: 'var(--s4)' }]));
  h += cartao('Clientes gerados por SDR', 'Fechamentos atribuidos ao SDR que originou.',
    vizBarras({ dados: linhasSdr.map((s, i) => ({ k: s.nome, v: s.clientes, cor: corSerie(i),
      extra: [{ rot: 'Honorarios', val: brl0(s.hon) }] })), nome: 'Clientes' }));
  h += '</div>';

  h += tabelaInterativa('sdr-tab', [
    { k: 'nome', rot: 'SDR', tipo: 'txt', cls: 'forte' },
    { k: 'agendadas', rot: 'Agendadas', tipo: 'num' },
    { k: 'realizadas', rot: 'Realizadas', tipo: 'num' },
    { k: 'noShow', rot: 'Nao realizadas', tipo: 'num' },
    { k: 'presenca', rot: 'Comparecimento', tipo: 'pct', casas: 1 },
    { k: 'semResposta', rot: 'Sem resposta', tipo: 'num' },
    { k: 'clientes', rot: 'Clientes', tipo: 'num' },
    { k: 'conv', rot: 'Conversao', tipo: 'pct', casas: 1 },
    { k: 'hon', rot: 'Honorarios', tipo: 'moeda0' }
  ], linhasSdr, { ord: 'realizadas', dir: -1, titulo: 'Desempenho por SDR', limite: 30, ativa: false });
  return h;
}

/* ==========================================================================
   TELA 7 - METAS E OKRS
   ========================================================================== */
function telaMetas() {
  let h = '';
  if (ERROS.metas) return aviso('critico', '<b>Planilha de Metas nao entrou:</b> ' + esc(ERROS.metas));
  const m = DADOS.metas || {};
  const nomeAtual = MESES_ACENTO[new Date().getMonth()];
  const nomeAnt = MESES_ACENTO[(new Date().getMonth() + 11) % 12];
  const rm = ritmoDoMes();

  const atual = m.meses && m.meses[nomeAtual] && !m.meses[nomeAtual].erro ? m.meses[nomeAtual] : null;
  const ant = m.meses && m.meses[nomeAnt] && !m.meses[nomeAnt].erro ? m.meses[nomeAnt] : null;

  h += '<div class="secao-titulo primeiro">Metas do mes &middot; ' + esc(nomeAtual) + '</div>';
  if (!atual) {
    h += aviso('atencao', 'Nao encontrei a aba <code>KPIS ' + esc(nomeAtual) + '</code> na planilha de Metas. ' +
      'Quando o time criar a aba do mes, ela aparece aqui sozinha.');
  } else {
    h += aviso('info', 'Medicao de <b>' + esc(atual.atualizado || 'data nao informada na planilha') + '</b> &middot; ' +
      rm.diasComp + ' de ' + rm.diasMes + ' dias do mes (' + pct(rm.pct, 0) + '). ' +
      'A <b>meta proporcional</b> e o quanto deveria estar entregue hoje; e contra ela que o ritmo e lido.');

    const fmtKr = k => k.tipo === 'moeda' ? brl0 : (k.tipo === 'pct' ? (v => pct(v, 0)) : n0);
    h += tabelaInterativa('metas-tab', [
      { k: 'resp', rot: 'Responsavel', tipo: 'txt', cls: 'forte' },
      { k: 'kr', rot: 'Resultado chave', tipo: 'txt', cls: 'wrap' },
      { k: 'metaMes', rot: 'Meta do mes', tipo: 'num', html: r => fmtKr(r)(r.metaMes) },

      { k: 'resultado', rot: 'Resultado', tipo: 'num', html: r => '<b style="color:var(--texto)">' + fmtKr(r)(r.resultado) + '</b>' },

    ], atual.krs, { titulo: 'Metas do mes', limite: 40 });

    /* Comparacao com o mes anterior pelos KRs de mesmo nome. */
    if (ant) {
      const comp = atual.krs.map(k => {
        const a = ant.krs.find(x => chaveBusca(x.kr) === chaveBusca(k.kr));
        if (!a) return null;
        return { kr: k.kr, resp: k.resp, atual: k.resultado, ant: a.resultado,
                 var: a.resultado ? ((k.resultado - a.resultado) / Math.abs(a.resultado)) * 100 : null, inverso: k.inverso, tipo: k.tipo };
      }).filter(Boolean);
      if (comp.length) {
        h += '<div class="secao-titulo">' + esc(nomeAtual) + ' x ' + esc(nomeAnt) +
          ' <span style="text-transform:none;letter-spacing:0;font-weight:500">(' + esc(nomeAtual) + ' ainda em curso &mdash; compare com o ritmo, nao com o total)</span></div>';

          { k: 'ant', rot: esc(nomeAnt), tipo: 'num', html: r => (r.tipo === 'moeda' ? brl0 : r.tipo === 'pct' ? (v => pct(v, 0)) : n0)(r.ant) },
          { k: 'atual', rot: esc(nomeAtual) + ' (parcial)', tipo: 'num', html: r => (r.tipo === 'moeda' ? brl0 : r.tipo === 'pct' ? (v => pct(v, 0)) : n0)(r.atual) },
          { k: 'var', rot: 'Variacao', tipo: 'num', ord: false, html: r => delta(r.var, { inverso: r.inverso }) }
        ], comp, { titulo: 'Comparativo de metas', limite: 40, ativa: false });

    }
  }

  /* --- Plano de acao --- */
  h += '<div class="secao-titulo">Plano de acao</div>';
  if (m.okrs && m.okrs.length) {

        html: r => !r.status ? '&mdash;' : selo(/conclu|feito|pronto/i.test(r.status) ? 'ok' :
          /execu|andamento/i.test(r.status) ? 'neutro' : 'atencao', r.status) },
      { k: 'atraso', rot: 'Prazo', tipo: 'num', ord: false,
        html: r => { if (!r.prazo) return '&mdash;';
          const d = diasEntre(r.prazo, hoje());
          if (/conclu|feito/i.test(r.status || '')) return selo('ok', 'concluida');
          return d > 0 ? selo('atencao', d + ' dia(s) em atraso') : d === 0 ? selo('atencao', 'vence hoje') : selo('neutro', 'em ' + (-d) + ' dia(s)'); } },
      { k: 'obs', rot: 'Observacao', tipo: 'txt', cls: 'wrap' }
    ], m.okrs, { titulo: 'Plano de acao', limite: 40, ativa: false });
  } else {

      (m.okrsErro ? 'Nao consegui ler a aba OKRS: ' + esc(m.okrsErro) : 'Nenhuma acao cadastrada na aba OKRS.') + '</div></div>';
  }

  /* --- Acumulado do ano (planilha antiga) --- */
  h += '<div class="secao-titulo">Acumulado do ano <span style="text-transform:none;letter-spacing:0;font-weight:500">(planilha antiga &mdash; base historica)</span></div>';
  if (DADOS.hist && DADOS.hist.acumulado && DADOS.hist.acumulado.real) {
    const ac = DADOS.hist.acumulado;
    const linhas = ac.etapas.map(e => ({
      etapa: e.rot, real: num(ac.real[e.k]),
      proj: ac.projMes ? num(ac.projMes[e.k]) : null, bruto: ac.real[e.k]
    })).filter(l => l.real || l.proj);
    h += cartao('Funil acumulado do ano', 'Vem da aba <b>Produtos Juridicos [Acumulado ' + new Date().getFullYear() +
      ']</b> da planilha antiga. Use como referencia de ano, nao como numero do mes.',
      tabelaInterativa('hist-tab', [
        { k: 'etapa', rot: 'Etapa', tipo: 'txt', cls: 'forte' },
        { k: 'proj', rot: 'Projetado no ano', tipo: 'num' },
        { k: 'real', rot: 'Real no ano', tipo: 'num', html: r => '<b style="color:var(--texto)">' + (/R\$|%/.test(String(r.bruto)) ? esc(r.bruto) : n0(r.real)) + '</b>' },
        { k: 'ating', rot: 'Atingimento', tipo: 'num', ord: false,
          html: r => { const t = taxa(r.real, r.proj); return t == null ? '&mdash;' : barraCelula(t, 200, t >= 100 ? 'var(--ok)' : 'var(--atencao)', pct(t, 0)); } }

function irPara(k, forcar) {
  const t = TELAS.find(x => x.k === k);
  if (!t) return;
  if (TELA_ATIVA === k && !forcar) { fecharSidebar(); return; }
  TELA_ATIVA = k;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('ativo', b.dataset.tela === k));
  document.getElementById('tituloTela').textContent = t.rot;
  document.getElementById('subTela').textContent = t.sub;
  TELAS.forEach(x => { if (x.k) { const el = document.getElementById('tela-' + x.k); if (el) el.classList.toggle('oculto', x.k !== k); } });
  desenharTela(k);
  fecharSidebar();
  document.getElementById('conteudo').scrollTop = 0;
}

function desenharTela(k) {
  const t = TELAS.find(x => x.k === k);
  const el = document.getElementById('tela-' + k);
  if (!t || !el) return;
  TABELA_ATIVA = null;
  try {
    el.innerHTML = t.fn();
  } catch (e) {
    el.innerHTML = aviso('critico', '<b>Erro ao montar esta tela:</b> ' + esc(e.message) +
      '<br>As outras telas continuam funcionando. Detalhe tecnico no console.');
    /* eslint-disable-next-line no-console */
    console.error('[painel] tela ' + k, e);
  }
}

function opcoesDe(campo, fontes) {
  const m = new Map();
  (fontes || []).forEach(lista => (lista || []).forEach(r => {
    const v = r[campo];
    if (!v) return;
    m.set(v, (m.get(v) || 0) + 1);
  }));
  return Array.from(m.entries()).sort((a, b) => b[1] - a[1]).map(([k, n]) => ({ k: k, n: n }));
}

         '<button class="chip-botao" type="button" data-abre="' + d.k + '">' +
           '<span>' + (sel.size ? n0(sel.size) + ' selecionado(s)' : 'Todos') + '</span>' +
           (sel.size ? '<span class="cnt">' + n0(sel.size) + '</span>' : '<span style="opacity:.5">&#9662;</span>') +
         '</button>' +
         '<div class="chip-lista oculto" data-lista="' + d.k + '">' +
           '<div class="cl-acoes"><button type="button" data-todos="' + d.k + '">Todos</button>' +
           '<button type="button" data-nenhum="' + d.k + '">Limpar</button></div>' +
           ops.map(o => '<label><input type="checkbox" data-dimv="' + d.k + '" value="' + esc(o.k) + '"' +
             (sel.has(o.k) ? ' checked' : '') + '><span>' + esc(o.k) + '</span><span class="cl-qtd">' + n0(o.n) + '</span></label>').join('') +
         '</div></div>';
  });

  h += '<div class="filtro"><label class="filtro-rotulo" for="fBusca">Pesquisar</label>' +
       '<input type="search" id="fBusca" placeholder="lead, cliente, campanha, etapa…" value="' + esc(F.busca) + '" /></div>';
  h += '<div class="filtro"><label class="filtro-rotulo">&nbsp;</label>' +
       '<button class="btn-acao" id="btnLimpar" type="button">Limpar filtros</button></div>';

  document.getElementById('filtros').innerHTML = h;
}

function ligarFiltros() {
  const f = document.getElementById('filtros');

  f.addEventListener('change', ev => {
    const t = ev.target;
    if (t.id === 'fPeriodo') { F.periodo = t.value; redesenhar(); return; }
    if (t.dataset.dimv) {
      const s = F[t.dataset.dimv];
      if (t.checked) s.add(t.value); else s.delete(t.value);
      atualizarBotaoDim(t.dataset.dimv);
      redesenhar();
    }
  });

  f.addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.abre) {
      const lista = f.querySelector('[data-lista="' + b.dataset.abre + '"]');
      const jaAberta = !lista.classList.contains('oculto');
      f.querySelectorAll('.chip-lista').forEach(x => x.classList.add('oculto'));
      lista.classList.toggle('oculto', jaAberta);
      ev.stopPropagation();
      return;
    }
    if (b.dataset.todos || b.dataset.nenhum) {
      const dim = b.dataset.todos || b.dataset.nenhum;
      const marcar = !!b.dataset.todos;
      F[dim].clear();
      f.querySelectorAll('[data-dimv="' + dim + '"]').forEach(c => {
        c.checked = marcar;
        if (marcar) F[dim].add(c.value);
      });
      atualizarBotaoDim(dim);
      redesenhar();
      return;
    }
    if (b.id === 'btnLimpar') {
      F.periodo = 'u6'; F.busca = '';
      DIMS.forEach(d => F[d.k].clear());
      montarFiltros(); redesenhar();
    }
  });

  let deb;
  f.addEventListener('input', ev => {
    if (ev.target.id !== 'fBusca') return;
    clearTimeout(deb);
    deb = setTimeout(() => { F.busca = ev.target.value.trim(); redesenhar(); }, 220);
  });

  document.addEventListener('click', ev => {
    if (!ev.target.closest('.chip-multi')) f.querySelectorAll('.chip-lista').forEach(x => x.classList.add('oculto'));
  });
}

function atualizarBotaoDim(dim) {
  const b = document.querySelector('[data-abre="' + dim + '"]');
  if (!b) return;
  const s = F[dim];
  b.innerHTML = '<span>' + (s.size ? n0(s.size) + ' selecionado(s)' : 'Todos') + '</span>' +
    (s.size ? '<span class="cnt">' + n0(s.size) + '</span>' : '<span style="opacity:.5">&#9662;</span>');
}

/* ==========================================================================
   DICA (camada de hover) - um balao para todos os graficos e selos
   ========================================================================== */
(function () {
  const d = document.getElementById('dica');
  let alvo = null;
  document.addEventListener('mousemove', ev => {
    const el = ev.target.closest ? ev.target.closest('[data-tip]') : null;
    if (!el) { if (alvo) { alvo = null; d.classList.remove('vis'); } return; }
    if (el !== alvo) { alvo = el; d.innerHTML = el.getAttribute('data-tip'); d.classList.add('vis'); }
    const m = 14;
    let x = ev.clientX + m, y = ev.clientY + m;
    const r = d.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - m;
    if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - m;
    d.style.left = Math.max(8, x) + 'px';
    d.style.top = Math.max(8, y) + 'px';
  }, { passive: true });
  document.addEventListener('mouseleave', () => d.classList.remove('vis'));
  /* No toque, o balao atrapalha mais do que ajuda. */
  document.addEventListener('touchstart', () => d.classList.remove('vis'), { passive: true });
})();

/* ==========================================================================
   TABELAS - ordenar e mostrar mais
   ========================================================================== */
document.addEventListener('click', ev => {
  const th = ev.target.closest('th[data-col]');
  if (th) {
    const id = th.dataset.tabela, col = th.dataset.col;
    const t = TABELAS[id];
    if (!t) return;
    if (t.ord === col) t.dir = -t.dir; else { t.ord = col; t.dir = -1; }
    repintarTabela(id);
    return;
  }
  const mais = ev.target.closest('[data-mais]');
  if (mais) {
    const t = TABELAS[mais.dataset.mais];
    if (t) { t.limite += t.passo; repintarTabela(mais.dataset.mais); }
    return;
  }
  const ir = ev.target.closest('[data-ir]');
  if (ir) { ev.preventDefault(); irPara(ir.dataset.ir); return; }
  const g = ev.target.closest('[data-grupo]');
  if (g) { F.grupo = g.dataset.grupo; redesenhar(); return; }
  const at = ev.target.closest('[data-ativas]');
  if (at) { F.soAtivas = at.dataset.ativas === 'true'; redesenhar(); }
});

/* ==========================================================================
   EXPORTAR CSV - leva o recorte inteiro, na ordem da tela
   ========================================================================== */
function exportarCSV() {
  const id = TABELA_ATIVA;
  const t = id && TABELAS[id];
  if (!t) { alert('Esta tela nao tem tabela para exportar. Abra Negociacao, Vendas, Trafego ou Metas.'); return; }
  const d = linhasOrdenadas(id);
  const tiraTag = s => String(s).replace(/<[^>]*>/g, '').replace(/&mdash;/g, '').replace(/&nbsp;/g, ' ')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").trim();
  const campo = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';

  const linhas = [t.cols.map(c => campo(c.rot)).join(';')];
  d.forEach(r => linhas.push(t.cols.map(c => {
    const v = typeof c.v === 'function' ? c.v(r) : r[c.k];
    if (v instanceof Date) return campo(v.toLocaleDateString('pt-BR'));
    if (typeof v === 'number') return campo(String(v).replace('.', ','));
    if (typeof v === 'boolean') return campo(v ? 'Sim' : 'Nao');
    if (v == null || v === '') return campo(tiraTag(celula(r, c)));
    return campo(v);
  }).join(';')));

  /* BOM para o Excel em pt-BR abrir com acento certo. */
  const blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bm-' + id + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ==========================================================================
   SEGURANCA DA SESSAO
   --------------------------------------------------------------------------
   O que este bloco garante de verdade:
     . a pagina so mostra numero depois de abrir o cofre com login + senha;
     . a sessao vive na ABA (sessionStorage), morre ao fechar e expira sozinha
       depois de 30 minutos sem uso;
     . a SENHA nunca e guardada - o que fica na aba e o conteudo ja decifrado,
       para o F5 nao exigir login de novo;
     . tentativa errada custa tempo (PBKDF2 de 310 mil iteracoes ja e lento) e
       o contador trava por 30s depois de 5 erros;
     . a pagina se recusa a rodar dentro de iframe de terceiro.
   O que ele NAO garante: privacidade dos dados na origem. As planilhas lidas
   estao compartilhadas por link no Google - quem tiver o ID de uma delas le
   direto, sem passar por aqui. Ver a nota em "Fontes e dados".
   ========================================================================== */
const INATIVIDADE_MIN = 30;
let tmrInatividade = null;

function marcarAtividade() {
  clearTimeout(tmrInatividade);
  tmrInatividade = setTimeout(() => sair('Sessao encerrada por inatividade.'), INATIVIDADE_MIN * 60000);
}

function sair(msg) {
  try {
    sessionStorage.removeItem(K_AUTH);
    sessionStorage.removeItem(K_CRED);
    sessionStorage.removeItem(K_TOKEN);
  } catch (e) {}
  CONFIG.SHEETS = null; CONFIG.perfil = null;
  TOKEN = null; PROXY_DADOS = null; PROXY_ERROS = {}; TRANSPORTE = 'gviz';
  Object.keys(DADOS).forEach(k => delete DADOS[k]);
  clearTimeout(tmrInatividade);
  if (msg) {
    const el = document.getElementById('loginErro');
    el.textContent = msg; el.classList.remove('oculto');
  }
  document.getElementById('app').classList.add('oculto');
  document.getElementById('loginOverlay').classList.remove('oculto');
  document.getElementById('campoSenha').value = '';
}

function entrar(segredo, doCache) {
  CONFIG.SHEETS = segredo.SHEETS;
  CONFIG.perfil = segredo.perfil || 'Gestor Comercial';
  CONFIG.PROXY = proxySalvo();
  if (!doCache) {
    /* Guarda o conteudo ja decifrado e a credencial derivada - nunca a senha.
       sessionStorage e por aba: fechou a aba, acabou. */
    try {
      sessionStorage.setItem(K_AUTH, '1');
      sessionStorage.setItem(K_CRED, JSON.stringify(segredo));
      if (TOKEN) sessionStorage.setItem(K_TOKEN, TOKEN);
    } catch (e) {}
  }
  document.getElementById('loginOverlay').classList.add('oculto');
  document.getElementById('app').classList.remove('oculto');
  marcarAtividade();
  montarNav();
  iniciar();
}

let erros = 0, travadoAte = 0;

document.getElementById('loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('btnEntrar');
  const erroEl = document.getElementById('loginErro');
  const usuario = document.getElementById('campoUsuario').value;
  const senha = document.getElementById('campoSenha').value;

  if (Date.now() < travadoAte) {
    erroEl.textContent = 'Muitas tentativas. Aguarde ' + Math.ceil((travadoAte - Date.now()) / 1000) + 's.';
    erroEl.classList.remove('oculto');
    return;
  }
  btn.disabled = true; btn.textContent = 'Verificando…';
  erroEl.classList.add('oculto');
  try {
    /* O cofre prova a senha neste navegador; o token e o que o proxy
       confere no servidor. Os dois saem da mesma senha, em paralelo. */
    const [segredo, tok] = await Promise.all([
      abrirCofre(usuario, senha),
      derivarToken(usuario, senha).catch(() => null)
    ]);
    TOKEN = tok;
    erros = 0;
    document.getElementById('campoSenha').value = '';
    entrar(segredo);
  } catch (e) {
    erros++;
    if (erros >= 5) { travadoAte = Date.now() + 30000; erros = 0; }
    await new Promise(r => setTimeout(r, 400));
    erroEl.textContent = e.message || 'Login ou senha invalidos.';
    erroEl.classList.remove('oculto');
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});

document.getElementById('btnSair').addEventListener('click', () => sair(null));
['click', 'keydown', 'wheel', 'touchstart'].forEach(e =>
  document.addEventListener(e, () => { if (CONFIG.SHEETS) marcarAtividade(); }, { passive: true }));

/* ==========================================================================
   CARGA E ATUALIZACAO
   ========================================================================== */
let carregando = false;

async function iniciar(recarregar) {
  if (carregando) return;
  carregando = true;
  const btn = document.getElementById('btnAtualizar');
  btn.disabled = true;
  const alvo = document.getElementById('carregando');
  if (!recarregar) { alvo.classList.remove('oculto'); }

  try {
    await carregarTudo();
    alvo.classList.add('oculto');
    montarFiltros();
    irPara(TELA_ATIVA, true);
    const quantas = FONTES.length - Object.keys(ERROS).length;
    document.getElementById('rodapeAtualizado').innerHTML =
      'Leitura de ' + ULTIMA_LEITURA.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) +
      '<br>' + quantas + ' de ' + FONTES.length + ' fontes lidas' +
      (Object.keys(ERROS).length ? ' &middot; <a href="#" data-ir="fontes" style="color:var(--atencao)">ver falhas</a>' : '');
  } catch (e) {
    alvo.innerHTML = aviso('critico', '<b>Nao consegui ler as planilhas:</b> ' + esc(e.message));
    alvo.classList.remove('oculto');
  } finally {
    carregando = false;
    btn.disabled = false;
  }
}

document.getElementById('btnAtualizar').addEventListener('click', () => iniciar(true));
document.getElementById('btnExportar').addEventListener('click', exportarCSV);
document.getElementById('btnPlanilhas').addEventListener('click', () => irPara('fontes'));
document.getElementById('btnFiltros').addEventListener('click', () => {
  const el = document.getElementById('filtros');
  el.classList.toggle('aberto');
  const n = DIMS.reduce((a, d) => a + F[d.k].size, 0) + (F.busca ? 1 : 0);
  document.getElementById('btnFiltros').classList.toggle('primario', !el.classList.contains('aberto') && n > 0);
});
document.getElementById('btnMenu').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('aberta');
  document.getElementById('sidebarOverlay').classList.add('vis');
});
document.getElementById('sidebarOverlay').addEventListener('click', fecharSidebar);

/* Mes inspecionado e metas da tela de KPIs. */
document.addEventListener('change', ev => {
  if (ev.target.id === 'selMesKpi') { F.mesKpi = ev.target.value; redesenhar(); }
});
document.addEventListener('click', ev => {
  if (!ev.target.closest('#btnMetas')) return;
  const atuais = metasAtivas();
  const novas = {};
  let mudou = false;
  for (const k of Object.keys(METAS_PADRAO)) {
    const d = METAS_PADRAO[k];
    const unidade = d.tipo === 'moeda' ? 'R$' : d.tipo === 'pct' ? '%' : d.tipo === 'mult' ? 'x' : '';
    const r = prompt('Meta mensal — ' + d.rot + (unidade ? ' (' + unidade + ')' : ''), String(atuais[k]));
    if (r === null) return;                 /* cancelou: nao salva nada */
    const v = num(r);
    novas[k] = v;
    if (v !== atuais[k]) mudou = true;
  }
  try { localStorage.setItem(K_METAS, JSON.stringify(novas)); } catch (e) {}
  if (mudou) redesenhar();
});

/* Endereco do proxy: fica no navegador, nao no codigo. */
document.addEventListener('click', ev => {
  if (ev.target.closest('#btnUsarProxy')) {
    const url = (document.getElementById('campoProxy').value || '').trim();
    if (url && !/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)) {
      alert('O endereco deve ser o do app da Web do Apps Script e terminar em /exec.');
      return;
    }
    salvarProxy(url);
    iniciar(true);
    return;
  }
  if (ev.target.closest('#btnTirarProxy')) {
    salvarProxy(null);
    iniciar(true);
  }
});
document.getElementById('nav').addEventListener('click', ev => {
  const b = ev.target.closest('[data-tela]');
  if (b) irPara(b.dataset.tela);
});

/* Releitura automatica enquanto a aba esta a vista. */
setInterval(() => {
  if (CONFIG.SHEETS && document.visibilityState === 'visible' && !carregando) iniciar(true);
}, CONFIG.AUTO_MIN * 60000);

ligarFiltros();

/* Sessao da aba: volta sem pedir senha de novo, sem nunca ter guardado a senha. */
(async function () {
  CONFIG.PROXY = proxySalvo();
  let cred = null;
  try {
    if (sessionStorage.getItem(K_AUTH) === '1') {
      cred = JSON.parse(sessionStorage.getItem(K_CRED) || 'null');
      TOKEN = sessionStorage.getItem(K_TOKEN) || null;
    }
  } catch (e) {}
  if (cred && cred.SHEETS) { entrar(cred, true); return; }
  document.getElementById('campoUsuario').focus();
})();
</script>
